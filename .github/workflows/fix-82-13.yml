name: fix-82-13
"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-82-13.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tighten auth throttles #82.13
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- controller ---
          p = Path("backend/src/auth/auth.controller.ts")
          t = p.read_text()
          if "#82.13" in t and "limit: 100" not in t:
              print("controller already patched")
          else:
              reps = [
                (
                  "  @Post('register')\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('register')\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 20, ttl: 600_000 } })",
                ),
                (
                  "  @Post('login')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('login')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 20, ttl: 600_000 } })",
                ),
                (
                  "  @Post('otp/request')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('otp/request')\n  @HttpCode(200)\n  // #82.13 — OTP request stricter (SMS cost / abuse)\n  @Throttle({ default: { limit: 10, ttl: 600_000 } })",
                ),
                (
                  "  @Post('otp/verify')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('otp/verify')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 30, ttl: 600_000 } })",
                ),
                (
                  "  @Post('password/forgot')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('password/forgot')\n  @HttpCode(200)\n  // #82.13 — password reset request stricter\n  @Throttle({ default: { limit: 10, ttl: 600_000 } })",
                ),
                (
                  "  @Post('password/reset')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('password/reset')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 20, ttl: 600_000 } })",
                ),
                (
                  "  @Post('change-password')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('change-password')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 20, ttl: 600_000 } })",
                ),
                (
                  "  @Post('change-phone/request')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('change-phone/request')\n  @HttpCode(200)\n  // #82.13 — change-phone OTP stricter\n  @Throttle({ default: { limit: 10, ttl: 600_000 } })",
                ),
                (
                  "  @Post('change-phone/verify')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('change-phone/verify')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 20, ttl: 600_000 } })",
                ),
                (
                  "  @Post('delete-account')\n  @HttpCode(200)\n  @Throttle({ default: { limit: 100, ttl: 600_000 } })",
                  "  @Post('delete-account')\n  @HttpCode(200)\n  // #82.13 — tighten auth throttle (was 100/10m)\n  @Throttle({ default: { limit: 10, ttl: 600_000 } })",
                ),
              ]
              for old, new in reps:
                  if old not in t:
                      raise SystemExit("missing block: " + old[:60])
                  t = t.replace(old, new, 1)
              if "limit: 100" in t:
                  raise SystemExit("still has limit: 100")
              p.write_text(t)
              print("controller patched")

          # --- service ---
          p2 = Path("backend/src/auth/auth.service.ts")
          t2 = p2.read_text()
          if "#82.13" in t2:
              print("service already patched")
          else:
              old = "    const maxPerHour = this.config.get<number>('otpMaxPerHour') || 100;\n    const maxPerDay = this.config.get<number>('otpMaxPerDay') || 100;"
              new = "    // #82.13 — defaults align with configuration.ts / .env.example (was || 100)\n    const maxPerHour = this.config.get<number>('otpMaxPerHour') || 3;\n    const maxPerDay = this.config.get<number>('otpMaxPerDay') || 8;"
              if old not in t2:
                  raise SystemExit("service block not found")
              p2.write_text(t2.replace(old, new, 1))
              print("service patched")

          assert "#82.13" in p.read_text()
          assert "#82.13" in p2.read_text()
          print("verify ok")
          PY
          grep -n "#82.13" backend/src/auth/auth.controller.ts | head -5
          grep -n "#82.13" backend/src/auth/auth.service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.controller.ts backend/src/auth/auth.service.ts
          git commit -m "fix(#82.13): tighten login/OTP IP throttle and per-phone OTP defaults"
          git push
