name: Install AdminOps from b64 parts
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/admin-ops-b64/*'
      - '.github/workflows/install-admin-ops.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and install
        run: |
          set -e
          cat scripts/admin-ops-b64/p0 scripts/admin-ops-b64/p1 scripts/admin-ops-b64/p2 scripts/admin-ops-b64/p3 | base64 -d > backend/src/admin/admin-ops.controller.ts
          head -5 backend/src/admin/admin-ops.controller.ts
          grep -q AdminOpsController backend/src/admin/admin-ops.controller.ts
          python3 - <<'PY'
          from pathlib import Path
          mod = Path('backend/src/admin/admin.module.ts')
          mt = mod.read_text()
          if 'AdminOpsController' not in mt:
              if "admin-catalog.controller" in mt:
                  mt = mt.replace("from './admin-catalog.controller';", "from './admin-catalog.controller';\nimport { AdminOpsController } from './admin-ops.controller';")
              else:
                  mt = mt.replace("from './public-site.controller';", "from './public-site.controller';\nimport { AdminOpsController } from './admin-ops.controller';")
              if 'AdminCatalogController,' in mt:
                  mt = mt.replace('AdminCatalogController,', 'AdminCatalogController,\n    AdminOpsController,')
              else:
                  mt = mt.replace('PublicSiteController,', 'PublicSiteController,\n    AdminOpsController,')
              mod.write_text(mt)
          print('module done')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts backend/src/admin/admin.module.ts
          git commit -m "feat(admin): install AdminOpsController (CMS, notify, users, feature)" || exit 0
          git push origin HEAD:main
