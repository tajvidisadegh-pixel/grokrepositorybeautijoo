name: fix-82-16-dockerfile

"on":
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json + patch package.json start (#82.16)
        run: |
          set -euo pipefail
          cd backend

          if [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json..."
            npm install --package-lock-only
            test -f package-lock.json
            echo "lockfile lines: $(wc -l < package-lock.json)"
          else
            echo "package-lock.json already present ($(wc -l < package-lock.json) lines)"
          fi

          python3 << 'PY2'
          import json
          from pathlib import Path
          p = Path("package.json")
          data = json.loads(p.read_text())
          new = (
              "node scripts/prisma-migrate-deploy.cjs && "
              "node prisma/seed-roles.cjs && "
              '(node prisma/seed-catalog.cjs || echo "[boot] seed-catalog failed (non-fatal)" >&2) && '
              "node dist/main.js"
          )
          if data["scripts"].get("start") != new:
              data["scripts"]["start"] = new
              data["scripts"]["start:prod"] = "npm run start"
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
              print("updated package.json start")
          else:
              print("package.json start already ok")
          df = Path("Dockerfile").read_text()
          assert "npm ci" in df, "Dockerfile missing npm ci - push Dockerfile first"
          assert "USER node" in df, "Dockerfile missing USER node"
          assert "seed-catalog failed (non-fatal" in df
          print("Dockerfile already hardened ok")
          PY2

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json backend/package.json backend/Dockerfile
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
fix(#82.16): backend Dockerfile — npm ci + lockfile, non-root, visible seed errors

- Commit package-lock.json and prefer npm ci for deterministic installs
- Run container as node (non-root); chown /app at build
- seed-catalog failure is logged instead of silent || true
- package.json start script aligned with the same boot sequence
EOF
)"
          git pull --rebase origin main || true
          git push origin HEAD:main
