name: fix-82-16-dockerfile

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate package-lock.json + apply Dockerfile (#82.16)
        run: |
          set -euo pipefail
          cd backend

          # 1) Generate deterministic lockfile
          if [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json via npm install..."
            npm install --package-lock-only
            test -f package-lock.json
            echo "lockfile lines: $(wc -l < package-lock.json)"
          else
            echo "package-lock.json already present"
          fi

          # 2) Write hardened Dockerfile
          python3 - << 'PY'
          import base64, pathlib
          content = base64.b64decode("""""").decode("utf-8")
          pathlib.Path("Dockerfile").write_text(content)
          print("wrote Dockerfile", len(content))
          assert "npm ci" in content
          assert "USER node" in content
          assert "seed-catalog failed (non-fatal" in content
          PY

          # 3) Align package.json start script — log catalog seed failures instead of silent || true
          python3 - << 'PY'
          import json, pathlib
          p = pathlib.Path("package.json")
          data = json.loads(p.read_text())
          old = data["scripts"].get("start", "")
          new = (
              "node scripts/prisma-migrate-deploy.cjs && "
              "node prisma/seed-roles.cjs && "
              "(node prisma/seed-catalog.cjs || echo \"[boot] seed-catalog failed (non-fatal)\" >&2) && "
              "node dist/main.js"
          )
          if old != new:
              data["scripts"]["start"] = new
              data["scripts"]["start:prod"] = "npm run start"
              p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
              print("updated package.json start script")
          else:
              print("package.json start already aligned")
          print("start =", data["scripts"]["start"][:120])
          PY

          cd ..
          echo "--- Dockerfile head ---"
          head -20 backend/Dockerfile
          echo "--- lock present ---"
          ls -la backend/package-lock.json | head -1

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/Dockerfile backend/package-lock.json backend/package.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
fix(#82.16): backend Dockerfile — npm ci + lockfile, non-root, visible seed errors

- Commit package-lock.json and prefer npm ci for deterministic installs
- Run container as node (non-root); chown /app at build
- seed-catalog failure is logged instead of silent || true
- package.json start script aligned with the same boot sequence
EOF
)"
          git pull --rebase origin main || true
          git push origin HEAD:main
