name: Emergency restore placeholders
on:
  push:
    paths:
      - '.github/workflows/emergency-restore.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curl known-good files
        run: |
          set -e
          GOOD=80e35204183daa512c59d03137e5be06bfc62647
          BASE="https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/${GOOD}"
          curl -fsSL -o backend/src/bookings/bookings.service.ts "$BASE/backend/src/bookings/bookings.service.ts"
          curl -fsSL -o frontend/src/app/zibagar/bookings/page.tsx "$BASE/frontend/src/app/zibagar/bookings/page.tsx"
          curl -fsSL -o frontend/src/lib/panel-api.ts "$BASE/frontend/src/lib/panel-api.ts"
          wc -c backend/src/bookings/bookings.service.ts frontend/src/app/zibagar/bookings/page.tsx frontend/src/lib/panel-api.ts
          grep -q Injectable backend/src/bookings/bookings.service.ts
          grep -q transitionBooking frontend/src/lib/panel-api.ts
          grep -q 'use client' frontend/src/app/zibagar/bookings/page.tsx
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/emergency-restore.yml
          rm -f .github/workflows/patch-noshow.yml
          rm -f .github/workflows/restore-item3.yml
          git add backend/src/bookings/bookings.service.ts frontend/src/app/zibagar/bookings/page.tsx frontend/src/lib/panel-api.ts
          git add -A
          git commit -m "fix: restore bookings.service, zibagar bookings, panel-api from good commit"
          git push
