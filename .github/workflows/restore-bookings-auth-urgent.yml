name: restore-bookings-auth-urgent
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-auth-urgent.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from known-good commits
        run: |
          set -euo pipefail
          # bookings: last known good with #82.5-9 + #82.19
          git show a36cd642258a024d90fe0ff818552c9fdac6eb08:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          # auth: last known good before placeholder
          git show dd6a621521a497cc29e81bfc50b5062c11bc7666:backend/src/auth/auth.service.ts > backend/src/auth/auth.service.ts
          grep -q 'class BookingsService' backend/src/bookings/bookings.service.ts
          grep -q 'class AuthService' backend/src/auth/auth.service.ts
          grep -qv 'PLACEHOLDER' backend/src/bookings/bookings.service.ts
          grep -qv 'PLACEHOLDER' backend/src/auth/auth.service.ts
          wc -l backend/src/bookings/bookings.service.ts backend/src/auth/auth.service.ts
          echo RESTORE_OK
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/auth/auth.service.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: restore bookings.service.ts and auth.service.ts from known-good commits (remove PLACEHOLDER)"
          git push origin HEAD:main
