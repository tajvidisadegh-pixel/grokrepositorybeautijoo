name: fix-bookings-filter
on:
  push:
    paths: ['.github/workflows/fix-bookings-filter.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean bookings + filter
        run: |
          set -eux
          # clean version before broken JSX inject
          git show 4f3ac09bc4d4ed868cc46871bd4b30fea2046cad:frontend/src/app/panel/bookings/page.tsx > frontend/src/app/panel/bookings/page.tsx
          python3 << 'PY'
          from pathlib import Path
          s = Path('frontend/src/app/panel/bookings/page.tsx').read_text()
          assert 'import { PanelLoading' in s
          if "const [statusFilter, setStatusFilter]" not in s:
              s = s.replace(
                  'const [items, setItems]',
                  "const [statusFilter, setStatusFilter] = useState('');\n  const [items, setItems]",
                  1,
              )
          import re
          s = re.sub(
              r'fetchMyBookings\([^)]*\)',
              'fetchMyBookings(1, 50, statusFilter || undefined)',
              s,
              count=1,
          )
          s = s.replace('  }, []);\n\n  useEffect(() => {\n    load();\n  }, [load]);', '  }, [statusFilter]);\n\n  useEffect(() => {\n    load();\n  }, [load]);', 1)
          ui = '''\n      <div className="flex flex-wrap gap-2" aria-label="فیلتر وضعیت">\n        {[\n          { v: '', l: 'همه' },\n          { v: 'pending', l: 'در انتظار' },\n          { v: 'confirmed', l: 'تأییدشده' },\n          { v: 'completed', l: 'انجام‌شده' },\n          { v: 'cancelled', l: 'کنسل‌شده' },\n        ].map((o) => (\n          <button\n            key={o.v || 'all'}\n            type="button"\n            onClick={() => setStatusFilter(o.v)}\n            className={`rounded-full border px-3 py-1.5 text-xs font-medium ${\n              statusFilter === o.v\n                ? 'border-coral bg-coral text-white'\n                : 'border-border bg-white hover:border-coral'\n            }`}\n          >\n            {o.l}\n          </button>\n        ))}\n      </div>\n'''
          needle = '''      <div>\n        <h1 className="text-2xl font-bold">رزروهای من</h1>\n        <p className="mt-1 text-sm text-gray">لیست واقعی از سرور</p>\n      </div>\n'''
          if 'فیلتر وضعیت' not in s and needle in s:
              s = s.replace(needle, needle + ui, 1)
          Path('frontend/src/app/panel/bookings/page.tsx').write_text(s)
          assert 'import { PanelLoading' in s
          assert 'import { \n      <div' not in s
          print('ok', len(s), s.count('statusFilter'))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-bookings-filter.yml
          git add frontend/src/app/panel/bookings/page.tsx
          git add -A
          git commit -m "fix: panel bookings status filter placement (#40-29)"
          git push
