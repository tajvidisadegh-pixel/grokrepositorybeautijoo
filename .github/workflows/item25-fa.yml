name: item25-fa
on:
  push:
    paths:
      - '.github/workflows/item25-fa.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          s = s.replace("setSubmitError('Phone verification required');", "setSubmitError('قبل از رزرو باید شماره موبایل را تأیید کنید.');")
          s = s.replace("router.push('/otp?reason=booking');", "router.push('/otp?reason=booking&next=' + encodeURIComponent(bookingLoginReturnPath(draft)));")
          p.write_text(s)
          print('updated', 'قبل از رزرو' in s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item25-fa.yml
          git add frontend/src/components/booking/booking-wizard.tsx
          git add -A
          git commit -m "fix(ui): Persian phoneVerified copy in wizard (#40-25)" || echo nothing
          git push
