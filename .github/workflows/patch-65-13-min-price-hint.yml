name: patch-65-13-min-price-hint
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-13-min-price-hint.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Red inline min-price only when invalid
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # ---- ServiceEditPanel ----
          sep = Path('frontend/src/app/zibagar/services/ServiceEditPanel.tsx')
          s = sep.read_text()
          s = s.replace(
              '''            <Input inputMode="numeric" min={10000} value={price ? formatPriceDigits(price) : ''} onChange={(e) => setPrice(parsePriceInput(e.target.value))} />
            {price > 0 && price < 10000 && (
              <p className="mt-1 text-xs font-medium text-red-600">قیمت باید حداقل ۱۰٬۰۰۰ تومان باشد.</p>
            )}''',
              '''            <Input
              inputMode="numeric"
              value={price ? formatPriceDigits(price) : ''}
              onChange={(e) => setPrice(parsePriceInput(e.target.value))}
              className={price > 0 && price < 10000 ? 'border-red-500 focus-visible:ring-red-500' : ''}
            />
            {price > 0 && price < 10000 ? (
              <p className="mt-1 text-xs font-medium text-red-600">
                قیمت باید بیشتر باشد — حداقل ۱۰٬۰۰۰ تومان
              </p>
            ) : null}''',
          )
          sep.write_text(s)
          print('ServiceEditPanel ok')

          # ---- services/page.tsx (mobile menu) ----
          sp = Path('frontend/src/app/zibagar/services/page.tsx')
          t = sp.read_text()

          # stronger red messages under fields
          t = t.replace(
              '''                {addPrice && Number(addPrice) > 0 && Number(addPrice) < MIN_PRICE && (
                  <p className="mt-1.5 text-sm text-red-600">
                    حداقل {MIN_PRICE.toLocaleString('fa-IR')} تومان
                  </p>
                )}''',
              '''                {addPrice && Number(addPrice) > 0 && Number(addPrice) < MIN_PRICE && (
                  <p className="mt-1.5 text-sm font-medium text-red-600">
                    قیمت باید بیشتر باشد — حداقل {MIN_PRICE.toLocaleString('fa-IR')} تومان
                  </p>
                )}''',
          )
          t = t.replace(
              '''              {editPrice && Number(editPrice) > 0 && Number(editPrice) < MIN_PRICE && (
                <p className="mt-1.5 text-sm text-red-600">
                  حداقل {MIN_PRICE.toLocaleString('fa-IR')} تومان
                </p>
              )}''',
              '''              {editPrice && Number(editPrice) > 0 && Number(editPrice) < MIN_PRICE && (
                <p className="mt-1.5 text-sm font-medium text-red-600">
                  قیمت باید بیشتر باشد — حداقل {MIN_PRICE.toLocaleString('fa-IR')} تومان
                </p>
              )}''',
          )

          # red border on invalid inputs
          t = t.replace(
              '''                <Input
                  inputMode="numeric"
                  pattern="[0-9]*"
                  value={addPrice}
                  onChange={(e) => setAddPrice(e.target.value.replace(/[^\d]/g, ''))}
                  placeholder="مثلاً ۳۵۰۰۰۰"
                  className="h-14 rounded-2xl text-base tabular-nums"
                  autoFocus
                />''',
              '''                <Input
                  inputMode="numeric"
                  pattern="[0-9]*"
                  value={addPrice}
                  onChange={(e) => setAddPrice(e.target.value.replace(/[^\d]/g, ''))}
                  placeholder="مثلاً ۳۵۰۰۰۰"
                  className={`h-14 rounded-2xl text-base tabular-nums ${
                    addPrice && Number(addPrice) > 0 && Number(addPrice) < MIN_PRICE
                      ? 'border-red-500 focus-visible:ring-red-500'
                      : ''
                  }`}
                  autoFocus
                />''',
          )
          t = t.replace(
              '''              <Input
                inputMode="numeric"
                pattern="[0-9]*"
                value={editPrice}
                onChange={(e) => setEditPrice(e.target.value.replace(/[^\d]/g, ''))}
                className="h-14 rounded-2xl text-base tabular-nums"
                autoFocus
              />''',
              '''              <Input
                inputMode="numeric"
                pattern="[0-9]*"
                value={editPrice}
                onChange={(e) => setEditPrice(e.target.value.replace(/[^\d]/g, ''))}
                className={`h-14 rounded-2xl text-base tabular-nums ${
                  editPrice && Number(editPrice) > 0 && Number(editPrice) < MIN_PRICE
                    ? 'border-red-500 focus-visible:ring-red-500'
                    : ''
                }`}
                autoFocus
              />''',
          )

          # remove any static top banner if still present
          t = re.sub(
              r"\s*<p className=\"[^"]*\">\s*حداقل\s*۱۰[,٬]?۰۰۰\s*تومان\s*</p>\s*",
              "\n",
              t,
          )
          sp.write_text(t)
          print('services page ok')

          # ---- portfolio: field-level red instead of top msg only ----
          pp = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          if pp.exists():
              p = pp.read_text()
              # when validation fails keep setMsg but also ensure we don't show permanent top min text
              # improve message
              p = p.replace(
                  "setMsg('قیمت باید حداقل ۱۰٬۰۰۰ تومان باشد.');",
                  "setMsg('قیمت باید بیشتر باشد — حداقل ۱۰٬۰۰۰ تومان');",
              )
              # if edit price field exists, add inline hint pattern near editPrice input
              if 'editPrice' in p and 'قیمت باید بیشتر باشد' not in p.split('value={editPrice}')[-1][:400]:
                  # try inject after edit price input
                  m = re.search(
                      r"(value=\{editPrice\}[^>]*>)",
                      p,
                  )
                  # skip complex inject if structure unknown
                  pass
              pp.write_text(p)
              print('portfolio ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/services/ServiceEditPanel.tsx \
            frontend/src/app/zibagar/services/page.tsx \
            frontend/src/app/zibagar/portfolio/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.13): min price only red inline when below 10000"
          git push
