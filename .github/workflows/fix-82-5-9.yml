        if (timeOff > 0) throw new ConflictException('در این بازه مرخصی/تعطیلی ثبت شده است');
        const manual = await tx.manualReservation.count({
          where: {
            professionalId: b.professionalId,
            startAt: { lt: endAt },
            endAt: { gt: startAt },
          },
        });
        if (manual > 0) throw new ConflictException('این بازه با رزرو دستی تداخل دارد');
        return tx.booking.update({ where: { id }, data: { startAt, endAt } });
      },
      {
        isolationLevel: Prisma.TransactionIsolationLevel.ReadCommitted,
        maxWait: 5_000,
        timeout: 15_000,
      },
    );
  }"""
