name: Restore auth.service
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-auth-service.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and patch auth.service.ts
        run: |
          git show c3d0c362b126e16ff6682515be80021094a18f82:backend/src/auth/auth.service.ts > backend/src/auth/auth.service.ts
          python3 - <<'PY2'
          path = "backend/src/auth/auth.service.ts"
          with open(path) as f:
              c = f.read()
          old = "    const passwordHash = await argon2.hash(dto.password);"
          new = """    // Password is optional (issue #43) — OTP-only accounts have null passwordHash
    const passwordHash =
      dto.password && dto.password.length >= 8
        ? await argon2.hash(dto.password)
        : null;"""
          if old not in c:
              raise SystemExit("expected passwordHash line not found")
          with open(path, "w") as f:
              f.write(c.replace(old, new, 1))
          print("patched ok", len(c))
          PY2
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "fix(auth): restore full auth.service + passwordless register (issue #43)"
          git push
