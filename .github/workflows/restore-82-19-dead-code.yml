name: restore-82-19-dead-code
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find good base and apply #82.19
        run: |
          set -euo pipefail
          GOOD=$(git log --all --oneline -- backend/src/bookings/bookings.service.ts | head -20)
          echo "$GOOD"
          if grep -q 'PLACEHOLDER' backend/src/bookings/bookings.service.ts 2>/dev/null || ! grep -q 'BookingsService' backend/src/bookings/bookings.service.ts 2>/dev/null; then
            echo "File is broken, restoring from history..."
            for c in $(git log --pretty=format:%H -- backend/src/bookings/bookings.service.ts | head -30); do
              if git show "$c:backend/src/bookings/bookings.service.ts" 2>/dev/null | grep -q 'class BookingsService' && ! git show "$c:backend/src/bookings/bookings.service.ts" 2>/dev/null | grep -q 'PLACEHOLDER'; then
                git show "$c:backend/src/bookings/bookings.service.ts" > backend/src/bookings/bookings.service.ts
                echo "Restored from $c"
                break
              fi
            done
          fi
          python3 << 'PY'
from pathlib import Path
import re
p = Path('backend/src/bookings/bookings.service.ts')
text = p.read_text(encoding='utf-8')
if 'PLACEHOLDER' in text or 'class BookingsService' not in text:
    raise SystemExit('still broken after restore')
old = """      if (sl._pauseBookings === true) {
        throw new BadRequestException('این زیباگر فعلاً نوبت جدید نمی‌پذیرد.');
      }
      // #72 — pro-initiated customer block no longer enforced
      const links = (proRow?.socialLinks as { _blockedCustomerIds?: string[] } | null) || null;
      const blocked = Array.isArray(links?._blockedCustomerIds) ? links!._blockedCustomerIds! : [];
      if (false && blocked.includes(customerId)) {
        throw new BadRequestException('متأسفانه امکان رزرو نزد این زیباگر برای شما وجود ندارد.');
      }
"""
new = """      if (sl._pauseBookings === true) {
        throw new BadRequestException('این زیباگر فعلاً نوبت جدید نمی‌پذیرد.');
      }
"""
if old in text:
    text = text.replace(old, new, 1)
    print('removed dead blocked block')
elif 'if (false && blocked' in text:
    raise SystemExit('dead block present but pattern mismatch')
else:
    print('dead block already absent')
if '$queryRawUnsafe' in text:
    text2, n = re.subn(
        r'await tx\.\$queryRawUnsafe\(\s*`SELECT id FROM professionals WHERE id = \$1::uuid FOR UPDATE`,\s*data\.professionalId,\s*\);',
        '/* #82.19 */ await tx.$queryRaw`SELECT id FROM professionals WHERE id = ${data.professionalId}::uuid FOR UPDATE`;',
        text,
        count=1,
    )
    if n != 1:
        raise SystemExit(f'queryRawUnsafe replace failed n={n}')
    text = text2
    print('replaced queryRawUnsafe')
else:
    print('no queryRawUnsafe left')
p.write_text(text, encoding='utf-8')
assert 'class BookingsService' in text
assert 'if (false && blocked' not in text
assert text.count('$queryRawUnsafe') == 0
assert '_pauseBookings' in text
print('OK markers present')
PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "fix(#82.19): remove dead blocked guard + safe \$queryRaw FOR UPDATE lock"
            git push origin HEAD:main
          fi
