name: apply-18-7-session-security
on:
  push:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: |
          set -euo pipefail
          test -f backend/src/common/guards/csrf-origin.guard.ts
          python3 scripts/apply_18_7_session_security.py
          grep -n refresh_reuse_detected backend/src/auth/auth.service.ts
          grep -n CsrfOriginGuard backend/src/auth/auth.controller.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/auth/auth.service.ts backend/src/auth/auth.controller.ts backend/test/unit/refresh-reuse.spec.ts
          if git diff --staged --quiet; then echo nochange; else git commit -m 'feat(18.7): refresh token reuse detection + CSRF Origin guard' && git push; fi
