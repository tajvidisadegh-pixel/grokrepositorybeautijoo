name: Apply earnings + calendar files
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-earnings-calendar.yml'
      - 'scripts/apply-payload/**'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write files
        run: |
          set -e
          mkdir -p scripts/apply-payload
          if [ -f scripts/apply-payload/pro_svc.b64.part1 ]; then
            cat scripts/apply-payload/pro_svc.b64.part1 scripts/apply-payload/pro_svc.b64.part2 | base64 -d > backend/src/professionals/professionals.service.ts
            echo "wrote professionals.service.ts"
            wc -c backend/src/professionals/professionals.service.ts
            grep -q "totalEarned\|available\|periods" backend/src/professionals/professionals.service.ts
          fi
          if [ -f scripts/apply-payload/bookings.b64.part1 ]; then
            cat scripts/apply-payload/bookings.b64.part1 scripts/apply-payload/bookings.b64.part2 | base64 -d > frontend/src/app/zibagar/bookings/page.tsx
            echo "wrote bookings page"
            wc -c frontend/src/app/zibagar/bookings/page.tsx
            grep -q "تقویم هفتگی\|weekDays" frontend/src/app/zibagar/bookings/page.tsx
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts frontend/src/app/zibagar/bookings/page.tsx || true
          git diff --staged --quiet || git commit -m "feat: auto earnings balance + weekly bookings calendar"
          git push
