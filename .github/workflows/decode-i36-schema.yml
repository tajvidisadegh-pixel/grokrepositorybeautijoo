name: decode-i36-schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/i36/**'
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode schema
        run: |
          python3 -c "
          import base64, pathlib
          parts = sorted(pathlib.Path('.github/i36').glob('part*.txt'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          pathlib.Path('backend/prisma/schema.prisma').write_bytes(data)
          print(len(data))
          assert b'model Professional' in data
          assert b'socialLinks' in data
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma
          git commit -m "fix: restore full schema.prisma (#36)" || true
          git push
