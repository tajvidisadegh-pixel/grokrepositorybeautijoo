name: patch-65-2-booking-sms
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-2-booking-sms.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch payments + booking SMS
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- payments.module: import NotificationsModule ---
          pm = Path('backend/src/payments/payments.module.ts')
          t = pm.read_text()
          if 'NotificationsModule' not in t:
              t = t.replace(
                  "import { ZarinpalPaymentProvider } from './zarinpal-payment.provider';",
                  "import { ZarinpalPaymentProvider } from './zarinpal-payment.provider';\nimport { NotificationsModule } from '../notifications/notifications.module';",
              )
              t = t.replace(
                  '@Module({\n  controllers: [PaymentsController],',
                  '@Module({\n  imports: [NotificationsModule],\n  controllers: [PaymentsController],',
              )
              pm.write_text(t)
              print('payments.module ok')
          else:
              print('payments.module already')

          # --- payments.service: notify pro on paid ---
          ps = Path('backend/src/payments/payments.service.ts')
          t = ps.read_text()
          if 'NotificationsService' not in t:
              t = t.replace(
                  "import { BookingStatus, PaymentStatus } from '@prisma/client';",
                  "import { BookingStatus, NotificationType, PaymentStatus } from '@prisma/client';\nimport { NotificationsService } from '../notifications/notifications.service';\nimport { tehranDateStr, tehranHHMM } from '../common/timezone';",
              )
              t = t.replace(
                  '''  constructor(
    private readonly prisma: PrismaService,
    @Inject(PAYMENT_PROVIDER) private readonly provider: PaymentProvider,
  ) {}''',
                  '''  constructor(
    private readonly prisma: PrismaService,
    @Inject(PAYMENT_PROVIDER) private readonly provider: PaymentProvider,
    private readonly notifications: NotificationsService,
  ) {}''',
              )
              old = '''    const booking = await this.prisma.booking.findUnique({
      where: { id: payment.bookingId },
    });
    if (booking && (booking.status === 'pending' || booking.status === 'expired')) {
      await this.prisma.booking.update({
        where: { id: payment.bookingId },
        data: { status: 'confirmed', confirmedAt: new Date() },
      });
    }

    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };'''
              new = '''    const booking = await this.prisma.booking.findUnique({
      where: { id: payment.bookingId },
      include: {
        professional: { select: { userId: true } },
        customer: { select: { phone: true, profile: { select: { displayName: true } } } },
      },
    });
    if (booking && (booking.status === 'pending' || booking.status === 'expired')) {
      await this.prisma.booking.update({
        where: { id: payment.bookingId },
        data: { status: 'confirmed', confirmedAt: new Date() },
      });
    }

    // #65.2 — SMS + in-app for professional when booking is paid/confirmed
    if (booking?.professional?.userId) {
      const when = booking.startAt
        ? `${tehranDateStr(booking.startAt)} ساعت ${tehranHHMM(booking.startAt)}`
        : '';
      const who =
        booking.customer?.profile?.displayName ||
        booking.customer?.phone ||
        'مشتری';
      await this.notifications.notify({
        userId: booking.professional.userId,
        type: NotificationType.booking_confirmed,
        title: 'رزرو جدید تأیید شد',
        body: when
          ? `نوبت جدید از ${who} برای ${when} پرداخت و قطعی شد.`
          : `نوبت جدید از ${who} پرداخت و قطعی شد.`,
        data: {
          bookingId: payment.bookingId,
          href: `/zibagar/bookings?focus=${payment.bookingId}`,
        },
        sms: true,
      });
    }

    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };'''
              if old not in t:
                  raise SystemExit('payments callback block not found')
              t = t.replace(old, new, 1)
              ps.write_text(t)
              print('payments.service ok')
          else:
              print('payments.service already has NotificationsService')

          # --- bookings.service: richer SMS body on create ---
          bs = Path('backend/src/bookings/bookings.service.ts')
          t = bs.read_text()
          old_n = '''      await this.notifications.notify({
        userId: pro.userId,
        type: NotificationType.booking_request,
        title: 'درخواست رزرو (در انتظار پرداخت)',
        body: 'یک مشتری نوبت رزرو کرده و در حال پرداخت است. تا تأیید پرداخت، نوبت قطعی نیست.',
        data: {
          bookingId: booking.id,
          customerId,
          professionalId: data.professionalId,
          href: `/zibagar/bookings?focus=${booking.id}`,
        },
        sms: true,
      });'''
          new_n = '''      await this.notifications.notify({
        userId: pro.userId,
        type: NotificationType.booking_request,
        title: 'درخواست رزرو (در انتظار پرداخت)',
        body: `رزرو جدید برای ${dateStr} ساعت ${startHHMM}. مشتری در حال پرداخت است — تا پرداخت، نوبت قطعی نیست.`,
        data: {
          bookingId: booking.id,
          customerId,
          professionalId: data.professionalId,
          href: `/zibagar/bookings?focus=${booking.id}`,
        },
        sms: true,
      });'''
          if old_n in t:
              t = t.replace(old_n, new_n, 1)
              bs.write_text(t)
              print('bookings.service sms body ok')
          elif 'sms: true' in t and 'booking_request' in t:
              print('bookings already has sms notify')
          else:
              raise SystemExit('booking notify block missing')

          # --- frontend badge: also count confirmed upcoming today as soft signal is optional;
          # keep pending; refresh faster on bookings route
          zl = Path('frontend/src/app/zibagar/layout.tsx')
          zt = zl.read_text()
          if "status: 'pending'" in zt and '45_000' not in zt:
              zt = zt.replace('60_000', '45_000')
              zl.write_text(zt)
              print('layout poll 45s')
          else:
              print('layout ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.module.ts backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts frontend/src/app/zibagar/layout.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.2): pro SMS on booking create+paid; bookings nav badge"
          git push
