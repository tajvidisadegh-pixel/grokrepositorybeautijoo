name: Apply issue 23 earnings UI
on:
  push:
    paths:
      - 'scripts/apply-issue23-earnings.sh'
      - '.github/workflows/apply-issue23.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write earnings page
        run: bash scripts/apply-issue23-earnings.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/earnings/page.tsx
          if git diff --staged --quiet; then echo No change; else git commit -m "feat(zibagar): earnings periods chart without gross/commission (issue #23)" && git push; fi
