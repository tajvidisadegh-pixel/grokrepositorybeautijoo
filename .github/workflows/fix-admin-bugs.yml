name: Fix admin bugs setUserRoles dashboard
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from last good commit and patch
        run: |
          git show fc049b303c2252c030edfce5aa5f6ea0498449d3:backend/src/admin/admin.service.ts > backend/src/admin/admin.service.ts
          python3 scripts/apply_admin_bugfixes.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          git status
          git diff --cached --stat
          git commit -m "fix(admin): setUserRoles + dashboard revenue + bookingsByStatus" || exit 0
          git push origin HEAD:main
