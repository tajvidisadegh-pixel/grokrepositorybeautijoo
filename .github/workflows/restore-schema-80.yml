name: Restore schema 80

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-schema-80.yml'
      - 'scripts/patch_schema_80.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore good schema from history
        run: |
          set -euo pipefail
          git show 154893e6d466fc5e80402a72dee9f1aaf7115e70:backend/prisma/schema.prisma > backend/prisma/schema.prisma
          test -s backend/prisma/schema.prisma
          wc -c backend/prisma/schema.prisma

      - name: Apply Issue 80 fields
        run: python3 scripts/patch_schema_80.py

      - name: Commit restored schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma
          if git diff --cached --quiet; then
            echo "no schema change"
            exit 0
          fi
          git commit -m "fix(#80): restore schema.prisma with three-layer pricing fields"
          git push origin HEAD:main
