name: Fix booking eslint 80.6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-booking-eslint-80.yml'
      - 'scripts/fix_booking_eslint_80.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_booking_eslint_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/booking/booking-wizard.tsx "frontend/src/app/booking/[slug]/page.tsx"
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#80.6): eslint cleanups for booking pricing UI"
          git push origin HEAD:main
