name: Retire noisy workflows
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/retire-noisy-workflows.yml
permissions:
  contents: write
jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace noisy workflows with noop
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/fix-admin-pricing-return.yml \
            .github/workflows/restore-pricing-controller.yml \
            .github/workflows/booking-offline-mode.yml \
            .github/workflows/restore-payments-offline.yml \
            .github/workflows/offline-wizard-export.yml \
            .github/workflows/create-stable-tag.yml \
            .github/workflows/sync-backend-export-root.yml
          do
            name=$(basename "$f" .yml)
            cat > "$f" <<EOF
          name: ${name} (retired noop)
          on:
            workflow_dispatch:
          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "retired — no longer runs on push"
          EOF
            # fix leading spaces from heredoc indent
            sed -i 's/^          //' "$f"
            echo retired "$f"
          done
      - name: Sync payments to export
        run: |
          git fetch origin beautijoo-backend-export || true
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export || exit 0
          mkdir -p /tmp/be/src/payments
          cp backend/src/payments/payments.service.ts /tmp/be/src/payments/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payments/payments.service.ts
          git commit -m "fix: offline auto keeps mock for tests" || true
          git push origin HEAD:beautijoo-backend-export || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          git commit -m "ci: retire noisy one-shot workflows (noop on push)" || exit 0
          git push origin HEAD:main
