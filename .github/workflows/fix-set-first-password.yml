name: fix-set-first-password
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_set_first_password.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_set_first_password.py
      - name: Commit main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts backend/src/auth/dto/auth.dto.ts backend/src/auth/password-reset.helpers.ts
          git commit -m "fix(auth): OTP-only accounts can set first password" || exit 0
          git push
      - name: Sync to export
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 << 'PY'
          import base64, json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'beautijoo-backend-export'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'sync',
              'Content-Type': 'application/json',
          }
          def api(method, url, data=None):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode())
          mapping = [
              ('backend/src/auth/auth.service.ts', 'src/auth/auth.service.ts'),
              ('backend/src/auth/dto/auth.dto.ts', 'src/auth/dto/auth.dto.ts'),
              ('backend/src/auth/password-reset.helpers.ts', 'src/auth/password-reset.helpers.ts'),
          ]
          for local, remote in mapping:
              with open(local, 'rb') as f:
                  raw = f.read()
              b64 = base64.b64encode(raw).decode()
              get_url = f'https://api.github.com/repos/{repo}/contents/{remote}?ref={branch}'
              try:
                  sha = api('GET', get_url).get('sha')
              except Exception:
                  sha = None
              payload = {
                  'message': f'fix(auth): sync {remote} set-first-password',
                  'content': b64,
                  'branch': branch,
              }
              if sha:
                  payload['sha'] = sha
              api('PUT', f'https://api.github.com/repos/{repo}/contents/{remote}', json.dumps(payload).encode())
              print('synced', remote, len(raw))
          PY
