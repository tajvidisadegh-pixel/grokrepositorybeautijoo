name: Apply issue29 Jalali dates
on:
  push:
    paths:
      - 'scripts/patch-issue29-jalali.py'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-issue29-jalali.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/bookings/page.tsx \
                  frontend/src/app/panel/settings/page.tsx \
                  frontend/src/app/admin/audit/page.tsx \
                  frontend/src/app/admin/site-builder/page.tsx \
                  frontend/src/components/booking/booking-wizard.tsx \
                  frontend/src/components/layout/footer.tsx || true
          if git diff --staged --quiet; then echo No change; else
            git commit -m "fix(dates): site-wide Jalali via fa-IR-u-ca-persian (#29)"
            git push
          fi
