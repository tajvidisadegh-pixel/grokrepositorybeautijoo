name: Fix admin catalog controller
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-catalog.yml'

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write real controller (inline)
        run: |
          mkdir -p backend/src/admin
          cat > backend/src/admin/admin-catalog.controller.ts << 'ENDOFFILE'
          import {
            Body,
            Controller,
            Delete,
            Get,
            NotFoundException,
            BadRequestException,
            Param,
            Patch,
            Post,
          } from '@nestjs/common';
          import { ApiBearerAuth, ApiOperation, ApiTags } from '@nestjs/swagger';
          import { IsBoolean, IsOptional, IsString, IsUUID, MinLength } from 'class-validator';
          import { PrismaService } from '../prisma/prisma.service';
          import { Roles } from '../common/decorators/roles.decorator';

          function slugify(input: string): string {
            const base = input
              .trim()
              .toLowerCase()
              .replace(/\s+/g, '-')
              .replace(/[^\w\u0600-\u06FF-]+/g, '')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');
            return base || `node-${Date.now()}`;
          }

          class CreateCategoryDto {
            @IsString() @MinLength(1) name!: string;
            @IsOptional() @IsUUID() parentId?: string | null;
            @IsOptional() @IsString() slug?: string;
            @IsOptional() @IsString() description?: string;
          }

          class UpdateCategoryDto {
            @IsOptional() @IsString() @MinLength(1) name?: string;
            @IsOptional() @IsUUID() parentId?: string | null;
            @IsOptional() @IsBoolean() isActive?: boolean;
            @IsOptional() @IsString() description?: string;
          }

          class CreateCatalogServiceDto {
            @IsString() @MinLength(1) name!: string;
            @IsUUID() categoryId!: string;
            @IsOptional() @IsString() slug?: string;
            @IsOptional() @IsString() description?: string;
          }

          class UpdateCatalogServiceDto {
            @IsOptional() @IsString() @MinLength(1) name?: string;
            @IsOptional() @IsUUID() categoryId?: string;
            @IsOptional() @IsBoolean() isActive?: boolean;
            @IsOptional() @IsString() description?: string;
          }

          @ApiTags('admin-catalog')
          @ApiBearerAuth()
          @Roles('SUPER_ADMIN', 'admin')
          @Controller('admin')
          export class AdminCatalogController {
            constructor(private readonly prisma: PrismaService) {}

            @Get('service-categories')
            listCategories() {
              return this.prisma.serviceCategory.findMany({
                orderBy: [{ sortOrder: 'asc' }, { name: 'asc' }],
                include: {
                  parent: { select: { id: true, name: true } },
                  _count: { select: { services: true, children: true } },
                },
              });
            }

            @Post('service-categories')
            async createCategory(@Body() dto: CreateCategoryDto) {
              const name = dto.name.trim();
              if (!name) throw new BadRequestException('name required');
              if (dto.parentId) {
                const parent = await this.prisma.serviceCategory.findUnique({ where: { id: dto.parentId } });
                if (!parent) throw new NotFoundException('parent not found');
              }
              let slug = (dto.slug?.trim() || slugify(name)).slice(0, 140);
              const existing = await this.prisma.serviceCategory.findUnique({ where: { slug } });
              if (existing) slug = `${slug}-${Date.now().toString(36)}`.slice(0, 140);
              return this.prisma.serviceCategory.create({
                data: {
                  name,
                  slug,
                  parentId: dto.parentId || null,
                  description: dto.description?.trim() || null,
                  isActive: true,
                },
                include: {
                  parent: { select: { id: true, name: true } },
                  _count: { select: { services: true, children: true } },
                },
              });
            }

            @Patch('service-categories/:id')
            async updateCategory(@Param('id') id: string, @Body() dto: UpdateCategoryDto) {
              const row = await this.prisma.serviceCategory.findUnique({ where: { id } });
              if (!row) throw new NotFoundException('category not found');
              if (dto.parentId !== undefined && dto.parentId !== null) {
                if (dto.parentId === id) throw new BadRequestException('invalid parent');
                const parent = await this.prisma.serviceCategory.findUnique({ where: { id: dto.parentId } });
                if (!parent) throw new NotFoundException('parent not found');
              }
              return this.prisma.serviceCategory.update({
                where: { id },
                data: {
                  ...(dto.name !== undefined ? { name: dto.name.trim() } : {}),
                  ...(dto.parentId !== undefined ? { parentId: dto.parentId } : {}),
                  ...(dto.isActive !== undefined ? { isActive: dto.isActive } : {}),
                  ...(dto.description !== undefined ? { description: dto.description.trim() || null } : {}),
                },
                include: {
                  parent: { select: { id: true, name: true } },
                  _count: { select: { services: true, children: true } },
                },
              });
            }

            @Delete('service-categories/:id')
            async deleteCategory(@Param('id') id: string) {
              const row = await this.prisma.serviceCategory.findUnique({ where: { id } });
              if (!row) throw new NotFoundException('category not found');
              await this.prisma.$transaction([
                this.prisma.serviceCategory.update({ where: { id }, data: { isActive: false } }),
                this.prisma.service.updateMany({ where: { categoryId: id }, data: { isActive: false } }),
              ]);
              return { id, deleted: true, soft: true };
            }

            @Get('catalog-services')
            listCatalogServices() {
              return this.prisma.service.findMany({
                orderBy: { name: 'asc' },
                include: { category: { select: { id: true, name: true, slug: true } } },
              });
            }

            @Post('catalog-services')
            async createCatalogService(@Body() dto: CreateCatalogServiceDto) {
              const name = dto.name.trim();
              if (!name) throw new BadRequestException('name required');
              const category = await this.prisma.serviceCategory.findUnique({ where: { id: dto.categoryId } });
              if (!category) throw new NotFoundException('category not found');
              let slug = (dto.slug?.trim() || slugify(name)).slice(0, 160);
              const existing = await this.prisma.service.findUnique({ where: { slug } });
              if (existing) slug = `${slug}-${Date.now().toString(36)}`.slice(0, 160);
              return this.prisma.service.create({
                data: {
                  name,
                  slug,
                  categoryId: dto.categoryId,
                  description: dto.description?.trim() || null,
                  isActive: true,
                },
                include: { category: { select: { id: true, name: true, slug: true } } },
              });
            }

            @Patch('catalog-services/:id')
            async updateCatalogService(@Param('id') id: string, @Body() dto: UpdateCatalogServiceDto) {
              const row = await this.prisma.service.findUnique({ where: { id } });
              if (!row) throw new NotFoundException('service not found');
              if (dto.categoryId) {
                const category = await this.prisma.serviceCategory.findUnique({ where: { id: dto.categoryId } });
                if (!category) throw new NotFoundException('category not found');
              }
              return this.prisma.service.update({
                where: { id },
                data: {
                  ...(dto.name !== undefined ? { name: dto.name.trim() } : {}),
                  ...(dto.categoryId !== undefined ? { categoryId: dto.categoryId } : {}),
                  ...(dto.isActive !== undefined ? { isActive: dto.isActive } : {}),
                  ...(dto.description !== undefined ? { description: dto.description.trim() || null } : {}),
                },
                include: { category: { select: { id: true, name: true, slug: true } } },
              });
            }

            @Delete('catalog-services/:id')
            async deleteCatalogService(@Param('id') id: string) {
              const row = await this.prisma.service.findUnique({ where: { id } });
              if (!row) throw new NotFoundException('service not found');
              await this.prisma.service.update({ where: { id }, data: { isActive: false } });
              return { id, deleted: true, soft: true };
            }
          }
          ENDOFFILE
          # strip leading indentation from heredoc lines (2 spaces from YAML)
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/admin/admin-catalog.controller.ts')
          lines = p.read_text().splitlines()
          # remove 2-space indent if present on all code lines
          fixed = []
          for line in lines:
              if line.startswith('  '):
                  fixed.append(line[2:])
              else:
                  fixed.append(line)
          p.write_text('\\n'.join(fixed) + '\\n')
          t = p.read_text()
          assert 'AdminCatalogController' in t
          assert \"@Delete('service-categories/:id')\" in t
          print('ok', len(t))
          "
      - name: Ensure module registers controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin.module.ts')
          t = p.read_text()
          if 'AdminCatalogController' not in t:
              t = t.replace(
                  "import { PublicSiteController } from './public-site.controller';",
                  "import { PublicSiteController } from './public-site.controller';\nimport { AdminCatalogController } from './admin-catalog.controller';",
              )
              t = t.replace(
                  'PublicSiteController,\n  ],',
                  'PublicSiteController,\n    AdminCatalogController,\n  ],',
              )
              p.write_text(t)
              print('module updated')
          else:
              print('module already has controller')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-catalog.controller.ts backend/src/admin/admin.module.ts
          git commit -m "feat(admin): AdminCatalogController with DELETE service-categories" || exit 0
          git push origin HEAD:main
