name: fix-61-rev2
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/app/zibagar/reviews/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'قالب پاسخ' in t and '</>' not in t[t.find('قالب پاسخ'): t.find('قالب پاسخ')+900]:
              t = re.sub(
                  r'(</div>\s*</div>\s*)\) : \(\s*<Button\s+size="sm"\s+variant="outline"\s+onClick=\{\(\) => \{\s*setReplyFor\(r\.id\);',
                  r'\1</>\n                      ) : (\n                        <Button\n                          size="sm"\n                          variant="outline"\n                          onClick={() => {\n                            setReplyFor(r.id);',
                  t,
                  count=1,
              )
              p.write_text(t, encoding='utf-8')
              print('reviews closed')
          else:
              print('reviews ok or no templates', '</>' in t)

          p = Path('frontend/src/app/zibagar/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'سقف ظرفیت روزانه' not in t:
              card = '''
      <Card className="space-y-2 p-4">
        <h2 className="text-sm font-bold">سقف ظرفیت روزانه</h2>
        <p className="text-xs text-gray">هشدار داشبورد وقتی تعداد نوبت امروز به این عدد برسد.</p>
        <input
          type="number"
          min={1}
          max={50}
          className="h-10 w-32 rounded-xl border border-border px-2 text-sm"
          defaultValue={5}
          onFocus={(e) => {
            try {
              const v = localStorage.getItem('bj_daily_cap');
              if (v) e.currentTarget.value = v;
            } catch {}
          }}
          onChange={(e) => {
            try {
              localStorage.setItem(
                'bj_daily_cap',
                String(Math.max(1, Math.min(50, Number(e.target.value) || 5))),
              );
            } catch {}
          }}
        />
      </Card>
'''
              if '{pendingReviewBanner}' in t:
                  t = t.replace('{pendingReviewBanner}', card + '\n      {pendingReviewBanner}', 1)
                  p.write_text(t, encoding='utf-8')
                  print('capacity card added')
              else:
                  print('no anchor')
          else:
              print('capacity exists')
          PY
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m 'fix: #61 reviews fragment + capacity card' && git push)
