name: patch-65-10-events
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-10-events.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enhance events API sanitize + UI dates/filter
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- Backend: sanitize items on put ---
          p = Path('backend/src/admin/admin-settings.controller.ts')
          t = p.read_text()
          old = '''  @RequirePermissions('admin.settings.write')
  @Put('events')
  @ApiOperation({ summary: 'Replace marketing/site events list (#65.10)' })
  async putEvents(@Body() body: { items?: Array<Record<string, unknown>> }) {
    const items = Array.isArray(body?.items) ? body.items.slice(0, 100) : [];
    const value = { items };
    await this.prisma.platformSetting.upsert({
      where: { key: 'marketing_events_v1' },
      create: { key: 'marketing_events_v1', value: value as object },
      update: { value: value as object },
    });
    return { items };
  }
}'''
          new = '''  @RequirePermissions('admin.settings.write')
  @Put('events')
  @ApiOperation({ summary: 'Replace marketing/site events list (#65.10)' })
  async putEvents(@Body() body: { items?: Array<Record<string, unknown>> }) {
    const raw = Array.isArray(body?.items) ? body.items.slice(0, 100) : [];
    const allowedKinds = new Set(['discount', 'new_pro', 'suggestion', 'campaign', 'other']);
    const items = raw
      .map((row, i) => {
        if (!row || typeof row !== 'object') return null;
        const id = String((row as any).id || `ev_${Date.now()}_${i}`).slice(0, 64);
        const title = String((row as any).title || '').trim().slice(0, 120);
        if (title.length < 2) return null;
        let kind = String((row as any).kind || 'other').slice(0, 40);
        if (!allowedKinds.has(kind)) kind = 'other';
        const bodyText = String((row as any).body || '').trim().slice(0, 500);
        const href = String((row as any).href || '').trim().slice(0, 300);
        const active = (row as any).active !== false;
        const startsAt = (row as any).startsAt ? String((row as any).startsAt).slice(0, 40) : undefined;
        const endsAt = (row as any).endsAt ? String((row as any).endsAt).slice(0, 40) : undefined;
        return {
          id,
          kind,
          title,
          body: bodyText || undefined,
          href: href || undefined,
          active,
          startsAt: startsAt || undefined,
          endsAt: endsAt || undefined,
        };
      })
      .filter(Boolean);
    const value = { items };
    await this.prisma.platformSetting.upsert({
      where: { key: 'marketing_events_v1' },
      create: { key: 'marketing_events_v1', value: value as object },
      update: { value: value as object },
    });
    return { items };
  }
}'''
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('backend sanitize ok')
          elif 'allowedKinds' in t:
              print('backend already sanitized')
          else:
              print('WARN backend pattern miss')

          # --- Frontend: dates + filter ---
          fp = Path('frontend/src/app/admin/events/page.tsx')
          ft = fp.read_text()

          if 'filterKind' not in ft:
              ft = ft.replace(
                  '  const [editing, setEditing] = useState<EventItem | null>(null);',
                  "  const [editing, setEditing] = useState<EventItem | null>(null);\n  const [filterKind, setFilterKind] = useState<string>('all');",
              )

          # add date fields in form before active checkbox
          if 'startsAt' not in ft or 'type="datetime-local"' not in ft:
              old_form = '''            <div>
              <label className="mb-1 block text-xs text-gray">لینک (اختیاری)</label>
              <input
                className="w-full rounded-xl border border-border px-3 py-2 text-sm"
                value={editing.href || ''}
                onChange={(e) => setEditing({ ...editing, href: e.target.value })}
                placeholder="/professionals یا https://..."
              />
            </div>
            <div className="flex items-end">
              <label className="flex items-center gap-2 text-sm">
                <input
                  type="checkbox"
                  checked={editing.active !== false}
                  onChange={(e) => setEditing({ ...editing, active: e.target.checked })}
                />
                فعال
              </label>
            </div>'''
              new_form = '''            <div>
              <label className="mb-1 block text-xs text-gray">لینک (اختیاری)</label>
              <input
                className="w-full rounded-xl border border-border px-3 py-2 text-sm"
                value={editing.href || ''}
                onChange={(e) => setEditing({ ...editing, href: e.target.value })}
                placeholder="/professionals یا https://..."
              />
            </div>
            <div>
              <label className="mb-1 block text-xs text-gray">شروع (اختیاری)</label>
              <input
                type="datetime-local"
                className="w-full rounded-xl border border-border px-3 py-2 text-sm"
                value={(editing.startsAt || '').slice(0, 16)}
                onChange={(e) => setEditing({ ...editing, startsAt: e.target.value || undefined })}
              />
            </div>
            <div>
              <label className="mb-1 block text-xs text-gray">پایان (اختیاری)</label>
              <input
                type="datetime-local"
                className="w-full rounded-xl border border-border px-3 py-2 text-sm"
                value={(editing.endsAt || '').slice(0, 16)}
                onChange={(e) => setEditing({ ...editing, endsAt: e.target.value || undefined })}
              />
            </div>
            <div className="flex items-end">
              <label className="flex items-center gap-2 text-sm">
                <input
                  type="checkbox"
                  checked={editing.active !== false}
                  onChange={(e) => setEditing({ ...editing, active: e.target.checked })}
                />
                فعال
              </label>
            </div>'''
              if old_form in ft:
                  ft = ft.replace(old_form, new_form, 1)
                  print('form dates ok')
              else:
                  print('WARN form block miss')

          # filter chips above list
          if 'filterKind' in ft and 'setFilterKind' in ft and 'همه انواع' not in ft:
              needle = '{msg && <p className="rounded-xl bg-blue-light px-3 py-2 text-sm text-blue">{msg}</p>}'
              inject = '''{msg && <p className="rounded-xl bg-blue-light px-3 py-2 text-sm text-blue">{msg}</p>}

      <div className="flex flex-wrap gap-1.5">
        <button
          type="button"
          onClick={() => setFilterKind('all')}
          className={`rounded-full border px-3 py-1 text-xs ${
            filterKind === 'all' ? 'border-coral bg-coral text-white' : 'border-border bg-white'
          }`}
        >
          همه انواع
        </button>
        {KINDS.map((k) => (
          <button
            key={k.id}
            type="button"
            onClick={() => setFilterKind(k.id)}
            className={`rounded-full border px-3 py-1 text-xs ${
              filterKind === k.id ? 'border-coral bg-coral text-white' : 'border-border bg-white'
            }`}
          >
            {k.label}
          </button>
        ))}
      </div>'''
              if needle in ft:
                  ft = ft.replace(needle, inject, 1)
                  print('filter chips ok')

          # apply filter when mapping items
          ft = ft.replace(
              '{items.map((it) => {',
              '{items.filter((it) => filterKind === \'all\' || it.kind === filterKind).map((it) => {',
          )

          # empty state when filter hides all
          ft = ft.replace(
              '{items.length === 0 && !editing ? (',
              '{items.filter((it) => filterKind === \'all\' || it.kind === filterKind).length === 0 && !editing ? (',
          )

          fp.write_text(ft)
          print('frontend size', fp.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-settings.controller.ts frontend/src/app/admin/events/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.10): admin events filter, dates, server sanitize"
          git push
