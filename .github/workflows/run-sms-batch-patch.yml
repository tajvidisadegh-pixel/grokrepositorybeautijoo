name: run-sms-batch-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-sms-batch-patch.yml'
      - 'scripts/patch_admin_ops_sms_batch.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run SMS batch patch
        run: |
          set -euo pipefail
          python3 scripts/patch_admin_ops_sms_batch.py
          grep -n concurrency backend/src/admin/admin-ops.controller.ts | head -3
          grep -n smsDelivered backend/src/admin/admin-ops.controller.ts | head -3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.r3): concurrent bulk SMS batches + per-user deliveryStatus"
          git push origin HEAD:main
