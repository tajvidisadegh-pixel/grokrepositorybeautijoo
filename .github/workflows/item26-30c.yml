name: item26-30c
on:
  push:
    paths: ['.github/workflows/item26-30c.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore auth.dto from pre-placeholder + patch gender
        run: |
          set -eux
          # restore dto from before PLACEHOLDER (c49a974)
          git show c49a974253d133ed2ff2463fb71b9e3e2622ca33:backend/src/auth/dto/auth.dto.ts > backend/src/auth/dto/auth.dto.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/auth/dto/auth.dto.ts')
          s = p.read_text()
          assert 'PLACEHOLDER' not in s and 'UpdateProfileDto' in s
          if 'gender?:' not in s[s.find('UpdateProfileDto'):]:
              s = s.replace(
                  "@MaxLength(512)\n  avatarUrl?: string;\n}\n\nexport class ChangePasswordDto",
                  "@MaxLength(512)\n  avatarUrl?: string;\n\n  @ApiPropertyOptional({ enum: ['female', 'male', 'other', 'undisclosed'] })\n  @IsOptional()\n  @IsString()\n  gender?: string;\n}\n\nexport class ChangePasswordDto",
                  1,
              )
              p.write_text(s)
          print('dto', len(s), 'gender' in s)
          PY
      - name: Patch services and frontend
        run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          import re

          # auth.service
          p = Path('backend/src/auth/auth.service.ts')
          s = p.read_text()
          if 'dto.gender' not in s:
              s = s.replace(
                  'if (dto.avatarUrl !== undefined) profileData.avatarUrl = dto.avatarUrl;\n    if (dto.bio !== undefined) profileData.bio = dto.bio;',
                  'if (dto.avatarUrl !== undefined) profileData.avatarUrl = dto.avatarUrl;\n    if (dto.bio !== undefined) profileData.bio = dto.bio;\n    if (dto.firstName !== undefined) profileData.firstName = dto.firstName;\n    if (dto.lastName !== undefined) profileData.lastName = dto.lastName;\n    if (dto.gender !== undefined) profileData.gender = dto.gender;',
                  1,
              )
          if 'gender: user.profile' not in s:
              s = s.replace(
                  'displayName: user.profile?.displayName,\n      avatarUrl: user.profile?.avatarUrl,\n      roles,',
                  'displayName: user.profile?.displayName,\n      avatarUrl: user.profile?.avatarUrl,\n      profile: user.profile\n        ? {\n            displayName: user.profile.displayName,\n            firstName: user.profile.firstName,\n            lastName: user.profile.lastName,\n            avatarUrl: user.profile.avatarUrl,\n            bio: user.profile.bio,\n            gender: user.profile.gender,\n          }\n        : null,\n      roles,',
                  1,
              )
          p.write_text(s)
          print('auth.service', 'dto.gender' in s)

          # bookings.service
          p = Path('backend/src/bookings/bookings.service.ts')
          s = p.read_text()
          old = 'listMineAsCustomer(userId: string, page = 1, limit = 20) {\n    const skip = (page - 1) * limit;\n    const [items, total] = await Promise.all([\n      this.prisma.booking.findMany({\n        where: { customerId: userId },'
          new = 'listMineAsCustomer(userId: string, page = 1, limit = 20, status?: string) {\n    const skip = (page - 1) * limit;\n    const where: { customerId: string; status?: string } = { customerId: userId };\n    if (status) where.status = status as never;\n    const [items, total] = await Promise.all([\n      this.prisma.booking.findMany({\n        where,'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('listMine ok')
          else:
              print('listMine miss')

          # controller
          p = Path('backend/src/bookings/bookings.controller.ts')
          s = p.read_text()
          if "@Query('status') status" not in s[s.find("@Get('mine')"):s.find("@Get('mine')")+400]:
              s = s.replace(
                  "@Query('limit') limit?: string,\n  ) {\n    return this.service.listMineAsCustomer(\n      userId,\n      page ? parseInt(page, 10) : 1,\n      limit ? parseInt(limit, 10) : 20,\n    );",
                  "@Query('limit') limit?: string,\n    @Query('status') status?: string,\n  ) {\n    return this.service.listMineAsCustomer(\n      userId,\n      page ? parseInt(page, 10) : 1,\n      limit ? parseInt(limit, 10) : 20,\n      status,\n    );",
                  1,
              )
              p.write_text(s)
              print('ctrl')

          # panel-api
          p = Path('frontend/src/lib/panel-api.ts')
          s = p.read_text()
          if 'status?: string' not in s[s.find('fetchMyBookings'):s.find('fetchMyBookings')+120]:
              s = s.replace(
                  'export async function fetchMyBookings(page = 1, limit = 20) {\n  const res = await apiClient.get<Paginated<BookingListItem> | BookingListItem[]>(`/bookings/mine?page=${page}&limit=${limit}`);',
                  'export async function fetchMyBookings(page = 1, limit = 20, status?: string) {\n  const q = new URLSearchParams({ page: String(page), limit: String(limit) });\n  if (status) q.set("status", status);\n  const res = await apiClient.get<Paginated<BookingListItem> | BookingListItem[]>(`/bookings/mine?${q}`);',
                  1,
              )
              p.write_text(s)
              print('panel-api')

          # panel bookings filter
          p = Path('frontend/src/app/panel/bookings/page.tsx')
          s = p.read_text()
          if 'statusFilter' not in s:
              s = s.replace('const [items, setItems]', "const [statusFilter, setStatusFilter] = useState('');\n  const [items, setItems]", 1)
              s = s.replace('fetchMyBookings(page, 20)', 'fetchMyBookings(page, 20, statusFilter || undefined)')
              s = s.replace('fetchMyBookings(1, 50)', 'fetchMyBookings(1, 50, statusFilter || undefined)')
              s = s.replace('}, [page]);', '}, [page, statusFilter]);', 1)
              ui = '''\n      <div className="flex flex-wrap gap-2" aria-label="فیلتر وضعیت">\n        {[\n          { v: '', l: 'همه' },\n          { v: 'pending', l: 'در انتظار' },\n          { v: 'confirmed', l: 'تأییدشده' },\n          { v: 'completed', l: 'انجام‌شده' },\n          { v: 'cancelled', l: 'کنسل‌شده' },\n        ].map((o) => (\n          <button\n            key={o.v || 'all'}\n            type="button"\n            onClick={() => setStatusFilter(o.v)}\n            className={`rounded-full border px-3 py-1.5 text-xs font-medium ${\n              statusFilter === o.v\n                ? 'border-coral bg-coral text-white'\n                : 'border-border bg-white hover:border-coral'\n            }`}\n          >\n            {o.l}\n          </button>\n        ))}\n      </div>\n'''
              for marker in ['{loading', 'PanelLoading', '{items.length']:
                  j = s.find(marker)
                  if j > 0:
                      s = s[:j] + ui + s[j:]
                      break
              p.write_text(s)
              print('filter')

          # wizard
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          if 'جزئیات مبلغ' not in s:
              s = s.replace(
                  '<p className="text-xs text-gray">هیچ هزینه پنهانی اضافه نمی‌شود.</p>',
                  '<p className="text-xs text-gray">جزئیات مبلغ: خدمت و افزودنی‌ها در بالا آمده. کمیسیون پلتفرم از مشتری کسر نمی‌شود؛ مبلغ نهایی همان جمع بالاست. هیچ هزینه پنهانی اضافه نمی‌شود.</p>',
                  1,
              )
              p.write_text(s)
              print('wizard')

          # zibagar banner
          p = Path('frontend/src/app/zibagar/page.tsx')
          s = p.read_text()
          if '۲۴ تا ۷۲' not in s:
              m = re.search(r'const statusInfo = statusDot\(pro\?\.status\);\n', s)
              if m:
                  decl = m.group(0) + '''\n  const pendingReviewBanner =\n    pro?.status === 'pending_review' ? (\n      <div className="mb-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-950" role="status">\n        <p className="font-bold">پروفایل شما در حال بررسی است</p>\n        <p className="mt-1 text-xs leading-6 text-amber-900/90">\n          درخواست تأیید برای ادمین ارسال شده. معمولاً بررسی بین ۲۴ تا ۷۲ ساعت طول می‌کشد.\n          تا زمان تأیید، پروفایل در جستجوی عمومی نمایش داده نمی‌شود.\n        </p>\n      </div>\n    ) : pro?.status === 'draft' ? (\n      <div className="mb-4 rounded-2xl border border-border bg-gray-light/50 px-4 py-3 text-sm" role="status">\n        <p className="font-medium">پروفایل هنوز پیش‌نویس است</p>\n        <p className="mt-1 text-xs text-gray">پس از تکمیل اطلاعات، آن را برای بررسی ادمین ارسال کنید.</p>\n      </div>\n    ) : null;\n'''
                  s = s[:m.start()] + decl + s[m.end():]
                  k = s.find('return (', s.find('pendingReviewBanner'))
                  mm = re.search(r'return \(\s*<div[^>]*>', s[k:]) if k>=0 else None
                  if mm:
                      pos = k + mm.end()
                      s = s[:pos] + '\n      {pendingReviewBanner}\n' + s[pos:]
                  p.write_text(s)
                  print('banner')
              else:
                  print('banner miss')
          print('done')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item26-30c.yml .github/workflows/item26-30b.yml .github/workflows/item26-30.yml
          git add -A
          git status
          git commit -m "feat(#40): items 26-30 price note, profile gender API, filters, pending banner" || echo nothing
          git push
