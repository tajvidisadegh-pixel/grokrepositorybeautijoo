name: Fix SpecialtyView for CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_sv30.py'
      - '.github/workflows/fix-sv30.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fix script
        run: |
          set -e
          python3 scripts/fix_sv30.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(#30): SpecialtyView valid JSX selection-only; remove broken workflows" || echo no-change
          git push
