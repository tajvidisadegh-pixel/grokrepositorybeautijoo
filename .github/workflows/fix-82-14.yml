name: fix-82-14
"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-82-14.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 82.14
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64
          chunks = [
            "","
            ""
            "pZiBcInBob25lOiB0cnVlXCIgaW4gc2VnOgogICAgcmFpc2UgU3lzdGVtRXhpdChcInBob25lIHN0aWxsIGluIGxpc3RNaW5lQXNQcm9mZXNzaW9uYWwgc2VnbWVudFwiKQpwcmludChcInZlcmlmeSBvayIpCg==",
          ]
          exec(base64.b64decode("".join(chunks)))
          PY
          grep -n "#82.14" backend/src/bookings/bookings.service.ts | head -8
          grep -n "#82.14" backend/src/main.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/main.ts
          git commit -m "fix(#82.14): strip booking phone PII; disable OpenAPI in production"
          git push
