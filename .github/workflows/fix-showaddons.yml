name: Fix showAddOns
on:
  push:
    paths: ['.github/workflows/fix-showaddons.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          if 'setShowAddOns' not in s:
              s = s.replace(
                  "  const [paymentInfo, setPaymentInfo] = useState<string | null>(null);\n",
                  "  const [paymentInfo, setPaymentInfo] = useState<string | null>(null);\n  const [showAddOns, setShowAddOns] = useState(false);\n",
              )
              p.write_text(s)
              print('fixed')
          else:
              print('already ok')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-showaddons.yml
          git add -A
          git diff --cached --quiet || git commit -m "fix: restore showAddOns state in booking-wizard"
          git push
