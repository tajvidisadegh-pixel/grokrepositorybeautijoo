name: fix-62-41-50-gaps
on:
  push:
    paths:
      - scripts/fix_62_41_50_gaps.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_62_41_50_gaps.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "fix: #62.44 expired banner + lead-time note" && git push)
