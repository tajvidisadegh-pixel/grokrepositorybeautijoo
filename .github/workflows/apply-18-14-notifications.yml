name: apply-18-14-notifications
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-18-14-notifications.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore panel-api + frontend 18.14 UX
        run: |
          set -euo pipefail
          GOOD=7be43fdb4c710908551bd2bebc8bfe74cf4088c0
          git show "${GOOD}:frontend/src/lib/panel-api.ts" > frontend/src/lib/panel-api.ts
          python3 << 'PY'
          from pathlib import Path

          # --- panel-api markAll ---
          p = Path('frontend/src/lib/panel-api.ts')
          text = p.read_text()
          if 'markAllNotificationsRead' not in text:
              old = """export async function markNotificationRead(id: string) {
            return apiClient.patch(`/notifications/${id}/read`);
          }"""
              new = old + """
          export async function markAllNotificationsRead() {
            return apiClient.patch<{ message: string; updated: number }>('/notifications/read-all');
          }"""
              if old not in text:
                  raise SystemExit('panel-api anchor missing')
              text = text.replace(old, new, 1)
              p.write_text(text)
          assert p.stat().st_size > 20000, p.stat().st_size
          print('panel-api ok', p.stat().st_size)

          # --- panel-shell polling ---
          shell = Path('frontend/src/components/panel/panel-shell.tsx')
          st = shell.read_text()
          if '45_000' not in st and 'setInterval' not in st:
              old = """    if (typeof window !== 'undefined') {
          window.addEventListener('focus', onFocus);
          window.addEventListener('beautijoo:unread-changed', onUnreadChanged);
        }

        return () => {
          cancelled = true;
          if (typeof window !== 'undefined') {
            window.removeEventListener('focus', onFocus);
            window.removeEventListener('beautijoo:unread-changed', onUnreadChanged);
          }
        };"""
              new = """    if (typeof window !== 'undefined') {
          window.addEventListener('focus', onFocus);
          window.addEventListener('beautijoo:unread-changed', onUnreadChanged);
        }
        const timer = window.setInterval(() => {
          if (document.visibilityState === 'visible') void refreshUnread();
        }, 45_000);

        return () => {
          cancelled = true;
          window.clearInterval(timer);
          if (typeof window !== 'undefined') {
            window.removeEventListener('focus', onFocus);
            window.removeEventListener('beautijoo:unread-changed', onUnreadChanged);
          }
        };"""
              if old not in st:
                  raise SystemExit('panel-shell anchor missing')
              shell.write_text(st.replace(old, new, 1))
          print('panel-shell ok')

          # --- header NotificationBell ---
          header = Path('frontend/src/components/layout/header.tsx')
          ht = header.read_text()
          if 'NotificationBell' not in ht:
              ht = ht.replace(
                  "import { Logo } from '@/components/brand/logo';",
                  "import { Logo } from '@/components/brand/logo';\nimport { NotificationBell } from '@/components/layout/notification-bell';",
              )
              needle = '''          <Link
            href="/search"
            className="flex size-11 min-h-11 min-w-11 items-center justify-center rounded-xl text-gray transition-colors hover:bg-coral-soft hover:text-coral md:hidden"
            aria-label="جستجو"
          >
            <Search className="size-5" aria-hidden />
          </Link>

          {!loading && isAuthenticated ? ('''
              insert = '''          <Link
            href="/search"
            className="flex size-11 min-h-11 min-w-11 items-center justify-center rounded-xl text-gray transition-colors hover:bg-coral-soft hover:text-coral md:hidden"
            aria-label="جستجو"
          >
            <Search className="size-5" aria-hidden />
          </Link>

          <NotificationBell />

          {!loading && isAuthenticated ? ('''
              if needle not in ht:
                  raise SystemExit('header needle missing')
              ht = ht.replace(needle, insert, 1)
              header.write_text(ht)
          print('header ok')
          PY

          # --- notifications page with mark-all ---
          cat > frontend/src/app/panel/notifications/page.tsx << 'PAGE'
          'use client';
          import { useCallback, useEffect, useState } from 'react';
          import { Card } from '@/components/ui/card';
          import { PanelLoading, PanelError, PanelEmpty } from '@/components/panel/state-blocks';
          import {
            fetchNotifications,
            markNotificationRead,
            markAllNotificationsRead,
            type NotificationItem,
          } from '@/lib/panel-api';
          import { friendlyApiError } from '@/lib/api-errors';
          import { cn, formatDateTime } from '@/lib/utils';

          function emitUnreadChanged() {
            if (typeof window !== 'undefined') {
              window.dispatchEvent(new Event('beautijoo:unread-changed'));
            }
          }

          export default function PanelNotificationsPage() {
            const [items, setItems] = useState<NotificationItem[]>([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState<string | null>(null);
            const [openId, setOpenId] = useState<string | null>(null);
            const [markingId, setMarkingId] = useState<string | null>(null);
            const [markingAll, setMarkingAll] = useState(false);

            const load = useCallback(async () => {
              setLoading(true);
              setError(null);
              try {
                setItems((await fetchNotifications(1)).items);
              } catch (e) {
                setError(friendlyApiError(e));
              } finally {
                setLoading(false);
              }
            }, []);

            useEffect(() => {
              load();
            }, [load]);

            const unreadCount = items.filter((n) => !n.readAt).length;

            async function markReadIfNeeded(n: NotificationItem) {
              if (n.readAt || markingId === n.id) return;
              setMarkingId(n.id);
              try {
                await markNotificationRead(n.id);
                setItems((prev) =>
                  prev.map((row) =>
                    row.id === n.id ? { ...row, readAt: new Date().toISOString() } : row,
                  ),
                );
                emitUnreadChanged();
              } catch (e) {
                setError(friendlyApiError(e));
              } finally {
                setMarkingId(null);
              }
            }

            async function handleMarkAll() {
              if (markingAll || unreadCount === 0) return;
              setMarkingAll(true);
              setError(null);
              try {
                await markAllNotificationsRead();
                setItems((prev) =>
                  prev.map((row) =>
                    row.readAt ? row : { ...row, readAt: new Date().toISOString() },
                  ),
                );
                emitUnreadChanged();
              } catch (e) {
                setError(friendlyApiError(e));
              } finally {
                setMarkingAll(false);
              }
            }

            function handleOpen(n: NotificationItem) {
              const nextOpen = openId === n.id ? null : n.id;
              setOpenId(nextOpen);
              if (nextOpen === n.id) {
                void markReadIfNeeded(n);
              }
            }

            if (loading) return <PanelLoading />;
            if (error && items.length === 0) return <PanelError message={error} onRetry={load} />;

            return (
              <div className="space-y-6" dir="rtl">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <h1 className="text-2xl font-bold">اعلان‌ها</h1>
                    <p className="mt-1 text-sm text-gray">
                      روی هر پیام بزنید تا باز شود و به‌عنوان خوانده‌شده ثبت شود
                    </p>
                  </div>
                  {unreadCount > 0 && (
                    <button
                      type="button"
                      onClick={() => void handleMarkAll()}
                      disabled={markingAll}
                      className="h-10 shrink-0 rounded-2xl border border-coral/40 bg-coral-soft/40 px-4 text-sm font-medium text-coral transition hover:bg-coral-soft disabled:opacity-60"
                    >
                      {markingAll ? 'در حال ثبت…' : `خواندن همه (${unreadCount.toLocaleString('fa-IR')})`}
                    </button>
                  )}
                </div>
                {error && items.length > 0 && (
                  <p className="rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700">{error}</p>
                )}
                {items.length === 0 ? (
                  <PanelEmpty title="اعلانی نیست" />
                ) : (
                  <ul className="space-y-3">
                    {items.map((n) => {
                      const unread = !n.readAt;
                      const isOpen = openId === n.id;
                      const body = n.body || n.message || '—';
                      return (
                        <li key={n.id}>
                          <Card
                            role="button"
                            tabIndex={0}
                            aria-expanded={isOpen}
                            onClick={() => handleOpen(n)}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                handleOpen(n);
                              }
                            }}
                            className={cn(
                              'cursor-pointer space-y-2 transition hover:shadow-md',
                              unread && 'border-coral/40 bg-coral-soft/30',
                              isOpen && 'ring-2 ring-coral/30',
                            )}
                          >
                            <div className="flex flex-wrap items-start justify-between gap-2">
                              <div className="min-w-0 flex-1">
                                <div className="flex flex-wrap items-center gap-2">
                                  <p className="font-semibold">{n.title || n.type || 'اعلان'}</p>
                                  {unread && (
                                    <span className="rounded-full bg-coral px-2 py-0.5 text-[10px] font-bold text-white">
                                      جدید
                                    </span>
                                  )}
                                  {markingId === n.id && (
                                    <span className="text-[10px] text-gray">در حال ثبت...</span>
                                  )}
                                </div>
                                <p className={cn('mt-1 text-sm text-gray', !isOpen && 'line-clamp-2')}>{body}</p>
                                <p className="mt-1 text-xs text-gray">{formatDateTime(n.createdAt)}</p>
                              </div>
                              <span className="shrink-0 text-xs text-gray">{isOpen ? 'بستن' : 'باز کردن'}</span>
                            </div>
                            {isOpen && (
                              <div className="border-t border-border/60 pt-3 text-sm leading-relaxed text-foreground">{body}</div>
                            )}
                          </Card>
                        </li>
                      );
                    })}
                  </ul>
                )}
              </div>
            );
          }
          PAGE
          # strip leading indent from heredoc
          python3 -c "from pathlib import Path; p=Path('frontend/src/app/panel/notifications/page.tsx'); t=p.read_text(); lines=t.splitlines(); p.write_text('\n'.join(l[10:] if l.startswith('          ') else l for l in lines)+'\n')"
          # ensure notification-bell exists
          test -f frontend/src/components/layout/notification-bell.tsx
          grep -q NotificationBell frontend/src/components/layout/header.tsx
          grep -q markAllNotificationsRead frontend/src/lib/panel-api.ts
          wc -c frontend/src/lib/panel-api.ts
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/panel-api.ts \
            frontend/src/components/layout/header.tsx \
            frontend/src/components/panel/panel-shell.tsx \
            frontend/src/app/panel/notifications/page.tsx \
            frontend/src/components/layout/notification-bell.tsx
          if git diff --cached --quiet; then
            echo 'no change'
          else
            git commit -m 'feat(18.14): header badge, mark-all-read, smart polling'
            git push
          fi
