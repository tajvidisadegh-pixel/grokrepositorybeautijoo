name: Booking offline payment mode
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/booking-offline-mode.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply offline mode
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # config
          p = Path('backend/src/config/configuration.ts')
          t = p.read_text()
          if 'bookingPaymentMode' not in t:
              needle = "    paymentProvider: process.env.PAYMENT_PROVIDER || '',\n"
              insert = needle + (
                  "    /** gateway | offline | auto(default). auto=offline unless real gateway provider */\n"
                  "    bookingPaymentMode: (process.env.BOOKING_PAYMENT_MODE || 'auto').toLowerCase(),\n"
              )
              assert needle in t
              p.write_text(t.replace(needle, insert, 1))
              print('config')

          # payments.service
          p = Path('backend/src/payments/payments.service.ts')
          t = p.read_text()
          if 'confirmOfflineBooking' not in t:
              helpers = '''
  /**
   * Offline booking without gateway (reversible).
   * BOOKING_PAYMENT_MODE=offline|gateway|auto (default auto).
   * auto → offline unless PAYMENT_PROVIDER is zarinpal/zibal/idpay.
   * When licensed: set PAYMENT_PROVIDER=zarinpal → back to gateway automatically.
   */
  private resolveBookingPaymentMode(): 'offline' | 'gateway' {
    const explicit = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();
    if (explicit === 'offline' || explicit === 'no_gateway' || explicit === 'pay_later') return 'offline';
    if (explicit === 'gateway' || explicit === 'online') return 'gateway';
    const provider = this.providerName();
    if (provider === 'zarinpal' || provider === 'zibal' || provider === 'idpay') return 'gateway';
    return 'offline';
  }

  private async confirmOfflineBooking(userId: string, bookingId: string) {
    const booking = await this.prisma.booking.findUnique({
      where: { id: bookingId },
      include: { payment: true },
    });
    if (!booking) throw new NotFoundException();
    if (booking.customerId !== userId) throw new ForbiddenException();
    if (booking.status === BookingStatus.expired || booking.status === BookingStatus.cancelled) {
      throw new BadRequestException('این رزرو دیگر قابل تأیید نیست');
    }
    if (booking.payment?.status === PaymentStatus.paid) {
      return {
        offline: true,
        status: 'paid' as const,
        bookingId,
        redirectUrl: null as string | null,
        providerRef: booking.payment.providerRef ?? 'offline',
      };
    }

    const idempotencyKey = booking.payment?.idempotencyKey || randomUUID();
    if (!booking.payment) {
      await this.prisma.payment.create({
        data: {
          bookingId,
          amount: booking.totalPrice,
          status: PaymentStatus.pending,
          provider: 'offline',
          idempotencyKey,
        },
      });
    }

    let rate = DEFAULT_PLATFORM_COMMISSION_RATE;
    try {
      const rateRow = await this.prisma.platformSetting.findUnique({
        where: { key: PLATFORM_COMMISSION_RATE_KEY },
      });
      if (rateRow?.value != null && Number.isFinite(Number(rateRow.value))) {
        rate = Number(rateRow.value);
      }
    } catch {
      /* optional setting */
    }
    const { commissionAmount, professionalNetAmount } = calculateCommission(booking.totalPrice, rate);
    const ref = `offline-${bookingId.replace(/-/g, '').slice(0, 12)}`;

    await this.prisma.payment.update({
      where: { bookingId },
      data: {
        status: PaymentStatus.paid,
        provider: 'offline',
        providerRef: ref,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
        },
      },
    });

    if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired) {
      await this.prisma.booking.update({
        where: { id: bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }

    return {
      offline: true,
      status: 'paid' as const,
      bookingId,
      redirectUrl: null as string | null,
      providerRef: ref,
    };
  }

'''
              marker = '  async initiate(userId: string, bookingId: string, callbackUrl: string) {'
              assert marker in t
              t = t.replace(marker, helpers + marker, 1)
              old = '''  async initiate(userId: string, bookingId: string, callbackUrl: string) {
    // #64.5 — lock callback to allowed frontend origins before talking to gateway
    this.assertAllowedCallbackUrl(callbackUrl);
    const providerKey = this.providerName();
    if (providerKey === 'disabled') {
'''
              new = '''  async initiate(userId: string, bookingId: string, callbackUrl: string) {
    if (this.resolveBookingPaymentMode() === 'offline') {
      return this.confirmOfflineBooking(userId, bookingId);
    }

    // #64.5 — lock callback to allowed frontend origins before talking to gateway
    this.assertAllowedCallbackUrl(callbackUrl);
    const providerKey = this.providerName();
    if (providerKey === 'disabled') {
'''
              assert old in t, 'initiate inject point missing'
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('payments.service')
          else:
              print('payments.service already')

          # booking-api
          p = Path('frontend/src/lib/booking-api.ts')
          t = p.read_text()
          if 'offline?:' not in t:
              t = t.replace(
                  '''  return apiClient.post<{
    paymentId?: string;
    redirectUrl?: string;
    providerRef?: string;
  }>('/payments/initiate', { bookingId, callbackUrl });''',
                  '''  return apiClient.post<{
    paymentId?: string;
    redirectUrl?: string | null;
    providerRef?: string;
    offline?: boolean;
    status?: string;
    bookingId?: string;
  }>('/payments/initiate', { bookingId, callbackUrl });''',
                  1,
              )
              p.write_text(t)
              print('booking-api')

          # wizard — match ZWNJ in نگه‌داشته
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          t = p.read_text()
          if 'pay.offline' not in t:
              old = (
                  '        const pay = await initiatePayment(created.id, callbackUrl);\n'
                  '        if (pay.redirectUrl) {\n'
                  '          window.location.href = pay.redirectUrl;\n'
                  '          return;\n'
                  '        }\n'
              )
              new = (
                  '        const pay = await initiatePayment(created.id, callbackUrl);\n'
                  '        if (pay.offline || pay.status === \'paid\' || (!pay.redirectUrl && pay.bookingId)) {\n'
                  '          router.push(`/booking/confirmation/${created.id}`);\n'
                  '          return;\n'
                  '        }\n'
                  '        if (pay.redirectUrl) {\n'
                  '          window.location.href = pay.redirectUrl;\n'
                  '          return;\n'
                  '        }\n'
              )
              if old not in t:
                  raise SystemExit('wizard redirect block missing')
              p.write_text(t.replace(old, new, 1))
              print('wizard')
          else:
              print('wizard already')

          for envp in ['backend/.env.example', '.env.example']:
              ep = Path(envp)
              if ep.exists() and 'BOOKING_PAYMENT_MODE' not in ep.read_text():
                  ep.write_text(ep.read_text() + '\n# auto|offline|gateway — auto=offline unless zarinpal/etc\n# BOOKING_PAYMENT_MODE=auto\n')
                  print(envp)

          print('OK')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: offline booking without gateway (BOOKING_PAYMENT_MODE auto/offline/gateway)" || exit 0
          git push origin HEAD:main
      - name: Sync export ROOT
        run: |
          set -euo pipefail
          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          mkdir -p /tmp/be/src/payments /tmp/be/src/config
          cp backend/src/payments/payments.service.ts /tmp/be/src/payments/
          cp backend/src/config/configuration.ts /tmp/be/src/config/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payments/payments.service.ts src/config/configuration.ts
          git commit -m "feat: offline booking mode (reversible)" || exit 0
          git push origin HEAD:beautijoo-backend-export
