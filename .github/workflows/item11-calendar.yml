name: item11-calendar
on:
  push:
    paths:
      - '.github/workflows/item11-calendar.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bookings page
        run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          s = p.read_text()
          if "viewMode: 'list' | 'week' | 'day'" in s or "'day'" in s and "setSelectedDay" in s:
              print('already patched')
          else:
              s = s.replace(
                  "const [viewMode, setViewMode] = useState<'list' | 'week'>('list');\n  const [weekStart, setWeekStart] = useState(() => tehranWeekStartSaturday());",
                  "const [viewMode, setViewMode] = useState<'list' | 'week' | 'day'>('list');\n  const [weekStart, setWeekStart] = useState(() => tehranWeekStartSaturday());\n  const [selectedDay, setSelectedDay] = useState(() => tehranDateStr(new Date()));",
                  1,
              )
              # after shiftWeek function, add sync effect before loading guard
              needle = '''  function shiftWeek(delta: number) {
    setWeekStart((prev) => {
      const n = new Date(prev);
      n.setUTCDate(n.getUTCDate() + delta * 7);
      return n;
    });
  }

  if (loading && items.length === 0) return <PanelLoading />;'''
              insert = '''  function shiftWeek(delta: number) {
    setWeekStart((prev) => {
      const n = new Date(prev);
      n.setUTCDate(n.getUTCDate() + delta * 7);
      return n;
    });
  }

  function shiftDay(delta: number) {
    const [y, m, d] = selectedDay.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
    dt.setUTCDate(dt.getUTCDate() + delta);
    setSelectedDay(tehranDateStr(dt));
  }

  // Keep API date range aligned with calendar views
  useEffect(() => {
    if (viewMode === 'week') {
      const from = dayKey(weekStart);
      const end = new Date(weekStart);
      end.setUTCDate(weekStart.getUTCDate() + 6);
      const to = dayKey(end);
      setFrom(from);
      setTo(to);
      setApplied((prev) => ({ ...prev, from, to }));
    } else if (viewMode === 'day') {
      setFrom(selectedDay);
      setTo(selectedDay);
      setApplied((prev) => ({ ...prev, from: selectedDay, to: selectedDay }));
    }
  }, [viewMode, weekStart, selectedDay]);

  const dayItems = useMemo(() => {
    const list = itemsByDay.get(selectedDay) || [];
    return [...list].sort(
      (a, b) => new Date(a.startAt).getTime() - new Date(b.startAt).getTime(),
    );
  }, [itemsByDay, selectedDay]);

  if (loading && items.length === 0) return <PanelLoading />;'''
              if needle not in s:
                  raise SystemExit('shiftWeek block not found')
              s = s.replace(needle, insert, 1)

              # toggle buttons
              old_btn = '''          <Button size="sm" variant={viewMode === 'list' ? 'primary' : 'outline'} onClick={() => setViewMode('list')}>
            لیست
          </Button>
          <Button size="sm" variant={viewMode === 'week' ? 'primary' : 'outline'} onClick={() => setViewMode('week')}>
            تقویم هفتگی
          </Button>'''
              new_btn = '''          <Button size="sm" variant={viewMode === 'list' ? 'primary' : 'outline'} onClick={() => setViewMode('list')}>
            لیست
          </Button>
          <Button size="sm" variant={viewMode === 'week' ? 'primary' : 'outline'} onClick={() => setViewMode('week')}>
            تقویم هفتگی
          </Button>
          <Button size="sm" variant={viewMode === 'day' ? 'primary' : 'outline'} onClick={() => setViewMode('day')}>
            برنامه روز
          </Button>'''
              if old_btn not in s:
                  raise SystemExit('buttons not found')
              s = s.replace(old_btn, new_btn, 1)

              # insert day view before week view
              day_block = '''      {viewMode === 'day' && (
        <Card className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <Button size="sm" variant="outline" onClick={() => shiftDay(-1)}>
              روز قبل
            </Button>
            <div className="flex flex-col items-center gap-1">
              <p className="text-sm font-medium">{formatDate(selectedDay + 'T12:00:00', { style: 'long', weekday: true })}</p>
              <button
                type="button"
                className="text-xs text-coral underline"
                onClick={() => setSelectedDay(tehranDateStr(new Date()))}
              >
                برو به امروز
              </button>
            </div>
            <Button size="sm" variant="outline" onClick={() => shiftDay(1)}>
              روز بعد
            </Button>
          </div>
          {dayItems.length === 0 ? (
            <p className="py-8 text-center text-sm text-gray">برای این روز رزروی ثبت نشده است.</p>
          ) : (
            <ul className="space-y-2">
              {dayItems.map((b) => (
                <li
                  key={b.id}
                  className="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-border bg-white px-3 py-2 text-sm"
                >
                  <div>
                    <p className="font-medium">
                      <span dir="ltr">{timeFa(b.startAt)}</span>
                      {b.endAt && (
                        <span className="text-gray"> – <span dir="ltr">{timeFa(b.endAt)}</span></span>
                      )}
                    </p>
                    <p className="text-xs text-gray">
                      {b.customer?.profile?.displayName || b.customer?.phone || 'مشتری'}
                      {' · '}
                      {persianBookingStatus(b.status)}
                    </p>
                  </div>
                  <span className="text-xs font-medium text-blue">{formatPrice(b.totalPrice)}</span>
                </li>
              ))}
            </ul>
          )}
        </Card>
      )}

'''
              marker = "      {viewMode === 'week' && ("
              if marker not in s:
                  raise SystemExit('week marker missing')
              if "viewMode === 'day'" not in s.split(marker)[0][-500:]:
                  s = s.replace(marker, day_block + marker, 1)
              p.write_text(s)
              print('patched', len(s), 'day' in s)

          # nav link in layout
          lp = Path('frontend/src/app/zibagar/layout.tsx')
          ls = lp.read_text()
          if "/zibagar/bookings" in ls and 'تقویم' not in ls:
              # label stays رزروها - calendar is a tab inside
              pass
          lp.write_text(ls)
          print('layout ok')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item11-calendar.yml
          git add frontend/src/app/zibagar/bookings/page.tsx
          git add -A
          git status
          git commit -m "feat(zibagar): day schedule view + week range sync (#40 item 11)" || echo nothing
          git push
