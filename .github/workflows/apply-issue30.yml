name: Apply issue 30
on:
  push:
    paths:
      - 'scripts/i30_p*.txt'
      - '.github/workflows/apply-issue30.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write files
        run: |
          set -e
          python3 << 'PY'
          import base64, json, pathlib
          parts = sorted(pathlib.Path('scripts').glob('i30_p*.txt'))
          raw = ''.join(p.read_text() for p in parts)
          data = json.loads(raw)
          for path, b64 in data.items():
              dest = pathlib.Path(path)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(b64))
              print('wrote', path, dest.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add frontend backend
          git status
          git diff --cached --stat
          git commit -m 'feat(#30): specialty selection-only UI + support tickets' || echo 'no changes'
          git push
