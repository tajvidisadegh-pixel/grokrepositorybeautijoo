name: fix-92-count
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text(encoding='utf-8')
          if 'completedBookingsCount' in t:
              print('exists')
          else:
              old = """    const safe = this.sanitizePublicLocations(pro);
    const withMedia = this.attachMediaPublicUrls(safe);
    this.cache.set(cacheKey, withMedia, 120_000);
    return withMedia;"""
              new = """    const safe = this.sanitizePublicLocations(pro);
    const withMedia = this.attachMediaPublicUrls(safe);
    const completedBookingsCount = await this.prisma.booking.count({
      where: { professionalId: pro.id, status: 'completed' as any },
    }).catch(() => 0);
    const payload = { ...withMedia, completedBookingsCount };
    this.cache.set(cacheKey, payload, 120_000);
    return payload;"""
              if old in t:
                  t = t.replace(old, new, 1)
                  p.write_text(t, encoding='utf-8')
                  print('fixed')
              else:
                  print('miss')
          PY
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "fix: completedBookingsCount on public pro (#40.92)" && git push; fi
