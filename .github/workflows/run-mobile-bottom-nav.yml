name: Run mobile bottom nav patch
on:
  push:
    paths:
      - '.github/workflows/run-mobile-bottom-nav.yml'
      - 'scripts/patch-mobile-bottom-nav.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-mobile-bottom-nav.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-mobile-bottom-nav.yml
          git add frontend/src/components/panel/panel-shell.tsx frontend/src/app/panel/layout.tsx frontend/src/app/zibagar/layout.tsx
          git add -A
          git diff --cached --quiet || git commit -m "feat(panel): mobile bottom nav for customer and pro (#40-6)"
          git push
