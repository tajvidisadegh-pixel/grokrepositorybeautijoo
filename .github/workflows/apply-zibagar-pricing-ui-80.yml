name: Apply zibagar pricing UI 80.4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-zibagar-pricing-ui-80.yml'
      - 'scripts/patch_panel_api_pricing_80.py'
      - 'scripts/patch_zibagar_pricing_ui_80.py'
      - 'frontend/src/components/zibagar/PricingModeFields.tsx'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch panel-api + page
        run: |
          python3 scripts/patch_panel_api_pricing_80.py
          python3 scripts/patch_zibagar_pricing_ui_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/panel-api.ts frontend/src/app/zibagar/services/page.tsx frontend/src/components/zibagar/PricingModeFields.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.4): zibagar pricing mode UI wired to API"
          git push origin HEAD:main
