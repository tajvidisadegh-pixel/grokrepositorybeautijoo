name: Restore pricing controller
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-pricing-controller.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore controller from history
        run: |
          set -euo pipefail
          git log --oneline -- backend/src/admin/admin-catalog-pricing.controller.ts | head -20
          # last known good blob before PLACEHOLDER
          git show bfa3d524f4892d52009c8b8a38dcf22a1e91eada:backend/src/admin/admin-catalog-pricing.controller.ts > backend/src/admin/admin-catalog-pricing.controller.ts
          wc -c backend/src/admin/admin-catalog-pricing.controller.ts
          grep -n "export class AdminCatalogPricingController" backend/src/admin/admin-catalog-pricing.controller.ts
          # inject return updated if missing
          python3 -c "
from pathlib import Path
p=Path('backend/src/admin/admin-catalog-pricing.controller.ts')
t=p.read_text()
assert 'PLACEHOLDER' not in t
assert 'export class AdminCatalogPricingController' in t
needle='include: this.serviceInclude(),\n    });\n  }\n\n  @Get('
# find pricing-flags update end - more robust
marker='defaultPricingMode: normalizePricingMode(next.defaultPricingMode),\n      },\n      include: this.serviceInclude(),\n    });'
if 'return updated' not in t and marker in t:
    t=t.replace(marker, marker+'\n    return updated;', 1)
    p.write_text(t)
    print('added return')
else:
    print('return status', 'return updated' in t)
"
          grep -n "return updated" backend/src/admin/admin-catalog-pricing.controller.ts || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-catalog-pricing.controller.ts
          git status
          git commit -m "fix(#80): restore AdminCatalogPricingController + return updated" || { echo no commit; exit 0; }
          git push origin HEAD:main
