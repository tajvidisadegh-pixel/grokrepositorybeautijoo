name: Restore pricing controller
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-pricing-controller.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download good controller and patch
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/bfa3d524f4892d52009c8b8a38dcf22a1e91eada/backend/src/admin/admin-catalog-pricing.controller.ts" \
            -o backend/src/admin/admin-catalog-pricing.controller.ts
          wc -c backend/src/admin/admin-catalog-pricing.controller.ts
          head -5 backend/src/admin/admin-catalog-pricing.controller.ts
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin-catalog-pricing.controller.ts')
          t = p.read_text()
          if 'PLACEHOLDER' in t or 'export class AdminCatalogPricingController' not in t:
              raise SystemExit('bad download')
          needle = """      include: this.serviceInclude(),
    });
  }

  @Get('catalog-services/:id/attribute-groups')"""
          repl = """      include: this.serviceInclude(),
    });
    return updated;
  }

  @Get('catalog-services/:id/attribute-groups')"""
          if 'return updated' not in t:
              if needle not in t:
                  raise SystemExit('needle missing')
              t = t.replace(needle, repl, 1)
              p.write_text(t)
              print('return added')
          print('ok', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-catalog-pricing.controller.ts
          git commit -m "fix(#80): restore pricing controller + return updated body" || exit 0
          git push origin HEAD:main
