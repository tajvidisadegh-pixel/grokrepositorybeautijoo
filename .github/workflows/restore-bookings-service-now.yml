name: restore-bookings-service-now
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore bookings from dd6a621 + safe patches
        run: |
          set -euo pipefail
          git show dd6a621521a497cc29e81bfc50b5062c11bc7666:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          assert 'export class BookingsService' in t
          # reportIssue: remove take 20
          t = t.replace(\"take: 20,\n\", '', 1) if 'take: 20' in t else t
          # pro reschedule
          old = 'if (existing.customerId !== userId) throw new ForbiddenException();'
          new = '''{
      const pro = await this.prisma.professional.findFirst({ where: { userId } });
      const isCustomer = existing.customerId === userId;
      const isPro = !!pro && pro.id === existing.professionalId;
      if (!isCustomer && !isPro) throw new ForbiddenException();
    }'''
          if old in t:
              t = t.replace(old, new, 1)
          # date validation
          old = \"if (query.from) (where.startAt as Prisma.DateTimeFilter).gte = new Date(query.from);\"
          new = \"if (query.from) { const from = new Date(query.from); if (isNaN(from.getTime())) throw new BadRequestException('invalid from'); (where.startAt as Prisma.DateTimeFilter).gte = from; }\"
          if old in t:
              t = t.replace(old, new, 1)
          old = \"if (query.to) (where.startAt as Prisma.DateTimeFilter).lte = new Date(query.to);\"
          new = \"if (query.to) { const to = new Date(query.to); if (isNaN(to.getTime())) throw new BadRequestException('invalid to'); (where.startAt as Prisma.DateTimeFilter).lte = to; }\"
          if old in t:
              t = t.replace(old, new, 1)
          # offline auto-confirm before return booking after notify
          needle = 'return booking;'
          # only first post-create return is harder; append helper comment near end of create
          if 'offline auto-confirm' not in t and 'await this.payments.initiate(customerId, booking.id' not in t:
              marker = \"this.logger.warn(\`post-create notify failed booking=\$\{booking.id\}: \$\{(err as Error)?.message || err\}\`);\"
              # simpler: inject after post-create catch by unique string
              uniq = 'post-create notify failed booking='
              idx = t.find(uniq)
              if idx > 0:
                  # find return booking after this
                  ridx = t.find('return booking;', idx)
                  if ridx > 0:
                      inject = '''
      try {
        const payMode = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();
        const provider = (process.env.PAYMENT_PROVIDER || '').toString().trim().toLowerCase();
        const offline = payMode === 'offline' || payMode === 'no_gateway' || payMode === 'pay_later' || (payMode === 'auto' && (!provider || provider === 'disabled' || provider === 'none'));
        if (offline) {
          await this.payments.initiate(customerId, booking.id, 'https://localhost/offline');
          const refreshed = await this.prisma.booking.findUnique({ where: { id: booking.id }, include: { items: true, payment: true } });
          if (refreshed) return refreshed;
        }
      } catch (err) {
        this.logger.warn('offline auto-confirm failed: ' + ((err as Error)?.message || err));
      }
'''
                      t = t[:ridx] + inject + t[ridx:]
          p.write_text(t, encoding='utf-8')
          print('ok', p.stat().st_size)
          "
          # payments
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/payments/payments.service.ts')
          t = p.read_text(encoding='utf-8')
          if 'settlementEligible' not in t:
              t = t.replace(\"note: 'Confirmed without online gateway. Not a bank settlement.',\", \"note: 'Confirmed without online gateway. Not a bank settlement.', settlementEligible: false, realMoney: false,\", 1)
              p.write_text(t, encoding='utf-8')
              print('payments ok')
          "
          # admin-ops
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/admin/admin-ops.controller.ts')
          t = p.read_text(encoding='utf-8')
          t2 = t.replace('where: { phone: nextPhone, accountType: existing.accountType, NOT: { id } },', 'where: { phone: nextPhone, NOT: { id } },', 1)
          t2 = t2.replace(\"await this.audit(actorId, 'admin.user.profile.update', 'user', id, dto);\", \"await this.audit(actorId, 'admin.user.profile.update', 'user', id, { phoneChanged: !!dto.phone, fieldKeys: Object.keys(dto||{}) });\", 1)
          old = \"await this.prisma.user.update({ where: { id }, data: { phone: dto.phone.trim() } });\"
          new = \"await this.prisma.user.update({ where: { id }, data: { phone: nextPhone, phoneVerified: false } }); await this.prisma.refreshToken.updateMany({ where: { userId: id, revokedAt: null }, data: { revokedAt: new Date() } });\"
          if old in t2:
              t2 = t2.replace(old, new, 1)
          if t2 != t:
              p.write_text(t2, encoding='utf-8')
              print('admin-ops ok')
          "
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/payments/payments.service.ts backend/src/admin/admin-ops.controller.ts || true
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "fix: restore bookings + offline auto-confirm, pro reschedule, reportIssue, dates, admin phone, settlementEligible"
          git push origin HEAD:main
