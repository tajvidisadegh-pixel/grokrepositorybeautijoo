name: Fix specialty visibility
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_specialties.py'
      - '.github/workflows/fix-specialties.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_specialties.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/profile/complete/page.tsx frontend/src/app/zibagar/services/page.tsx backend/src/services/services.service.ts
          git status
          git commit -m "fix(zibagar): show all admin specialties in pro panel selection" || exit 0
          git push origin HEAD:main
