name: patch-remove-social-profile
on:
  push:
    paths:
      - scripts/patch_remove_social_profile.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_remove_social_profile.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "fix: hide social fields on zibagar profile" && git push)
