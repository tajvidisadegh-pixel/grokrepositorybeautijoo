name: Patch pro sticky
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/patch-pro-sticky.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/professionals/[slug]/page.tsx')
          s = p.read_text()
          if 'StickyBookBar' not in s:
            s = s.replace(
              "import LocationMapView from '@/components/location/location-map-view';",
              "import LocationMapView from '@/components/location/location-map-view'\nimport { StickyBookBar } from '@/components/professionals/sticky-book-bar';",
            )
            s = s.replace(
              'className="mx-auto max-w-6xl px-4 py-10"',
              'className="mx-auto max-w-6xl px-4 py-10 pb-24 md:pb-10"',
              1,
            )
            # append sticky before closing root
            if 'StickyBookBar' not in s:
              s = s.replace(
                '\n    </div>\n  );\n}\n',
                '\n      <StickyBookBar slug={pro.slug} />\n    </div>\n  );\n}\n',
                1,
              )
            p.write_text(s)
            print('slug ok')
          else:
            print('slug already')
          sp = Path('frontend/src/app/search/page.tsx')
          t = sp.read_text()
          if 'دکمه' in t and 'نزدیک من' in t and 'مرتب‌سازی' in t and "sort === 'distance'" in t:
            print('search already')
          elif "sort === 'distance'" not in t:
            t = t.replace(
              '      <div className="mt-8">',
              """      {sort === 'distance' && !(lat && lng) && (
        <p className="mt-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
          برای مرتب‌سازی «نزدیک‌ترین»، دکمه نزدیک من را بزنید تا موقعیت شما دریافت شود.
        </p>
      )}
      <div className="mt-8">""",
              1,
            )
            sp.write_text(t)
            print('search ok')
          Path('.github/workflows/patch-pro-sticky.yml').unlink(missing_ok=True)
          Path('.github/workflows/patch-sticky-book.yml').unlink(missing_ok=True)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'feat: sticky book bar + near-me distance hint'
          git push
