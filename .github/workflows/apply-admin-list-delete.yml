name: Apply admin list delete fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/_patch_admin_lists.py'
      - '.github/workflows/apply-admin-list-delete.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/_patch_admin_lists.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts backend/src/admin/admin.controller.ts frontend/src/app/admin/users/page.tsx frontend/src/app/admin/professionals/page.tsx
          git status
          git commit -m "feat(admin): hard-delete users/professionals + Excel-style table lists" || exit 0
          git push origin HEAD:main
