name: patch-me-status
on:
  push:
    paths: ['.github/workflows/patch-me-status.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/auth/auth.service.ts')
          s = p.read_text()
          if 'status: user.status' not in s[s.find('async me('):s.find('async me(')+800]:
              s = s.replace(
                  'email: user.email,\n      accountType: user.accountType,',
                  'email: user.email,\n      status: user.status,\n      accountType: user.accountType,',
                  1,
              )
              p.write_text(s)
              print('status added')
          # BookingStatus for listMine
          p = Path('backend/src/bookings/bookings.service.ts')
          s = p.read_text()
          if 'import' in s and 'BookingStatus' not in s[:500]:
              # try add to existing prisma import line if any
              pass
          s = s.replace(
              'const where: { customerId: string; status?: string } = { customerId: userId };\n    if (status) where.status = status as never;',
              "const where: { customerId: string; status?: import('@prisma/client').BookingStatus } = { customerId: userId };\n    if (status) where.status = status as import('@prisma/client').BookingStatus;",
              1,
          )
          p.write_text(s)
          print('where typed')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/patch-me-status.yml
          git add -A
          git commit -m "fix: user.status in me() + BookingStatus for mine filter" || echo nothing
          git push
