name: Fix IsUUID import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-isuuid-import.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force IsUUID in imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin.controller.ts')
          t = p.read_text()
          # only fix import block if IsUUID not already imported
          if "IsUUID," not in t and "IsUUID }" not in t:
              t = t.replace(
                  "  IsArray,\n  ArrayMinSize,",
                  "  IsArray,\n  IsUUID,\n  ArrayMinSize,",
              )
              p.write_text(t)
              print('fixed')
          else:
              print('already imported')
          # verify
          block = t.split("from 'class-validator'")[0][-200:]
          print('import tail:', repr(block))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.controller.ts
          git commit -m "fix(admin): import IsUUID for BulkDeleteUsersDto" || exit 0
          git push origin HEAD:main
