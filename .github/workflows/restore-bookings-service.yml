name: restore-bookings-service
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-service.yml'
      - 'scripts/restore-bookings-service.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore bookings.service.ts
        run: python3 scripts/restore-bookings-service.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git diff --cached --quiet || git commit -m "fix(#13): bookings.service cancel+refund"
          git push
