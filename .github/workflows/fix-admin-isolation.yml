name: Fix admin isolation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_isolation.py'
      - '.github/workflows/fix-admin-isolation.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_isolation.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts frontend/src/app/admin/professionals/page.tsx
          git commit -m "fix(admin): customer/pro isolation + pros 4 buttons" || exit 0
          git push origin HEAD:main
