name: Run payment confirm patch
on:
  push:
    paths:
      - '.github/workflows/run-payment-confirm-patch.yml'
      - 'scripts/patch-payment-confirm.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-payment-confirm.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-payment-confirm-patch.yml
          git add backend/src/payments/payments.service.ts frontend/src/components/booking/booking-wizard.tsx
          git add -A
          git diff --cached --quiet || git commit -m "feat(payments): confirm booking on paid + redirect to gateway (#40)"
          git push
