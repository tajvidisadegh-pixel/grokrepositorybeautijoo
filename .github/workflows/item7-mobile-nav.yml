name: item7-mobile-nav
on:
  push:
    paths:
      - '.github/workflows/item7-mobile-nav.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layouts
        run: |
          set -eux
          cat > frontend/src/app/panel/layout.tsx << 'EOF'
          'use client';
          import type { ReactNode } from 'react';
          import { PanelShell } from '@/components/panel/panel-shell';

          const ITEMS = [
            { href: '/panel', label: 'داشبورد', mobile: true },
            { href: '/panel/bookings', label: 'رزروها', mobile: true },
            { href: '/panel/favorites', label: 'علاقه‌مندی‌ها' },
            { href: '/panel/reviews', label: 'نظرات' },
            { href: '/panel/notifications', label: 'اعلان‌ها', mobile: true },
            { href: '/panel/profile', label: 'پروفایل', mobile: true },
            { href: '/panel/settings', label: 'تنظیمات' },
          ];

          export default function PanelLayout({ children }: { children: ReactNode }) {
            return (
              <PanelShell
                title="پنل مشتری"
                items={ITEMS}
                roles={['customer', 'admin', 'SUPER_ADMIN']}
              >
                {children}
              </PanelShell>
            );
          }
          EOF
          # strip leading spaces from heredoc indent
          python3 -c "from pathlib import Path; p=Path('frontend/src/app/panel/layout.tsx'); t=p.read_text(); lines=t.splitlines(); indent=min((len(l)-len(l.lstrip()) for l in lines if l.strip()), default=0); p.write_text('\n'.join(l[indent:] if len(l)>=indent else l for l in lines)+'\n')"

          cat > frontend/src/app/zibagar/layout.tsx << 'EOF'
          'use client';
          import type { ReactNode } from 'react';
          import { usePathname } from 'next/navigation';
          import { PanelShell } from '@/components/panel/panel-shell';
          import { RequireAuth } from '@/components/auth/require-auth';

          const ITEMS = [
            { href: '/zibagar', label: 'داشبورد', mobile: true },
            { href: '/zibagar/bookings', label: 'رزروها', mobile: true },
            { href: '/zibagar/notifications', label: 'اعلان‌ها', mobile: true },
            { href: '/zibagar/profile', label: 'پروفایل', mobile: true },
            { href: '/zibagar/reviews', label: 'نظرات' },
            { href: '/zibagar/services', label: 'تخصص‌ها و منو قیمت' },
            { href: '/zibagar/portfolio', label: 'نمونه‌کار' },
            { href: '/zibagar/earnings', label: 'درآمد' },
            { href: '/zibagar/hours', label: 'ساعات کاری' },
            { href: '/zibagar/locations', label: 'آدرس' },
            { href: '/zibagar/support', label: 'پشتیبانی' },
            { href: '/zibagar/settings', label: 'تنظیمات' },
          ];

          const PRO_ROLES = ['professional', 'admin', 'SUPER_ADMIN'] as const;

          export default function ZibagarLayout({ children }: { children: ReactNode }) {
            const pathname = usePathname() || '';
            if (pathname.startsWith('/zibagar/profile/complete')) {
              return (
                <RequireAuth roles={[...PRO_ROLES]}>
                  <div className="min-h-screen bg-gray-light">
                    <header className="border-b border-border bg-white">
                      <div className="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
                        <span className="text-sm font-bold text-coral">تکمیل پروفایل زیباگر</span>
                        <a href="/zibagar" className="text-sm text-blue hover:underline">
                          ذخیره و خروج به پنل
                        </a>
                      </div>
                    </header>
                    <div className="mx-auto max-w-3xl px-4 py-6">{children}</div>
                  </div>
                </RequireAuth>
              );
            }
            return (
              <PanelShell title="پنل زیباگر" items={ITEMS} roles={[...PRO_ROLES]}>
                {children}
              </PanelShell>
            );
          }
          EOF
          python3 -c "from pathlib import Path; p=Path('frontend/src/app/zibagar/layout.tsx'); t=p.read_text(); lines=t.splitlines(); indent=min((len(l)-len(l.lstrip()) for l in lines if l.strip()), default=0); p.write_text('\n'.join(l[indent:] if len(l)>=indent else l for l in lines)+'\n')"

      - name: Patch panel-shell icons
        run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/components/panel/panel-shell.tsx')
          s = p.read_text()
          if 'function NavIcon' in s:
              print('already has NavIcon')
          else:
              marker = "function isPersonalNotificationsHref(href: string): boolean {\n  return href === '/panel/notifications' || href === '/zibagar/notifications';\n}\n\nfunction NavLink({"
              insert = '''function isPersonalNotificationsHref(href: string): boolean {
  return href === '/panel/notifications' || href === '/zibagar/notifications';
}

function NavIcon({ href, active }: { href: string; active: boolean }) {
  const c = active ? 'text-coral' : 'text-gray';
  const common = `size-5 shrink-0 ${c}`;
  if (href === '/panel' || href === '/zibagar') {
    return (
      <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden>
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z" />
      </svg>
    );
  }
  if (href.includes('/bookings')) {
    return (
      <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden>
        <rect x="3.5" y="5" width="17" height="15" rx="2" />
        <path strokeLinecap="round" d="M8 3.5v3M16 3.5v3M3.5 10h17" />
      </svg>
    );
  }
  if (href.includes('/notifications')) {
    return (
      <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden>
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 9a6 6 0 1 1 12 0c0 3.5 1.5 5 1.5 5H4.5S6 12.5 6 9z" />
        <path strokeLinecap="round" d="M10 19a2 2 0 0 0 4 0" />
      </svg>
    );
  }
  if (href.includes('/profile')) {
    return (
      <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden>
        <circle cx="12" cy="8" r="3.5" />
        <path strokeLinecap="round" d="M5 19.5c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5" />
      </svg>
    );
  }
  return (
    <svg className={common} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden>
      <circle cx="12" cy="12" r="3" />
      <path strokeLinecap="round" d="M12 3v2M12 19v2M3 12h2M19 12h2" />
    </svg>
  );
}

function NavLink({'''
              if marker not in s:
                  raise SystemExit('marker missing')
              s = s.replace(marker, insert, 1)
              old = "      <span className={compact ? 'line-clamp-1 max-w-[4.5rem] text-center' : ''}>{item.label}</span>"
              new = """      {compact && <NavIcon href={item.href} active={active} />}
      <span className={compact ? 'line-clamp-1 max-w-[4.5rem] text-center' : ''}>
        {compact && (item.href === '/panel' || item.href === '/zibagar')
          ? 'خانه'
          : item.label}
      </span>"""
              if old not in s:
                  raise SystemExit('compact span missing')
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('shell patched', len(s))
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item7-mobile-nav.yml
          git add frontend/src/app/panel/layout.tsx frontend/src/app/zibagar/layout.tsx frontend/src/components/panel/panel-shell.tsx
          git add -A
          git status
          git commit -m "feat(ui): mobile bottom nav icons + 4 core tabs (#40 item 7)" || echo nothing
          git push
