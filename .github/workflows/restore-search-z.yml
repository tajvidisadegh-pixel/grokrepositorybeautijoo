name: restore-search-z
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-search-z.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: restore
        run: |
          python3 << 'END'
          import base64, zlib, pathlib
          b64 = """"""
          pathlib.Path("frontend/src/app/search/page.tsx").write_bytes(zlib.decompress(base64.b64decode(b64)))
          print("ok", pathlib.Path("frontend/src/app/search/page.tsx").stat().st_size)
          END
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add frontend/src/app/search/page.tsx
          git commit -m "fix(#67): restore search page (NearMeFields string props typecheck)" || exit 0
          git push
