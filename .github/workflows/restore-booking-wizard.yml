name: Restore booking-wizard
on:
  push:
    paths: ['.github/workflows/restore-booking-wizard.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original then patch transparency
        run: |
          set -e
          curl -sL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/b7ae24b763e5158760b58f283d4a5760625bd309/frontend/src/components/booking/booking-wizard.tsx" -o frontend/src/components/booking/booking-wizard.tsx
          test -s frontend/src/components/booking/booking-wizard.tsx
          python3 << 'ENDPY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          s = s.replace('  const [showAddOns, setShowAddOns] = useState(false);\n', '')
          # Always show add-ons: expand the collapsed UI by forcing showAddOns true path
          # Replace the gate: {!showAddOns ? ( button ) : ( content )} with just content open
          start = s.find('{selected && (selected.addOns || []).length > 0 && (')
          if start < 0:
              raise SystemExit('addon block start not found')
          # Find matching section end before goDatetime button area - use unique markers
          marker_open = '{!showAddOns ? ('
          if marker_open not in s:
              print('already patched or different structure')
          else:
              # simpler: inject price breakdown before submit button in summary
              needle = '''            <div className="flex justify-between gap-2">\n              <dt className="text-gray">قیمت</dt>\n              <dd className="font-bold text-coral">{formatPrice(displayPrice)}</dd>\n            </div>\n          </dl>'''
              insert = '''            <div className="flex justify-between gap-2">\n              <dt className="text-gray">مدت</dt>\n              <dd>{totalDuration} دقیقه</dd>\n            </div>\n          </dl>\n          <div className="space-y-2 rounded-2xl border border-border bg-gray-light/40 p-3 text-sm">\n            <p className="font-medium">جزئیات مبلغ</p>\n            <div className="flex justify-between gap-2">\n              <span className="text-gray">{selected.name}{selectedRuleLabel ? ` (${selectedRuleLabel})` : ''}</span>\n              <span>{formatPrice(basePrice)}</span>\n            </div>\n            {(selected.addOns || []).filter((a) => selectedAddOnIds.includes(a.id)).map((a) => (\n              <div key={a.id} className="flex justify-between gap-2">\n                <span className="text-gray">+ {a.name}</span>\n                <span>{formatPrice(a.price)}</span>\n              </div>\n            ))}\n            <div className="flex justify-between gap-2 border-t border-border pt-2 text-base font-bold">\n              <span>مبلغ قابل پرداخت</span>\n              <span className="text-coral">{formatPrice(displayPrice)}</span>\n            </div>\n            <p className="text-xs text-gray">هیچ هزینه پنهانی اضافه نمی‌شود.</p>\n          </div>'''
              if needle not in s:
                  raise SystemExit('price needle not found')
              # avoid duplicate duration if we keep existing duration row
              s = s.replace(needle, insert, 1)
              print('summary breakdown ok')
          p.write_text(s)
          print('size', p.stat().st_size)
          ENDPY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/booking/booking-wizard.tsx
          rm -f .github/workflows/restore-booking-wizard.yml
          git add -A
          git status
          git diff --cached --quiet || git commit -m "fix: restore booking-wizard + transparent price summary (#38-2)"
          git push
