name: disable-legacy-one-shots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/disable-legacy-one-shots.yml'
jobs:
  disable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite legacy one-shot workflows to noop
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode())"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "chore(ci): disable legacy one-shot workflows"
          git push
