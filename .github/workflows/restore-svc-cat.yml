name: restore-svc-cat
on:
  push:
    paths: ['.github/TRIGGER_RESTORE_SVC_CAT']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch page
        run: |
          set -euo pipefail
          git show 672e371e96a93a4bb55279d1277d5eb5920c3efe:frontend/src/app/admin/service-categories/page.tsx > frontend/src/app/admin/service-categories/page.tsx
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/admin/service-categories/page.tsx')
          t = p.read_text(encoding='utf-8')
          assert 'export default function' in t and len(t) > 5000
          old = '''        <p className="mt-1 text-sm text-gray-500">
          مدیریت درخت دسته‌ها، تخصص‌های کاتالوگ و حالت‌های قیمت (ثابت / گزینه‌ها / بیعانه). از دکمه «قیمت‌گذاری» روی هر تخصص استفاده کنید.
        </p>'''
          new = '''        <p className="mt-1 text-sm text-gray-500">
          مدیریت درخت دسته‌ها، تخصص‌های کاتالوگ و حالت‌های قیمت. از دکمه «قیمت‌گذاری» روی هر تخصص استفاده کنید.
        </p>
        <div className="mt-3 rounded-xl border border-dashed border-[#2D6CDF]/40 bg-[#F7FBFF] p-3 text-xs leading-6 text-gray-600">
          <p className="font-semibold text-[#0B2C4A]">نمونه حالت‌های قیمت (برای فهمیدن)</p>
          <ul className="mt-1 list-disc pr-4">
            <li><b>ثابت:</b> مثلاً «اصلاح صورت» = ۴۵۰٬۰۰۰ تومان — یک قیمت مشخص.</li>
            <li><b>متغیر:</b> مثلاً رنگ مو با گزینه‌های کوتاه / متوسط / بلند (Δ ۰ / ۵۰٬۰۰۰ / ۱۲۰٬۰۰۰).</li>
            <li><b>بیعانه:</b> مثلاً عروس با بیعانه ۲٬۰۰۰٬۰۰۰ و قیمت نهایی بعد از مشاوره.</li>
          </ul>
          <p className="mt-1">فعال‌سازی متغیر: قیمت‌گذاری ← تیک «قیمت با گزینه‌ها» ← ذخیره حالت‌ها ← افزودن گروه و گزینه.</p>
        </div>'''
          if old not in t:
              print('warn: sample block not applied; page restored raw')
          else:
              t = t.replace(old, new, 1)
              p.write_text(t, encoding='utf-8')
              print('sample block applied', len(t))
          PY
          test $(wc -c < frontend/src/app/admin/service-categories/page.tsx) -gt 5000
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/TRIGGER_RESTORE_SVC_CAT .github/workflows/restore-svc-cat.yml
          git add frontend/src/app/admin/service-categories/page.tsx
          git add -A
          git commit -m "fix: restore admin service-categories page + sample pricing guide"
          git push origin HEAD:main
