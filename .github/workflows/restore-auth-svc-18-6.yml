name: restore-auth-svc-18-6
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-auth-svc-18-6.yml']
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode auth.service.ts
        run: |
          set -euo pipefail
          rm -f /tmp/z.b64
          echo "PLACEHOLDER_CHUNK" >> /tmp/z.b64
