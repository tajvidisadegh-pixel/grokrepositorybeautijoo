name: Restore pro service zparts
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-pro-z.yml"
      - "scripts/restore_pro_svc.py"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run restore script
        run: python3 scripts/restore_pro_svc.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git diff --staged --quiet || git commit -m "fix(#7): restore ProfessionalsService advanced search (full)"
          git push
