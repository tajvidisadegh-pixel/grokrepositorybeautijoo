name: apply-82-12-complete-gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-82-12-complete-gate.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #82.12 complete gate
        run: |
          set -e
          echo '' | base64 -d > /tmp/p82_12.py
          python3 /tmp/p82_12.py
          grep -q '#82.12' backend/src/bookings/bookings.service.ts
          grep -q '#82.12' backend/src/cleanup/cleanup.service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/cleanup/cleanup.service.ts backend/test/unit/cleanup.service.spec.ts
          git commit -m "fix(#82.12): complete only confirmed+paid bookings; cleanup skips unpaid pending"
          git push
