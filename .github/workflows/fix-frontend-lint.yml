name: Fix frontend lint unused vars
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_pro_userid.py'
      - '.github/workflows/fix-frontend-lint.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_pro_userid.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/panel-api.ts frontend/src/app/admin/professionals/page.tsx
          git commit -m "fix(frontend): AdminProfessional.userId/user.id for notify build" || exit 0
          git push origin HEAD:main
