name: Fix frontend lint unused vars
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_settokens.py'
      - '.github/workflows/fix-frontend-lint.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_settokens.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/auth-storage.ts
          git commit -m "fix(frontend): restore setTokens(access, refresh?) signature" || exit 0
          git push origin HEAD:main
