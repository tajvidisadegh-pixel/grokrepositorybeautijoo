name: Apply issue 23 min earnings patch
on:
  push:
    paths:
      - 'scripts/patch-issue23-earnings-min.py'
      - '.github/workflows/apply-issue23-min.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-issue23-earnings-min.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/earnings/page.tsx
          if git diff --staged --quiet; then echo No change; else git commit -m "feat(zibagar): earnings periods chart, hide gross/commission (issue #23)" && git push; fi
