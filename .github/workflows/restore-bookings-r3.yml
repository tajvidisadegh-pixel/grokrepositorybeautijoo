name: restore-bookings-r3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-r3.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from good SHA and patch
        run: |
          set -euo pipefail
          # last known good full file before PLACEHOLDER
          git show a2369da0b1bc50d0ddb44692d2163e7cc6703f0e:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          assert 'PLACEHOLDER' not in t and 'BookingsService' in t

          t = t.replace(
          '''        skip,
        take: limit,
        orderBy: { startAt: \'desc\' },
        include: {
          professional: { select: { id: true, title: true, slug: true } },
          items: true,
          payment: true,
        },''',
          '''        skip,
        take: safeLimit,
        orderBy: { startAt: \'desc\' },
        include: {
          professional: { select: { id: true, title: true, slug: true } },
          items: true,
          payment: true,
        },''',
          1,
          )

          anchor = '''    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);

    const dateStr = tehranDateStr(startAt);'''
          inject = '''    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);

    // #82.r3.2 — location must belong to this professional (prevent IDOR)
    if (data.locationId) {
      const owned = await this.prisma.professionalLocation.findFirst({
        where: {
          professionalId: data.professionalId,
          locationId: data.locationId,
        },
        select: { locationId: true },
      });
      if (!owned) {
        throw new BadRequestException('\u0622\u062f\u0631\u0633 \u0627\u0646\u062a\u062e\u0627\u0628\u200c\u0634\u062f\u0647 \u0645\u062a\u0639\u0644\u0642 \u0628\u0647 \u0627\u06cc\u0646 \u0632\u06cc\u0628\u0627\u06af\u0631 \u0646\u06cc\u0633\u062a');
      }
    }

    const dateStr = tehranDateStr(startAt);'''
          if anchor in t:
              t = t.replace(anchor, inject, 1)
              print('location ok')
          else:
              raise SystemExit('location anchor missing')

          soft_old = '''          } catch (err) {
            this.logger.warn(
              `customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`,
            );
            return this.prisma.booking.update({
              where: { id },
              data: {
                status: BookingStatus.cancelled,
                cancelReason:
                  reason ?? '\u0644\u063a\u0648 \u062a\u0648\u0633\u0637 \u0645\u0634\u062a\u0631\u06cc (\u0627\u0633\u062a\u0631\u062f\u0627\u062f \u0646\u0627\u0645\u0648\u0641\u0642 \u2014 \u067e\u06cc\u06af\u06cc\u0631\u06cc \u067e\u0634\u062a\u06cc\u0628\u0627\u0646\u06cc)',
                cancelledAt: new Date(),
              },
            });
          }'''
          # use simpler match without persian
          import re
          t2, n = re.subn(
              r"return this\.prisma\.booking\.update\(\{\s*where: \{ id \},\s*data: \{\s*status: BookingStatus\.cancelled,\s*cancelReason:\s*reason \?\? '[^']*',\s*cancelledAt: new Date\(\),\s*\},\s*\}\);\s*\}\s*catch",
              'THROW_PLACE',
              t,
              count=1,
          )
          # Do explicit block replace for refund fail
          start = t.find('customer paid cancel refund failed booking=')
          if start < 0:
              raise SystemExit('refund log missing')
          # find the catch block containing this
          catch_start = t.rfind('} catch (err) {', 0, start)
          # find end of this catch - next "return this.prisma.booking.findUniqueOrThrow"
          end = t.find('return this.prisma.booking.findUniqueOrThrow', start)
          if catch_start < 0 or end < 0:
              raise SystemExit(f'refund bounds fail {catch_start} {end}')
          # replace from catch_start to just before findUniqueOrThrow
          # Actually replace the return update inside catch
          block = t[catch_start:end]
          if 'BookingStatus.cancelled' in block and 'refund failed' in block:
              new_catch = '''} catch (err) {
            // #82.r3.5 — do NOT cancel while payment still paid
            this.logger.warn(
              `customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`,
            );
            try {
              await this.prisma.booking.update({
                where: { id },
                data: {
                  notes: [b.notes, 'REFUND_PENDING:cancel_refund_failed'].filter(Boolean).join(' | ').slice(0, 2000),
                },
              });
              await this.prisma.auditLog.create({
                data: {
                  actorId: userId,
                  action: 'booking.cancel.refund_failed',
                  entityType: 'booking',
                  entityId: id,
                  after: {
                    paymentId: b.payment?.id,
                    error: String((err as Error)?.message || err).slice(0, 300),
                  } as any,
                },
              });
            } catch { /* non-blocking */ }
            throw new BadRequestException(
              'استرداد پرداخت ناموفق بود. رزرو لغو نشد؛ لطفاً بعداً تلاش کنید یا با پشتیبانی تماس بگیرید.',
            );
          }
          '''
              t = t[:catch_start] + new_catch + t[end:]
              print('refund fail rewritten')
          else:
              print('refund block unexpected')

          # late cancel
          late_marker = 'خارج از پنجره لغو رایگان'
          if late_marker in t and 'REFUND_POLICY:late_cancel' not in t:
              # replace the simple update return for late cancel
              import re as _re
              pat = _re.compile(
                  r"if \(!withinFreeWindow && hours > 0\) \{\s*return this\.prisma\.booking\.update\(\{[\s\S]*?cancelledAt: new Date\(\),\s*\},\s*\}\);\s*\}"
              )
              repl = '''if (!withinFreeWindow && hours > 0) {
            // #82.r3.6 — late cancel: no auto-refund; durable audit + customer notice
            const updated = await this.prisma.booking.update({
              where: { id },
              data: {
                status: BookingStatus.cancelled,
                cancelReason:
                  (reason?.trim() || 'لغو دیرهنگام توسط مشتری') +
                  ` (خارج از پنجره لغو رایگان ${hours} ساعته — استرداد خودکار انجام نشد)`,
                cancelledAt: new Date(),
                notes: [b.notes, 'REFUND_POLICY:late_cancel_no_auto_refund'].filter(Boolean).join(' | ').slice(0, 2000),
              },
            });
            try {
              await this.prisma.auditLog.create({
                data: {
                  actorId: userId,
                  action: 'booking.cancel.late_no_refund',
                  entityType: 'booking',
                  entityId: id,
                  after: {
                    paymentId: b.payment?.id,
                    paymentStatus: b.payment?.status,
                    freeCancelHours: hours,
                  } as any,
                },
              });
            } catch { /* non-blocking */ }
            try {
              await this.notifications.notify({
                userId: b.customerId,
                type: NotificationType.system,
                title: 'لغو نوبت (بدون استرداد خودکار)',
                body: `رزرو لغو شد. به‌دلیل لغو خارج از پنجره ${hours} ساعته، استرداد خودکار انجام نشد. در صورت نیاز با پشتیبانی تماس بگیرید.`,
                data: { bookingId: id, href: `/dashboard/bookings?focus=${id}` },
                sms: false,
              });
            } catch { /* non-blocking */ }
            return updated;
          }'''
              t2, n = pat.subn(repl, t, count=1)
              if n:
                  t = t2
                  print('late cancel rewritten')
              else:
                  print('late cancel pattern miss')

          if 'take: safeLimit' not in t:
              t = t.replace('take: limit,', 'take: safeLimit,', 1)
              print('safeLimit fallback')

          p.write_text(t, encoding='utf-8')
          print('lines', len(t.splitlines()))
          print('ok markers', 'safeLimit' in t, 'locationId' in t and 'professionalLocation' in t, 'REFUND_PENDING' in t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.r3): restore bookings + location IDOR, safeLimit, cancel refund/late paths"
          git push origin HEAD:main
