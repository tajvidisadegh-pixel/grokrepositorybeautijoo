name: fix-ts-build-errors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-ts-build-errors.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix TS errors
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          bad = "` (خارج از پنجره لغو رایگان ${hours} ساعته — استرداد خودکار انجام نشد)',"
          good = "` (خارج از پنجره لغو رایگان ${hours} ساعته — استرداد خودکار انجام نشد)`,"
          if bad in t:
              t = t.replace(bad, good, 1)
              p.write_text(t, encoding='utf-8')
              print('bookings template fixed')
          elif good in t:
              print('bookings already ok')
          else:
              # try ascii hyphen variant
              import re
              t2, n = re.subn(
                  r"` \(خارج از پنجره لغو رایگان \$\{hours\} ساعته[^`']*\)'",
                  lambda m: m.group(0)[:-1] + '`',
                  t,
                  count=1,
              )
              if n:
                  p.write_text(t2, encoding='utf-8')
                  print('bookings regex fixed')
              else:
                  print('bookings pattern not found')

          m = Path('backend/src/main.ts')
          mt = m.read_text(encoding='utf-8')
          if "(req, res, next)" in mt and "Request" not in mt.split("(req, res, next)")[0][-200:]:
              if "import type { Request, Response, NextFunction }" not in mt:
                  # add express types import after first import block
                  if "from 'express'" not in mt:
                      mt = "import type { Request, Response, NextFunction } from 'express';\n" + mt
                  mt = mt.replace(
                      "(req, res, next)",
                      "(req: Request, res: Response, next: NextFunction)",
                      1,
                  )
                  m.write_text(mt, encoding='utf-8')
                  print('main.ts types fixed')
              else:
                  mt = mt.replace(
                      "(req, res, next)",
                      "(req: Request, res: Response, next: NextFunction)",
                      1,
                  )
                  m.write_text(mt, encoding='utf-8')
                  print('main.ts types fixed2')
          else:
              print('main.ts skip')

          print('ALL_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/main.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: close broken template literal in cancelReason; type uploads middleware"
          git push origin HEAD:main
