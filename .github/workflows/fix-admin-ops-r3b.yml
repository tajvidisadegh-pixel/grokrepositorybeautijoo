name: fix-admin-ops-r3b
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-ops-r3b.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin-ops
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin-ops.controller.ts')
          t = p.read_text(encoding='utf-8')

          t = t.replace(
              'if (depth > 12) return null;',
              "if (depth > 12) return typeof value === 'string' ? value.replace(/<[^>]*>/g, '').slice(0, 5000) : value;",
              1,
          )

          if 'rawSize > 400_000' not in t:
              t = t.replace(
                  "async putContent(@Body() body: any, @CurrentUser('id') actorId?: string) {\n    const cleaned = stripHtmlDeep({",
                  "async putContent(@Body() body: any, @CurrentUser('id') actorId?: string) {\n    const rawSize = Buffer.byteLength(JSON.stringify(body ?? {}), 'utf8');\n    if (rawSize > 400_000) throw new BadRequestException('payload too large');\n    const cleaned = stripHtmlDeep({",
                  1,
              )

          if 'sbSize > 400_000' not in t and 'listRaw.length > 200' in t:
              t = t.replace(
                  'if (listRaw.length > 200) throw new BadRequestException',
                  "const sbSize = Buffer.byteLength(JSON.stringify(listRaw), 'utf8');\n    if (sbSize > 400_000) throw new BadRequestException('payload too large');\n    if (listRaw.length > 200) throw new BadRequestException",
                  1,
              )

          t = t.replace(
              "deliveryStatus: 'sent',\n              smsRequested: !!dto.sms,",
              "deliveryStatus: dto.sms ? 'pending' : 'sent',\n              smsRequested: !!dto.sms,",
          )
          t = t.replace(
              "data: { campaignId, deliveryStatus: 'sent', smsRequested: !!dto.sms } as any,",
              "data: { campaignId, deliveryStatus: dto.sms ? 'pending' : 'sent', smsRequested: !!dto.sms } as any,",
          )

          old = 'const maxSms = Math.min(ids.length, Number(process.env.BULK_SMS_MAX || 200));'
          new = (
              "const envMax = parseInt(process.env.BULK_SMS_MAX || '200', 10);\n"
              "      const hardMax = Math.min(200, Number.isFinite(envMax) && envMax > 0 ? envMax : 200);\n"
              "      const maxSms = Math.min(ids.length, hardMax);"
          )
          if old in t:
              t = t.replace(old, new, 1)
              print('hardcap')

          old_loop_start = '      for (const u of users) {\n        if (!u.phone) continue;\n        try {\n          await this.sms.sendNotification(u.phone, msg);\n          smsSent++;\n        } catch (e) {\n          smsFailed++;\n          this.logger.warn(`bulk SMS fail user=${u.id}: ${e}`);\n        }\n      }'
          new_loop = '''      const concurrency = 10;
      for (let i = 0; i < users.length; i += concurrency) {
        const slice = users.slice(i, i + concurrency);
        const results = await Promise.all(
          slice.map(async (u) => {
            if (!u.phone) return { ok: false as const, id: u.id };
            try {
              await this.sms.sendNotification(u.phone, msg);
              return { ok: true as const, id: u.id };
            } catch (e) {
              this.logger.warn(`bulk SMS fail user=${u.id}: ${e}`);
              return { ok: false as const, id: u.id };
            }
          }),
        );
        for (const r of results) {
          if (r.ok) smsSent++;
          else smsFailed++;
          try {
            await this.prisma.notification.updateMany({
              where: { userId: r.id, data: { path: ['campaignId'], equals: campaignId } },
              data: {
                data: {
                  campaignId,
                  deliveryStatus: r.ok ? 'sent' : 'failed',
                  smsRequested: true,
                  smsDelivered: r.ok,
                } as any,
              },
            });
          } catch { /* non-blocking */ }
        }
      }'''
          if old_loop_start in t:
              t = t.replace(old_loop_start, new_loop, 1)
              print('sms loop')
          else:
              print('sms loop miss')

          t = t.replace(
              'where: { id: { in: ids.slice(0, maxSms) }, phone: { not: null } },',
              'where: { id: { in: ids.slice(0, maxSms) }, phone: { not: null }, status: UserStatus.active },',
              1,
          )

          old_idx = 'const idsList = [campaignId, ...(Array.isArray(prev) ? prev : [])].slice(0, 500);'
          new_idx = 'const prevIds = Array.isArray(prev) ? prev.filter((x: string) => x !== campaignId) : [];\n      const idsList = [campaignId, ...prevIds].slice(0, 500);'
          if old_idx in t:
              t = t.replace(old_idx, new_idx, 1)
              print('idx')

          p.write_text(t, encoding='utf-8')
          print('done', 'hardMax' in t, '400_000' in t, 'smsDelivered' in t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.r3): bulk SMS hardcap+status, CMS payload limits, campaign index"
          git push origin HEAD:main
