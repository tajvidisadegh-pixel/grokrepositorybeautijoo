name: apply-65-remaining-root-fixes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-65-remaining-root-fixes.yml'
      - '.github/payloads/fix-65-remaining/**'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write files
        run: |
          set -euo pipefail
          decode() {
            local name="$1" dest="$2"
            cat .github/payloads/fix-65-remaining/${name}.*.b64 | tr -d '\n' | base64 -d > "$dest"
            echo "wrote $dest ($(wc -c < "$dest") bytes)"
          }
          decode slug backend/src/common/public-slug.ts
          decode svc backend/src/professionals/professionals.service.ts
          decode hours frontend/src/app/zibagar/hours/page.tsx
          decode pro "frontend/src/app/professionals/[slug]/page.tsx"
          decode services frontend/src/app/zibagar/services/page.tsx
      - name: Verify markers
        run: |
          set -euo pipefail
          grep -q isPhoneLike backend/src/common/public-slug.ts
          grep -q toPublicSlug backend/src/professionals/professionals.service.ts
          grep -q TIME_OPTIONS_24H frontend/src/app/zibagar/hours/page.tsx
          ! grep -q 'type="time"' frontend/src/app/zibagar/hours/page.tsx
          grep -q 'نظرات مشتریان' "frontend/src/app/professionals/[slug]/page.tsx"
          grep -q editDescription frontend/src/app/zibagar/services/page.tsx
          echo "all markers OK"
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/common/public-slug.ts \
                  backend/src/professionals/professionals.service.ts \
                  frontend/src/app/zibagar/hours/page.tsx \
                  "frontend/src/app/professionals/[slug]/page.tsx" \
                  frontend/src/app/zibagar/services/page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(#65): hours 24h selects, slug phone guard, reviews, service description"
          git push origin HEAD:main
