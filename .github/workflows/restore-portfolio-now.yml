name: Restore portfolio NOW
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-portfolio-now.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore portfolio and sync export
        run: |
          set -euxo pipefail
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/f646098de8e5bfbfdbc3ca17902509877a7c54a2/frontend/src/app/zibagar/portfolio/page.tsx" \
            -o frontend/src/app/zibagar/portfolio/page.tsx
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          t = p.read_text()
          assert 'ZibagarPortfolioPage' in t
          old = """          items={items.map((m) => ({
            src: m.publicUrl || '',
            alt: m.title || 'portfolio',
            isVideo: isVideo(m.mimeType, m.publicUrl),
          }))}"""
          new = """          items={items.map((m) => ({
            id: m.id,
            url: m.publicUrl || '',
            mimeType: m.mimeType || undefined,
            caption: m.title || undefined,
          }))}"""
          if old in t:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('fixed lightbox')
          elif 'id: m.id' in t:
              print('already fixed')
          else:
              raise SystemExit('map pattern missing')
          print('size', p.stat().st_size)
          # verify payments still good
          pt = Path('backend/src/payments/payments.service.ts').read_text()
          if 'PLACEHOLDER' in pt or 'export class PaymentsService' not in pt:
              raise SystemExit('payments broken')
          print('payments ok', len(pt))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/portfolio/page.tsx
          git commit -m "fix: restore portfolio page + LightboxItem types"
          git push origin HEAD:main

          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          mkdir -p /tmp/be/src/payments
          cp backend/src/payments/payments.service.ts /tmp/be/src/payments/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payments/payments.service.ts
          git commit -m "fix: restore payments.service offline mode" || true
          git push origin HEAD:beautijoo-backend-export || true
