name: Restore panel-api baseline
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-panel-api.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restore panel-api from support commit
        run: |
          set -e
          git show 592154f:frontend/src/lib/panel-api.ts > frontend/src/lib/panel-api.ts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/panel-api.ts
          git commit -m "fix(#30): restore panel-api without CatalogAddOn helpers (backend API remains)" || echo no-change
          git push
