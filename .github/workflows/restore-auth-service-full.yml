name: Restore auth.service full
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/auth.service.b64'
      - '.github/workflows/restore-auth-service-full.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write auth.service.ts
        run: |
          python3 -c "
          import base64
          from pathlib import Path
          data = base64.b64decode(Path('scripts/auth.service.b64').read_text().strip())
          Path('backend/src/auth/auth.service.ts').write_bytes(data)
          print('wrote', len(data), 'bytes')
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "fix(auth): restore full AuthService with forgot/reset password"
          git push
