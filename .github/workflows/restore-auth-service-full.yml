name: Restore auth.service full
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/auth_p*.txt'
      - '.github/workflows/restore-auth-service-full.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode and write auth.service.ts
        run: |
          python3 << 'PY'
          import base64
          from pathlib import Path
          parts = [Path(f'scripts/auth_p{i:02d}.txt').read_text().strip() for i in range(20)]
          data = base64.b64decode(''.join(parts))
          Path('backend/src/auth/auth.service.ts').write_bytes(data)
          print('wrote', len(data), 'bytes')
          assert b'async register' in data
          assert b'async forgotPassword' in data
          print('methods ok')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "fix(auth): restore full AuthService with forgot/reset password"
          git push
