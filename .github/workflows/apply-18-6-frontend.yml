name: apply-18-6-frontend

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python3 << 'PY'
          from pathlib import Path

          api = Path("frontend/src/lib/panel-api.ts")
          at = api.read_text()
          # flexible replace
          import re
          at2, n = re.subn(
              r"export async function deleteAccount\(payload: \{ password: string \}\)",
              "export async function deleteAccount(payload: { password?: string } = {})",
              at,
          )
          if n:
              api.write_text(at2)
              print("panel-api patched", n)
          else:
              print("panel-api already ok or pattern missing")
              if "password?:" in at:
                  print("already optional")

          sp = Path("frontend/src/app/panel/settings/page.tsx")
          st = sp.read_text()
          # remove required password check
          st2 = st
          for old, new in [
              ("if (!deletePassword) {\n      setDelErr('رمز عبور الزامی است');\n      return;\n    }\n    setDelLoading(true);\n    try {\n      const res = await deleteAccount({ password: deletePassword });",
               "setDelLoading(true);\n    try {\n      const payload = deletePassword ? { password: deletePassword } : {};\n      const res = await deleteAccount(payload);"),
              ("const res = await deleteAccount({ password: deletePassword });",
               "const payload = deletePassword ? { password: deletePassword } : {};\n      const res = await deleteAccount(payload);"),
          ]:
              if old in st2:
                  st2 = st2.replace(old, new)
                  print("settings replaced block")
                  break
          if st2 == st:
              print("settings no match")
          else:
              sp.write_text(st2)
              print("settings written")
          PY
      - name: Commit
        run: |
          git config user.name grok-bot
          git config user.email bot@x.ai
          git add frontend/src/lib/panel-api.ts frontend/src/app/panel/settings/page.tsx
          git status
          git commit -m "feat(18.6): optional password for OTP users in delete UI/API" || true
          git push origin HEAD:main
