name: restore-bookings-and-doc-82-11
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-and-doc-82-11.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore bookings + document #82.11 constraint
        run: |
          set -e
          git show 4bbf0d4652a62db11aea205915ae560163887b6b:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          head -1 backend/src/bookings/bookings.service.ts | grep -q import
          grep -q maxBufferMin backend/src/bookings/bookings.service.ts
          wc -c backend/src/bookings/bookings.service.ts
          echo '' | base64 -d > /tmp/doc82_11.py
          python3 /tmp/doc82_11.py
          grep -q bookings_no_overlap_active backend/prisma/schema.prisma
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/prisma/schema.prisma
          git commit -m "fix(#82.11): document bookings_no_overlap_active; restore bookings.service.ts from 4bbf0d4"
          git push
