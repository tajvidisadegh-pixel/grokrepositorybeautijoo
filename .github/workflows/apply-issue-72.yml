name: Apply issue 72 product rules

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-72.yml'
      - 'scripts/patch_issue_72_product_rules.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_72_product_rules.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/professionals/professionals.service.ts \
            backend/src/bookings/bookings.service.ts \
            frontend/src/app/zibagar/bookings/page.tsx \
            frontend/src/app/zibagar/profile/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#72): disable pro social links, block user, enforce no reject"
          git push origin HEAD:main
