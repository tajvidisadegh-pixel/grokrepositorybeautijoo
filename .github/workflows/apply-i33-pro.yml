name: apply-i33-pro
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-i33-pro.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch professionals.service
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text()
          t = t.replace(
              "import { ProfessionalStatus, Prisma } from '@prisma/client';",
              "import { MediaKind, ProfessionalStatus, Prisma } from '@prisma/client';",
              1,
          )
          if 'MediaKind.salon' not in t:
              old = """      locations: { include: { location: true } },
      professionalServices: {
        where: { isActive: true },
        include: {
          service: { include: { category: true } },
          mediaAssets: { orderBy: { sortOrder: 'asc' as const } },"""
              new = """      locations: {
        include: { location: true },
        where: { isPrimary: true },
        take: 1,
      },
      mediaAssets: {
        where: { kind: { in: [MediaKind.salon, MediaKind.portfolio] } },
        orderBy: { sortOrder: 'asc' as const },
      },
      professionalServices: {
        where: { isActive: true },
        include: {
          service: { include: { category: true } },
          mediaAssets: { orderBy: { sortOrder: 'asc' as const } },"""
              if old not in t:
                  raise SystemExit('publicInclude missing')
              t = t.replace(old, new, 1)
          if 'attachMediaPublicUrls' not in t:
              old = """    const safe = this.sanitizePublicLocations(pro);
    this.cache.set(cacheKey, safe, 120_000);
    return safe;
  }"""
              new = """    const safe = this.sanitizePublicLocations(pro);
    const withMedia = this.attachMediaPublicUrls(safe);
    this.cache.set(cacheKey, withMedia, 120_000);
    return withMedia;
  }

  private attachMediaPublicUrls<T extends {
    mediaAssets?: Array<{ url?: string | null; publicUrl?: string | null }> | null;
    professionalServices?: Array<{ mediaAssets?: Array<{ url?: string | null; publicUrl?: string | null }> | null }> | null;
  }>(pro: T): T {
    if (!pro) return pro;
    const mapRow = <R extends { url?: string | null; publicUrl?: string | null }>(row: R): R => ({
      ...row,
      publicUrl: row.publicUrl ?? row.url ?? null,
    });
    const mediaAssets = Array.isArray(pro.mediaAssets) ? pro.mediaAssets.map(mapRow) : pro.mediaAssets;
    const professionalServices = Array.isArray(pro.professionalServices)
      ? pro.professionalServices.map((ps) => ({
          ...ps,
          mediaAssets: Array.isArray(ps.mediaAssets) ? ps.mediaAssets.map(mapRow) : ps.mediaAssets,
        }))
      : pro.professionalServices;
    return { ...pro, mediaAssets, professionalServices };
  }"""
              if old not in t:
                  raise SystemExit('findBySlug missing')
              t = t.replace(old, new, 1)
          p.write_text(t)
          assert 'MediaKind.salon' in t
          assert 'attachMediaPublicUrls' in t
          print('professionals patched', len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git diff --cached --quiet || git commit -m "feat(#33): expose salon media on public pro profile"
          git push
