name: Run fix gender filter
on:
  push:
    paths:
      - '.github/workflows/run-fix-gender.yml'
      - 'scripts/fix-gender-filter.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-gender-filter.py
      - name: Build check
        working-directory: backend
        run: |
          npm install
          npx prisma generate --schema=./prisma/schema.prisma
          npx nest build
          test -f dist/main.js || test -f dist/src/main.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-fix-gender.yml
          git add backend/src/professionals/professionals.service.ts
          git add -A
          git diff --cached --quiet || git commit -m "fix(search): correct Prisma gender filter typing"
          git push
