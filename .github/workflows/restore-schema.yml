name: Restore schema.prisma
on:
  push:
    paths:
      - 'backend/prisma/.schema-b64/**'
      - '.github/workflows/restore-schema.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble schema from b64 parts
        run: |
          set -e
          cat backend/prisma/.schema-b64/part-*.b64 | tr -d '\n' | base64 -d > backend/prisma/schema.prisma
          head -3 backend/prisma/schema.prisma
          grep -c '^model ' backend/prisma/schema.prisma
          test "$(grep -c '^model ' backend/prisma/schema.prisma)" -ge 30
      - name: Commit restored schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma
          if git diff --staged --quiet; then
            echo "No schema change"
          else
            git commit -m "fix(schema): assemble full Prisma schema from b64 parts (issue #21)"
            git push
          fi
