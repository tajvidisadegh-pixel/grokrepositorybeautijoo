name: Remove bio step
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-bio-step.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Strip bio from wizard
        run: |
          set -euo pipefail
          F=frontend/src/app/zibagar/profile/complete/page.tsx
          B=backend/src/professionals/professionals.service.ts

          # drop contact step line
          sed -i "/id: 'contact'/d" "$F"

          # drop bio state
          sed -i "/const \[bio, setBio\]/d" "$F"
          sed -i "/setBio(/d" "$F"

          # drop bio from resume order array
          sed -i "s/'bio',//g" "$F"

          # remove saveContact function (line range via python)
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/app/zibagar/profile/complete/page.tsx')
          t = p.read_text()
          t, n = re.subn(r"\n  async function saveContact\(\) \{[\s\S]*?\n  \}\n", "\n", t, count=1)
          print('saveContact', n)
          # onNext: remove contact branch and renumber
          t = t.replace('else if (step === 1) ok = await saveContact();\n    else if (step === 2) ok = await saveMedia();\n    else if (step === 3) ok = await saveLocation();\n    else if (step === 4) ok = await saveService();\n    else if (step === 5) ok = await saveHours();',
                         'else if (step === 1) ok = await saveMedia();\n    else if (step === 2) ok = await saveLocation();\n    else if (step === 3) ok = await saveService();\n    else if (step === 4) ok = await saveHours();')
          # remove bio UI card
          t, n = re.subn(r"\n      \{step === 1 && \([\s\S]*?معرفی / بیو[\s\S]*?\)\}\n", "\n", t, count=1)
          print('ui', n)
          # renumber remaining step UI with placeholders
          for a,b in [('2','__M'),('3','__L'),('4','__S'),('5','__H'),('6','__R')]:
              t = t.replace('{step === %s &&' % a, '{%s &&' % b)
          t = t.replace('{__M &&', '{step === 1 &&')
          t = t.replace('{__L &&', '{step === 2 &&')
          t = t.replace('{__S &&', '{step === 3 &&')
          t = t.replace('{__H &&', '{step === 4 &&')
          t = t.replace('{__R &&', '{step === 5 &&')
          # categories effect: services was step 4, now 3
          t = t.replace('useEffect(() => {\n    if (step === 4) {', 'useEffect(() => {\n    if (step === 3) {')
          # resume mapping simplify
          t = t.replace('else if (i === 3) resume = 1;\n            else if (i === 4) resume = 2;\n            else if (i === 5) resume = 3;\n            else if (i === 6) resume = 4;\n            else resume = 5;',
                         'else if (i === 3) resume = 1;\n            else if (i === 4) resume = 2;\n            else if (i === 5) resume = 3;\n            else resume = 4;')
          t = t.replace('if (i === order.length - 1 && data.completion?.complete) resume = 6;',
                         'if (i === order.length - 1 && data.completion?.complete) resume = 5;')
          assert 'saveContact' not in t
          assert 'setBio' not in t
          assert 'معرفی / بیو' not in t
          p.write_text(t)
          print('frontend OK')

          b = Path('backend/src/professionals/professionals.service.ts')
          bt = b.read_text()
          bt = bt.replace("  | 'bio'\n", '')
          bt = re.sub(r"  bio: '[^']*',\n", '', bt, count=1)
          bt = bt.replace("        { bio: { contains: params.q, mode: 'insensitive' } },\n", '')
          bt = bt.replace('    // Bio is optional — never blocks completion to 100%\n    const hasBio = true;\n', '')
          bt = bt.replace("      { key: 'bio', label: COMPLETION_LABELS.bio + ' (اختیاری)', done: hasBio },\n", '')
          bt = bt.replace("    const required = fields.filter((f) => f.key !== 'bio');\n", '    const required = fields;\n')
          bt = bt.replace('avatarUrl: true, bio: true,', 'avatarUrl: true,')
          b.write_text(bt)
          print('backend OK')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/profile/complete/page.tsx backend/src/professionals/professionals.service.ts
          git status
          git commit -m "feat: remove bio/intro step from professional registration" || exit 0
          git push origin HEAD:main
