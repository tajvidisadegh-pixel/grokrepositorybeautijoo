name: Remove bio step from pro wizard
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-bio-step.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches with sed/python (robust)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/app/zibagar/profile/complete/page.tsx')
          t = p.read_text()

          # Remove contact from STEPS list
          t = re.sub(
              r"\s*\{ id: 'contact', label: '[^']*' \},\n",
              "\n",
              t,
              count=1,
          )

          # Remove bio state + setter load
          t = t.replace("  const [bio, setBio] = useState('');\n", "")
          t = t.replace("      setBio(data.bio || data.user?.profile?.bio || '');\n", "")

          # Resume order: drop bio
          t = t.replace(
              "['title','firstName','lastName','bio','avatarOrCover','location','service','workingHours']",
              "['title','firstName','lastName','avatarOrCover','location','service','workingHours']",
          )
          # Fix resume indices (was: bio=1, media=2...; now media=1...)
          t = t.replace(
          '''            if (i <= 2) resume = 0;
            else if (i === 3) resume = 1;
            else if (i === 4) resume = 2;
            else if (i === 5) resume = 3;
            else if (i === 6) resume = 4;
            else resume = 5;
            break;
          }
          if (i === order.length - 1 && data.completion?.complete) resume = 6;''',
          '''            if (i <= 2) resume = 0;
            else if (i === 3) resume = 1;
            else if (i === 4) resume = 2;
            else if (i === 5) resume = 3;
            else resume = 4;
            break;
          }
          if (i === order.length - 1 && data.completion?.complete) resume = 5;''',
          )

          # Remove saveContact function
          t, n = re.subn(
              r"\n  async function saveContact\(\) \{[\s\S]*?\n  \}\n",
              "\n",
              t,
              count=1,
          )
          print('saveContact removed', n)

          # Fix onNext
          t = t.replace(
          '''    if (step === 0) ok = await saveBasic();
    else if (step === 1) ok = await saveContact();
    else if (step === 2) ok = await saveMedia();
    else if (step === 3) ok = await saveLocation();
    else if (step === 4) ok = await saveService();
    else if (step === 5) ok = await saveHours();''',
          '''    if (step === 0) ok = await saveBasic();
    else if (step === 1) ok = await saveMedia();
    else if (step === 2) ok = await saveLocation();
    else if (step === 3) ok = await saveService();
    else if (step === 4) ok = await saveHours();''',
          )

          # Remove bio UI block (step === 1 contact card)
          t, n = re.subn(
              r"\n      \{step === 1 && \([\s\S]*?معرفی / بیو[\s\S]*?\)\}\n",
              "\n",
              t,
              count=1,
          )
          print('bio UI removed', n)

          # Renumber remaining steps with unique placeholders
          t = t.replace('{step === 2 &&', '{__M__ &&')
          t = t.replace('{step === 3 &&', '{__L__ &&')
          t = t.replace('{step === 4 &&', '{__S__ &&')
          t = t.replace('{step === 5 &&', '{__H__ &&')
          t = t.replace('{step === 6 &&', '{__R__ &&')
          t = re.sub(
              r"(useEffect\(\(\) => \{\n    )if \(step === 4\)",
              r"\1if (step === 3)",
              t,
              count=1,
          )
          t = t.replace('{__M__ &&', '{step === 1 &&')
          t = t.replace('{__L__ &&', '{step === 2 &&')
          t = t.replace('{__S__ &&', '{step === 3 &&')
          t = t.replace('{__H__ &&', '{step === 4 &&')
          t = t.replace('{__R__ &&', '{step === 5 &&')

          assert 'saveContact' not in t, 'saveContact left'
          assert 'setBio' not in t, 'setBio left'
          assert 'معرفی / بیو' not in t, 'bio label left'
          assert "id: 'contact'" not in t, 'contact step left'
          p.write_text(t)
          print('frontend patched OK')

          b = Path('backend/src/professionals/professionals.service.ts')
          bt = b.read_text()
          bt = bt.replace("  | 'bio'\n", '')
          bt = re.sub(r"  bio: '[^']*',\n", '', bt, count=1)
          bt = bt.replace("        { bio: { contains: params.q, mode: 'insensitive' } },\n", '')
          bt = bt.replace("    // Bio is optional — never blocks completion to 100%\n    const hasBio = true;\n", '')
          bt = bt.replace("      { key: 'bio', label: COMPLETION_LABELS.bio + ' (اختیاری)', done: hasBio },\n", '')
          bt = bt.replace("    const required = fields.filter((f) => f.key !== 'bio');\n", "    const required = fields;\n")
          bt = bt.replace(
              'displayName: true, firstName: true, lastName: true, avatarUrl: true, bio: true,',
              'displayName: true, firstName: true, lastName: true, avatarUrl: true,',
          )
          b.write_text(bt)
          print('backend patched OK')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: remove bio/intro step from professional registration" || echo none
          git push origin HEAD:main
