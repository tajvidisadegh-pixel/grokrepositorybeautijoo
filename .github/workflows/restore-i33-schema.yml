name: restore-i33-schema
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore media.service.ts with salon support
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/c9774cbae4f8210179d84fae72c54eb13a51ffcd/backend/src/media/media.service.ts" -o backend/src/media/media.service.ts
          python3 - <<'PY'
          from pathlib import Path
          t = Path('backend/src/media/media.service.ts').read_text()
          old = """      if (isVideo && kind !== MediaKind.portfolio && kind !== MediaKind.service) {
        throw new BadRequestException('ویدیو فقط برای پورتفولیو یا خدمت مجاز است');
      }"""
          new = """      if (
        isVideo &&
        kind !== MediaKind.portfolio &&
        kind !== MediaKind.service &&
        kind !== MediaKind.salon
      ) {
        throw new BadRequestException('ویدیو فقط برای پورتفولیو، خدمت یا سالن مجاز است');
      }"""
          if old not in t:
            raise SystemExit('media pattern missing')
          Path('backend/src/media/media.service.ts').write_text(t.replace(old, new, 1))
          assert 'MediaKind.salon' in Path('backend/src/media/media.service.ts').read_text()
          print('media ok', Path('backend/src/media/media.service.ts').stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/media/media.service.ts
          git diff --cached --quiet || git commit -m "fix(#33): restore media.service.ts with salon video support"
          git push
