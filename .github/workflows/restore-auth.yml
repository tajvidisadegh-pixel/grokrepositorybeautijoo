name: Restore auth service
on:
  push:
    paths:
      - 'scripts/restore_auth_service.py'
      - '.github/workflows/restore-auth.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_auth_service.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --staged --quiet && echo nochange && exit 0
          git commit -m "fix: restore full auth.service.ts (remove PLACEHOLDER + #10 methods)"
          git push
