name: apply-i35-sizes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-i35-sizes.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch site-builder and homepage font sizes
        run: |
          python3 << 'PY'
          from pathlib import Path

          # site-builder
          p = Path('frontend/src/app/admin/site-builder/page.tsx')
          t = p.read_text()
          if 'titleSize?' not in t:
              t = t.replace(
                  "  textColor?: 'auto' | 'light' | 'dark';\n  searchPlaceholder?: string;",
                  "  textColor?: 'auto' | 'light' | 'dark';\n  titleSize?: 'sm' | 'md' | 'lg' | 'xl';\n  subtitleSize?: 'sm' | 'md' | 'lg';\n  searchPlaceholder?: string;",
                  1,
              )
              t = t.replace('<Select label="تراز متن"', '<Select label="تراز متن (موقعیت)"', 1)
              old = """                <Select label=\"رنگ متن\" value={hero.textColor || 'auto'} onChange={(v) => patchHero({ textColor: v as Hero['textColor'] })} options={[{ value: 'auto', label: 'خودکار (روشن روی تصویر)' }, { value: 'light', label: 'روشن (سفید)' }, { value: 'dark', label: 'تیره' }]} />"""
              # fix quotes - use real content
              marker = "options={[{ value: 'auto', label: 'خودکار (روشن روی تصویر)' }, { value: 'light', label: 'روشن (سفید)' }, { value: 'dark', label: 'تیره' }]} />"
              if marker in t and 'اندازه عنوان' not in t:
                  t = t.replace(
                      marker,
                      marker + "\n                <Select label=\"اندازه عنوان\" value={hero.titleSize || 'lg'} onChange={(v) => patchHero({ titleSize: v as Hero['titleSize'] })} options={[{ value: 'sm', label: 'کوچک' }, { value: 'md', label: 'متوسط' }, { value: 'lg', label: 'بزرگ' }, { value: 'xl', label: 'خیلی بزرگ' }]} />\n                <Select label=\"اندازه زیرعنوان\" value={hero.subtitleSize || 'md'} onChange={(v) => patchHero({ subtitleSize: v as Hero['subtitleSize'] })} options={[{ value: 'sm', label: 'کوچک' }, { value: 'md', label: 'متوسط' }, { value: 'lg', label: 'بزرگ' }]} />",
                      1,
                  )
              old_o = """  const hasBanner = Boolean(hero.desktopImageUrl || hero.mobileImageUrl);\n  const overlayPct = Math.min(90, Math.max(0, Number(hero.overlayOpacity ?? 40)));\n  const layout = hero.layout || (hasBanner ? 'image-background' : 'gradient-only');"""
              if old_o in t and 'titleSizeCls' not in t:
                  t = t.replace(
                      old_o,
                      old_o + "\n  const titleSizeCls =\n    hero.titleSize === 'sm'\n      ? 'text-lg'\n      : hero.titleSize === 'md'\n        ? 'text-xl'\n        : hero.titleSize === 'xl'\n          ? 'text-3xl'\n          : 'text-2xl';\n  const subtitleSizeCls =\n    hero.subtitleSize === 'sm' ? 'text-sm' : hero.subtitleSize === 'lg' ? 'text-lg' : 'text-base';",
                      1,
                  )
              t = t.replace(
                  '<p className="text-xl font-bold text-[#0B2C4A]">{hero.title || \'عنوان\'}</p>',
                  '<p className={`${titleSizeCls} font-bold text-[#0B2C4A]`}>{hero.title || \'عنوان\'}</p>',
                  1,
              )
              t = t.replace(
                  '{hero.subtitle && <p className="mt-1 text-base text-gray-800">{hero.subtitle}</p>}',
                  '{hero.subtitle && <p className={`mt-1 ${subtitleSizeCls} text-gray-800`}>{hero.subtitle}</p>}',
                  1,
              )
              t = t.replace(
                  "<p className={`text-2xl font-bold ${forceLight ? 'text-white' : 'text-[#0B2C4A]'`}>",
                  "<p className={`${titleSizeCls} font-bold ${forceLight ? 'text-white' : 'text-[#0B2C4A]'`}>",
                  1,
              )
              t = t.replace(
                  "<p className={`mt-1 text-lg ${forceLight ? 'text-white/95' : 'text-gray-800'}`}>{hero.subtitle}</p>",
                  "<p className={`mt-1 ${subtitleSizeCls} ${forceLight ? 'text-white/95' : 'text-gray-800'}`}>{hero.subtitle}</p>",
                  1,
              )
              p.write_text(t)
              print('site-builder patched')
          else:
              print('site-builder already has titleSize')

          # homepage
          p = Path('frontend/src/app/page.tsx')
          t = p.read_text()
          if 'titleSize?' not in t:
              t = t.replace(
                  "  textColor?: 'auto' | 'light' | 'dark';\n  searchPlaceholder?: string;",
                  "  textColor?: 'auto' | 'light' | 'dark';\n  titleSize?: 'sm' | 'md' | 'lg' | 'xl';\n  subtitleSize?: 'sm' | 'md' | 'lg';\n  searchPlaceholder?: string;",
                  1,
              )
              old_min = '  const minH = Math.min(800, Math.max(280, Number(hero.minHeight ?? 420)));'
              if old_min in t and 'titleSizeCls' not in t:
                  t = t.replace(
                      old_min,
                      old_min + "\n  const titleSizeCls =\n    hero.titleSize === 'sm'\n      ? 'text-xl sm:text-2xl md:text-3xl'\n      : hero.titleSize === 'md'\n        ? 'text-2xl sm:text-3xl md:text-4xl'\n        : hero.titleSize === 'xl'\n          ? 'text-3xl sm:text-4xl md:text-5xl lg:text-6xl'\n          : 'text-2xl sm:text-3xl md:text-4xl lg:text-5xl';\n  const subtitleSizeCls =\n    hero.subtitleSize === 'sm'\n      ? 'text-sm sm:text-base'\n      : hero.subtitleSize === 'lg'\n        ? 'text-lg sm:text-xl'\n        : 'text-base sm:text-lg';",
                      1,
                  )
              t = t.replace(
                  'className={`text-2xl font-bold leading-snug sm:text-3xl sm:leading-tight md:text-4xl lg:text-5xl ${titleCls}`}',
                  'className={`${titleSizeCls} font-bold leading-snug sm:leading-tight ${titleCls}`}',
                  1,
              )
              t = t.replace(
                  '{hero.subtitle ? <span className={`block ${subCls}`}>{hero.subtitle}</span> : null}',
                  '{hero.subtitle ? <span className={`block ${subtitleSizeCls} ${subCls}`}>{hero.subtitle}</span> : null}',
                  1,
              )
              t = t.replace(
                  'className="text-2xl font-bold leading-snug text-blue sm:text-3xl md:text-4xl"',
                  'className={`${titleSizeCls} font-bold leading-snug text-blue`}',
                  1,
              )
              t = t.replace(
                  '<span className="mt-1 block text-foreground">{hero.subtitle}</span>',
                  '<span className={`mt-1 block ${subtitleSizeCls} text-foreground`}>{hero.subtitle}</span>',
                  1,
              )
              p.write_text(t)
              print('page patched')
          else:
              print('page already has titleSize')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/site-builder/page.tsx frontend/src/app/page.tsx
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "feat(#35): site-builder + homepage title/subtitle size controls"
          git push
