name: Restore admin.service bugfixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore_admin_service.py'
      - 'scripts/admin_service_fixed.b64'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_admin_service.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          git status
          git diff --cached --stat
          git commit -m "fix(admin): setUserRoles + dashboard revenue + bookingsByStatus" || exit 0
          git push origin HEAD:main
