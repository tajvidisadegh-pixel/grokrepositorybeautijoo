name: fix-admin-before-null
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-before-null.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin.service.ts')
          t = p.read_text(encoding='utf-8')
          old = "          before: null,\n"
          if old in t:
              t = t.replace(old, '', 1)
              p.write_text(t, encoding='utf-8')
              print('removed before:null')
          else:
              print('not found')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: omit before:null in impersonation audit (Prisma Json type)"
          git push origin HEAD:main
