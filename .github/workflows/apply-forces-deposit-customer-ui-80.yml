name: Apply forcesDeposit customer UI 80.2.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-forces-deposit-customer-ui-80.yml'
      - 'scripts/patch_forces_deposit_customer_ui_80.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_forces_deposit_customer_ui_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/app/booking/\[slug\]/page.tsx \
            frontend/src/components/booking/booking-wizard.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.phase2.2): clear deposit path when forcesDeposit option selected"
          git push origin HEAD:main
