name: patch-auth-login-phone2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/TRIGGER_AUTH_LOGIN_PHONE2'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login with phone variants
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('backend/src/auth/auth.service.ts')
          t = p.read_text()
          if 'phoneLookupVariants' not in t:
              old = """  private resolveAccountType(raw?: string | null): AccountType {
    if (raw === 'professional') return AccountType.professional;
    return AccountType.customer;
  }

  private isPrivileged(roles: string[]): boolean {
    return roles.some((r) => PRIVILEGED_ROLES.has(r));
  }"""
              new = """  private resolveAccountType(raw?: string | null): AccountType {
    if (raw === 'professional') return AccountType.professional;
    return AccountType.customer;
  }

  private normalizePhone(raw?: string | null): string {
    let s = String(raw || '').trim().replace(/[\\s-]/g, '');
    s = s.replace(/^\\+/, '');
    if (s.startsWith('0098')) s = s.slice(4);
    else if (s.startsWith('98') && s.length >= 12) s = s.slice(2);
    if (s.startsWith('9') && s.length === 10) s = '0' + s;
    return s;
  }

  private phoneLookupVariants(phone: string): string[] {
    const n = this.normalizePhone(phone);
    const set = new Set<string>();
    if (phone) set.add(String(phone).trim());
    if (n) set.add(n);
    if (n.startsWith('0') && n.length === 11) {
      set.add('98' + n.slice(1));
      set.add('+98' + n.slice(1));
    }
    return [...set].filter(Boolean);
  }

  private isPrivileged(roles: string[]): boolean {
    return roles.some((r) => PRIVILEGED_ROLES.has(r));
  }"""
              if old not in t:
                  raise SystemExit('resolve missing')
              t = t.replace(old, new, 1)
              print('normalize')

          # Build Persian strings via unicode escapes so YAML stays ASCII
          msg_otp_pro = (
              'این حساب ' + 'زیباگر' + ' فقط با کد پیامکی قابل ورود است. '
              + 'برای ورود با رمز از «فراموشی رمز» رمز تعیین کنید یا با کد پیامکی وارد شوید.'
          )
          # Use explicit unicode for safety in source file
          otp_msg = (
              "'این حساب ' +\n"
              "          want +\n"
              "          ' فقط با کد پیامکی قابل ورود است. برای ورود با رمز از «فراموشی رمز» رمز تعیین کنید یا با کد پیامکی وارد شوید.'"
          )

          if 'phoneLookupVariants(dto.phone)' not in t:
              start = t.find('  async login(dto: LoginDto) {')
              m = re.search(
                  r'const ok = await argon2\.verify\(user\.passwordHash, dto\.password\);\n    if \(!ok\) \{\n      throw new UnauthorizedException\([^;]+;\n    \}',
                  t[start:],
              )
              if start < 0 or not m:
                  raise SystemExit('login block missing')
              end_at = start + m.end()
              new_login = r'''  async login(dto: LoginDto) {
    const accountType = this.resolveAccountType(dto.accountType);
    const roleWanted = accountType === AccountType.professional ? 'professional' : 'customer';
    const phones = this.phoneLookupVariants(dto.phone);
    const candidates = await this.prisma.user.findMany({
      where: { phone: { in: phones } },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    let user =
      candidates.find((u) => u.accountType === accountType && u.passwordHash) ||
      candidates.find((u) => u.accountType === accountType) ||
      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted) && u.passwordHash) ||
      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted)) ||
      null;

    if (!user) {
      if (candidates.length > 0) {
        const otherType = candidates[0].accountType;
        const other = otherType === AccountType.professional ? 'pro' : 'user';
        const want = roleWanted === 'professional' ? 'pro' : 'user';
        throw new UnauthorizedException(
          'No password login for role ' + want + '. Switch login type or register the role.'
        );
      }
      throw new UnauthorizedException('Invalid phone or password');
    }

    if (!user.passwordHash) {
      const want = roleWanted === 'professional' ? 'professional' : 'customer';
      throw new UnauthorizedException(
        'This ' + want + ' account is OTP-only. Set a password via forgot-password or login with SMS code.'
      );
    }

    if (user.status !== UserStatus.active) {
      throw new UnauthorizedException('Account inactive');
    }
    const ok = await argon2.verify(user.passwordHash, dto.password);
    if (!ok) {
      throw new UnauthorizedException('Invalid phone or password');
    }'''
              # Prefer Persian messages (written as unicode escapes)
              new_login = new_login.replace(
                  "throw new UnauthorizedException(\n          'No password login for role ' + want + '. Switch login type or register the role.'\n        );",
                  "throw new UnauthorizedException(\n          '\u0628\u0631\u0627\u06cc \u0627\u06cc\u0646 \u0634\u0645\u0627\u0631\u0647 \u062d\u0633\u0627\u0628 ' + (want === 'pro' ? '\u0632\u06cc\u0628\u0627\u06af\u0631' : '\u06a9\u0627\u0631\u0628\u0631\u06cc') + ' \u067e\u06cc\u062f\u0627 \u0646\u0634\u062f. \u0627\u06af\u0631 \u062d\u0633\u0627\u0628 ' + (other === 'pro' ? '\u0632\u06cc\u0628\u0627\u06af\u0631' : '\u06a9\u0627\u0631\u0628\u0631\u06cc') + ' \u062f\u0627\u0631\u06cc\u062f \u0646\u0648\u0639 \u0648\u0631\u0648\u062f \u0631\u0627 \u0639\u0648\u0636 \u06a9\u0646\u06cc\u062f.',\n        );",
              )
              new_login = new_login.replace(
                  "throw new UnauthorizedException(\n        'This ' + want + ' account is OTP-only. Set a password via forgot-password or login with SMS code.'\n      );",
                  "throw new UnauthorizedException(\n        '\u0627\u06cc\u0646 \u062d\u0633\u0627\u0628 ' + (want === 'professional' ? '\u0632\u06cc\u0628\u0627\u06af\u0631' : '\u06a9\u0627\u0631\u0628\u0631\u06cc') + ' \u0641\u0642\u0637 \u0628\u0627 \u06a9\u062f \u067e\u06cc\u0627\u0645\u06a9\u06cc \u0642\u0627\u0628\u0644 \u0648\u0631\u0648\u062f \u0627\u0633\u062a. \u0628\u0631\u0627\u06cc \u0648\u0631\u0648\u062f \u0628\u0627 \u0631\u0645\u0632 \u0627\u0632 \u0641\u0631\u0627\u0645\u0648\u0634\u06cc \u0631\u0645\u0632 \u0627\u0633\u062a\u0641\u0627\u062f\u0647 \u06a9\u0646\u06cc\u062f.',\n      );",
              )
              new_login = new_login.replace(
                  "throw new UnauthorizedException('Invalid phone or password');",
                  "throw new UnauthorizedException('\u0634\u0645\u0627\u0631\u0647 \u06cc\u0627 \u0631\u0645\u0632 \u0639\u0628\u0648\u0631 \u0646\u0627\u062f\u0631\u0633\u062a \u0627\u0633\u062a');",
              )
              new_login = new_login.replace(
                  "throw new UnauthorizedException('Account inactive');",
                  "throw new UnauthorizedException('\u062d\u0633\u0627\u0628 \u06a9\u0627\u0631\u0628\u0631\u06cc \u063a\u06cc\u0631\u0641\u0639\u0627\u0644 \u0627\u0633\u062a');",
              )
              t = t[:start] + new_login + t[end_at:]
              print('login replaced')
          else:
              print('login already patched')

          p.write_text(t)
          print('size', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git commit -m "fix(auth): phone variants + OTP-only professional password login" || exit 0
          git push
