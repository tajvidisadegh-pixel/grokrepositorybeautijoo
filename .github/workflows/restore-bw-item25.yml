name: restore-bw-item25
on:
  push:
    paths: ['.github/workflows/restore-bw-item25.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore wizard
        run: |
          python3 << 'ENDPY'
          import base64, gzip, pathlib
          b64 = open('.github/workflows/restore-bw-item25.b64').read()
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('frontend/src/components/booking/booking-wizard.tsx').write_bytes(data)
          print('wrote', len(data))
          ENDPY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/booking/booking-wizard.tsx
          rm -f .github/workflows/restore-bw-item25.yml .github/workflows/restore-bw-item25.b64
          git add -A
          git diff --cached --quiet || git commit -m "fix: restore booking-wizard phoneVerified banner (#40-25)"
          git push
