name: restore-bw-item25
on:
  push:
    paths: ['.github/workflows/restore-bw-item25.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from good commit and add banner
        run: |
          set -e
          # Known good full wizard before PLACEHOLDER corruption
          git show 52917be0b052b7b767711cdd5dd0a69cb77d88b7:frontend/src/components/booking/booking-wizard.tsx > frontend/src/components/booking/booking-wizard.tsx
          python3 << 'ENDPY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          src = p.read_text()
          needle = '          <CancelPolicyNotice className="mb-3" />'
          banner = '''          {isAuthenticated && user && user.phoneVerified === false && (
            <div
              className="mb-3 rounded-2xl border border-amber-200 bg-amber-50 px-3 py-2.5 text-sm text-amber-950"
              role="status"
            >
              <p className="font-medium">تأیید موبایل لازم است</p>
              <p className="mt-1 text-xs leading-6 text-amber-900/90">
                قبل از ثبت رزرو باید شماره موبایل را با کد پیامکی تأیید کنید. با زدن دکمه زیر به صفحه تأیید هدایت می‌شوید.
              </p>
            </div>
          )}
          <CancelPolicyNotice className="mb-3" />'''
          if 'تأیید موبایل لازم است' not in src:
              if needle not in src:
                  raise SystemExit('needle missing')
              src = src.replace(needle, banner, 1)
              p.write_text(src)
              print('banner inserted', len(src))
          else:
              print('banner already present', len(src))
          assert 'phoneVerified' in src
          assert 'PLACEHOLDER' not in src
          assert 'RESTORE_INCOMPLETE' not in src
          ENDPY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/components/booking/booking-wizard.tsx
          rm -f .github/workflows/restore-bw-item25.yml .github/workflows/restore-bw-item25.b64
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix: restore booking-wizard + phoneVerified banner (#40-25)" || echo 'nothing to commit'
          git push
