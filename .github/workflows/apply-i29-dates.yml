name: Apply issue 29 Shamsi dates
on:
  push:
    paths:
      - '.github/workflows/apply-i29-dates.yml'
      - 'scripts/apply_i29.py'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set -e
          python3 scripts/apply_i29.py
          echo "Patch applied"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "feat(#29): unify all dates to Shamsi (Jalali) with relative labels"
          git push
