name: fix-all-remaining

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-all-remaining.yml"
      - "scripts/apply_remaining_fixes.py"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply remaining fixes
        run: python3 scripts/apply_remaining_fixes.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/payments/payments.service.ts backend/src/admin/admin-ops.controller.ts
          if git diff --cached --quiet; then
            echo nochange
            exit 0
          fi
          git commit -m "fix: restore bookings + reportIssue/dates/offline confirm/admin phone/settlementEligible"
          git pull --rebase origin main || git pull --rebase --autostash origin main
          git push origin HEAD:main
