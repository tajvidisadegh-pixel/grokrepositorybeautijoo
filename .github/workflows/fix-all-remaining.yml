name: fix-all-remaining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-all-remaining.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply sed/python fixes
        run: |
          set -euo pipefail
          # bookings: fix typo
          sed -i 's/this\.downstreamprisma/this.prisma/g' backend/src/bookings/bookings.service.ts || true
          python3 -c "
          from pathlib import Path
          p=Path('backend/src/bookings/bookings.service.ts')
          t=p.read_text(encoding='utf-8')
          assert 'PLACEHOLDER' not in t and 'BookingsService' in t
          t=t.replace('take: 20,\n','',1)
          old='if (query.from) (where.startAt as any).gte = new Date(query.from);'
          new='if (query.from) { const from = new Date(query.from); if (isNaN(from.getTime())) throw new BadRequestException(\"invalid from\"); (where.startAt as any).gte = from; }'
          t=t.replace(old,new,1)
          old='if (query.to) (where.startAt as any).lte = new Date(query.to);'
          new='if (query.to) { const to = new Date(query.to); if (isNaN(to.getTime())) throw new BadRequestException(\"invalid to\"); (where.startAt as any).lte = to; }'
          t=t.replace(old,new,1)
          if 'offline auto-confirm' not in t and 'post-create notify failed' in t:
            needle='return booking;'
            idx=t.find('post-create notify failed')
            r=t.find(needle, idx)
            if r>0:
              inj='''\n      try {\n        const payMode = (process.env.BOOKING_PAYMENT_MODE || \"auto\").toString().trim().toLowerCase();\n        const provider = (process.env.PAYMENT_PROVIDER || \"\").toString().trim().toLowerCase();\n        const offline = payMode === \"offline\" || payMode === \"no_gateway\" || payMode === \"pay_later\" || (payMode === \"auto\" && (!provider || provider === \"disabled\" || provider === \"none\"));\n        if (offline) {\n          await this.payments.initiate(customerId, booking.id, \"https://localhost/offline\");\n          const refreshed = await this.prisma.booking.findUnique({ where: { id: booking.id }, include: { items: true, payment: true } });\n          if (refreshed) return refreshed;\n        }\n      } catch (err) {\n        this.logger.warn(\"offline auto-confirm failed: \" + ((err as Error)?.message || err));\n      }\n'''
              t=t[:r]+inj+t[r:]
          p.write_text(t,encoding='utf-8')
          print('bookings',len(t))
          "
          python3 -c "
          from pathlib import Path
          p=Path('backend/src/payments/payments.service.ts')
          t=p.read_text(encoding='utf-8')
          if 'settlementEligible' not in t:
            t=t.replace(\"note: 'Confirmed without online gateway. Not a bank settlement.',\",\"note: 'Confirmed without online gateway. Not a bank settlement.', settlementEligible: false, realMoney: false,\",1)
            p.write_text(t,encoding='utf-8')
            print('payments')
          "
          python3 -c "
          from pathlib import Path
          p=Path('backend/src/admin/admin-ops.controller.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('where: { phone: nextPhone, accountType: existing.accountType, NOT: { id } },','where: { phone: nextPhone, NOT: { id } },',1)
          t=t.replace('await this.prisma.user.update({ where: { id }, data: { phone: dto.phone.trim() } });','await this.prisma.user.update({ where: { id }, data: { phone: nextPhone, phoneVerified: false } }); await this.prisma.refreshToken.updateMany({ where: { userId: id, revokedAt: null }, data: { revokedAt: new Date() } });',1)
          t=t.replace(\"await this.audit(actorId, 'admin.user.profile.update', 'user', id, dto);\",\"await this.audit(actorId, 'admin.user.profile.update', 'user', id, { phoneChanged: !!dto.phone, fieldKeys: Object.keys(dto || {}) });\",1)
          p.write_text(t,encoding='utf-8')
          print('admin')
          "
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/payments/payments.service.ts backend/src/admin/admin-ops.controller.ts
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "fix: reportIssue, dates, offline auto-confirm, admin phone revoke, settlementEligible"
          git push origin HEAD:main
