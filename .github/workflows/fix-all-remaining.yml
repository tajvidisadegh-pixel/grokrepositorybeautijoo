name: fix-all-remaining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-all-remaining.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Always restore bookings then patch everything
        run: |
          set -euo pipefail
          git show 2b44ecd8075297c7fb81736921bbefa8558db5ef:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          assert 'BookingsService' in t and len(t) > 10000
          t = t.replace('this.downstreamprisma', 'this.prisma')
          t = t.replace('take: 20,\n', '', 1)
          t = t.replace(
              'if (query.from) (where.startAt as any).gte = new Date(query.from);',
              'if (query.from) { const from = new Date(query.from); if (isNaN(from.getTime())) throw new BadRequestException("invalid from"); (where.startAt as any).gte = from; }',
              1,
          )
          t = t.replace(
              'if (query.to) (where.startAt as any).lte = new Date(query.to);',
              'if (query.to) { const to = new Date(query.to); if (isNaN(to.getTime())) throw new BadRequestException("invalid to"); (where.startAt as any).lte = to; }',
              1,
          )
          if 'offline auto-confirm' not in t:
              marker = 'post-create notify failed'
              idx = t.find(marker)
              r = t.find('return booking;', idx if idx >= 0 else 0)
              if r > 0:
                  inj = '''
      try {
        const payMode = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();
        const provider = (process.env.PAYMENT_PROVIDER || '').toString().trim().toLowerCase();
        const offline = payMode === 'offline' || payMode === 'no_gateway' || payMode === 'pay_later' || (payMode === 'auto' && (!provider || provider === 'disabled' || provider === 'none'));
        if (offline) {
          await this.payments.initiate(customerId, booking.id, 'https://localhost/offline');
          const refreshed = await this.prisma.booking.findUnique({ where: { id: booking.id }, include: { items: true, payment: true } });
          if (refreshed) return refreshed;
        }
      } catch (err) {
        this.logger.warn('offline auto-confirm failed: ' + ((err as Error)?.message || err));
      }
'''
                  t = t[:r] + inj + t[r:]
          p.write_text(t, encoding='utf-8')
          print('bookings', len(t))

          p = Path('backend/src/payments/payments.service.ts')
          t = p.read_text(encoding='utf-8')
          if 'settlementEligible' not in t:
              t = t.replace(
                  "note: 'Confirmed without online gateway. Not a bank settlement.',",
                  "note: 'Confirmed without online gateway. Not a bank settlement.', settlementEligible: false, realMoney: false,",
                  1,
              )
              p.write_text(t, encoding='utf-8')
              print('payments')

          p = Path('backend/src/admin/admin-ops.controller.ts')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'where: { phone: nextPhone, accountType: existing.accountType, NOT: { id } },',
              'where: { phone: nextPhone, NOT: { id } },',
              1,
          )
          t = t.replace(
              'await this.prisma.user.update({ where: { id }, data: { phone: dto.phone.trim() } });',
              'await this.prisma.user.update({ where: { id }, data: { phone: nextPhone, phoneVerified: false } }); await this.prisma.refreshToken.updateMany({ where: { userId: id, revokedAt: null }, data: { revokedAt: new Date() } });',
              1,
          )
          t = t.replace(
              "await this.audit(actorId, 'admin.user.profile.update', 'user', id, dto);",
              "await this.audit(actorId, 'admin.user.profile.update', 'user', id, { phoneChanged: !!dto.phone, fieldKeys: Object.keys(dto || {}) });",
              1,
          )
          p.write_text(t, encoding='utf-8')
          print('admin')
          print('ALL OK')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/payments/payments.service.ts backend/src/admin/admin-ops.controller.ts
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "fix: restore bookings + reportIssue/dates/offline confirm/admin phone/settlementEligible"
          git push origin HEAD:main
