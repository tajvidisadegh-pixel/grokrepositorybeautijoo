name: restore-services-18-3
on:
  push:
    paths:
      - '.github/workflows/restore-services-18-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write services.service.ts
        run: |
          python3 << 'PY'
          import zlib, base64, pathlib
          b64 = ""
          data = zlib.decompress(base64.b64decode(b64))
          path = pathlib.Path('backend/src/services/services.service.ts')
          path.write_bytes(data)
          print('wrote', path, len(data))
          text = data.decode()
          assert 'PLACEHOLDER' not in text
          assert 'AppCacheService' in text
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/services.service.ts
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "fix(#18.3): restore services.service.ts with AppCache"
          git push
