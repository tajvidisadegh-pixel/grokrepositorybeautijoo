name: Restore panel-api green
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download known-good panel-api
        run: |
          curl -fsSL "https://raw.githubusercontent.com/tajvidimaryam7899-del/grokrepositorybeautijoo/73a90783a47e83c63600a960af8c949cbc20a00d/frontend/src/lib/panel-api.ts" -o frontend/src/lib/panel-api.ts
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/lib/panel-api.ts')
          t = p.read_text()
          assert 'admin-mock-data' not in t
          t2 = re.sub(
              r"if \(file\.size > 50 \* 1024 \* 1024\) \{\n    throw new ApiError\(400, '[^']+'\);\n  \}",
              "if (!file.size) {\n    throw new ApiError(400, 'فایل خالی است.');\n  }",
              t,
              count=1,
          )
          p.write_text(t2)
          print('ok', len(t2))
          PY
      - name: Commit
        run: |
          git config user.name "Beautijoo Bot"
          git config user.email "bot@beautijoo.ir"
          git add frontend/src/lib/panel-api.ts
          git commit -m "fix(frontend): restore panel-api from 73a9078 raw (no mock, no size ceiling)" || exit 0
          git push origin main
