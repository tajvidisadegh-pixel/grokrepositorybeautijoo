name: patch-18-4-jalali
on:
  push:
    paths:
      - '.github/workflows/patch-18-4-jalali.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend Jalali/Tehran usage
        run: |
          python3 << 'END'
          from pathlib import Path

          # --- jalali.ts: strengthen todayIsoTehran + helpers ---
          p = Path('frontend/src/lib/jalali.ts')
          t = p.read_text()
          if 'tehranDateStr' not in t:
              t = t.rstrip() + '''\n\n/** Asia/Tehran calendar date YYYY-MM-DD. */\nexport function tehranDateStr(d: Date = new Date()): string {\n  try {\n    return new Intl.DateTimeFormat('en-CA', {\n      timeZone: 'Asia/Tehran',\n      year: 'numeric',\n      month: '2-digit',\n      day: '2-digit',\n    }).format(d);\n  } catch {\n    return d.toISOString().slice(0, 10);\n  }\n}\n\nexport function tehranTodayIso(): string {\n  return todayIsoTehran();\n}\n\nexport function tehranTimeStr(d: Date = new Date()): string {\n  try {\n    const parts = new Intl.DateTimeFormat('en-GB', {\n      timeZone: 'Asia/Tehran',\n      hour: '2-digit',\n      minute: '2-digit',\n      hour12: false,\n      hourCycle: 'h23',\n    }).formatToParts(d);\n    const h = parts.find((x) => x.type === 'hour')?.value ?? '00';\n    const m = parts.find((x) => x.type === 'minute')?.value ?? '00';\n    return `${h.padStart(2, '0')}:${m.padStart(2, '0')}`;\n  } catch {\n    return '00:00';\n  }\n}\n'''
          old_today = '''export function todayIsoTehran(): string {
  const offsetMs = 3.5 * 60 * 60 * 1000;
  const tehran = new Date(Date.now() + offsetMs);
  return `${tehran.getUTCFullYear()}-${pad2(tehran.getUTCMonth() + 1)}-${pad2(tehran.getUTCDate())}`;
}'''
          new_today = '''export function todayIsoTehran(): string {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tehran',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).format(new Date());
  } catch {
    const offsetMs = 3.5 * 60 * 60 * 1000;
    const tehran = new Date(Date.now() + offsetMs);
    return `${tehran.getUTCFullYear()}-${pad2(tehran.getUTCMonth() + 1)}-${pad2(tehran.getUTCDate())}`;
  }
}'''
          if old_today in t:
              t = t.replace(old_today, new_today, 1)
          p.write_text(t)
          print('jalali ok')

          # --- booking-wizard ---
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          t = p.read_text()
          if "from '@/lib/jalali'" not in t:
              t = t.replace(
                  "import { formatPrice } from '@/lib/utils';",
                  "import { formatPrice } from '@/lib/utils';\nimport { tehranTodayIso, isoToJalaliLabel } from '@/lib/jalali';",
              )
          t = t.replace(
              '''function todayISO(): string {
  return new Date().toISOString().slice(0, 10);
}''',
              '''function todayISO(): string {
  return tehranTodayIso();
}''',
          )
          t = t.replace(
              '<dd dir="ltr">{date}</dd>',
              '<dd>{isoToJalaliLabel(date)} <span className="text-xs text-gray" dir="ltr">({date})</span></dd>',
          )
          p.write_text(t)
          print('wizard ok')

          # --- zibagar bookings ---
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text()
          if "from '@/lib/jalali'" not in t:
              t = t.replace(
                  "import { formatPrice } from '@/lib/utils';",
                  "import { formatPrice, formatDate, formatTime24 } from '@/lib/utils';\nimport { tehranDateStr } from '@/lib/jalali';",
              )
          old_helpers = '''function dateKeyFa(iso: string): string {
  try {
    return new Date(iso).toLocaleDateString('fa-IR', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
    });
  } catch {
    return iso.slice(0, 10);
  }
}

function timeFa(iso: string): string {
  try {
    return new Date(iso).toLocaleTimeString('fa-IR', {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false,
    });
  } catch {
    return '';
  }
}

function dayKey(d: Date): string {
  return d.toISOString().slice(0, 10);
}'''
          new_helpers = '''function dateKeyFa(iso: string): string {
  return formatDate(iso, { style: 'long' });
}

function timeFa(iso: string): string {
  return formatTime24(iso);
}

function dayKey(d: Date): string {
  return tehranDateStr(d);
}'''
          if old_helpers in t:
              t = t.replace(old_helpers, new_helpers, 1)
          old_week = '''  const [weekStart, setWeekStart] = useState(() => {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const toSat = (day + 1) % 7;
    d.setDate(d.getDate() - toSat);
    return d;
  });'''
          new_week = '''  const [weekStart, setWeekStart] = useState(() => {
    const now = new Date();
    let probe = new Date(now);
    for (let i = 0; i < 7; i++) {
      const wd = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Tehran',
        weekday: 'short',
      }).format(probe);
      if (wd === 'Sat') {
        const [y, m, d] = tehranDateStr(probe).split('-').map(Number);
        return new Date(Date.UTC(y, m - 1, d, 9, 0, 0));
      }
      probe = new Date(probe.getTime() - 24 * 3600_000);
    }
    return new Date();
  });'''
          if old_week in t:
              t = t.replace(old_week, new_week, 1)
          p.write_text(t)
          print('zibagar ok')
          print('done')
          END
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/jalali.ts frontend/src/components/booking/booking-wizard.tsx frontend/src/app/zibagar/bookings/page.tsx
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "feat(#18.4): Tehran day keys + jalali booking labels"
          git push
