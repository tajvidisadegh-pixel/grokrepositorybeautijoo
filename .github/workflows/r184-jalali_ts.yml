name: r184-jalali_ts
on:
  push:
    paths:
      - '.github/workflows/r184-jalali_ts.yml'
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          import zlib, base64, pathlib
          b64 = ""
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path("frontend/src/lib/jalali.ts").write_bytes(data)
          assert b"PLACEHOLDER" not in data
          print("ok", len(data))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/jalali.ts
          git commit -m "feat(#18.4): Tehran-aware todayIsoTehran + tehranDateStr" || exit 0
          git push
