name: fix-82-high1-4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-82-high1-4.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply high-priority patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('backend/src/bookings/bookings.service.ts')
          text = p.read_text(encoding='utf-8')
          if 'PLACEHOLDER' in text and 'class BookingsService' not in text:
              raise SystemExit('bookings.service.ts is broken PLACEHOLDER')

          old_report = '''  async reportIssue(id: string, userId: string, message: string) {
    const b = await this.prisma.booking.findUnique({ where: { id } });
    if (!b) throw new NotFoundException();
    if (b.customerId !== userId) throw new ForbiddenException();
    const admins = await this.prisma.user.findMany({
      where: { userRoles: { some: { role: { name: { in: ['admin', 'SUPER_ADMIN'] } } } } },
      select: { id: true },
      take: 20,
    });
    for (const a of admins) {
      await this.notifications.notify({
        userId: a.id,
        type: NotificationType.system,
        title: 'گزارش مشکل رزرو',
        body: message?.slice(0, 500) || 'گزارش بدون متن',
        data: { bookingId: id },
        sms: false,
      });
    }
    return { message: 'گزارش برای سوپرادمین ارسال شد', notified: admins.length };
  }
}'''
          new_report = '''  async reportIssue(id: string, userId: string, message: string) {
    const b = await this.prisma.booking.findUnique({ where: { id } });
    if (!b) throw new NotFoundException();
    // #82.high1 — allow both customer and the professional of this booking
    const pro = await this.prisma.professional.findFirst({ where: { userId } });
    const isCustomer = b.customerId === userId;
    const isPro = !!pro && pro.id === b.professionalId;
    if (!isCustomer && !isPro) throw new ForbiddenException();

    // Rate-limit: at most 3 reports per booking per hour
    const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
    const recent = await this.prisma.auditLog.count({
      where: {
        action: 'booking.report_issue',
        entityType: 'booking',
        entityId: id,
        createdAt: { gt: oneHourAgo },
      },
    });
    if (recent >= 3) {
      throw new BadRequestException('تعداد گزارش‌های این رزرو در یک ساعت بیش از حد مجاز است. لطفاً بعداً تلاش کنید.');
    }

    const admins = await this.prisma.user.findMany({
      where: { userRoles: { some: { role: { name: { in: ['admin', 'SUPER_ADMIN'] } } } } },
      select: { id: true },
      take: 20,
    });
    let notified = 0;
    for (const a of admins) {
      try {
        await this.notifications.notify({
          userId: a.id,
          type: NotificationType.system,
          title: 'گزارش مشکل رزرو',
          body: message?.slice(0, 500) || 'گزارش بدون متن',
          data: {
            bookingId: id,
            reporterId: userId,
            reporterRole: isPro ? 'professional' : 'customer',
          },
          sms: false,
        });
        notified += 1;
      } catch (err) {
        this.logger.warn(
          `reportIssue notify failed admin=${a.id} booking=${id}: ${(err as Error)?.message || err}`,
        );
      }
    }
    try {
      await this.prisma.auditLog.create({
        data: {
          actorId: userId,
          action: 'booking.report_issue',
          entityType: 'booking',
          entityId: id,
          after: {
            message: message?.slice(0, 200),
            reporterRole: isPro ? 'professional' : 'customer',
            notified,
          } as any,
        },
      });
    } catch {
      /* non-blocking */
    }
    return { message: 'گزارش برای سوپرادمین ارسال شد', notified };
  }
}'''
          if old_report in text:
              text = text.replace(old_report, new_report, 1)
              print('reportIssue patched')
          elif 'recent >= 3' in text:
              print('reportIssue already patched')
          else:
              raise SystemExit('reportIssue pattern not found')

          if 'maskedItems' not in text:
              old_ret = '''    return { items, meta: { page, limit, total } };
  }

  async getOne(id: string, userId: string) {'''
              new_ret = '''    // #82.high4 — mask customer phone for professional list views
    const maskedItems = items.map((it) => {
      const phone = it.customer?.phone;
      if (phone && phone.length >= 4) {
        return {
          ...it,
          customer: {
            ...it.customer,
            phone: phone.slice(0, 4) + '***' + phone.slice(-2),
          },
        };
      }
      return it;
    });
    return { items: maskedItems, meta: { page, limit, total } };
  }

  async getOne(id: string, userId: string) {'''
              if old_ret not in text:
                  raise SystemExit('list return pattern not found')
              text = text.replace(old_ret, new_ret, 1)
              print('list phone mask patched')
          else:
              print('list phone mask already present')

          if '#82.high4 — mask the other party' not in text:
              old_go = '''    if (b.customerId !== userId && pro?.id !== b.professionalId) {
      throw new ForbiddenException();
    }
    return b;
  }'''
              new_go = '''    if (b.customerId !== userId && pro?.id !== b.professionalId) {
      throw new ForbiddenException();
    }
    // #82.high4 — mask the other party's phone number
    const isCustomer = b.customerId === userId;
    const mask = (phone?: string | null) => {
      if (!phone || phone.length < 4) return phone;
      return phone.slice(0, 4) + '***' + phone.slice(-2);
    };
    if (isCustomer) {
      if (b.professional?.user) {
        (b.professional.user as any).phone = mask(b.professional.user.phone);
      }
    } else {
      if (b.customer) {
        (b.customer as any).phone = mask(b.customer.phone);
      }
    }
    return b;
  }'''
              if old_go not in text:
                  raise SystemExit('getOne end pattern not found')
              text = text.replace(old_go, new_go, 1)
              print('getOne phone mask patched')
          else:
              print('getOne phone mask already present')

          p.write_text(text, encoding='utf-8')
          assert 'class BookingsService' in text
          print('bookings.service.ts OK, lines', len(text.splitlines()))

          p2 = Path('backend/src/auth/auth.service.ts')
          text2 = p2.read_text(encoding='utf-8')
          if 'PLACEHOLDER' in text2 and 'class AuthService' not in text2:
              raise SystemExit('auth.service.ts is broken')

          if 'BookingStatus' not in text2:
              text2 = text2.replace(
                  "import { AccountType, ProfessionalStatus, UserStatus } from '@prisma/client';",
                  "import { AccountType, BookingStatus, ProfessionalStatus, UserStatus } from '@prisma/client';",
              )
              if 'BookingStatus' not in text2:
                  text2 = text2.replace(
                      "from '@prisma/client';",
                      "from '@prisma/client';\nimport { BookingStatus } from '@prisma/client';",
                      1,
                  )
              print('BookingStatus import added')

          old_del = '''  async deleteAccount(userId: string, dto: DeleteAccountDto) {
    const user = await this.prisma.user.findUnique({ where: { id: userId } });
    if (!user) {
      throw new BadRequestException('کاربر یافت نشد');
    }
    if (user.passwordHash) {
      if (!dto.password) {
        throw new BadRequestException('رمز عبور برای تأیید حذف الزامی است');
      }
      const ok = await argon2.verify(user.passwordHash, dto.password);
      if (!ok) {
        throw new UnauthorizedException('رمز عبور نادرست است');
      }
    }
    await this.prisma.$transaction(async (tx) => {
      await tx.user.update({
        where: { id: userId },
        data: {
          status: UserStatus.deleted,
          phone: `deleted-${userId.slice(0, 8)}`,
          email: null,
          passwordHash: null,
          phoneVerified: false,
        },
      });
      await tx.profile.updateMany({
        where: { userId },
        data: { displayName: 'کاربر حذف‌شده', avatarUrl: null, bio: null },
      });
      await tx.refreshToken.updateMany({
        where: { userId, revokedAt: null },
        data: { revokedAt: new Date() },
      });
      try {
        await tx.auditLog.create({
          data: {
            actorId: userId,
            action: 'user.account_delete',
            entityType: 'user',
            entityId: userId,
            after: { anonymized: true, status: 'deleted' } as any,
          },
        });
      } catch {
        /* non-blocking */
      }
    });
    userAuthCache.invalidate(userId);
    return { message: 'حساب کاربری با موفقیت حذف و داده‌های شخصی ناشناس شد' };
  }'''

          new_del = '''  async deleteAccount(userId: string, dto: DeleteAccountDto) {
    const user = await this.prisma.user.findUnique({ where: { id: userId } });
    if (!user) {
      throw new BadRequestException('کاربر یافت نشد');
    }
    // #82.high3 — require password OR OTP depending on account type
    if (user.passwordHash) {
      if (!dto.password) {
        throw new BadRequestException('رمز عبور برای تأیید حذف الزامی است');
      }
      const ok = await argon2.verify(user.passwordHash, dto.password);
      if (!ok) {
        throw new UnauthorizedException('رمز عبور نادرست است');
      }
    } else {
      if (!dto.code?.trim()) {
        throw new BadRequestException(
          'برای حذف حساب بدون رمز، ابتدا کد تأیید را از /auth/request-otp با purpose=delete_account دریافت و ارسال کنید',
        );
      }
      if (!user.phone) {
        throw new BadRequestException('شماره موبایل برای تأیید حذف موجود نیست');
      }
      const purpose = `delete_account:${user.accountType}`;
      await this.consumeOtp(user.phone, dto.code.trim(), purpose);
    }

    await this.prisma.$transaction(async (tx) => {
      // #82.high2 — cancel active future bookings owned as customer
      const activeCustomerBookings = await tx.booking.findMany({
        where: {
          customerId: userId,
          status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
          startAt: { gte: new Date() },
        },
        select: { id: true },
      });
      if (activeCustomerBookings.length) {
        await tx.booking.updateMany({
          where: { id: { in: activeCustomerBookings.map((b) => b.id) } },
          data: { status: BookingStatus.cancelled },
        });
      }

      let cancelledProCount = 0;
      const pro = await tx.professional.findFirst({ where: { userId } });
      if (pro) {
        // #82.high2 — hide professional profile
        await tx.professional.update({
          where: { id: pro.id },
          data: {
            status: 'suspended',
            title: 'حساب حذف‌شده',
            bio: null,
            logoUrl: null,
            coverImageUrl: null,
            isFeatured: false,
            publishedAt: null,
          },
        });
        const activeProBookings = await tx.booking.findMany({
          where: {
            professionalId: pro.id,
            status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
            startAt: { gte: new Date() },
          },
          select: { id: true },
        });
        cancelledProCount = activeProBookings.length;
        if (activeProBookings.length) {
          await tx.booking.updateMany({
            where: { id: { in: activeProBookings.map((b) => b.id) } },
            data: { status: BookingStatus.cancelled },
          });
        }
      }

      await tx.user.update({
        where: { id: userId },
        data: {
          status: UserStatus.deleted,
          phone: `deleted-${userId.slice(0, 8)}`,
          email: null,
          passwordHash: null,
          phoneVerified: false,
        },
      });
      await tx.profile.updateMany({
        where: { userId },
        data: { displayName: 'کاربر حذف‌شده', avatarUrl: null, bio: null },
      });
      await tx.refreshToken.updateMany({
        where: { userId, revokedAt: null },
        data: { revokedAt: new Date() },
      });
      try {
        await tx.auditLog.create({
          data: {
            actorId: userId,
            action: 'user.account_delete',
            entityType: 'user',
            entityId: userId,
            after: {
              anonymized: true,
              status: 'deleted',
              cancelledCustomerBookings: activeCustomerBookings.length,
              cancelledProBookings: cancelledProCount,
              proHidden: !!pro,
            } as any,
          },
        });
      } catch {
        /* non-blocking */
      }
    });
    userAuthCache.invalidate(userId);
    return { message: 'حساب کاربری با موفقیت حذف و داده‌های شخصی ناشناس شد' };
  }'''

          if old_del in text2:
              text2 = text2.replace(old_del, new_del, 1)
              print('deleteAccount patched')
          elif 'delete_account:' in text2 and 'cancelledProCount' in text2:
              print('deleteAccount already patched')
          else:
              raise SystemExit('deleteAccount pattern not found')

          p2.write_text(text2, encoding='utf-8')
          assert 'class AuthService' in text2
          print('auth.service.ts OK, lines', len(text2.splitlines()))
          print('ALL PATCHES APPLIED')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/auth/auth.service.ts
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "fix(#82.high1-4): reportIssue for pro + rate-limit, OTP delete confirm, cancel bookings & hide pro on delete, mask phones"
            git push origin HEAD:main
          fi
