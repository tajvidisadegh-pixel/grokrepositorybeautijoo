name: Apply issue 31 portfolio full
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-i31-portfolio.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore schema and apply #31 files
        env:
          # Base64 payloads written to files in next step via python from companion gist-like inline
          SKIP: "0"
        run: |
          set -e
          curl -sL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/7989df5c9941a137ca77f5d52aaa9f965486465c/backend/prisma/schema.prisma" -o backend/prisma/schema.prisma
          python3 -c "
from pathlib import Path
p = Path('backend/prisma/schema.prisma')
t = p.read_text()
old = '''  mimeType              String?     @map(\"mime_type\") @db.VarChar(100)
  sizeBytes             Int?        @map(\"size_bytes\")
  sortOrder             Int         @default(0) @map(\"sort_order\")'''
new = '''  mimeType              String?     @map(\"mime_type\") @db.VarChar(100)
  sizeBytes             Int?        @map(\"size_bytes\")
  title                 String?     @db.VarChar(200)
  price                 Int?
  durationMin           Int?        @map(\"duration_min\")
  sortOrder             Int         @default(0) @map(\"sort_order\")'''
assert old in t, 'pattern missing'
p.write_text(t.replace(old, new, 1))
print('schema ok', p.stat().st_size)
"
          # Fetch remaining sources from raw main once scripts land; minimal surgical controller patch
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/media/media.controller.ts')
          t = p.read_text()
          if 'uploadMaxBytesMulter' not in t:
              t = t.replace(
                  "import { uploadMaxBytes } from './upload-security';",
                  "import { uploadMaxBytesMulter } from './upload-security';",
              )
              t = t.replace('limits: { fileSize: uploadMaxBytes(), files: 1 }',
                            'limits: { fileSize: uploadMaxBytesMulter(), files: 1 }')
          if "!mime.startsWith('video/')" not in t:
              t = t.replace(
                  "if (mime && !MULTER_ACCEPT.has(mime) && !mime.startsWith('image/'))",
                  "if (mime && !MULTER_ACCEPT.has(mime) && !mime.startsWith('image/') && !mime.startsWith('video/'))",
              )
          if '@Patch' not in t:
              t = t.replace('  Delete,\n  Param,', '  Delete,\n  Patch,\n  Param,')
              patch_block = '''
  @Patch(':id')
  update(
    @CurrentUser('id') userId: string,
    @Param('id') id: string,
    @Body()
    body: {
      title?: string | null;
      price?: number | null;
      durationMin?: number | null;
      professionalServiceId?: string | null;
      sortOrder?: number;
    },
  ) {
    return this.service.updateMine(userId, id, body || {});
  }
'''
              t = t.replace("  @Post('publish')", patch_block + "\n  @Post('publish')")
          p.write_text(t)
          print('controller patched')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "feat(#31): schema MediaAsset title/price/duration + controller PATCH/video"
            git push
          fi
