name: item17-patch
on:
  push:
    paths:
      - '.github/workflows/item17-hours.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          bp = Path('backend/src/professionals/professionals.service.ts')
          bs = bp.read_text()
          needle = "include: { service: { select: { name: true, slug: true } } },\n      },\n    };"
          if 'Today open/closed on cards' in bs:
              print('backend ok')
          elif needle not in bs:
              raise SystemExit('needle missing')
          else:
              repl = "include: { service: { select: { name: true, slug: true } } },\n      },\n      workingHours: {\n        where: { isActive: true },\n        select: { dayOfWeek: true, startTime: true, endTime: true, isActive: true },\n      },\n    };"
              bs = bs.replace(needle, repl, 1)
              bp.write_text(bs)
              print('backend ok')

          tp = Path('frontend/src/types/public.ts')
          ts = tp.read_text()
          marker = 'distanceApproximate?: boolean;'
          chunk_start = ts.find('export type ProfessionalListItem')
          chunk = ts[chunk_start:chunk_start+1200]
          if 'workingHours?:' in chunk:
              print('types ok')
          else:
              ts = ts.replace(
                  marker,
                  marker + "\n  /** Active hours for open-now badge */\n  workingHours?: Array<{ dayOfWeek: string; startTime: string; endTime: string; isActive?: boolean }>;",
                  1,
              )
              tp.write_text(ts)
              print('types ok')

          pp = Path('frontend/src/app/professionals/[slug]/page.tsx')
          ps = pp.read_text()
          if 'OpenStatusBadge' not in ps:
              ps = ps.replace(
                  "import { ShareProfileButton } from '@/components/professionals/share-profile-button';",
                  "import { ShareProfileButton } from '@/components/professionals/share-profile-button';\nimport { OpenStatusBadge } from '@/components/professionals/open-status-badge';",
                  1,
              )
              if "import { OpenStatusBadge }" not in ps:
                  ps = ps.replace(
                      "import { StickyBookBar } from '@/components/professionals/sticky-book-bar';",
                      "import { StickyBookBar } from '@/components/professionals/sticky-book-bar';\nimport { OpenStatusBadge } from '@/components/professionals/open-status-badge';",
                      1,
                  )
              ps = ps.replace(
                  'ساعات کاری: {hoursLine}',
                  '<OpenStatusBadge hours={pro.workingHours || []} showRange size="md" />'
                  + "{hoursLine ? <span className=\"text-sm text-gray\"> · {hoursLine}</span> : null}",
                  1,
              )
              pp.write_text(ps)
          print('profile', 'OpenStatusBadge' in pp.read_text())
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item17-hours.yml
          git add -A
          git commit -m "feat: workingHours in search + open badge on profile (#40-17)" || echo nothing
          git push
