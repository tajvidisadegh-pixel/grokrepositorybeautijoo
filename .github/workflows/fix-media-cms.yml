name: Fix media CMS admin pro
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ops_null.py'
      - '.github/workflows/fix-media-cms.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_ops_null.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts
          git commit -m "fix(build): remove before:null from auditLog create" || exit 0
          git push origin HEAD:main
