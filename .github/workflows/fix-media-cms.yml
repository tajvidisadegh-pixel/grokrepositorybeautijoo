name: Fix media CMS admin pro
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ops_audit.py'
      - 'scripts/patch_build_fix.py'
      - '.github/workflows/fix-media-cms.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          if [ -f scripts/patch_build_fix.py ]; then python3 scripts/patch_build_fix.py || true; fi
          if [ -f scripts/patch_ops_audit.py ]; then python3 scripts/patch_ops_audit.py || true; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts backend/src/admin/admin-ops.controller.ts
          git commit -m "fix(build): admin-ops auditLog instead of missing this.audit" || exit 0
          git push origin HEAD:main
