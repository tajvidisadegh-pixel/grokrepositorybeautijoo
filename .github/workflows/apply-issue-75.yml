name: Apply issue 75 finance transparency

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-75.yml'
      - 'scripts/patch_issue_75_finance_transparency.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_75_finance_transparency.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/professionals/professionals.service.ts \
            backend/src/admin/admin.controller.ts \
            backend/src/admin/admin.service.ts \
            frontend/src/app/zibagar/earnings/page.tsx \
            frontend/src/app/admin/finance/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#75): settleable earnings, status labels, admin payout mark"
          git push origin HEAD:main
