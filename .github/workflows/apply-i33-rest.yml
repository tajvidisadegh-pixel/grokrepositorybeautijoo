name: apply-i33-rest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-i33-rest.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch professionals.service for salon media
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text()
          t = t.replace(\"import { ProfessionalStatus, Prisma } from '@prisma/client';\", \"import { MediaKind, ProfessionalStatus, Prisma } from '@prisma/client';\", 1)
          if 'MediaKind.salon' not in t:
              old = '''      locations: { include: { location: true } },\n      professionalServices: {\n        where: { isActive: true },\n        include: {\n          service: { include: { category: true } },\n          mediaAssets: { orderBy: { sortOrder: 'asc' as const } },'''
              new = '''      locations: {\n        include: { location: true },\n        where: { isPrimary: true },\n        take: 1,\n      },\n      mediaAssets: {\n        where: { kind: { in: [MediaKind.salon, MediaKind.portfolio] } },\n        orderBy: { sortOrder: 'asc' as const },\n      },\n      professionalServices: {\n        where: { isActive: true },\n        include: {\n          service: { include: { category: true } },\n          mediaAssets: { orderBy: { sortOrder: 'asc' as const } },'''
              assert old in t, 'publicInclude missing'
              t = t.replace(old, new, 1)
          if 'attachMediaPublicUrls' not in t:
              old = '''    const safe = this.sanitizePublicLocations(pro);\n    this.cache.set(cacheKey, safe, 120_000);\n    return safe;\n  }'''
              new = '''    const safe = this.sanitizePublicLocations(pro);\n    const withMedia = this.attachMediaPublicUrls(safe);\n    this.cache.set(cacheKey, withMedia, 120_000);\n    return withMedia;\n  }\n\n  private attachMediaPublicUrls<T extends {\n    mediaAssets?: Array<{ url?: string | null; publicUrl?: string | null }> | null;\n    professionalServices?: Array<{ mediaAssets?: Array<{ url?: string | null; publicUrl?: string | null }> | null }> | null;\n  }>(pro: T): T {\n    if (!pro) return pro;\n    const mapRow = <R extends { url?: string | null; publicUrl?: string | null }>(row: R): R => ({\n      ...row,\n      publicUrl: row.publicUrl ?? row.url ?? null,\n    });\n    const mediaAssets = Array.isArray(pro.mediaAssets) ? pro.mediaAssets.map(mapRow) : pro.mediaAssets;\n    const professionalServices = Array.isArray(pro.professionalServices)\n      ? pro.professionalServices.map((ps) => ({\n          ...ps,\n          mediaAssets: Array.isArray(ps.mediaAssets) ? ps.mediaAssets.map(mapRow) : ps.mediaAssets,\n        }))\n      : pro.professionalServices;\n    return { ...pro, mediaAssets, professionalServices };\n  }'''
              assert old in t, 'findBySlug missing'
              t = t.replace(old, new, 1)
          p.write_text(t)
          assert 'MediaKind.salon' in t and 'attachMediaPublicUrls' in t
          print('professionals ok', len(t))
          "
      - name: Commit backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git diff --cached --quiet || git commit -m "feat(#33): expose salon mediaAssets on public pro API"
          git push
