name: fix-ts-18-3
on:
  push:
    paths:
      - '.github/workflows/fix-ts-18-3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix circular types
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text()
          t2 = t.replace(
              "if (hit) return hit as Awaited<ReturnType<ProfessionalsService['search']>>;",
              "if (hit) return hit as any;",
          )
          t2 = t2.replace(
              "if (hit) return hit as Awaited<ReturnType<ProfessionalsService['findBySlug']>>;",
              "if (hit) return hit as any;",
          )
          if t2 == t:
              raise SystemExit('no replacements made')
          p.write_text(t2)
          print('fixed')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git commit -m "fix(#18.3): avoid circular ReturnType on cache hits"
          git push
