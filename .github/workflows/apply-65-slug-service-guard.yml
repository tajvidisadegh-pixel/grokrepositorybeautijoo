name: apply-65-slug-service-guard
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-65-slug-service-guard.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch professionals.service.ts
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text()

          if "from '../common/public-slug'" not in t:
              t = t.replace(
                  "import { boundingBox, haversineKm, parseGeoQuery } from '../common/geo';",
                  "import { boundingBox, haversineKm, parseGeoQuery } from '../common/geo';\nimport { isValidPublicSlug, toPublicSlug } from '../common/public-slug';",
                  1,
              )
              print('added import')

          if 'const normalizedSlug = toPublicSlug(data.slug)' not in t:
              needle = "const slugTaken = await this.prisma.professional.findUnique({ where: { slug: data.slug } });"
              if needle not in t:
                  raise SystemExit('slugTaken needle missing')
              replacement = (
                  "const normalizedSlug = toPublicSlug(data.slug);\n"
                  "    if (!isValidPublicSlug(normalizedSlug)) {\n"
                  "      throw new BadRequestException('اسلاگ عمومی نامعتبر است. فقط حروف لاتین، عدد و خط فاصله مجاز است و نباید شماره تلفن باشد.');\n"
                  "    }\n"
                  "    const slugTaken = await this.prisma.professional.findUnique({ where: { slug: normalizedSlug } });"
              )
              t = t.replace(needle, replacement, 1)
              t = t.replace('userId, slug: data.slug, title: data.title, bio: data.bio,', 'userId, slug: normalizedSlug, title: data.title, bio: data.bio,', 1)
              print('createForUser patched')

          if 'Normalize legacy phone/invalid slugs' not in t:
              old = (
                  "    const updated = await this.prisma.professional.update({\n"
                  "      where: { id: pro.id },\n"
                  "      data: {\n"
                  "        status: ProfessionalStatus.pending_review,\n"
                  "        publishedAt: null,\n"
                  "      },\n"
                  "    });"
              )
              if old not in t:
                  raise SystemExit('publish block missing')
              new = (
                  "    // Normalize legacy phone/invalid slugs before entering review\n"
                  "    const data: Prisma.ProfessionalUpdateInput = {\n"
                  "      status: ProfessionalStatus.pending_review,\n"
                  "      publishedAt: null,\n"
                  "    };\n"
                  "    if (!isValidPublicSlug(pro.slug)) {\n"
                  "      const base = toPublicSlug(pro.title || pro.slug) || `pro-${pro.id.slice(0, 8)}`;\n"
                  "      let candidate = isValidPublicSlug(base) ? base : `pro-${pro.id.slice(0, 8)}`;\n"
                  "      let n = 0;\n"
                  "      while (await this.prisma.professional.findFirst({ where: { slug: candidate, NOT: { id: pro.id } } })) {\n"
                  "        n += 1;\n"
                  "        candidate = `${base.slice(0, 70)}-${n}`;\n"
                  "      }\n"
                  "      data.slug = candidate;\n"
                  "    }\n"
                  "    const updated = await this.prisma.professional.update({\n"
                  "      where: { id: pro.id },\n"
                  "      data,\n"
                  "    });"
              )
              t = t.replace(old, new, 1)
              print('publish patched')

          p.write_text(t)
          assert "from '../common/public-slug'" in t
          assert 'normalizedSlug' in t
          assert 'Normalize legacy phone/invalid slugs' in t
          print('OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(#65): slug normalize on createForUser and publish"
          git push origin HEAD:main
