name: patch-login-password-messages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/TRIGGER_PATCH_LOGIN'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply login message patch
        run: |
          python3 << 'ENDSCRIPT'
from pathlib import Path
p = Path('backend/src/auth/auth.service.ts')
text = p.read_text()
old = '''  async login(dto: LoginDto) {
    const accountType = this.resolveAccountType(dto.accountType);
    const roleWanted = accountType === AccountType.professional ? 'professional' : 'customer';
    const candidates = await this.prisma.user.findMany({
      where: { phone: dto.phone },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    let user =
      candidates.find((u) => u.accountType === accountType) ||
      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted)) ||
      null;
    if (!user || !user.passwordHash) {
      if (candidates.length > 0) {
        const other = candidates[0].accountType === AccountType.professional ? 'زیباگر' : 'نوبت‌گیر';
        const want = roleWanted === 'professional' ? 'زیباگر' : 'نوبت‌گیر';
        throw new UnauthorizedException(
          'برای این شماره حساب ' + want + ' با رمز پیدا نشد. اگر حساب ' + other + ' دارید نوع ورود را عوض کنید یا ثبت‌نام نقش جدید انجام دهید.',
        );
      }
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }
    if (user.status !== UserStatus.active) {
      throw new UnauthorizedException('حساب کاربری غیرفعال است');
    }
    const ok = await argon2.verify(user.passwordHash, dto.password);
    if (!ok) {
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }'''

new = '''  async login(dto: LoginDto) {
    const accountType = this.resolveAccountType(dto.accountType);
    const roleWanted = accountType === AccountType.professional ? 'professional' : 'customer';
    const wantLabel = roleWanted === 'professional' ? 'زیباگر' : 'نوبت‌گیر';
    const otherLabel = roleWanted === 'professional' ? 'نوبت‌گیر' : 'زیباگر';
    const candidates = await this.prisma.user.findMany({
      where: { phone: dto.phone },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    let user =
      candidates.find((u) => u.accountType === accountType) ||
      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted)) ||
      null;

    // No user row for the requested role at all
    if (!user) {
      if (candidates.length > 0) {
        throw new UnauthorizedException(
          `برای این شماره حساب ${wantLabel} پیدا نشد. اگر حساب ${otherLabel} دارید نوع ورود را عوض کنید یا برای نقش ${wantLabel} ثبت‌نام کنید.`,
        );
      }
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }

    // User exists for this role but never set a password (OTP-only registration)
    if (!user.passwordHash) {
      throw new UnauthorizedException(
        `حساب ${wantLabel} شما رمز ندارد. با «ورود با کد پیامکی» وارد شوید یا از «فراموشی رمز» یک رمز جدید بگذارید.`,
      );
    }

    if (user.status !== UserStatus.active) {
      throw new UnauthorizedException('حساب کاربری غیرفعال است');
    }
    const ok = await argon2.verify(user.passwordHash, dto.password);
    if (!ok) {
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }'''

if old not in text:
    raise SystemExit('OLD_BLOCK_NOT_FOUND')
p.write_text(text.replace(old, new, 1))
print('login_patch_ok')
ENDSCRIPT
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix(auth): clearer password-login errors (no password vs wrong role)"
          git push
