name: fix-createdat

on:
  push:
    paths:
      - '.github/triggers/fix-createdat.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/triggers/fix-createdat.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/professionals/[slug]/page.tsx
          git commit -m "fix(#40): non-null assertion for createdAt format" || echo nochange
          git push
