name: apply-item-32-34-fe

on:
  push:
    paths:
      - '.github/triggers/apply-32-34-fe.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 .github/triggers/fe-patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "frontend/src/app/professionals/[slug]/page.tsx" frontend/src/app/zibagar/hours/page.tsx
          git commit -m "feat(#40): items 32+34 last activity UI + hours draft save" || echo nochange
          git push
