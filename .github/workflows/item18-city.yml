name: fix-notify-46-50

on:
  push:
    paths:
      - '.github/triggers/fix-notify.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/triggers/fix-notify.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/reminders/reminders.service.ts
          git commit -m "fix(#40): use notifications.notify for daily summary" || echo nochange
          git push
