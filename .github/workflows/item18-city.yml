name: fix-41-45-types

on:
  push:
    paths:
      - '.github/triggers/fix-41-45.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: python3 .github/triggers/fix-41-45.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/panel/bookings/page.tsx
          git commit -m "fix(#40): panel bookings report UI structure + types" || echo nochange
          git push
