name: fix-49-btn

on:
  push:
    paths:
      - '.github/triggers/fix-49-btn.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/triggers/fix-49-btn.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/bookings/page.tsx
          git commit -m "feat(#40): block customer button on zibagar bookings (item 49)" || echo nochange
          git push
