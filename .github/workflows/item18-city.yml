name: fix-36-40-types

on:
  push:
    paths:
      - '.github/triggers/fix-36-40.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: python3 .github/triggers/fix-36-40.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/search/page.tsx frontend/src/app/zibagar/hours/page.tsx
          git commit -m "fix(#40): typecheck items 38-40 pageHref + formatDate imports" || echo nochange
          git push
