name: fix-62-gaps2
on:
  push:
    paths:
      - scripts/fix_62_gaps2.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_62_gaps2.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "fix: expired login banner, lead note, report spacing" && git push)
