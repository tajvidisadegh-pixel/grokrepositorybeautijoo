name: Restore admin.service + review moderation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_review_moderation.py'
      - '.github/workflows/restore-admin-service.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore admin.service.ts from last good commit if placeholder
        run: |
          if grep -q 'PLACEHOLDER_WILL_FAIL' backend/src/admin/admin.service.ts 2>/dev/null; then
            echo "Restoring from 244bc18b..."
            git show 244bc18b4a91325275d2314364ba297af096f74d:backend/src/admin/admin.service.ts > backend/src/admin/admin.service.ts
          fi
          python3 scripts/apply_review_moderation.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix(admin): restore admin.service + review moderation methods (#5)"
            git push
          fi
