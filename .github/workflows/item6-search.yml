name: item6-search
on:
  push:
    paths:
      - '.github/workflows/item6-search.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          s = p.read_text()
          if 'minDuration?: number' not in s:
            s = s.replace('maxPrice?: number;\n    sort?: string;', 'maxPrice?: number;\n    minDuration?: number;\n    sort?: string;', 1)
          if 'minDuration: params.minDuration' not in s:
            s = s.replace("gender: params.gender || '',", "gender: params.gender || '',\n            minDuration: params.minDuration ?? null,")
          old = "if (params.category || hasPrice) {"
          if 'hasDuration' not in s and old in s:
            s = s.replace(
              "if (params.category || hasPrice) {",
              "const hasDuration = params.minDuration != null && Number.isFinite(params.minDuration) && params.minDuration > 0;\n    if (params.category || hasPrice || hasDuration) {",
              1,
            )
            s = s.replace(
              "if (hasPrice) {\n        svcSome.price = priceFilter;\n      }\n      where.professionalServices = { some: svcSome };",
              "if (hasPrice) {\n        svcSome.price = priceFilter;\n      }\n      if (hasDuration) {\n        svcSome.durationMin = { gte: params.minDuration };\n      }\n      where.professionalServices = { some: svcSome };",
              1,
            )
          p.write_text(s)
          print('service', 'hasDuration' in s, s.count('minDuration'))

          p = Path('backend/src/service-filters/service-filters.controller.ts')
          s = p.read_text()
          if 'minDuration' not in s:
            s = s.replace("@Query('maxPrice') maxPrice?: string,", "@Query('maxPrice') maxPrice?: string,\n    @Query('minDuration') minDuration?: string,", 1)
            s = s.replace(
              "maxPrice: maxPrice != null && maxPrice !== '' ? parseInt(maxPrice, 10) : undefined,",
              "maxPrice: maxPrice != null && maxPrice !== '' ? parseInt(maxPrice, 10) : undefined,\n      minDuration: minDuration != null && minDuration !== '' ? parseInt(minDuration, 10) : undefined,",
              1,
            )
          p.write_text(s)

          p = Path('backend/src/service-filters/service-filters.service.ts')
          s = p.read_text()
          if 'minDuration?: number' not in s:
            s = s.replace('maxPrice?: number;\n', 'maxPrice?: number;\n    minDuration?: number;\n', 1)
          p.write_text(s)

          p = Path('frontend/src/app/search/page.tsx')
          s = p.read_text()
          if 'tehranTodayIso' not in s:
            s = s.replace("import { FormJalaliDate } from '@/components/ui/jalali-date-input';", "import { FormJalaliDate } from '@/components/ui/jalali-date-input';\nimport { tehranTodayIso } from '@/lib/jalali';", 1)
          if 'availableToday' not in s:
            s = s.replace('availableDate?: string;', 'availableDate?: string; availableToday?: string;', 1)
            s = s.replace('gender?: string;', 'gender?: string; minDuration?: string;', 1)
            s = s.replace(
              '  const availableDate = sp.availableDate?.trim() || undefined;',
              "  const availableToday = sp.availableToday === '1' || sp.availableToday === 'true';\n  const availableDate = availableToday ? tehranTodayIso() : (sp.availableDate?.trim() || undefined);\n  const minDuration = sp.minDuration != null && sp.minDuration !== '' ? parseInt(sp.minDuration, 10) : undefined;",
              1,
            )
            s = s.replace(
              'minRating: Number.isFinite(minRating as number) ? minRating : undefined,',
              'minRating: Number.isFinite(minRating as number) ? minRating : undefined,\n      minDuration: Number.isFinite(minDuration as number) ? minDuration : undefined,',
              1,
            )
            s = s.replace(
              "if (availableDate) params.set('availableDate', availableDate);",
              "if (availableDate) params.set('availableDate', availableDate);\n    if (availableToday) params.set('availableToday', '1');\n    if (minDuration != null && Number.isFinite(minDuration)) params.set('minDuration', String(minDuration));",
              1,
            )
            needle = '''          <div>
            <label className="mb-1 block text-xs font-medium text-gray">تاریخ در دسترس بودن</label>
            <FormJalaliDate name="availableDate" defaultValue={availableDate || ''} className={inputCls} />
          </div>'''
            rep = '''          <div>
            <label className="mb-1 block text-xs font-medium text-gray">تاریخ در دسترس بودن</label>
            <FormJalaliDate name="availableDate" defaultValue={availableToday ? '' : (availableDate || '')} className={inputCls} />
            <label className="mt-2 flex cursor-pointer items-center gap-2 text-xs text-gray">
              <input type="checkbox" name="availableToday" value="1" defaultChecked={availableToday} className="size-4 accent-coral" />
              امروز آزاد است
            </label>
          </div>
          <div>
            <label className="mb-1 block text-xs font-medium text-gray">حداقل مدت خدمت (دقیقه)</label>
            <select name="minDuration" defaultValue={minDuration != null && Number.isFinite(minDuration) ? String(minDuration) : ''} className={inputCls}>
              <option value="">همه</option>
              <option value="30">۳۰+</option>
              <option value="60">۶۰+</option>
              <option value="90">۹۰+</option>
              <option value="120">۱۲۰+</option>
            </select>
          </div>'''
            if needle in s:
              s = s.replace(needle, rep, 1)
          p.write_text(s)
          print('search', 'availableToday' in s, 'minDuration' in s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item6-search.yml .github/workflows/patch-search-filters.yml
          git add -A
          git status
          git commit -m "feat(search): minDuration backend + availableToday UI (#40 item6)" || echo 'nothing'
          git push
