name: Restore issue 7 advanced search
on:
  push:
    paths:
      - '.github/workflows/restore-issue7.yml'
      - 'scripts/search_page.p*.b64'
      - 'scripts/sf_ctrl.p*.b64'
      - 'scripts/sf_svc.p*.b64'
      - 'scripts/pro_svc.p*.b64'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write all #7 files
        run: |
          set -e
          cat scripts/search_page.p*.b64 | tr -d '\n' | base64 -d > frontend/src/app/search/page.tsx
          cat scripts/sf_ctrl.p*.b64 | tr -d '\n' | base64 -d > backend/src/service-filters/service-filters.controller.ts
          cat scripts/sf_svc.p*.b64 | tr -d '\n' | base64 -d > backend/src/service-filters/service-filters.service.ts
          cat scripts/pro_svc.p*.b64 | tr -d '\n' | base64 -d > backend/src/professionals/professionals.service.ts
          grep -q minRating frontend/src/app/search/page.tsx
          grep -q availableDate backend/src/service-filters/service-filters.controller.ts
          grep -q minRating backend/src/service-filters/service-filters.service.ts
          grep -q minRating backend/src/professionals/professionals.service.ts
          grep -q getEarnings backend/src/professionals/professionals.service.ts
          wc -c frontend/src/app/search/page.tsx backend/src/service-filters/service-filters.controller.ts backend/src/service-filters/service-filters.service.ts backend/src/professionals/professionals.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/search/page.tsx backend/src/service-filters/service-filters.controller.ts backend/src/service-filters/service-filters.service.ts backend/src/professionals/professionals.service.ts
          git diff --staged --quiet || git commit -m "feat(#7): advanced search (rating/price/availability/sort) + restore ProfessionalsService"
          git push
