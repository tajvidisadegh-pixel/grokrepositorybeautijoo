name: Restore issue 7 advanced search
on:
  push:
    paths:
      - '.github/workflows/restore-issue7.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore service from known-good commit
        run: |
          set -e
          git show 6e0504b891999deb5b0d025f3e58844c29ea1b0e:backend/src/professionals/professionals.service.ts > backend/src/professionals/professionals.service.ts
          grep -q getEarnings backend/src/professionals/professionals.service.ts
          grep -q requestPayout backend/src/professionals/professionals.service.ts
          wc -c backend/src/professionals/professionals.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git diff --staged --quiet || git commit -m "fix(#7): restore ProfessionalsService from 6e0504b"
          git push
