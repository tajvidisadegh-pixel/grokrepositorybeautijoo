name: Restore issue 7 advanced search
on:
  push:
    paths:
      - '.github/workflows/restore-issue7.yml'
      - 'scripts/pro_full.p*.b64'
      - 'scripts/sf_full.p*.b64'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode professionals.service + service-filters.service
        run: |
          set -e
          cat scripts/pro_full.p*.b64 | tr -d '\n' | base64 -d > backend/src/professionals/professionals.service.ts
          cat scripts/sf_full.p*.b64 | tr -d '\n' | base64 -d > backend/src/service-filters/service-filters.service.ts
          grep -q minRating backend/src/professionals/professionals.service.ts
          grep -q availableDate backend/src/professionals/professionals.service.ts
          grep -q getEarnings backend/src/professionals/professionals.service.ts
          grep -q requestPayout backend/src/professionals/professionals.service.ts
          grep -q minRating backend/src/service-filters/service-filters.service.ts
          wc -c backend/src/professionals/professionals.service.ts backend/src/service-filters/service-filters.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts backend/src/service-filters/service-filters.service.ts
          git diff --staged --quiet || git commit -m "feat(#7): ProfessionalsService advanced search + service-filters pass-through"
          git push
