name: restore-panel-api-18-14
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-panel-api-18-14.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore panel-api and patch markAll
        run: |
          set -euo pipefail
          GOOD=7be43fdb4c710908551bd2bebc8bfe74cf4088c0
          git show "${GOOD}:frontend/src/lib/panel-api.ts" > frontend/src/lib/panel-api.ts
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/lib/panel-api.ts')
          text = p.read_text()
          if 'markAllNotificationsRead' not in text:
              old = """export async function markNotificationRead(id: string) {
            return apiClient.patch(`/notifications/${id}/read`);
          }"""
              new = old + """
          export async function markAllNotificationsRead() {
            return apiClient.patch<{ message: string; updated: number }>('/notifications/read-all');
          }"""
              if old not in text:
                  raise SystemExit('anchor not found')
              p.write_text(text.replace(old, new, 1))
          print('panel-api bytes', p.stat().st_size)
          assert p.stat().st_size > 20000
          PY
      - name: Commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/panel-api.ts
          if git diff --cached --quiet; then
            echo 'no change'
          else
            git commit -m 'fix(18.14): restore full panel-api + markAllNotificationsRead'
            git push
          fi
