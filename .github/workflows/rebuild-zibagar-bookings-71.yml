name: Rebuild zibagar bookings 71

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-zibagar-bookings-71.yml'
      - 'scripts/rebuild_zibagar_bookings_71.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/rebuild_zibagar_bookings_71.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/bookings/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#71): rebuild pro bookings UI — no confirm/reject, paid is final"
          git push origin HEAD:main
