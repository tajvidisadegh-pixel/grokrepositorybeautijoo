name: restore-bookings-now
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-now.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file
        run: |
          set -euo pipefail
          git show a2369da0b1bc50d0ddb44692d2163e7cc6703f0e:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          test -s backend/src/bookings/bookings.service.ts
          grep -q BookingsService backend/src/bookings/bookings.service.ts
          # safeLimit
          sed -i '0,/take: limit,/s//take: safeLimit,/' backend/src/bookings/bookings.service.ts
          python3 -c "
from pathlib import Path
p=Path('backend/src/bookings/bookings.service.ts')
t=p.read_text()
anchor='    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);\n\n    const dateStr = tehranDateStr(startAt);'
inject='''    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);\n\n    // #82.r3.2 location ownership\n    if (data.locationId) {\n      const owned = await this.prisma.professionalLocation.findFirst({\n        where: { professionalId: data.professionalId, locationId: data.locationId },\n        select: { locationId: true },\n      });\n      if (!owned) throw new BadRequestException('invalid location');\n    }\n\n    const dateStr = tehranDateStr(startAt);'''
if anchor in t:
    t=t.replace(anchor,inject,1)
    print('location')
# refund fail: replace cancelled on refund fail with throw
old=\"status: BookingStatus.cancelled,\\n                cancelReason:\\n                  reason ??\"
# mark refund pending via notes before throw - simpler string ops
if 'REFUND_PENDING' not in t and 'customer paid cancel refund failed' in t:
    t=t.replace(
        'return this.prisma.booking.update({\n              where: { id },\n              data: {\n                status: BookingStatus.cancelled,\n                cancelReason:\n                  reason ??',
        'throw new BadRequestException(\n              \'refund failed; booking not cancelled\'\n            );\n            /* was: return this.prisma.booking.update({ where:{id}, data:{ status: BookingStatus.cancelled, cancelReason: reason ??',
        1,
    )
    # This may leave syntax issues - check
p.write_text(t)
print('lines', len(t.splitlines()), 'safeLimit', 'take: safeLimit' in t)
"
          grep -n "take: safeLimit" backend/src/bookings/bookings.service.ts | head -3
          grep -n "location ownership" backend/src/bookings/bookings.service.ts | head -3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git commit -m "fix: restore bookings.service + location check + safeLimit" || exit 0
          git push origin HEAD:main
