name: run-18-4-once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-18-4-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/lib/jalali.ts')
          t = p.read_text()
          old = """export function todayIsoTehran(): string {
  const offsetMs = 3.5 * 60 * 60 * 1000;
  const tehran = new Date(Date.now() + offsetMs);
  return `${tehran.getUTCFullYear()}-${pad2(tehran.getUTCMonth() + 1)}-${pad2(tehran.getUTCDate())}`;
}"""
          new = """export function todayIsoTehran(): string {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tehran',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).format(new Date());
  } catch {
    const offsetMs = 3.5 * 60 * 60 * 1000;
    const tehran = new Date(Date.now() + offsetMs);
    return `${tehran.getUTCFullYear()}-${pad2(tehran.getUTCMonth() + 1)}-${pad2(tehran.getUTCDate())}`;
  }
}"""
          if old in t:
              t = t.replace(old, new, 1)
              print('todayIsoTehran updated')
          if 'export function tehranDateStr' not in t:
              t += """

export function tehranDateStr(d: Date = new Date()): string {
  try {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tehran',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
    }).format(d);
  } catch {
    return d.toISOString().slice(0, 10);
  }
}

export function tehranTodayIso(): string {
  return todayIsoTehran();
}
"""
              print('helpers appended')
          p.write_text(t)

          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          t = p.read_text()
          if "from '@/lib/jalali'" not in t:
              t = t.replace(
                  "import { formatPrice } from '@/lib/utils';",
                  "import { formatPrice } from '@/lib/utils';\nimport { tehranTodayIso, isoToJalaliLabel } from '@/lib/jalali';",
              )
          t = t.replace(
              "return new Date().toISOString().slice(0, 10);",
              "return tehranTodayIso();",
          )
          t = t.replace(
              '<dd dir="ltr">{date}</dd>',
              '<dd>{isoToJalaliLabel(date)} <span className="text-xs text-gray" dir="ltr">({date})</span></dd>',
          )
          p.write_text(t)
          print('wizard')

          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text()
          if "tehranDateStr" not in t:
              t = t.replace(
                  "import { formatPrice } from '@/lib/utils';",
                  "import { formatPrice, formatDate, formatTime24 } from '@/lib/utils';\nimport { tehranDateStr } from '@/lib/jalali';",
              )
          t = t.replace(
              "return d.toISOString().slice(0, 10);",
              "return tehranDateStr(d);",
          )
          # dateKeyFa / timeFa if still local
          if 'toLocaleDateString' in t and 'function dateKeyFa' in t:
              import re
              t = re.sub(
                  r"function dateKeyFa\(iso: string\): string \{[\s\S]*?\n\}\n\nfunction timeFa\(iso: string\): string \{[\s\S]*?\n\}\n\nfunction dayKey",
                  "function dateKeyFa(iso: string): string {\n  return formatDate(iso, { style: 'long' });\n}\n\nfunction timeFa(iso: string): string {\n  return formatTime24(iso);\n}\n\nfunction dayKey",
                  t,
                  count=1,
              )
          p.write_text(t)
          print('zibagar')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "feat(#18.4): Tehran today + dayKey + jalali booking summary"
          git push
