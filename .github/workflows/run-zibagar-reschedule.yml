name: Zibagar reschedule UI
on:
  push:
    paths:
      - '.github/workflows/run-zibagar-reschedule.yml'
      - 'scripts/patch-zibagar-reschedule.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-zibagar-reschedule.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-zibagar-reschedule.yml
          git add frontend/src/app/zibagar/bookings/page.tsx
          git add -A
          git diff --cached --quiet || git commit -m "feat(zibagar): reschedule booking UI for professionals (#40)"
          git push
