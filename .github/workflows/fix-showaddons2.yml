name: Fix showAddOns state
on:
  push:
    paths: ['.github/workflows/fix-showaddons2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          needle = "  const [paymentInfo, setPaymentInfo] = useState<string | null>(null);\n"
          add = needle + "  const [showAddOns, setShowAddOns] = useState(false);\n"
          if "const [showAddOns, setShowAddOns]" not in s:
              if needle not in s:
                  raise SystemExit('paymentInfo line missing')
              s = s.replace(needle, add, 1)
              p.write_text(s)
              print('added state')
          else:
              print('state already present')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-showaddons2.yml
          git add -A
          git diff --cached --quiet || git commit -m "fix: declare showAddOns useState in booking-wizard"
          git push
