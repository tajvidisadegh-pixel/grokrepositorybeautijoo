name: patch-65-11-photo-limit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-11-photo-limit.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce limit + hide upgrade until attempt
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # ---- media.service.ts: platform settings + unlock flag ----
          ms = Path('backend/src/media/media.service.ts')
          t = ms.read_text()

          if 'PORTFOLIO_LIMIT_REACHED' not in t:
              # ensure mergePlatformSettings import
              if 'mergePlatformSettings' not in t:
                  t = t.replace(
                      "from './upload-security';",
                      "from './upload-security';\nimport {\n  PLATFORM_SETTINGS_KEY,\n  mergePlatformSettings,\n} from '../admin/platform-settings.defaults';",
                  )

              old = '''      if (kind === MediaKind.portfolio) {
        const count = await this.prisma.mediaAsset.count({
          where: { professionalId: pro.id, kind: MediaKind.portfolio },
        });
        if (count >= uploadMaxPortfolio()) {
          throw new BadRequestException(
            `تعداد تصاویر نمونه کار به سقف مجاز (${uploadMaxPortfolio()}) رسیده است`,
          );
        }
      }'''

              new = '''      // #65.11 — free photo quota (portfolio/service/salon); unlock only via flag
      if (
        kind === MediaKind.portfolio ||
        kind === MediaKind.service ||
        kind === MediaKind.salon
      ) {
        const settingsRow = await this.prisma.platformSetting.findUnique({
          where: { key: PLATFORM_SETTINGS_KEY },
        });
        const settings = mergePlatformSettings(settingsRow?.value);
        const freeLimit =
          Number(settings.professionals?.portfolioFreeLimit) > 0
            ? Number(settings.professionals.portfolioFreeLimit)
            : uploadMaxPortfolio();
        const unlockToman =
          Number(settings.professionals?.portfolioUnlockToman) >= 0
            ? Number(settings.professionals.portfolioUnlockToman)
            : 3_000_000;
        const links = (pro.socialLinks as Record<string, unknown> | null) || {};
        const unlocked = Boolean(links.portfolioUnlocked);
        const count = await this.prisma.mediaAsset.count({
          where: {
            professionalId: pro.id,
            kind: {
              in: [MediaKind.portfolio, MediaKind.service, MediaKind.salon],
            },
          },
        });
        if (count >= freeLimit && !unlocked) {
          throw new BadRequestException({
            statusCode: 400,
            code: 'PORTFOLIO_LIMIT_REACHED',
            message: 'سقف تعداد عکس پر شده است.',
            limit: freeLimit,
            unlockToman,
          });
        }
      }'''

              if old not in t:
                  raise SystemExit('media limit block not found')
              t = t.replace(old, new, 1)
              ms.write_text(t)
              print('media.service patched')
          else:
              print('media.service already has PORTFOLIO_LIMIT_REACHED')

          # ---- zibagar portfolio page: hide upgrade until upload attempt ----
          zp = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          z = zp.read_text()

          # remove static atLimit banner
          z = re.sub(
              r"\s*\{atLimit && \([\s\S]*?\)\}\s*\n",
              "\n",
              z,
              count=1,
          )

          # do not disable upload button
          z = z.replace(
              '<Button size="sm" loading={busy} disabled={atLimit} onClick={() => inputRef.current?.click()}>',
              '<Button size="sm" loading={busy} onClick={() => inputRef.current?.click()}>',
          )

          # add limitModal state if missing
          if 'limitModal' not in z:
              z = z.replace(
                  '  const [uploadProgress, setUploadProgress] = useState<number | null>(null);',
                  "  const [uploadProgress, setUploadProgress] = useState<number | null>(null);\n  const [limitModal, setLimitModal] = useState<{ limit: number; unlockToman: number } | null>(null);",
              )

          # rewrite onUpload limit pre-check to open modal only (no permanent banner)
          # find and replace early limit message block inside onUpload
          old_pre = """        'سقف رایگان نمونه‌کار پر است. برای آپلود بیشتر از ۱۰۰ مورد می‌توانید نسخه ویژه را تهیه کنید.',"""
          # better: rewrite whole onUpload start - use regex
          if 'setLimitModal' not in z.split('async function onUpload')[1][:800]:
              # inject after function start - replace simple precheck if present
              z2 = z
              # Remove client pre-block that sets msg about limit
              z2 = re.sub(
                  r"if \(items\.length >= MAX_PORTFOLIO\) \{[\s\S]*?return;\s*\}",
                  """if (items.length >= MAX_PORTFOLIO) {
      // #65.11 — reveal upgrade ONLY when user tries to upload beyond free quota
      setLimitModal({ limit: MAX_PORTFOLIO, unlockToman: 3_000_000 });
      return;
    }""",
                  z2,
                  count=1,
              )
              z = z2

          # on API error, also open modal if code present
          if "code === 'PORTFOLIO_LIMIT_REACHED'" not in z:
              z = z.replace(
                  '      setMsg(friendlyApiError(e));',
                  """      const body = (e as { body?: { code?: string; limit?: number; unlockToman?: number; message?: string } })?.body
        || (e as { data?: { code?: string; limit?: number; unlockToman?: number } })?.data;
      if (body?.code === 'PORTFOLIO_LIMIT_REACHED' || /سقف/.test(String((e as Error)?.message || ''))) {
        setLimitModal({
          limit: Number(body?.limit) || MAX_PORTFOLIO,
          unlockToman: Number(body?.unlockToman) || 3_000_000,
        });
      } else {
        setMsg(friendlyApiError(e));
      }""",
                  1,  # only first in onUpload ideally - may hit other catches; ok
              )

          # append modal UI before closing outer div of page
          if 'limitModal &&' not in z:
              # insert before final closing of main return - after last msg/list is hard; append before last `</div>` of return
              # Find Sticky or end of component return
              idx = z.rfind('  );\n}')
              if idx < 0:
                  idx = z.rfind('}\n')
              modal = '''
      {limitModal && (
        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40 p-4 sm:items-center" role="dialog">
          <div className="w-full max-w-md rounded-2xl bg-white p-5 shadow-xl">
            <h2 className="text-lg font-bold">سقف تعداد عکس</h2>
            <p className="mt-2 text-sm leading-7 text-gray">
              امکان آپلود تا{' '}
              {limitModal.limit.toLocaleString('fa-IR')} عکس برای هر زیباگر فعال است.
              برای فضای بیشتر می‌توانید ارتقا را فعال کنید.
            </p>
            <p className="mt-2 text-sm font-medium text-foreground">
              هزینه ارتقا:{' '}
              {limitModal.unlockToman.toLocaleString('fa-IR')} تومان
            </p>
            <div className="mt-4 flex flex-wrap gap-2">
              <a
                href="/zibagar/support"
                className="inline-flex h-10 items-center rounded-xl bg-coral px-4 text-sm font-medium text-white"
              >
                درخواست ارتقا
              </a>
              <button
                type="button"
                className="inline-flex h-10 items-center rounded-xl border border-border px-4 text-sm"
                onClick={() => setLimitModal(null)}
              >
                بستن
              </button>
            </div>
          </div>
        </div>
      )}
'''
              # insert before last `    </div>` of return in export default
              # safer: before `    </div>\n  );` at end of page
              if re.search(r'    </div>\n  \);\n\}', z):
                  z = re.sub(r'(    </div>\n  \);\n\})', modal + r'\1', z, count=1)
                  print('modal injected')
              else:
                  z = z + '\n// modal inject failed\n'
                  print('WARN modal inject')

          zp.write_text(z)
          print('portfolio page size', zp.stat().st_size)

          # ---- admin settings: expose portfolio limit + price ----
          ap = Path('frontend/src/app/admin/settings/page.tsx')
          a = ap.read_text()
          a = a.replace(
              'professionals: { requireManualReview: boolean; minServicesToPublish: number };',
              'professionals: { requireManualReview: boolean; minServicesToPublish: number; portfolioFreeLimit?: number; portfolioUnlockToman?: number };',
          )
          if 'portfolioFreeLimit' not in a or "portfolioFreeLimit:" not in a.split('LABELS')[-1] if 'LABELS' in a else True:
              a = a.replace(
                  "    minServicesToPublish: 'حداقل خدمت برای انتشار',",
                  "    minServicesToPublish: 'حداقل خدمت برای انتشار',\n    portfolioFreeLimit: 'سقف رایگان تعداد عکس',\n    portfolioUnlockToman: 'هزینه ارتقای سقف عکس (تومان)',",
              )
          ap.write_text(a)
          print('admin settings labels updated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/media/media.service.ts \
            frontend/src/app/zibagar/portfolio/page.tsx \
            frontend/src/app/admin/settings/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.11): photo limit silent until 101st upload; admin price"
          git push
