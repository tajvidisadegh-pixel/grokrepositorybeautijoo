name: restore-pro-simple
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/TRIGGER_PRO_SIMPLE'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore file from known-good commit via raw URL
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/dee62d5b11f68a877b424861b50e56eb381d3be4/frontend/src/app/admin/professionals/page.tsx" \
            -o frontend/src/app/admin/professionals/page.tsx
          BYTES=$(wc -c < frontend/src/app/admin/professionals/page.tsx)
          echo "bytes=$BYTES"
          test "$BYTES" -gt 5000
          grep -q "AdminProfessionalsPage" frontend/src/app/admin/professionals/page.tsx
      - name: Insert checkbox column (best effort)
        continue-on-error: true
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/admin/professionals/page.tsx')
          t = p.read_text()
          if 'selected.has(p.id)' in t:
              print('already has checkbox')
              raise SystemExit(0)
          # find first tbody row Link cell
          key = 'items.map((p) => ('
          i = t.find(key)
          if i < 0:
              print('map missing')
              raise SystemExit(0)
          j = t.find('<td className="px-3 py-2">', i)
          if j < 0:
              print('td missing')
              raise SystemExit(0)
          checkbox_td = '''<td className="px-3 py-2">
                    <input type="checkbox" aria-label="select" checked={selected.has(p.id)} onChange={() => toggleSelect(p.id)} />
                  </td>
                  '''
          t = t[:j] + checkbox_td + t[j:]
          p.write_text(t)
          print('checkbox inserted at', j)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/professionals/page.tsx
          git status
          git commit -m "fix(#83): restore admin professionals page + row checkbox" || exit 0
          git push
