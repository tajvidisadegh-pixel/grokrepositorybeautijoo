name: patch-65-1-theme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-1-theme.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings to ThemeAppearance
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/panel/settings/page.tsx')
          t = p.read_text()
          t2 = t.replace(
              "import { ThemeToggle } from '@/components/theme/theme-toggle';",
              "import { ThemeAppearance } from '@/components/theme/theme-toggle';",
          )
          t2 = t2.replace('<ThemeToggle />', '<ThemeAppearance />')
          # Fix nested div: close title block before theme card
          broken = '''        <p className="mt-1 text-sm text-gray">مدیریت حساب، نشست‌ها و اعلان‌ها</p>
      <div className="flex items-center justify-between rounded-2xl border border-border bg-white px-4 py-3">
        <div>
          <p className="text-sm font-medium">حالت نمایش</p>
          <p className="text-xs text-gray">روشن / تاریک</p>
        </div>
        <ThemeAppearance />
      </div>
      </div>'''
          fixed = '''        <p className="mt-1 text-sm text-gray">مدیریت حساب، نشست‌ها و اعلان‌ها</p>
      </div>

      <Card className="space-y-3">
        <div>
          <h2 className="text-lg font-semibold">حالت نمایش</h2>
          <p className="mt-0.5 text-xs text-gray">روشن یا تاریک — فقط از تنظیمات (نه از بالای سایت)</p>
        </div>
        <ThemeAppearance />
      </Card>'''
          if broken in t2:
              t2 = t2.replace(broken, fixed, 1)
              print('structure fixed')
          elif 'ThemeAppearance' in t2 and 'حالت نمایش' in t2:
              print('ok enough')
          else:
              print('unexpected layout')
              # still write import swap
          if t2 != t:
              p.write_text(t2)
              print('wrote', p.stat().st_size)
          else:
              print('no change')

          # admin
          ap = Path('frontend/src/app/admin/settings/page.tsx')
          at = ap.read_text()
          if 'ThemeAppearance' not in at:
              at = at.replace(
                  "import { Button } from '@/components/ui/button';",
                  "import { Button } from '@/components/ui/button';\nimport { ThemeAppearance } from '@/components/theme/theme-toggle';",
                  1,
              )
              marker = '      <div className="rounded-3xl border border-border bg-white p-4 space-y-2">'
              block = '''      <Card className="space-y-3 p-4">
        <div>
          <h2 className="text-base font-semibold">حالت نمایش</h2>
          <p className="mt-0.5 text-xs text-gray">روشن یا تاریک برای همین دستگاه</p>
        </div>
        <ThemeAppearance />
      </Card>

'''
              if marker in at:
                  at = at.replace(marker, block + marker, 1)
                  ap.write_text(at)
                  print('admin ok')
          else:
              print('admin skip')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.1): ThemeAppearance in panel/admin settings"
          git push
