name: patch-65-remaining

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch65.py'
      - '.github/workflows/patch-65-remaining.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/patch65.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(#65.16 #65.9): multi-open services and search icon left" || exit 0
          git push origin HEAD:main
