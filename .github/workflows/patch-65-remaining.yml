name: patch-65-remaining

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-65-remaining.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          set -eux
          python3 << 'PY'
from pathlib import Path

# services multi-open
p = Path('frontend/src/app/zibagar/services/page.tsx')
text = p.read_text(encoding='utf-8')
if 'openFamilies' not in text:
  text = text.replace(
    '  const [openFamily, setOpenFamily] = useState<string | null>(null);',
    '  const [openFamilies, setOpenFamilies] = useState<Set<string>>(new Set());',
    1,
  )
  text = text.replace('setOpenFamily(null)', 'setOpenFamilies(new Set())')
  text = text.replace('const open = openFamily === fam.name;', 'const open = openFamilies.has(fam.name);', 1)
  old = "onClick={() => setOpenFamily(open ? null : fam.name)}"
  new = """onClick={() => {
                        setOpenFamilies((prev) => {
                          const next = new Set(prev);
                          if (next.has(fam.name)) next.delete(fam.name);
                          else next.add(fam.name);
                          return next;
                        });
                      }}"""
  text = text.replace(old, new, 1)
  p.write_text(text, encoding='utf-8')
  print('services multi-open OK')
else:
  print('services already multi-open')

# homepage search icon left + small
p = Path('frontend/src/app/page.tsx')
text = p.read_text(encoding='utf-8')
old_icon = '<Search className="pointer-events-none absolute right-3 top-1/2 size-5 -translate-y-1/2 text-gray-muted" />'
new_icon = '<Search className="pointer-events-none absolute left-3 top-1/2 size-3.5 -translate-y-1/2 text-gray-muted" aria-hidden />'
if old_icon in text:
  text = text.replace(old_icon, new_icon)
  text = text.replace(
    'className="h-12 w-full rounded-2xl border border-border bg-white pr-11 pl-4 text-sm shadow-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"',
    'className="h-12 w-full rounded-2xl border border-border bg-white pl-10 pr-4 text-sm shadow-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"',
  )
  p.write_text(text, encoding='utf-8')
  print('search icon OK')
else:
  print('search icon skip', text.count('size-3.5'))

# locations privacy copy
p = Path('frontend/src/app/zibagar/locations/page.tsx')
text = p.read_text(encoding='utf-8')
old = """        <p className="mt-1 text-sm text-gray">
          هر زیباگر فقط یک مکان پایه دارد. نقشه و مسیریابی مشتری با «نشان» انجام می‌شود.
          می‌توانید آدرس دقیق یا محدوده تقریبی را برای حفظ حریم خصوصی انتخاب کنید.
        </p>"""
new = """        <p className="mt-1 text-sm text-gray">
          هر زیباگر فقط یک مکان پایه دارد. آدرس دقیق را ثبت کنید (برای رزرو و مسیریابی بعد از پرداخت).
          نمایش عمومی آدرس دقیق فقط در صورت انتخاب «آدرس دقیق» انجام می‌شود؛ در غیر این صورت فقط شهر/محله به عموم نشان داده می‌شود و آدرس کامل پس از رزرو برای مشتری نمایش داده خواهد شد.
        </p>"""
if old in text:
  text = text.replace(old, new, 1)
  p.write_text(text, encoding='utf-8')
  print('locations OK')
else:
  print('locations skip')

print('done')
PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(#65.16 #65.9 #65.14): multi-open services, search icon left, address privacy copy" || exit 0
          git push origin HEAD:main
