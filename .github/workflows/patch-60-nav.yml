name: patch-60-nav
on:
  push:
    paths:
      - scripts/patch_60_nav.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_60_nav.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "feat: nav links for catalog template and zibagar menu #60" && git push)
