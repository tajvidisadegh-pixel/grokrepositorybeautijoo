name: Fix zibagar bookings 71 UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-zibagar-bookings-71.yml'
      - 'scripts/fix_zibagar_bookings_71_ui.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_zibagar_bookings_71_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/bookings/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#71): valid pro bookings actions without confirm/reject"
          git push origin HEAD:main
