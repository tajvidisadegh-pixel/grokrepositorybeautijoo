name: Patch admin pricing UI 80

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-admin-pricing-ui-80.yml'
      - 'scripts/patch_admin_pricing_ui_80.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_admin_pricing_ui_80.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/service-categories/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.2): wire ServicePricingPanel into admin categories page"
          git push origin HEAD:main
