name: restore-82-5-9-robust
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-82-5-9-robust.yml'
      - 'scripts/patch_82_*.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base + apply patches
        run: |
          set -euo pipefail
          GOOD=dc12132f12064c6b6840dea9cf32ed59540bfdb4
          git show $GOOD:backend/src/payments/payments.service.ts > backend/src/payments/payments.service.ts
          git show $GOOD:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          python3 scripts/patch_82_pay.py
          python3 scripts/patch_82_book1.py
          python3 scripts/patch_82_book2.py
          mkdir -p docs
          cat > docs/SECURITY_ISSUE_82_9.md << 'DOC'
          # Issue #82.9 — Repository exposure & secret hygiene
          Owner: make repo private, run gitleaks/trufflehog, rotate secrets.
          App: never commit .env or payment/SMS keys.
          DOC
          grep -q '#82.5' backend/src/payments/payments.service.ts
          grep -q '#82.6' backend/src/bookings/bookings.service.ts
          grep -q '#82.7' backend/src/bookings/bookings.service.ts
          grep -q '#82.8' backend/src/bookings/bookings.service.ts
          echo SANITY_OK
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts docs/SECURITY_ISSUE_82_9.md
          if git diff --cached --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.5-9): callback guards, reschedule locks, paid cancel refund, safe notify, security doc"
          git push
