name: patch-65-14-address-privacy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-14-address-privacy.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Address required + public opt-in
        run: |
          python3 << 'PY'
          from pathlib import Path

          # ---- locations.service.ts ----
          ls = Path('backend/src/locations/locations.service.ts')
          t = ls.read_text()

          old_norm = '''  private normalizeCoords(data: LocationInput) {
    const precision =
      data.precision ||
      (data.latitude != null && data.longitude != null ? 'exact' : 'approximate');
    let latitude = data.latitude != null ? Number(data.latitude) : null;
    let longitude = data.longitude != null ? Number(data.longitude) : null;
    if (latitude != null && (latitude < -90 || latitude > 90)) {
      throw new BadRequestException('عرض جغرافیایی نامعتبر است');
    }
    if (longitude != null && (longitude < -180 || longitude > 180)) {
      throw new BadRequestException('طول جغرافیایی نامعتبر است');
    }
    if (precision === 'approximate') {
      if (latitude != null) latitude = Math.round(latitude * 100) / 100;
      if (longitude != null) longitude = Math.round(longitude * 100) / 100;
    }
    return { precision, latitude, longitude };
  }

  private buildAddress(data: LocationInput, precision: string) {
    const base = (data.address?.trim() || '').trim();
    if (precision === 'approximate' && !base) {
      return `محدوده ${data.city}${data.province ? `، ${data.province}` : ''}`;
    }
    if (precision === 'approximate' && base && !base.includes('محدوده')) {
      return `${base} (محدوده تقریبی)`;
    }
    return base || `${data.province || ''} ${data.city}`.trim();
  }'''

          new_norm = '''  private normalizeCoords(data: LocationInput) {
    // #65.14 — precision=exact only means "show exact to public"; default approximate
    const precision = data.precision === 'exact' ? 'exact' : 'approximate';
    let latitude = data.latitude != null ? Number(data.latitude) : null;
    let longitude = data.longitude != null ? Number(data.longitude) : null;
    if (latitude != null && (latitude < -90 || latitude > 90)) {
      throw new BadRequestException('عرض جغرافیایی نامعتبر است');
    }
    if (longitude != null && (longitude < -180 || longitude > 180)) {
      throw new BadRequestException('طول جغرافیایی نامعتبر است');
    }
    // Always store full coordinates for post-booking; public API sanitizes
    return { precision, latitude, longitude };
  }

  private buildAddress(data: LocationInput, _precision: string) {
    // #65.14 — exact street address always required for the platform
    const base = (data.address?.trim() || '').trim();
    if (!base || base.length < 5) {
      throw new BadRequestException('آدرس دقیق الزامی است (حداقل ۵ کاراکتر)');
    }
    return base.slice(0, 500);
  }'''

          if old_norm not in t:
              if 'آدرس دقیق الزامی است' in t:
                  print('locations.service already patched')
              else:
                  raise SystemExit('normalize/buildAddress block not found')
          else:
              t = t.replace(old_norm, new_norm, 1)
              ls.write_text(t)
              print('locations.service patched')

          # ---- complete/page.tsx ----
          cp = Path('frontend/src/app/zibagar/profile/complete/page.tsx')
          c = cp.read_text()

          if 'showPublicExact' not in c:
              c = c.replace(
                  "  const [locAddress, setLocAddress] = useState('');",
                  "  const [locAddress, setLocAddress] = useState('');\n  const [showPublicExact, setShowPublicExact] = useState(false);",
              )

          old_save = '''      if (!locProvince.trim() || !locCity.trim()) {
        setError('استان و شهر الزامی است');
        return false;
      }
      await addMyLocation({
        name: locName.trim() || undefined,
        address: locAddress.trim() || undefined,
        city: locCity.trim(),
        province: locProvince.trim(),
        latitude: locLat ?? undefined,
        longitude: locLng ?? undefined,
        isPrimary: true,
      });'''

          new_save = '''      if (!locProvince.trim() || !locCity.trim()) {
        setError('استان و شهر الزامی است');
        return false;
      }
      if (!locAddress.trim() || locAddress.trim().length < 5) {
        setError('آدرس دقیق الزامی است');
        return false;
      }
      await addMyLocation({
        name: locName.trim() || undefined,
        address: locAddress.trim(),
        city: locCity.trim(),
        province: locProvince.trim(),
        latitude: locLat ?? undefined,
        longitude: locLng ?? undefined,
        isPrimary: true,
        precision: showPublicExact ? 'exact' : 'approximate',
      });'''

          if old_save in c:
              c = c.replace(old_save, new_save, 1)
              print('complete saveLocation patched')
          else:
              print('WARN complete saveLocation pattern miss')

          # UI: require address + checkbox
          old_ui = '''          <label className="block space-y-1 text-sm">آدرس
            <Input value={locAddress} onChange={(e) => setLocAddress(e.target.value)} placeholder="آدرس کامل" />'''

          # might be multiline JSX differently
          if 'آدرس دقیق *' not in c:
              import re
              c2 = re.sub(
                  r'<label className="block space-y-1 text-sm">آدرس\s*\n\s*<Input value=\{locAddress\}[^/]*/>',
                  '''<label className="block space-y-1 text-sm">آدرس دقیق *
            <Input value={locAddress} onChange={(e) => setLocAddress(e.target.value)} placeholder="خیابان، پلاک، واحد…" />
            <span className="block text-xs text-gray">این آدرس برای پلتفرم ذخیره می‌شود و فقط بعد از رزرو به مشتری نشان داده می‌شود مگر اینکه نمایش عمومی را فعال کنید.</span>
          </label>
          <label className="flex items-start gap-2 text-sm">
            <input
              type="checkbox"
              className="mt-1"
              checked={showPublicExact}
              onChange={(e) => setShowPublicExact(e.target.checked)}
            />
            <span>نمایش آدرس دقیق برای عموم (بدون رزرو)</span>''',
                  c,
                  count=1,
              )
              if c2 == c:
                  # try simpler replace
                  if 'placeholder="آدرس کامل"' in c:
                      c = c.replace(
                          'placeholder="آدرس کامل"',
                          'placeholder="خیابان، پلاک، واحد…"',
                      )
                      # inject checkbox after address input block - find unique nearby
                      needle = 'placeholder="خیابان، پلاک، واحد…"'
                      idx = c.find(needle)
                      if idx > 0:
                          # find closing of label after this
                          end = c.find('</label>', idx)
                          if end > 0:
                              inject = '''</label>
          <p className="text-xs text-gray">آدرس دقیق برای ما الزامی است؛ برای مشتری فقط بعد از رزرو نمایش داده می‌شود مگر تیک زیر را بزنید.</p>
          <label className="flex items-start gap-2 text-sm">
            <input type="checkbox" className="mt-1" checked={showPublicExact} onChange={(e) => setShowPublicExact(e.target.checked)} />
            <span>نمایش آدرس دقیق برای عموم</span>
          '''
                              # avoid double close - insert before </label>
                              c = c[:end] + inject + c[end:]
                              print('complete UI checkbox injected')
                  else:
                      print('WARN could not patch complete UI')
              else:
                  c = c2
                  print('complete UI regex patched')

          # tip text
          c = c.replace(
              '<p className="text-xs text-gray">استان و شهر الزامی است.</p>',
              '<p className="text-xs text-gray">استان، شهر و آدرس دقیق الزامی است. آدرس دقیق فقط بعد از رزرو به مشتری نشان داده می‌شود مگر نمایش عمومی را فعال کنید.</p>',
          )

          cp.write_text(c)
          print('complete page size', cp.stat().st_size)

          # ---- zibagar locations page copy ----
          lp = Path('frontend/src/app/zibagar/locations/page.tsx')
          if lp.exists():
              l = lp.read_text()
              l = l.replace(
                  'می‌توانید آدرس دقیق یا محدوده تقریبی را برای حفظ حریم خصوصی انتخاب کنید.',
                  'آدرس دقیق را برای پلتفرم ثبت کنید. برای عموم فقط شهر دیده می‌شود مگر «نمایش آدرس دقیق برای عموم» را فعال کنید؛ بعد از رزرو، مشتری آدرس کامل را می‌بیند.',
              )
              l = l.replace('آدرس دقیق', 'نمایش آدرس دقیق برای عموم', 1)  # may over-replace - careful
              # better targeted for precision buttons
              l = l.replace(
                  '''              آدرس دقیق
            </button>''',
                  '''              نمایش آدرس دقیق برای عموم
            </button>''',
              )
              l = l.replace(
                  "? 'فقط شهر/محله به مشتری نشان داده می‌شود؛ پین نقشه عمومی نمی‌شود.'\n              : 'آدرس و پین روی نقشه برای مشتری قابل مشاهده است و می‌تواند با نشان مسیریابی کند.'",
                  "? 'برای عموم فقط شهر دیده می‌شود؛ آدرس کامل بعد از رزرو به مشتری می‌رسد.'\n              : 'آدرس کامل و پین برای عموم قابل مشاهده است.'",
              )
              lp.write_text(l)
              print('locations page copy updated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/locations/locations.service.ts \
            frontend/src/app/zibagar/profile/complete/page.tsx \
            frontend/src/app/zibagar/locations/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.14): require exact address; public only with opt-in"
          git push
