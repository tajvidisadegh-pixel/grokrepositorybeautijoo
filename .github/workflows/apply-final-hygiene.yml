name: apply-final-hygiene
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-final-hygiene.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Final hygiene patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          r = Path('frontend/src/app/api/revalidate/route.ts')
          t = r.read_text(encoding='utf-8')
          old = "process.env.REVALIDATE_SECRET || process.env.NEXT_PUBLIC_REVALIDATE_SECRET || '';"
          new = "process.env.REVALIDATE_SECRET || ''; // never NEXT_PUBLIC_* for secrets (#82.final)"
          if old in t:
              t = t.replace(old, new, 1)
              r.write_text(t, encoding='utf-8')
              print('revalidate secret fix ok')
          else:
              print('revalidate skip')

          b = Path('backend/src/bookings/bookings.service.ts')
          bt = b.read_text(encoding='utf-8')
          if "BOOKING_FREE_CANCEL_HOURS || '24'" in bt and 'CANCEL_MIN_HOURS_BEFORE' not in bt:
              bt = bt.replace(
                  "process.env.BOOKING_FREE_CANCEL_HOURS || '24'",
                  "process.env.BOOKING_FREE_CANCEL_HOURS || process.env.CANCEL_MIN_HOURS_BEFORE || '24'",
                  1,
              )
              b.write_text(bt, encoding='utf-8')
              print('cancel env alias ok')
          else:
              print('cancel env skip')

          env = Path('backend/.env.example')
          e = env.read_text(encoding='utf-8') if env.exists() else ''
          extras = "\n\n# ---- OTP limits (#82.med15) ----\n# OTP_MAX_PER_IP_10M=20\n\n# ---- Cancel policy (#82.med9) ----\n# BOOKING_FREE_CANCEL_HOURS=24\n# CANCEL_MIN_HOURS_BEFORE=24\n\n# ---- Boot seeds (#82.infra20) ----\n# RUN_SEED_CATALOG_ON_BOOT=false\n\n# ---- Storage (#82.infra19) ----\n# STORAGE_PROVIDER=s3\n# STORAGE_LOCAL_PATH=/app/uploads\n\n# ---- Payment mode (when gateway ready) ----\n# BOOKING_PAYMENT_MODE=auto\n# PAYMENT_PROVIDER=zarinpal\n"
          if 'BOOKING_FREE_CANCEL_HOURS' not in e:
              env.write_text(e.rstrip() + extras, encoding='utf-8')
              print('env.example ok')
          else:
              print('env.example skip')

          # Write gitleaks.yml WITHOUT nested ${{ }} in THIS workflow file
          gl = Path('.github/workflows/gitleaks.yml')
          gl.write_text(
              "name: gitleaks\n"
              "on:\n"
              "  push:\n"
              "    branches: [main]\n"
              "  pull_request:\n"
              "  workflow_dispatch:\n"
              "jobs:\n"
              "  scan:\n"
              "    runs-on: ubuntu-latest\n"
              "    steps:\n"
              "      - uses: actions/checkout@v4\n"
              "        with:\n"
              "          fetch-depth: 0\n"
              "      - name: Gitleaks\n"
              "        uses: gitleaks/gitleaks-action@v2\n",
              encoding='utf-8',
          )
          print('gitleaks workflow ok')

          sec = Path('docs/SECURITY_ISSUE_82_9.md')
          sec.write_text(
              "# Security hygiene (#82.9 / #82.infra21)\n\n"
              "## Done in code\n"
              "- Image-only `/uploads`\n"
              "- OTP purpose whitelist + per-IP rate limit\n"
              "- Auth throttles tightened\n"
              "- `REVALIDATE_SECRET` must not be `NEXT_PUBLIC_*`\n"
              "- Gitleaks workflow on push/PR\n"
              "- Seed catalog gated by `RUN_SEED_CATALOG_ON_BOOT`\n\n"
              "## Owner actions (required)\n"
              "1. Make the repository **private** (GitHub Settings → Danger Zone).\n"
              "2. Check Actions → gitleaks; rotate any leaked secrets.\n"
              "3. Prefer `STORAGE_PROVIDER=s3` in production.\n"
              "4. When gateway is ready: set BOOKING_PAYMENT_MODE + PAYMENT_PROVIDER; lock NOK callback.\n",
              encoding='utf-8',
          )
          print('security doc ok')
          print('ALL_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "chore(#82.final): env.example, gitleaks CI, revalidate secret, cancel env alias, security doc"
          git push origin HEAD:main
