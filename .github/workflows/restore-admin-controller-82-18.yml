name: restore-admin-controller-82-18

"on":
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore admin.controller.ts from embedded base64
        run: |
          python3 << 'PY'
          import base64, pathlib
          # content loaded from next step file written by previous approach - use curl to raw good version instead
          import urllib.request
          url = "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/1557c26b66a76d8778c1e01bb747b7b989dd8ea9/backend/src/admin/admin.controller.ts"
          data = urllib.request.urlopen(url).read().decode()
          old = """  @Post('users/:id/impersonate')\n  @Roles('SUPER_ADMIN')\n  @ApiOperation({ summary: 'Impersonate customer (SUPER_ADMIN only)' })\n  impersonateCustomer(\n    @CurrentUser('id') adminId: string,\n    @Param('id') customerId: string,\n  ) {\n    return this.service.impersonateCustomer(adminId, customerId);\n  }"""
          new = """  /** #82.18 — SUPER_ADMIN only; audited in AdminService (blocking audit). */\n  @Post('users/:id/impersonate')\n  @Roles('SUPER_ADMIN')\n  @ApiOperation({\n    summary: 'Impersonate customer (SUPER_ADMIN only, audited)',\n    description:\n      'Issues a short-lived access token as the customer. Requires SUPER_ADMIN. ' +\n      'Writes IMPERSONATION_STARTED to audit_log before the token is issued.',\n  })\n  impersonateCustomer(\n    @CurrentUser('id') adminId: string,\n    @Param('id') customerId: string,\n  ) {\n    return this.service.impersonateCustomer(adminId, customerId);\n  }"""
          if old not in data:
              raise SystemExit('impersonate block not found in restored controller')
          data = data.replace(old, new, 1)
          pathlib.Path('backend/src/admin/admin.controller.ts').write_text(data)
          assert 'PLACEHOLDER' not in data
          assert 'impersonateCustomer' in data
          print('controller restored', len(data))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.controller.ts
          if git diff --cached --quiet; then echo noop; exit 0; fi
          git commit -m "fix(#82.18): restore admin.controller.ts + SUPER_ADMIN impersonate docs"
          git pull --rebase origin main || true
          git push origin HEAD:main
