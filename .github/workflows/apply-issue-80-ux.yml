name: Apply issue 80 pricing UX
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-80-ux.yml'
      - 'scripts/patch_issue_80_hide_fixed_badges.py'
      - 'frontend/src/components/admin/ServicePricingPanel.tsx'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_80_hide_fixed_badges.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/admin/ServicePricingPanel.tsx \
            frontend/src/app/admin/service-categories/page.tsx \
            frontend/src/app/zibagar/services/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#80): pricing modal overlay + hide fixed-only labels"
          git push origin HEAD:main
