name: Restore payments offline
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-payments-offline.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from pre-placeholder and patch
        run: |
          set -euo pipefail
          # last known good before PLACEHOLDER push
          git show d34434ed1aef92b34675e16d7120ef6e229e86f9:backend/src/payments/payments.service.ts > backend/src/payments/payments.service.ts || \
          git show 66dd9d996c5562b85843c054ffaa490051902ecd:backend/src/payments/payments.service.ts > backend/src/payments/payments.service.ts
          wc -c backend/src/payments/payments.service.ts
          head -3 backend/src/payments/payments.service.ts
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/payments/payments.service.ts')
          t = p.read_text()
          assert 'PLACEHOLDER' not in t and 'export class PaymentsService' in t
          if 'confirmOfflineBooking' not in t:
              helpers = '''
  private resolveBookingPaymentMode(): \'offline\' | \'gateway\' {
    const explicit = (process.env.BOOKING_PAYMENT_MODE || \'auto\').toString().trim().toLowerCase();
    if (explicit === \'offline\' || explicit === \'no_gateway\' || explicit === \'pay_later\') return \'offline\';
    if (explicit === \'gateway\' || explicit === \'online\') return \'gateway\';
    const provider = this.providerName();
    if (provider === \'zarinpal\' || provider === \'zibal\' || provider === \'idpay\') return \'gateway\';
    return \'offline\';
  }

  private async confirmOfflineBooking(userId: string, bookingId: string) {
    const booking = await this.prisma.booking.findUnique({ where: { id: bookingId }, include: { payment: true } });
    if (!booking) throw new NotFoundException();
    if (booking.customerId !== userId) throw new ForbiddenException();
    if (booking.status === BookingStatus.expired || booking.status === BookingStatus.cancelled) {
      throw new BadRequestException(\'این رزرو دیگر قابل تأیید نیست\');
    }
    if (booking.payment?.status === PaymentStatus.paid) {
      return { offline: true, status: \'paid\' as const, bookingId, redirectUrl: null as string | null, providerRef: booking.payment.providerRef ?? \'offline\' };
    }
    const idempotencyKey = booking.payment?.idempotencyKey || randomUUID();
    if (!booking.payment) {
      await this.prisma.payment.create({ data: { bookingId, amount: booking.totalPrice, status: PaymentStatus.pending, provider: \'offline\', idempotencyKey } });
    }
    let rate = DEFAULT_PLATFORM_COMMISSION_RATE;
    try {
      const rateRow = await this.prisma.platformSetting.findUnique({ where: { key: PLATFORM_COMMISSION_RATE_KEY } });
      if (rateRow?.value != null && Number.isFinite(Number(rateRow.value))) rate = Number(rateRow.value);
    } catch { /* optional */ }
    const { commissionAmount, professionalNetAmount } = calculateCommission(booking.totalPrice, rate);
    const ref = `offline-${bookingId.replace(/-/g, \'\').slice(0, 12)}`;
    await this.prisma.payment.update({
      where: { bookingId },
      data: {
        status: PaymentStatus.paid,
        provider: \'offline\',
        providerRef: ref,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: { mode: \'offline\', note: \'Confirmed without online gateway. Not a bank settlement.\' },
      },
    });
    if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired) {
      await this.prisma.booking.update({ where: { id: bookingId }, data: { status: BookingStatus.confirmed, confirmedAt: new Date() } });
    }
    return { offline: true, status: \'paid\' as const, bookingId, redirectUrl: null as string | null, providerRef: ref };
  }

'''
              # fix escape - write helpers without over-escaping
              helpers = """
  private resolveBookingPaymentMode(): 'offline' | 'gateway' {
    const explicit = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();
    if (explicit === 'offline' || explicit === 'no_gateway' || explicit === 'pay_later') return 'offline';
    if (explicit === 'gateway' || explicit === 'online') return 'gateway';
    const provider = this.providerName();
    if (provider === 'zarinpal' || provider === 'zibal' || provider === 'idpay') return 'gateway';
    return 'offline';
  }

  private async confirmOfflineBooking(userId: string, bookingId: string) {
    const booking = await this.prisma.booking.findUnique({
      where: { id: bookingId },
      include: { payment: true },
    });
    if (!booking) throw new NotFoundException();
    if (booking.customerId !== userId) throw new ForbiddenException();
    if (booking.status === BookingStatus.expired || booking.status === BookingStatus.cancelled) {
      throw new BadRequestException('این رزرو دیگر قابل تأیید نیست');
    }
    if (booking.payment?.status === PaymentStatus.paid) {
      return {
        offline: true,
        status: 'paid' as const,
        bookingId,
        redirectUrl: null as string | null,
        providerRef: booking.payment.providerRef ?? 'offline',
      };
    }
    const idempotencyKey = booking.payment?.idempotencyKey || randomUUID();
    if (!booking.payment) {
      await this.prisma.payment.create({
        data: {
          bookingId,
          amount: booking.totalPrice,
          status: PaymentStatus.pending,
          provider: 'offline',
          idempotencyKey,
        },
      });
    }
    let rate = DEFAULT_PLATFORM_COMMISSION_RATE;
    try {
      const rateRow = await this.prisma.platformSetting.findUnique({
        where: { key: PLATFORM_COMMISSION_RATE_KEY },
      });
      if (rateRow?.value != null && Number.isFinite(Number(rateRow.value))) {
        rate = Number(rateRow.value);
      }
    } catch {
      /* optional */
    }
    const { commissionAmount, professionalNetAmount } = calculateCommission(booking.totalPrice, rate);
    const ref = 'offline-' + bookingId.replace(/-/g, '').slice(0, 12);
    await this.prisma.payment.update({
      where: { bookingId },
      data: {
        status: PaymentStatus.paid,
        provider: 'offline',
        providerRef: ref,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
        },
      },
    });
    if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired) {
      await this.prisma.booking.update({
        where: { id: bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }
    return {
      offline: true,
      status: 'paid' as const,
      bookingId,
      redirectUrl: null as string | null,
      providerRef: ref,
    };
  }

"""
              marker = '  async initiate(userId: string, bookingId: string, callbackUrl: string) {'
              assert marker in t
              t = t.replace(marker, helpers + marker, 1)
              old = marker + "\n    // #64.5 — lock callback to allowed frontend origins before talking to gateway\n    this.assertAllowedCallbackUrl(callbackUrl);\n    const providerKey = this.providerName();\n    if (providerKey === 'disabled') {\n"
              new = marker + "\n    if (this.resolveBookingPaymentMode() === 'offline') {\n      return this.confirmOfflineBooking(userId, bookingId);\n    }\n\n    // #64.5 — lock callback to allowed frontend origins before talking to gateway\n    this.assertAllowedCallbackUrl(callbackUrl);\n    const providerKey = this.providerName();\n    if (providerKey === 'disabled') {\n"
              assert old in t, 'inject point missing'
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('patched', p.stat().st_size)
          else:
              print('already offline')

          # config
          p = Path('backend/src/config/configuration.ts')
          t = p.read_text()
          if 'bookingPaymentMode' not in t:
              needle = "    paymentProvider: process.env.PAYMENT_PROVIDER || '',\n"
              t = t.replace(needle, needle + "    bookingPaymentMode: (process.env.BOOKING_PAYMENT_MODE || 'auto').toLowerCase(),\n", 1)
              p.write_text(t)
              print('config')

          # booking-api
          p = Path('frontend/src/lib/booking-api.ts')
          t = p.read_text()
          if 'offline?:' not in t:
              t = t.replace('redirectUrl?: string;', 'redirectUrl?: string | null;\n    offline?: boolean;\n    status?: string;\n    bookingId?: string;', 1)
              p.write_text(t)
              print('api')

          # wizard
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          t = p.read_text()
          if 'pay.offline' not in t:
              old = '        const pay = await initiatePayment(created.id, callbackUrl);\n        if (pay.redirectUrl) {\n'
              new = '        const pay = await initiatePayment(created.id, callbackUrl);\n        if (pay.offline || pay.status === \'paid\' || (!pay.redirectUrl && pay.bookingId)) {\n          router.push(`/booking/confirmation/${created.id}`);\n          return;\n        }\n        if (pay.redirectUrl) {\n'
              assert old in t
              p.write_text(t.replace(old, new, 1))
              print('wizard')
          print('done')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/config/configuration.ts frontend/src/lib/booking-api.ts frontend/src/components/booking/booking-wizard.tsx
          git commit -m "feat: offline booking without gateway + restore payments.service" || exit 0
          git push origin HEAD:main
      - name: Export sync
        run: |
          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          mkdir -p /tmp/be/src/payments /tmp/be/src/config
          cp backend/src/payments/payments.service.ts /tmp/be/src/payments/
          cp backend/src/config/configuration.ts /tmp/be/src/config/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payments/payments.service.ts src/config/configuration.ts
          git commit -m "feat: offline booking mode" || exit 0
          git push origin HEAD:beautijoo-backend-export
