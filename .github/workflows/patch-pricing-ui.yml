name: patch-pricing-ui
on:
  push:
    paths:
      - '.github/TRIGGER_PRICING_UI'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pricing UI patches
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # --- ServicePricingPanel ---
          p = Path('frontend/src/components/admin/ServicePricingPanel.tsx')
          t = p.read_text(encoding='utf-8')

          old_save = '''  async function saveFlags() {
    if (!allowFixed && !allowVariable && !allowDeposit) {
      setError('حداقل یک حالت قیمت باید فعال باشد');
      return;
    }
    setBusy(true);
    setError(null);
    setMsg(null);
    try {
      const row = await apiClient.patch<PricingPayload>(
        `/admin/catalog-services/${serviceId}/pricing-flags`,
        {
          allowFixed,
          allowVariable,
          allowDeposit,
          defaultPricingMode: defaultMode,
        },
      );'''

          new_save = '''  function resolveDefaultMode(): string {
    const allowed: string[] = [];
    if (allowFixed) allowed.push('fixed');
    if (allowVariable) allowed.push('variable');
    if (allowDeposit) allowed.push('deposit');
    if (allowed.includes(defaultMode)) return defaultMode;
    return allowed[0] || 'fixed';
  }

  async function saveFlags() {
    if (!allowFixed && !allowVariable && !allowDeposit) {
      setError('حداقل یک حالت قیمت باید فعال باشد');
      return;
    }
    const mode = resolveDefaultMode();
    if (mode !== defaultMode) setDefaultMode(mode);
    setBusy(true);
    setError(null);
    setMsg(null);
    try {
      const row = await apiClient.patch<PricingPayload>(
        `/admin/catalog-services/${serviceId}/pricing-flags`,
        {
          allowFixed,
          allowVariable,
          allowDeposit,
          defaultPricingMode: mode,
        },
      );'''

          if old_save not in t:
              raise SystemExit('saveFlags block not found')
          t = t.replace(old_save, new_save, 1)

          old_add = '''  async function addGroup() {
    if (!groupName.trim()) return;
    setBusy(true);
    setError(null);
    try {
      await apiClient.post(`/admin/catalog-services/${serviceId}/attribute-groups`, {
        name: groupName.trim(),
        required: true,
      });
      setGroupName('');
      setMsg('گروه اضافه شد');
      await load();
    } catch (e) {
      setError(friendlyApiError(e));
    } finally {
      setBusy(false);
    }
  }'''

          sample_fn = '''  async function addGroup() {
    if (!groupName.trim()) return;
    setBusy(true);
    setError(null);
    try {
      await apiClient.post(`/admin/catalog-services/${serviceId}/attribute-groups`, {
        name: groupName.trim(),
        required: true,
      });
      setGroupName('');
      setMsg('گروه اضافه شد');
      await load();
    } catch (e) {
      setError(friendlyApiError(e));
    } finally {
      setBusy(false);
    }
  }

  /** Sample variable pricing so admin can see how groups/options work. */
  async function applySampleVariable() {
    setBusy(true);
    setError(null);
    setMsg(null);
    try {
      const mode = 'variable';
      await apiClient.patch(`/admin/catalog-services/${serviceId}/pricing-flags`, {
        allowFixed: true,
        allowVariable: true,
        allowDeposit: allowDeposit,
        defaultPricingMode: mode,
      });
      setAllowFixed(true);
      setAllowVariable(true);
      setDefaultMode(mode);

      const current = await apiClient.get<PricingPayload>(
        `/admin/catalog-services/${serviceId}/pricing`,
      );
      const existing = (current.attributeGroups || []).filter((g) => g.isActive !== false);
      if (existing.length === 0) {
        const g1 = await apiClient.post<{ id: string }>(
          `/admin/catalog-services/${serviceId}/attribute-groups`,
          { name: 'طول مو', required: true },
        );
        for (const opt of [
          { label: 'کوتاه', suggestedPriceDelta: 0, suggestedDurationDeltaMin: 0 },
          { label: 'متوسط', suggestedPriceDelta: 50000, suggestedDurationDeltaMin: 15 },
          { label: 'بلند', suggestedPriceDelta: 120000, suggestedDurationDeltaMin: 30 },
        ]) {
          await apiClient.post(`/admin/attribute-groups/${g1.id}/options`, opt);
        }
        const g2 = await apiClient.post<{ id: string }>(
          `/admin/catalog-services/${serviceId}/attribute-groups`,
          { name: 'نوع کار', required: false },
        );
        for (const opt of [
          { label: 'اصلاح ساده', suggestedPriceDelta: 0, suggestedDurationDeltaMin: 0 },
          { label: 'رنگ ریشه‌ای', suggestedPriceDelta: 200000, suggestedDurationDeltaMin: 45 },
          { label: 'دکلره', suggestedPriceDelta: 450000, suggestedDurationDeltaMin: 90, forcesDeposit: true },
        ]) {
          await apiClient.post(`/admin/attribute-groups/${g2.id}/options`, opt);
        }
      }
      setMsg('نمونه قیمت متغیر اعمال شد — گروه «طول مو» و «نوع کار»');
      await load();
      onSaved?.();
    } catch (e) {
      setError(friendlyApiError(e));
    } finally {
      setBusy(false);
    }
  }'''

          if old_add not in t:
              raise SystemExit('addGroup not found')
          t = t.replace(old_add, sample_fn, 1)

          marker = '''                <h4 className="text-sm font-semibold text-[#0B2C4A]">حالت‌های قیمت مجاز</h4>
                <div className="flex flex-col gap-2 sm:flex-row sm:flex-wrap">'''

          replacement = '''                <h4 className="text-sm font-semibold text-[#0B2C4A]">حالت‌های قیمت مجاز</h4>
                <div className="rounded-xl border border-dashed border-[#2D6CDF]/40 bg-[#F7FBFF] p-3 text-[11px] leading-5 text-gray-600">
                  <p className="font-medium text-[#0B2C4A]">راهنمای سریع حالت‌ها</p>
                  <ul className="mt-1 list-disc pr-4">
                    <li><b>ثابت:</b> یک قیمت مشخص برای خدمت</li>
                    <li><b>متغیر (گزینه‌ها):</b> قیمت پایه + انتخاب‌هایی مثل طول مو با Δ قیمت</li>
                    <li><b>بیعانه:</b> مشتری بیعانه می‌دهد و جزئیات بعداً نهایی می‌شود</li>
                  </ul>
                  <p className="mt-2">برای دیدن نمونه واقعی، دکمه زیر را بزنید.</p>
                  <button
                    type="button"
                    disabled={busy}
                    onClick={() => void applySampleVariable()}
                    className="mt-2 h-9 rounded-lg border border-[#2D6CDF] px-3 text-xs font-medium text-[#2D6CDF] disabled:opacity-50"
                  >
                    اعمال نمونه قیمت متغیر
                  </button>
                </div>
                <div className="flex flex-col gap-2 sm:flex-row sm:flex-wrap">'''

          if marker not in t:
              raise SystemExit('marker not found')
          t = t.replace(marker, replacement, 1)

          t = t.replace(
              '''                    <input
                      type="checkbox"
                      checked={allowFixed}
                      onChange={(e) => setAllowFixed(e.target.checked)}
                    />''',
              '''                    <input
                      type="checkbox"
                      checked={allowFixed}
                      onChange={(e) => {
                        const next = e.target.checked;
                        setAllowFixed(next);
                        if (!next && defaultMode === 'fixed') {
                          if (allowVariable) setDefaultMode('variable');
                          else if (allowDeposit) setDefaultMode('deposit');
                        }
                      }}
                    />''',
              1,
          )

          p.write_text(t, encoding='utf-8')
          print('ServicePricingPanel ok')

          # --- PricingModeFields ---
          pm = Path('frontend/src/components/zibagar/PricingModeFields.tsx')
          pt = pm.read_text(encoding='utf-8')
          old = '''  // #80 pure fixed: no extra UI at all
  if (allowed.length === 1 && allowed[0] === 'fixed') {
    return null;
  }'''
          new = '''  // Pure fixed with no other modes: explain why picker is hidden
  if (allowed.length === 1 && allowed[0] === 'fixed') {
    return (
      <p className="rounded-xl border border-border bg-gray-50 px-3 py-2 text-xs text-gray-600" dir="rtl">
        حالت این خدمت: <b>قیمت ثابت</b> (در کاتالوگ ادمین فقط ثابت مجاز است — برای متغیر/بیعانه از پنل ادمین مجوز بدهید)
      </p>
    );
  }'''
          if old not in pt:
              raise SystemExit('PricingModeFields pattern missing')
          pm.write_text(pt.replace(old, new, 1), encoding='utf-8')
          print('PricingModeFields ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/TRIGGER_PRICING_UI
          rm -f .github/workflows/patch-pricing-ui.yml
          git add frontend/src/components/admin/ServicePricingPanel.tsx frontend/src/components/zibagar/PricingModeFields.tsx
          git add -A
          git commit -m "fix(admin/zibagar): sample variable pricing + fix defaultMode when fixed disabled"
          git push origin HEAD:main
