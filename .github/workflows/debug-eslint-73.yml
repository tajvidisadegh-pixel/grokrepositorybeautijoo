name: Debug eslint 73
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-eslint-73.yml'
      - 'frontend/src/app/zibagar/portfolio/page.tsx'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: ESLint portfolio page
        working-directory: frontend
        run: |
          npx eslint "src/app/zibagar/portfolio/page.tsx" -f unix || true
          npx eslint "src/app/zibagar/portfolio/page.tsx" -f stylish | tee /tmp/eslint-out.txt || true
          # also full lint to match CI
          npm run lint 2>&1 | tee /tmp/full-lint.txt | tail -80
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: eslint-out
          path: |
            /tmp/eslint-out.txt
            /tmp/full-lint.txt
