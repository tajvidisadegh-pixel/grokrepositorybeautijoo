name: run-fix-admin-r4-remaining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-fix-admin-r4-remaining.yml'
      - 'scripts/fix-admin-r4-remaining.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/fix-admin-r4-remaining.py
          grep -n "impersonationTtl\|impMode" backend/src/auth/auth.service.ts | head -5
          grep -n "maskPhone\|commissionEstimated\|userId را مشخص" backend/src/admin/admin.service.ts | head -8
          grep -n "USER node\|HEALTHCHECK" Dockerfile | head -5
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts backend/src/admin/admin.service.ts Dockerfile docs/SECURITY_R4_OWNER.md
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(security): r4 remaining — impersonation TTL, phone mask, notifications filter, docker non-root"
          git push origin HEAD:main
