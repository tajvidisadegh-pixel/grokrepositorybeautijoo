name: Apply phase2 templates 80

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-phase2-templates-80.yml'
      - 'scripts/patch_phase2_templates_80.py'
      - 'backend/prisma/migrations/20261104103000_service_attribute_templates/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_phase2_templates_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/prisma/schema.prisma \
            backend/src/admin/admin-catalog-pricing.controller.ts \
            backend/src/bookings/bookings.service.ts \
            frontend/src/components/admin/ServicePricingPanel.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.phase2): attribute templates API, forcesDeposit booking, admin UI"
          git push origin HEAD:main
