name: apply-65-fe-remaining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-65-fe-remaining.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch frontend files
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import re

          hp = Path('frontend/src/app/zibagar/hours/page.tsx')
          ht = hp.read_text()
          if 'TIME_OPTIONS_24H' not in ht:
              ht = ht.replace(
                  "const HOURS_DRAFT_KEY = 'bj_zibagar_hours_draft_v1';",
                  "const HOURS_DRAFT_KEY = 'bj_zibagar_hours_draft_v1';\n\n/** 24h time options (HH:MM) — avoids browser AM/PM type=time UI */\nconst TIME_OPTIONS_24H: string[] = Array.from({ length: 24 * 4 }, (_, i) => {\n  const h = Math.floor(i / 4);\n  const m = (i % 4) * 15;\n  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;\n});",
                  1,
              )
          old_start = '''                    <Input\n                      className="h-8 min-w-0 flex-1 px-1.5 text-center text-sm"\n                      type="time"\n                      value={draft.startTime}\n                      onChange={(e) =>\n                        setDayDrafts((p) => ({\n                          ...p,\n                          [d.value]: { ...p[d.value], startTime: e.target.value },\n                        }))\n                      }\n                    />'''
          new_start = '''                    <select\n                      className="h-8 min-w-0 flex-1 rounded-lg border border-border bg-white px-1.5 text-center text-sm text-blue shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"\n                      value={draft.startTime}\n                      onChange={(e) =>\n                        setDayDrafts((p) => ({\n                          ...p,\n                          [d.value]: { ...p[d.value], startTime: e.target.value },\n                        }))\n                      }\n                    >\n                      {TIME_OPTIONS_24H.map((t) => (\n                        <option key={`s-${d.value}-${t}`} value={t}>{t}</option>\n                      ))}\n                    </select>'''
          if old_start in ht:
              ht = ht.replace(old_start, new_start, 1)
              print('start select')
          old_end = '''                    <Input\n                      className="h-8 min-w-0 flex-1 px-1.5 text-center text-sm"\n                      type="time"\n                      value={draft.endTime}\n                      onChange={(e) =>\n                        setDayDrafts((p) => ({\n                          ...p,\n                          [d.value]: { ...p[d.value], endTime: e.target.value },\n                        }))\n                      }\n                    />'''
          new_end = '''                    <select\n                      className="h-8 min-w-0 flex-1 rounded-lg border border-border bg-white px-1.5 text-center text-sm text-blue shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"\n                      value={draft.endTime}\n                      onChange={(e) =>\n                        setDayDrafts((p) => ({\n                          ...p,\n                          [d.value]: { ...p[d.value], endTime: e.target.value },\n                        }))\n                      }\n                    >\n                      {TIME_OPTIONS_24H.map((t) => (\n                        <option key={`e-${d.value}-${t}`} value={t}>{t}</option>\n                      ))}\n                    </select>'''
          if old_end in ht:
              ht = ht.replace(old_end, new_end, 1)
              print('end select')
          old_block = '''<Input type="time" dir="ltr" value={blockFrom} onChange={(e) => setBlockFrom(e.target.value)} />\n              <Input type="time" dir="ltr" value={blockTo} onChange={(e) => setBlockTo(e.target.value)} />'''
          new_block = '''<select\n                dir="ltr"\n                className="h-10 w-full rounded-lg border border-border bg-white px-2 text-center text-sm text-blue shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"\n                value={blockFrom}\n                onChange={(e) => setBlockFrom(e.target.value)}\n              >\n                {TIME_OPTIONS_24H.map((t) => (\n                  <option key={`bf-${t}`} value={t}>{t}</option>\n                ))}\n              </select>\n              <select\n                dir="ltr"\n                className="h-10 w-full rounded-lg border border-border bg-white px-2 text-center text-sm text-blue shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"\n                value={blockTo}\n                onChange={(e) => setBlockTo(e.target.value)}\n              >\n                {TIME_OPTIONS_24H.map((t) => (\n                  <option key={`bt-${t}`} value={t}>{t}</option>\n                ))}\n              </select>'''
          if old_block in ht:
              ht = ht.replace(old_block, new_block, 1)
              print('block select')
          ht = ht.replace(
              'className="shrink-0 rounded-lg border border-border px-2 py-1 text-xs text-gray"',
              'className="shrink-0 rounded-lg border border-border bg-white px-2 py-1 text-xs font-medium text-blue"',
          )
          if 'type="time"' in ht:
              raise SystemExit('type=time still present: ' + str(ht.count('type="time"')))
          hp.write_text(ht)
          print('hours OK')

          pp = Path('frontend/src/app/professionals/[slug]/page.tsx')
          pt = pp.read_text()
          if 'نظرات مشتریان' not in pt:
              m = re.search(r'\{pro\.bio && \([\s\S]*?\)\}', pt)
              if not m:
                  raise SystemExit('bio block not found')
              section = """\n\n          {Array.isArray((pro as { reviews?: Array<{ id: string; rating: number; comment?: string | null; createdAt?: string; reply?: string | null; customer?: { profile?: { displayName?: string | null } | null } | null }> }).reviews) &&\n            ((pro as { reviews?: unknown[] }).reviews?.length ?? 0) > 0 && (\n            <section className=\"mt-8 rounded-2xl border border-border bg-white p-5 shadow-sm\">\n              <h2 className=\"mb-4 text-lg font-bold text-blue\">نظرات مشتریان</h2>\n              <ul className=\"space-y-4\">\n                {((pro as { reviews: Array<{ id: string; rating: number; comment?: string | null; createdAt?: string; reply?: string | null; customer?: { profile?: { displayName?: string | null } | null } | null }> }).reviews).map((r) => (\n                  <li key={r.id} className=\"border-b border-border pb-4 last:border-0 last:pb-0\">\n                    <div className=\"flex flex-wrap items-center gap-2 text-sm\">\n                      <span className=\"font-medium text-blue\">{r.customer?.profile?.displayName || 'مشتری'}</span>\n                      <span className=\"tabular-nums text-amber-600\" aria-label={`امتیاز ${r.rating}`}>{'★'.repeat(Math.max(0, Math.min(5, r.rating)))}{'☆'.repeat(Math.max(0, 5 - Math.min(5, r.rating)))}</span>\n                      {r.createdAt && (\n                        <span className=\"text-xs text-gray\">{new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'Asia/Tehran' }).format(new Date(r.createdAt))}</span>\n                      )}\n                    </div>\n                    {r.comment && <p className=\"mt-1.5 text-sm leading-relaxed text-gray-700\">{r.comment}</p>}\n                    {r.reply && (\n                      <p className=\"mt-2 rounded-lg bg-coral-soft/40 px-3 py-2 text-xs text-gray-700\">\n                        <span className=\"font-medium text-coral\">پاسخ زیباگر: </span>{r.reply}\n                      </p>\n                    )}\n                  </li>\n                ))}\n              </ul>\n            </section>\n          )}\n"""
              pt = pt[:m.end()] + section + pt[m.end():]
              pp.write_text(pt)
              print('reviews OK')
          else:
              print('reviews already')

          sp = Path('frontend/src/app/zibagar/services/page.tsx')
          st = sp.read_text()
          if 'editDescription' not in st:
              st = st.replace(
                  "const [editDuration, setEditDuration] = useState('60');",
                  "const [editDuration, setEditDuration] = useState('60');\n  const [editDescription, setEditDescription] = useState('');",
                  1,
              )
              st = st.replace(
                  "setEditDuration(String(ps.durationMin || 60));\n    setError(null);\n    setSheet({ kind: 'price', ps });",
                  "setEditDuration(String(ps.durationMin || 60));\n    setEditDescription(ps.description || '');\n    setError(null);\n    setSheet({ kind: 'price', ps });",
                  1,
              )
              st = st.replace(
                  "await patchMyService(sheet.ps.id, {\n        price: priceNum,\n        durationMin: dur,\n        isActive: true,\n      });",
                  "await patchMyService(sheet.ps.id, {\n        price: priceNum,\n        durationMin: dur,\n        description: editDescription.trim() || undefined,\n        isActive: true,\n      });",
                  1,
              )
              old_ui = '''            <div>\n              <label className="mb-1.5 block text-sm text-gray">مدت (دقیقه)</label>\n              <Input\n                inputMode="numeric"\n                pattern="[0-9]*"\n                value={editDuration}\n                onChange={(e) => setEditDuration(e.target.value.replace(/[^\\d]/g, ''))}\n                className="h-12 rounded-2xl text-base tabular-nums"\n              />\n            </div>\n            <Button'''
              new_ui = '''            <div>\n              <label className="mb-1.5 block text-sm text-gray">مدت (دقیقه)</label>\n              <Input\n                inputMode="numeric"\n                pattern="[0-9]*"\n                value={editDuration}\n                onChange={(e) => setEditDuration(e.target.value.replace(/[^\\d]/g, ''))}\n                className="h-12 rounded-2xl text-base tabular-nums"\n              />\n            </div>\n            <div>\n              <label className="mb-1.5 block text-sm text-gray">توضیح خدمت (اختیاری)</label>\n              <textarea\n                dir="rtl"\n                rows={3}\n                maxLength={500}\n                className="w-full rounded-2xl border border-border bg-white px-3 py-2.5 text-sm text-blue shadow-sm focus:border-coral focus:outline-none focus:ring-1 focus:ring-coral"\n                placeholder="مثلاً: شامل شستشو و استایلینگ"\n                value={editDescription}\n                onChange={(e) => setEditDescription(e.target.value)}\n              />\n            </div>\n            <Button'''
              if old_ui not in st:
                  raise SystemExit('services duration UI not found')
              st = st.replace(old_ui, new_ui, 1)
              sp.write_text(st)
              print('services OK')
          else:
              print('services already')
          print('ALL DONE')
          PY
      - name: Verify
        run: |
          set -euo pipefail
          grep -q TIME_OPTIONS_24H frontend/src/app/zibagar/hours/page.tsx
          ! grep -q 'type="time"' frontend/src/app/zibagar/hours/page.tsx
          grep -q 'نظرات مشتریان' "frontend/src/app/professionals/[slug]/page.tsx"
          grep -q editDescription frontend/src/app/zibagar/services/page.tsx
          echo verify OK
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/hours/page.tsx \
                  "frontend/src/app/professionals/[slug]/page.tsx" \
                  frontend/src/app/zibagar/services/page.tsx
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(#65): hours 24h selects, public reviews section, service description field"
          git push origin HEAD:main
