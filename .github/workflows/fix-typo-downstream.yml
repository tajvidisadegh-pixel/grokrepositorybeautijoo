name: fix-typo-downstream
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-typo-downstream.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/this downstreamprisma/this.prisma/g' backend/src/bookings/bookings.service.ts
          grep -n 'this.prisma.user.findMany' backend/src/bookings/bookings.service.ts | head -3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git commit -m "fix: typo this.prisma in reportIssue" || exit 0
          git push origin HEAD:main
