name: patch-65-8-hero
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-8-hero.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace pro profile hero with approved layout
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/professionals/[slug]/page.tsx')
          t = p.read_text()

          old = '''          {/* #65.8 — summary hero: cover banner + avatar + name + rating */}
          <header className="overflow-hidden rounded-3xl border border-border/90 bg-white shadow-[0_1px_3px_rgba(31,41,55,0.05)]">
            <div className="relative h-36 w-full bg-gradient-to-l from-coral-soft via-coral/20 to-white sm:h-44">
              {bannerUrl ? (
                // eslint-disable-next-line @next/next/no-img-element
                <img
                  src={bannerUrl}
                  alt=""
                  className="absolute inset-0 h-full w-full object-cover"
                />
              ) : null}
              <div className="absolute inset-0 bg-gradient-to-t from-black/35 via-black/10 to-transparent" />
              {hasRating ? (
                <div className="absolute left-4 top-4 flex items-center gap-1 rounded-full bg-white/95 px-2.5 py-1 text-sm font-semibold text-amber-600 shadow-sm backdrop-blur-sm">
                  <span className="text-amber-500">★</span>
                  <span>{rating}</span>
                  <span className="text-xs font-normal text-gray">
                    ({Number(pro.ratingCount).toLocaleString('fa-IR')} نظر)
                  </span>
                </div>
              ) : (
                <div className="absolute left-4 top-4 rounded-full bg-white/95 px-2.5 py-1 text-xs font-medium text-coral shadow-sm backdrop-blur-sm">
                  زیباگر جدید
                </div>
              )}
            </div>
            <div className="relative -mt-10 flex flex-col gap-3 px-5 pb-5 sm:flex-row sm:items-end sm:gap-4 sm:px-6 sm:pb-6">
              <div className="flex size-20 shrink-0 items-center justify-center overflow-hidden rounded-2xl border-4 border-white bg-coral-soft text-2xl font-bold text-coral shadow-md ring-1 ring-border/60 sm:size-24">
                {avatar ? (
                  // eslint-disable-next-line @next/next/no-img-element
                  <img src={avatar} alt={name} className="size-full object-cover" />
                ) : (
                  name.charAt(0)
                )}
              </div>
              <div className="min-w-0 flex-1 pt-1 sm:pt-0">
                <h1 className="text-xl font-bold text-blue sm:text-2xl">{name}</h1>
                {pro.title && pro.title !== name && (
                  <p className="mt-0.5 text-sm text-gray">{pro.title}</p>
                )}
                <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-gray">
                  {pro.locations?.[0]?.location?.city && (
                    <span className="inline-flex items-center gap-1">
                      <span aria-hidden>📍</span>
                      {pro.locations[0].location.city}
                    </span>
                  )}
                  {(pro as { completedBookingsCount?: number }).completedBookingsCount != null &&
                    Number((pro as { completedBookingsCount?: number }).completedBookingsCount) > 0 && (
                      <span className="text-xs text-gray">
                        بیش از {Number((pro as { completedBookingsCount?: number }).completedBookingsCount).toLocaleString('fa-IR')} نوبت موفق
                      </span>
                    )}
                </div>
              </div>
            </div>
          </header>'''

          new = '''          {/* #65.8 — approved summary hero: large cover, small avatar, rating or new */}
          <header className="overflow-hidden rounded-[1.75rem] border border-border/80 bg-white shadow-[0_2px_16px_rgba(31,41,55,0.06)]">
            <div className="relative h-44 w-full bg-gradient-to-br from-coral/30 via-coral-soft to-white sm:h-52">
              {bannerUrl ? (
                // eslint-disable-next-line @next/next/no-img-element
                <img
                  src={bannerUrl}
                  alt=""
                  className="absolute inset-0 h-full w-full object-cover"
                />
              ) : null}
              <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-black/10 to-transparent" />
              {hasRating ? (
                <div className="absolute start-4 top-4 flex items-center gap-1.5 rounded-2xl bg-white/95 px-3 py-1.5 shadow-sm backdrop-blur-sm">
                  <span className="text-base text-amber-500" aria-hidden>
                    ★
                  </span>
                  <span className="text-sm font-bold text-foreground">{rating}</span>
                  <span className="text-[11px] text-gray">
                    ({Number(pro.ratingCount).toLocaleString('fa-IR')} نظر)
                  </span>
                </div>
              ) : (
                <div className="absolute start-4 top-4 rounded-2xl bg-white/95 px-3 py-1.5 text-xs font-semibold text-coral shadow-sm backdrop-blur-sm">
                  ★ زیباگر جدید
                </div>
              )}
            </div>

            <div className="relative -mt-12 flex flex-col items-center gap-3 px-5 pb-6 text-center sm:-mt-14 sm:flex-row sm:items-end sm:gap-4 sm:px-6 sm:text-start">
              <div className="flex size-[5.5rem] shrink-0 items-center justify-center overflow-hidden rounded-full border-[4px] border-white bg-coral-soft text-3xl font-bold text-coral shadow-lg ring-1 ring-border/50 sm:size-28">
                {avatar ? (
                  // eslint-disable-next-line @next/next/no-img-element
                  <img src={avatar} alt={name} className="size-full object-cover" />
                ) : (
                  <span aria-hidden>{name.charAt(0)}</span>
                )}
              </div>
              <div className="min-w-0 flex-1 sm:pb-1">
                <h1 className="text-2xl font-bold tracking-tight text-blue sm:text-[1.75rem]">
                  {name}
                </h1>
                {pro.title && pro.title !== name ? (
                  <p className="mt-1 text-sm font-medium text-coral">{pro.title}</p>
                ) : null}
                <div className="mt-2.5 flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-sm text-gray sm:justify-start">
                  {pro.locations?.[0]?.location?.city ? (
                    <span className="inline-flex items-center gap-1">
                      <span aria-hidden>📍</span>
                      {pro.locations[0].location.city}
                    </span>
                  ) : null}
                  {(pro as { completedBookingsCount?: number }).completedBookingsCount != null &&
                  Number((pro as { completedBookingsCount?: number }).completedBookingsCount) > 0 ? (
                    <span className="inline-flex items-center gap-1 text-xs text-gray">
                      <span aria-hidden>✓</span>
                      {Number(
                        (pro as { completedBookingsCount?: number }).completedBookingsCount,
                      ).toLocaleString('fa-IR')}
                      + نوبت موفق
                    </span>
                  ) : null}
                </div>
              </div>
            </div>
          </header>'''

          if old not in t:
              if 'approved summary hero' in t:
                  print('already applied')
              else:
                  raise SystemExit('hero block not found')
          else:
              t = t.replace(old, new, 1)
              p.write_text(t)
              print('hero replaced', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/professionals/[slug]/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.8): approved pro summary hero (cover, avatar, rating/new)"
          git push
