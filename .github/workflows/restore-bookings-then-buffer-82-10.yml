new_end = """    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);
    // #82.10 — trailing buffer from selected professional services (0 = legacy behavior)
    const newBufferMin = orderedServices.reduce(
      (m, ps) => Math.max(m, ps.bufferMin ?? 0),
