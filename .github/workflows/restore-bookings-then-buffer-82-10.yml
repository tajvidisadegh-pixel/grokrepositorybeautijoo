    );"""
assert old_end in text, 'create endAt block missing'
text = text.replace(old_end, new_end, 1)
old_overlap = """          const overlappingBookings = await tx.booking.count({
            where: {
              professionalId: data.professionalId,
              status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
              startAt: { lt: endAt },
