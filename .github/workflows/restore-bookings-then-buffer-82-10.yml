            },
          });
          for (const e of candidates) {
            const eBuf = this.maxBufferMin(e.items);
            if (
              this.bookingRangesConflict(
                startAt,
                endAt,
                newBufferMin,
                e.startAt,
                e.endAt,
                eBuf,
              )
            ) {
              throw new ConflictException('این بازه زمانی قبلاً رزرو شده است');
            }
          }"""
assert old_overlap in text, 'create overlap missing'
text = text.replace(old_overlap, new_overlap, 1)
old_reschedule = """  async reschedule(id: string, userId: string, startAtIso: string) {
    const b = await this.prisma.booking.findUnique({ where: { id } });
    if (!b) throw new NotFoundException();
    if (b.customerId !== userId) throw new ForbiddenException();
    const allowed: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];
    if (!allowed.includes(b.status)) throw new BadRequestException('قابل جابجایی نیست');
    const startAt = new Date(startAtIso);
    if (isNaN(startAt.getTime()) || startAt.getTime() < Date.now()) {
      throw new BadRequestException('زمان نامعتبر');
    }
    const durationMs = b.endAt.getTime() - b.startAt.getTime();
    const endAt = new Date(startAt.getTime() + durationMs);
    const overlap = await this.prisma.booking.count({
      where: {
        professionalId: b.professionalId,
        id: { not: id },
        status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
        startAt: { lt: endAt },
        endAt: { gt: startAt },
      },
    });
    if (overlap > 0) throw new ConflictException('این بازه زمانی قبلاً رزرو شده است');
    return this.prisma.booking.update({ where: { id }, data: { startAt, endAt } });
  }"""
new_reschedule = """  async reschedule(id: string, userId: string, startAtIso: string) {
    const b = await this.prisma.booking.findUnique({
      where: { id },
      include: {
        items: {
          select: {
            professionalService: { select: { bufferMin: true } },
          },
        },
      },
    });
    if (!b) throw new NotFoundException();
    if (b.customerId !== userId) throw new ForbiddenException();
    const allowed: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];
    if (!allowed.includes(b.status)) throw new BadRequestException('قابل جابجایی نیست');
    const startAt = new Date(startAtIso);
    if (isNaN(startAt.getTime()) || startAt.getTime() < Date.now()) {
      throw new BadRequestException('زمان نامعتبر');
    }
    const durationMs = b.endAt.getTime() - b.startAt.getTime();
    const endAt = new Date(startAt.getTime() + durationMs);
    // #82.10 — respect trailing bufferMin when moving a booking
    const newBufferMin = this.maxBufferMin(b.items);
    const padMs = Math.max(newBufferMin, 180) * 60_000;
    const candidates = await this.prisma.booking.findMany({
      where: {
        professionalId: b.professionalId,
        id: { not: id },
        status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
        startAt: { lt: new Date(endAt.getTime() + padMs) },
        endAt: { gt: new Date(startAt.getTime() - padMs) },
      },
      include: {
        items: {
          select: {
            professionalService: { select: { bufferMin: true } },
          },
        },
      },
    });
    for (const e of candidates) {
      const eBuf = this.maxBufferMin(e.items);
      if (
        this.bookingRangesConflict(
          startAt,
          endAt,
          newBufferMin,
          e.startAt,
          e.endAt,
          eBuf,
        )
      ) {
        throw new ConflictException('این بازه زمانی قبلاً رزرو شده است');
      }
    }
    return this.prisma.booking.update({ where: { id }, data: { startAt, endAt } });
  }"""
assert old_reschedule in text, 'reschedule missing'
text = text.replace(old_reschedule, new_reschedule, 1)
path.write_text(text)
print('patched', path.stat().st_size)
print('maxBufferMin', text.count('maxBufferMin'))
