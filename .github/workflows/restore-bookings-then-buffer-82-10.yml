name: restore-bookings-then-buffer-82-10
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-then-buffer-82-10.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base then apply #82.10 bufferMin
        run: |
          set -e
          git show 5fd76545f4516bd5187816ac7251febec453a026:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          python3 << 'PY'
from pathlib import Path
path = Path('backend/src/bookings/bookings.service.ts')
text = path.read_text()
helpers = '''
  /**
   * #82.10 — Trailing buffer (minutes) from professional services on booking items.
   * Default 0 keeps prior behavior when buffer is unset.
   */
  private maxBufferMin(
    items: Array<{
      bufferMin?: number | null;
      professionalService?: { bufferMin?: number | null } | null;
    }>,
  ): number {
    let max = 0;
    for (const it of items) {
      const fromPs = it.professionalService?.bufferMin;
      const direct = it.bufferMin;
      const v = typeof fromPs === 'number' ? fromPs : typeof direct === 'number' ? direct : 0;
      if (v > max) max = v;
    }
    return Math.max(0, max);
  }

  /** Two bookings conflict when either starts inside the other's service + trailing buffer. */
  private bookingRangesConflict(
    aStart: Date,
    aEnd: Date,
    aBufferMin: number,
    bStart: Date,
    bEnd: Date,
    bBufferMin: number,
  ): boolean {
    const aBusyEnd = aEnd.getTime() + Math.max(0, aBufferMin) * 60_000;
    const bBusyEnd = bEnd.getTime() + Math.max(0, bBufferMin) * 60_000;
    return aStart.getTime() < bBusyEnd && bStart.getTime() < aBusyEnd;
  }

'''
marker = "  ) {}\n\n  async create("
assert marker in text, 'constructor marker missing'
text = text.replace(marker, "  ) {}\n" + helpers + "  async create(", 1)
old_end = """    const endAt = new Date(startAt.getTime() + totalDuration * 60_000);

