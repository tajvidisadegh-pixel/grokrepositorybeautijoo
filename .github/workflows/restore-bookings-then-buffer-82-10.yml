name: restore-bookings-then-buffer-82-10
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-then-buffer-82-10.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base then apply #82.10 bufferMin
        run: |
          set -e
          git show 5fd76545f4516bd5187816ac7251febec453a026:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          echo 'REPLACE_B64' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -c maxBufferMin backend/src/bookings/bookings.service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git commit -m "fix(#82.10): apply professionalService.bufferMin in booking overlap (create/reschedule)"
          git push
