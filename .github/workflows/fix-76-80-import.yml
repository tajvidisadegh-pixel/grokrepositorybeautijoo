name: fix-76-80-import
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text(encoding='utf-8')
          t = t.replace("import { setCustomerNote, getCustomerNotes } from '@/lib/panel-api';\n", '', 1)
          old = "  reportBookingToAdmin,\n  type BookingListItem,\n} from '@/lib/panel-api';"
          new = "  reportBookingToAdmin,\n  setCustomerNote,\n  getCustomerNotes,\n  type BookingListItem,\n} from '@/lib/panel-api';"
          if old in t and 'setCustomerNote' not in t.split('panel-api')[0]:
              t = t.replace(old, new, 1)
          elif 'setCustomerNote' not in t:
              t = t.replace(
                  "type BookingListItem,\n} from '@/lib/panel-api';",
                  "type BookingListItem,\n  setCustomerNote,\n  getCustomerNotes,\n} from '@/lib/panel-api';",
                  1,
              )
          p.write_text(t, encoding='utf-8')
          print('fixed', t[:80])
          PY
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "fix: move setCustomerNote import after use client" && git push; fi
