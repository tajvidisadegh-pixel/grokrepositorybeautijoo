name: run-83-scripts
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch_backend83.py'
      - 'scripts/patch_frontend83.py'
      - '.github/TRIGGER_RUN_83'
      - '.github/workflows/run-83-scripts.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch scripts
        run: |
          set -e
          python3 scripts/patch_backend83.py
          python3 scripts/patch_frontend83.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix(#83): tickets, admin bookings, confirm offline, search params, wording" || exit 0
          git push
