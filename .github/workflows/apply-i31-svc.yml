name: Apply issue 31 service updateMine + portfolio UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-i31-svc.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch media.service updateMine + video
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/media/media.service.ts')
          t = p.read_text()
          if 'updateMine' not in t:
              t = t.replace(
                  "  assertNotSuspicious,\n  assertUploadSize,\n  uploadMaxPortfolio,\n} from './upload-security';",
                  "  assertNotSuspicious,\n  assertUploadSize,\n  uploadMaxPortfolio,\n  isVideoMime,\n} from './upload-security';",
              )
              # fix assertUploadSize call to pass mime
              t = t.replace(
                  'assertUploadSize(raw.length);\n      assertNotSuspicious(raw);',
                  "assertUploadSize(raw.length, file.mimetype);\n      assertNotSuspicious(raw, file.mimetype);\n\n      const isVideo =\n        isVideoMime(file.mimetype) ||\n        /\\.(mp4|webm|mov|m4v)$/i.test(file.originalname || '');\n      if (isVideo && kind !== MediaKind.portfolio && kind !== MediaKind.service) {\n        throw new BadRequestException('ویدیو فقط برای پورتفولیو یا خدمت مجاز است');\n      }",
              )
              t = t.replace(
                  'const processed = await this.processImage(raw);',
                  "const processed = isVideo\n        ? { buffer: raw, mime: (file.mimetype || 'video/mp4').toLowerCase(), ext: ((file.originalname || '').toLowerCase().endsWith('.webm') ? 'webm' : (file.originalname || '').toLowerCase().endsWith('.mov') ? 'mov' : 'mp4') }\n        : await this.processImage(raw);",
              )
              insert = '''
  async updateMine(userId: string, mediaId: string, dto: {
    title?: string | null;
    price?: number | null;
    durationMin?: number | null;
    professionalServiceId?: string | null;
    sortOrder?: number;
  }) {
    const pro = await this.prisma.professional.findUnique({ where: { userId } });
    if (!pro) throw new NotFoundException('پروفایل زیباگر یافت نشد');
    const media = await this.prisma.mediaAsset.findFirst({
      where: { id: mediaId, professionalId: pro.id },
    });
    if (!media) throw new NotFoundException('رسانه یافت نشد');
    if (dto.professionalServiceId) {
      const ps = await this.prisma.professionalService.findFirst({
        where: { id: dto.professionalServiceId, professionalId: pro.id },
      });
      if (!ps) throw new ForbiddenException('خدمت متعلق به شما نیست');
    }
    const data: Record<string, unknown> = {};
    if (dto.title !== undefined) data.title = dto.title ? String(dto.title).trim().slice(0, 200) : null;
    if (dto.price !== undefined) {
      if (dto.price == null) data.price = null;
      else {
        const pr = Math.floor(Number(dto.price));
        if (!Number.isFinite(pr) || pr < 0) throw new BadRequestException('قیمت نامعتبر است');
        data.price = pr;
      }
    }
    if (dto.durationMin !== undefined) {
      if (dto.durationMin == null) data.durationMin = null;
      else {
        const d = Math.floor(Number(dto.durationMin));
        if (!Number.isFinite(d) || d < 1 || d > 24 * 60) throw new BadRequestException('مدت (دقیقه) نامعتبر است');
        data.durationMin = d;
      }
    }
    if (dto.professionalServiceId !== undefined) data.professionalServiceId = dto.professionalServiceId || null;
    if (dto.sortOrder !== undefined) data.sortOrder = Math.floor(Number(dto.sortOrder)) || 0;
    const updated = await this.prisma.mediaAsset.update({ where: { id: mediaId }, data });
    return withPublicUrl(updated);
  }

'''
              t = t.replace('  async publish(userId: string, mediaId: string)', insert + '  async publish(userId: string, mediaId: string)')
              p.write_text(t)
              print('service patched')
          else:
              print('service already has updateMine')
          PY
      - name: Write portfolio page from curl of prepared gist-like raw if missing edit
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          t = p.read_text()
          if 'openEdit' in t and 'MAX_VIDEO_BYTES' in t:
              print('portfolio already enhanced')
          else:
              # minimal enhancement: add Edit button that PATCHes title only via prompt for now
              # Full UI will be in a follow-up; ensure at least Edit exists
              if 'ویرایش' not in t:
                  t = t.replace(
                      "{m.status !== 'published' && (",
                      """<Button size=\"sm\" variant=\"outline\" loading={busy} onClick={async () => {
                      const title = window.prompt('عنوان (اختیاری):', '');
                      const price = window.prompt('قیمت تومان (اختیاری):', '');
                      const durationMin = window.prompt('مدت دقیقه (اختیاری):', '');
                      setBusy(true);
                      try {
                        await apiClient.patch(`/professionals/me/media/${m.id}`, {
                          title: title || null,
                          price: price ? Number(price.replace(/[^\\d]/g, '')) || null : null,
                          durationMin: durationMin ? Number(durationMin.replace(/[^\\d]/g, '')) || null : null,
                        });
                        setMsg('ذخیره شد.');
                        await load();
                      } catch (e) { setMsg(friendlyApiError(e)); }
                      finally { setBusy(false); }
                    }}>ویرایش</Button>
                    {m.status !== 'published' && (""",
                  )
                  # allow video accept
                  t = t.replace(
                      'accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.gif,.heic"',
                      'accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.gif,.heic,video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov"',
                  )
                  t = t.replace(
                      "if (!isAllowedImageFile(file)) {\n      setMsg('فقط تصویر JPG/PNG/WEBP/GIF/HEIC مجاز است.');\n      return;\n    }",
                      """const isVid = (file.type || '').startsWith('video/') || /\\.(mp4|webm|mov)$/i.test(file.name || '');
    if (!isAllowedImageFile(file) && !isVid) {
      setMsg('فقط تصویر یا ویدیو MP4/WEBM/MOV مجاز است.');
      return;
    }
    if (!isVid && file.size > 10 * 1024 * 1024) {
      setMsg('حجم تصویر حداکثر ۱۰ مگابایت است.');
      return;
    }
    if (isVid && file.size > 500 * 1024 * 1024) {
      setMsg('حجم ویدیو حداکثر ۵۰۰ مگابایت است.');
      return;
    }""",
                  )
                  t = t.replace('آپلود تصویر', 'آپلود تصویر / ویدیو')
                  p.write_text(t)
                  print('portfolio enhanced minimally')
              else:
                  print('has ویرایش already')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "feat(#31): updateMine + portfolio edit/video limits"
            git push
          fi
