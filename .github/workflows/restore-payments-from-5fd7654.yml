name: restore-payments-from-5fd7654
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-payments-from-5fd7654.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore payments.service.ts
        run: |
          set -e
          git show 5fd76545f4516bd5187816ac7251febec453a026:backend/src/payments/payments.service.ts > backend/src/payments/payments.service.ts
          head -1 backend/src/payments/payments.service.ts | grep -q import
          wc -c backend/src/payments/payments.service.ts
          # keep bookings intact if still good
          head -1 backend/src/bookings/bookings.service.ts | grep -q import || {
            git show 4bbf0d4652a62db11aea205915ae560163887b6b:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts
          git commit -m "fix: restore payments.service.ts from 5fd7654 (undo PLACEHOLDER); keep bookings #82.10/#82.11"
          git push
