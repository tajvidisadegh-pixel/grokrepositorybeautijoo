name: apply-issue-82-restore-and-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-82-restore-and-patch.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch payments and bookings
        run: |
          set -euo pipefail
          git show 9205c72:backend/src/payments/payments.service.ts > backend/src/payments/payments.service.ts
          git show 9205c72:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          echo "restored from 9205c72"
          wc -l backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts

          python3 << 'PY'
          from pathlib import Path

          # --- payments 82.5 ---
          p = Path("backend/src/payments/payments.service.ts")
          t = p.read_text()
          if "#82.5" in t and "booking_cancelled" in t:
              print("payments already has 82.5")
          else:
              marker = "    const verified = await this.provider.verify(providerRef, payment.amount);"
              end_marker = "    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };\n  }"
              i = t.find(marker)
              j = t.find(end_marker, i)
              if i < 0 or j < 0:
                  raise SystemExit(f"payments anchors not found i={i} j={j}")
              j = j + len(end_marker)
              new_block = r"""    const verified = await this.provider.verify(providerRef, payment.amount);
    if (!verified.success) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: { status: PaymentStatus.failed },
      });
      await this.releaseUnpaidPendingBooking(
        payment.bookingId,
        'payment_verify_failed',
      );
      return { status: 'failed', bookingId: payment.bookingId };
    }

    // #82.5 - never mark paid / confirm against a cancelled booking
    const bookingRow =
      payment.booking ||
      (await this.prisma.booking.findUnique({ where: { id: payment.bookingId } }));
    if (!bookingRow) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: {
          status: PaymentStatus.failed,
          metadata: {
            ...(typeof payment.metadata === 'object' && payment.metadata !== null
              ? (payment.metadata as object)
              : {}),
            gatewayRefId: verified.refId ?? null,
            rejectReason: 'booking_missing',
          },
        },
      });
      return { status: 'failed', bookingId: payment.bookingId, reason: 'booking_missing' };
    }
    if (bookingRow.status === BookingStatus.cancelled) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: {
          status: PaymentStatus.failed,
          metadata: {
            ...(typeof payment.metadata === 'object' && payment.metadata !== null
              ? (payment.metadata as object)
              : {}),
            gatewayRefId: verified.refId ?? null,
            rejectReason: 'booking_cancelled',
            verifiedButRejected: true,
          },
        },
      });
      try {
        if (payment.providerRef) {
          await this.provider.refund({
            providerRef: payment.providerRef,
            amount: payment.amount,
            reason: 'booking cancelled before payment confirm',
          });
        }
      } catch {
        /* non-blocking */
      }
      return {
        status: 'failed',
        bookingId: payment.bookingId,
        reason: 'booking_cancelled',
      };
    }

    // #82.5 - expired or pending: re-check slot before confirming
    if (
      bookingRow.status === BookingStatus.expired ||
      bookingRow.status === BookingStatus.pending
    ) {
      const overlap = await this.prisma.booking.count({
        where: {
          professionalId: bookingRow.professionalId,
          id: { not: bookingRow.id },
          status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      const timeOff = await this.prisma.timeOff.count({
        where: {
          professionalId: bookingRow.professionalId,
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      const manual = await this.prisma.manualReservation.count({
        where: {
          professionalId: bookingRow.professionalId,
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      if (overlap > 0 || timeOff > 0 || manual > 0) {
        await this.prisma.payment.update({
          where: { id: payment.id },
          data: {
            status: PaymentStatus.failed,
            metadata: {
              ...(typeof payment.metadata === 'object' && payment.metadata !== null
                ? (payment.metadata as object)
                : {}),
              gatewayRefId: verified.refId ?? null,
              rejectReason: 'slot_unavailable',
              verifiedButRejected: true,
            },
          },
        });
        try {
          if (payment.providerRef) {
            await this.provider.refund({
              providerRef: payment.providerRef,
              amount: payment.amount,
              reason: 'slot unavailable at payment confirm',
            });
          }
        } catch {
          /* non-blocking */
        }
        return {
          status: 'failed',
          bookingId: payment.bookingId,
          reason: 'slot_unavailable',
        };
      }
    }

    const rateRow = await this.prisma.platformSetting.findUnique({
      where: { key: PLATFORM_COMMISSION_RATE_KEY },
    });
    const rate =
      rateRow?.value != null && Number.isFinite(Number(rateRow.value))
        ? Number(rateRow.value)
        : DEFAULT_PLATFORM_COMMISSION_RATE;
    const { commissionAmount, professionalNetAmount } = calculateCommission(
      payment.amount,
      rate,
    );

    await this.prisma.payment.update({
      where: { id: payment.id },
      data: {
        status: PaymentStatus.paid,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          ...(typeof payment.metadata === 'object' && payment.metadata !== null
            ? (payment.metadata as object)
            : {}),
          gatewayRefId: verified.refId ?? null,
        },
      },
    });

    if (
      bookingRow.status === BookingStatus.pending ||
      bookingRow.status === BookingStatus.expired
    ) {
      await this.prisma.booking.update({
        where: { id: payment.bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }

    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };
  }"""
              p.write_text(t[:i] + new_block + t[j:])
              print("payments 82.5 applied")

          # --- bookings 82.7 ---
          p = Path("backend/src/bookings/bookings.service.ts")
          t = p.read_text()
          if "#82.7" in t:
              print("82.7 already present")
          else:
              old = """      // Customer cancel of confirmed/paid remains (policy may refund later)
      return this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelReason: reason ?? null,
          cancelledAt: new Date(),
        },
      });
    }"""
              new = """      // #82.7 - customer cancel of paid booking: issue gateway refund
      if (isCustomer && paid && b.payment?.id) {
        try {
          await this.payments.refund(
            b.payment.id,
            reason?.trim() || 'customer cancel',
            userId,
          );
        } catch (err) {
          this.logger.warn(
            `customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`,
          );
          return this.prisma.booking.update({
            where: { id },
            data: {
              status: BookingStatus.cancelled,
              cancelReason: reason ?? 'customer cancel (refund failed)',
              cancelledAt: new Date(),
            },
          });
        }
        return this.prisma.booking.findUniqueOrThrow({ where: { id } });
      }

      return this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelReason: reason ?? null,
          cancelledAt: new Date(),
        },
      });
    }"""
              if old not in t:
                  print("WARNING: 82.7 anchor missing")
              else:
                  p.write_text(t.replace(old, new, 1))
                  print("82.7 applied")

          t = p.read_text()
          if "PaymentsService" not in t:
              raise SystemExit("PaymentsService missing")
          print("PaymentsService present")

          Path("docs").mkdir(exist_ok=True)
          Path("docs/SECURITY_ISSUE_82_9.md").write_text(
              "# Issue 82.9 - Repository exposure and secret hygiene\n\n"
              "## Owner actions\n"
              "1. Make the repository private on GitHub.\n"
              "2. Run gitleaks / trufflehog on history.\n"
              "3. Rotate any leaked secrets immediately.\n\n"
              "## App-side hygiene\n"
              "- Never commit .env or payment/SMS keys.\n"
              "- Production must set real PAYMENT_PROVIDER.\n"
          )
          print("security doc written")
          pt = Path("backend/src/payments/payments.service.ts").read_text()
          bt = Path("backend/src/bookings/bookings.service.ts").read_text()
          print("markers:", "#82.5" in pt, "#82.7" in bt)
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts docs/SECURITY_ISSUE_82_9.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "fix(82.5-9): restore services + callback guards, paid cancel refund, security hygiene"
          git push
