name: Apply issue 73 portfolio gallery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-73.yml'
      - 'scripts/patch_issue_73_portfolio_gallery.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_73_portfolio_gallery.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/portfolio/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#73): multi-file portfolio upload + denser thumbnail grid"
          git push origin HEAD:main
