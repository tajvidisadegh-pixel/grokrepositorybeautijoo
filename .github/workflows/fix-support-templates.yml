name: Fix support templates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-support-templates.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix escaped backticks
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/support/page.tsx')
          t = p.read_text()
          # Fix wrongly escaped template literals from apply script
          t2 = t.replace('\\`', '`').replace('\\${', '${')
          # Also handle single-backslash forms if present as two chars
          t2 = t2.replace('\\`', '`')
          # direct replacements for the known bad patterns
          t2 = t.replace(
              r'\`/support/tickets/\${id}\`',
              '`/support/tickets/${id}`',
          ).replace(
              r'\`/support/tickets/\${selectedId}/messages\`',
              '`/support/tickets/${selectedId}/messages`',
          )
          p.write_text(t2)
          print('fixed', p)
          for i,l in enumerate(t2.splitlines(),1):
            if 'apiClient' in l and 'support/tickets' in l:
              print(i, l)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/support/page.tsx
          git commit -m "fix(#30): correct template literals in zibagar support page" || echo no-change
          git push
