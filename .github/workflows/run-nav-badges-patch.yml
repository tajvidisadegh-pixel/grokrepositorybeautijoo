name: Run nav-badges patch
on:
  push:
    paths:
      - '.github/workflows/run-nav-badges-patch.yml'
      - 'scripts/patch-nav-badges.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-nav-badges.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-nav-badges-patch.yml
          git add backend/src/admin/admin.service.ts backend/src/admin/admin.controller.ts
          git add -A
          git diff --cached --quiet || git commit -m "feat(admin): nav-badges endpoint for sidebar counts (#38)"
          git push
