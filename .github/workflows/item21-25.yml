name: apply-item-31-32

on:
  push:
    paths:
      - '.github/triggers/apply-31-32.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend
        run: |
          echo "" | base64 -d > /tmp/patch31.py
          python3 /tmp/patch31.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/professionals/professionals.service.ts backend/src/auth/auth.service.ts
          git commit -m "feat(#40): items 31-32 concurrent booking limit + last activity" || echo nochange
          git push
