name: apply-item-36-40

on:
  push:
    paths:
      - '.github/triggers/apply-36-40.flag'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 .github/triggers/patch-36-40.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(#40): items 36-40 rating, pro search, hours conflict, contact after confirm, recent searches" || echo nochange
          git push
