name: item21-25b
on:
  push:
    paths:
      - '.github/workflows/item21-25.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          s = p.read_text()
          if "phoneVerified" not in s:
              old = "if (!data.serviceIds?.length) throw new BadRequestException('حداقل یک خدمت لازم است');\n\n    const pro = await this.prisma.professional.findUnique"
              new = "if (!data.serviceIds?.length) throw new BadRequestException('حداقل یک خدمت لازم است');\n\n    const customer = await this.prisma.user.findUnique({ where: { id: customerId } });\n    if (!customer) throw new NotFoundException('کاربر یافت نشد');\n    if (!customer.phoneVerified) {\n      throw new BadRequestException('قبل از رزرو باید شماره موبایل با کد یکبارمصرف تأیید شود');\n    }\n\n    const pro = await this.prisma.professional.findUnique"
              if old not in s:
                  # softer
                  old2 = "if (!data.serviceIds?.length) throw new BadRequestException('حداقل یک خدمت لازم است');"
                  if old2 not in s:
                      raise SystemExit('needle')
                  s = s.replace(old2, old2 + "\n\n    const customer = await this.prisma.user.findUnique({ where: { id: customerId } });\n    if (!customer) throw new NotFoundException('کاربر یافت نشد');\n    if (!customer.phoneVerified) {\n      throw new BadRequestException('قبل از رزرو باید شماره موبایل با کد یکبارمصرف تأیید شود');\n    }", 1)
              else:
                  s = s.replace(old, new, 1)
              p.write_text(s)
              print('phone', 'phoneVerified' in s)
          else:
              print('phone ok')

          w = Path('frontend/src/components/booking/booking-wizard.tsx')
          ws = w.read_text()
          if 'CancelPolicyNotice' not in ws:
              if "from '@/lib/api-errors'" in ws:
                  ws = ws.replace("from '@/lib/api-errors';", "from '@/lib/api-errors';\nimport { CancelPolicyNotice } from '@/components/booking/cancel-policy-notice';", 1)
              ws = ws.replace('{submitError && (', '<CancelPolicyNotice className="mb-3" />\n          {submitError && (', 1)
              w.write_text(ws)
              print('wizard', 'CancelPolicyNotice' in ws)
          else:
              print('wizard ok')
          print('done')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item21-25.yml
          git add -A
          git commit -m "feat: phoneVerified before booking + cancel policy notice (#40 21,25)" || echo nothing
          git push
