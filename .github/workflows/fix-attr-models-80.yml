name: Fix attr models 80

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-attr-models-80.yml'
      - 'scripts/add_attr_models_80.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert missing models
        run: python3 scripts/add_attr_models_80.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#80): add ServiceAttributeGroup/Option models to schema"
          git push origin HEAD:main
