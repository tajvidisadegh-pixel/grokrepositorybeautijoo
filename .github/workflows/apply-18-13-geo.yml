name: apply-18-13-geo
on:
  push:
    paths:
      - 'scripts/apply_18_13_geo.py'
      - '.github/workflows/apply-18-13-geo.yml'
      - 'backend/src/common/geo.ts'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend search for geo
        run: |
          set -euo pipefail
          python3 scripts/apply_18_13_geo.py
          grep -n 'parseGeoQuery\|radiusKm\|haversineKm\|boundingBox' backend/src/professionals/professionals.service.ts backend/src/professionals/professionals.controller.ts backend/src/service-filters/service-filters.controller.ts | head -40
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/professionals/professionals.service.ts backend/src/professionals/professionals.controller.ts backend/src/service-filters/service-filters.controller.ts backend/src/service-filters/service-filters.service.ts
          if git diff --staged --quiet; then echo nochange; exit 0; fi
          git commit -m 'feat(18.13): wire lat/lng/radiusKm radius filter into professional search'
          git pull --rebase origin main
          git push
