name: fix-hours-const
on:
  push:
    paths:
      - scripts/fix_hours_const.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_hours_const.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m 'fix: prefer-const in multi-day time off (#61.29)' && git push)
