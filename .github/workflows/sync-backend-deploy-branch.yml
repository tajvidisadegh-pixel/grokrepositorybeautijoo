# Controlled backend deploy branch (gap 18.15 / DEPLOYMENT Option B).
# - Automatic: Git tags matching v*
# - Manual: workflow_dispatch with explicit ref
# - NOT on every push to main (prevents accidental production drift)
# - Force-push ONLY to beautijoo-backend-export (never main)
name: Sync backend deployment branch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact Git ref or tag to export from (e.g. main, v1.2.0, or commit SHA).'
        required: true
        type: string
        default: 'main'

permissions:
  contents: write

jobs:
  sync-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Determine target ref
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
            if [ -z "$REF" ]; then
              echo "::error::ref input is required for workflow_dispatch"
              exit 1
            fi
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unsupported event"
            exit 1
          fi

      - name: Checkout the exact target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}

      - name: Confirm checked-out commit
        run: |
          echo "Requested ref : ${{ steps.target.outputs.ref }}"
          echo "Checked out   : $(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Split backend subtree from the exact checked-out commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=backend --branch=backend-deploy-sync

      - name: Update backend deployment branch (force-push ONLY to beautijoo-backend-export)
        run: |
          git push origin backend-deploy-sync:beautijoo-backend-export --force
          echo "beautijoo-backend-export updated from $(git rev-parse HEAD)"
