name: fix-batch-9-items
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- admin-ops updateUserProfile ---
          p = Path('backend/src/admin/admin-ops.controller.ts')
          text = p.read_text(encoding='utf-8')
          old = """  @RequirePermissions('admin.users.write')
  @Patch('users/:id/profile')
  async updateUserProfile(
    @Param('id') id: string,
    @Body() dto: UpdateUserProfileDto,
    @CurrentUser('id') actorId?: string,
  ) {
    const existing = await this.prisma.user.findUnique({ where: { id } });
    if (!existing) throw new NotFoundException('not found');
    if (dto.phone?.trim() && normalizeIranPhone(dto.phone) !== normalizeIranPhone(existing.phone || '')) {
      const nextPhone = normalizeIranPhone(dto.phone);
      if (
        await this.prisma.user.findFirst({
          where: { phone: nextPhone, accountType: existing.accountType, NOT: { id } },
        })
      ) {
        throw new ConflictException('phone exists');
      }
      dto.phone = nextPhone;
      await this.prisma.user.update({ where: { id }, data: { phone: dto.phone.trim() } });
    }
    const profileData: any = {};
    if (dto.displayName !== undefined) profileData.displayName = dto.displayName.trim() || existing.phone || 'User';
    if (dto.firstName !== undefined) profileData.firstName = dto.firstName.trim() || null;
    if (dto.lastName !== undefined) profileData.lastName = dto.lastName.trim() || null;
    if (Object.keys(profileData).length) {
      await this.prisma.profile.upsert({
        where: { userId: id },
        update: profileData,
        create: {
          userId: id,
          displayName: profileData.displayName || existing.phone || 'User',
          firstName: profileData.firstName ?? null,
          lastName: profileData.lastName ?? null,
        },
      });
    }
    await this.audit(actorId, 'admin.user.profile.update', 'user', id, dto);
    return this.prisma.user.findUnique({
      where: { id },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
  }"""
          new = """  @RequirePermissions('admin.users.write')
  @Patch('users/:id/profile')
  async updateUserProfile(
    @Param('id') id: string,
    @Body() dto: UpdateUserProfileDto,
    @CurrentUser('id') actorId?: string,
  ) {
    const existing = await this.prisma.user.findUnique({ where: { id } });
    if (!existing) throw new NotFoundException('not found');
    let phoneChanged = false;
    if (dto.phone?.trim() && normalizeIranPhone(dto.phone) !== normalizeIranPhone(existing.phone || '')) {
      const nextPhone = normalizeIranPhone(dto.phone);
      if (!nextPhone || nextPhone.length < 10) {
        throw new BadRequestException('شماره موبایل نامعتبر است');
      }
      const owner = await this.prisma.user.findFirst({
        where: { phone: nextPhone, NOT: { id } },
        select: { id: true },
      });
      if (owner) {
        throw new ConflictException('این شماره متعلق به کاربر دیگری است');
      }
      phoneChanged = true;
      await this.prisma.user.update({
        where: { id },
        data: { phone: nextPhone, phoneVerified: false },
      });
    }
    const profileData: any = {};
    if (dto.displayName !== undefined) profileData.displayName = dto.displayName.trim() || existing.phone || 'User';
    if (dto.firstName !== undefined) profileData.firstName = dto.firstName.trim() || null;
    if (dto.lastName !== undefined) profileData.lastName = dto.lastName.trim() || null;
    if (Object.keys(profileData).length) {
      await this.prisma.profile.upsert({
        where: { userId: id },
        update: profileData,
        create: {
          userId: id,
          displayName: profileData.displayName || existing.phone || 'User',
          firstName: profileData.firstName ?? null,
          lastName: profileData.lastName ?? null,
        },
      });
    }
    if (phoneChanged) {
      await this.prisma.refreshToken.updateMany({
        where: { userId: id, revokedAt: null },
        data: { revokedAt: new Date() },
      });
      try {
        const { userAuthCache } = await import('../auth/user-auth-cache');
        userAuthCache.invalidate(id);
      } catch { /* optional */ }
    }
    await this.audit(actorId, 'admin.user.profile.update', 'user', id, {
      phoneChanged,
      displayNameChanged: dto.displayName !== undefined,
      firstNameChanged: dto.firstName !== undefined,
      lastNameChanged: dto.lastName !== undefined,
    });
    return this.prisma.user.findUnique({
      where: { id },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
  }"""
          if old not in text:
              raise SystemExit('admin-ops block missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('admin-ops ok')

          # --- bookings.service ---
          p = Path('backend/src/bookings/bookings.service.ts')
          text = p.read_text(encoding='utf-8')
          if text.strip() == 'PLACEHOLDER' or len(text) < 500:
              raise SystemExit('bookings.service is PLACEHOLDER — abort')

          old = """    const admins = await this.prisma.user.findMany({
      where: { userRoles: { some: { role: { name: { in: ['admin', 'SUPER_ADMIN'] } } } } },
      select: { id: true },
      take: 20,
    });"""
          new = """    const admins = await this.prisma.user.findMany({
      where: {
        status: 'active',
        userRoles: { some: { role: { name: { in: ['admin', 'SUPER_ADMIN'] } } } },
      },
      select: { id: true },
    });"""
          if old not in text:
              raise SystemExit('reportIssue admins missing')
          text = text.replace(old, new, 1)

          old = """    if (query.from || query.to) {
      where.startAt = {};
      if (query.from) (where.startAt as Prisma.DateTimeFilter).gte = new Date(query.from);
      if (query.to) (where.startAt as Prisma.DateTimeFilter).lte = new Date(query.to);
    }"""
          new = """    if (query.from || query.to) {
      where.startAt = {};
      if (query.from) {
        const from = new Date(query.from);
        if (isNaN(from.getTime())) {
          throw new BadRequestException('پارامتر from تاریخ معتبر نیست');
        }
        (where.startAt as Prisma.DateTimeFilter).gte = from;
      }
      if (query.to) {
        const to = new Date(query.to);
        if (isNaN(to.getTime())) {
          throw new BadRequestException('پارامتر to تاریخ معتبر نیست');
        }
        (where.startAt as Prisma.DateTimeFilter).lte = to;
      }
    }"""
          if old not in text:
              raise SystemExit('listMine dates missing')
          text = text.replace(old, new, 1)

          old = """    if (!existing) throw new NotFoundException();
    if (existing.customerId !== userId) throw new ForbiddenException();
    const allowedPre: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];"""
          new = """    if (!existing) throw new NotFoundException();
    {
      const pro = await this.prisma.professional.findFirst({ where: { userId } });
      const isCustomer = existing.customerId === userId;
      const isPro = !!pro && pro.id === existing.professionalId;
      if (!isCustomer && !isPro) throw new ForbiddenException();
    }
    const allowedPre: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];"""
          if old not in text:
              raise SystemExit('reschedule ownership missing')
          text = text.replace(old, new, 1)

          old = """      } catch (err) {
        this.logger.warn(`post-create notify failed booking=${booking.id}: ${(err as Error)?.message || err}`);
      }
      return booking;"""
          new = """      } catch (err) {
        this.logger.warn(`post-create notify failed booking=${booking.id}: ${(err as Error)?.message || err}`);
      }
      try {
        const payMode = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();
        const provider = (process.env.PAYMENT_PROVIDER || '').toString().trim().toLowerCase();
        const offline =
          payMode === 'offline' ||
          payMode === 'no_gateway' ||
          payMode === 'pay_later' ||
          (payMode === 'auto' && (!provider || provider === 'disabled' || provider === 'none'));
        if (offline) {
          await this.payments.initiate(customerId, booking.id, 'https://localhost/offline');
          const refreshed = await this.prisma.booking.findUnique({
            where: { id: booking.id },
            include: { items: true, payment: true },
          });
          if (refreshed) return refreshed;
        }
      } catch (err) {
        this.logger.warn(
          `offline auto-confirm failed booking=${booking.id}: ${(err as Error)?.message || err}`,
        );
      }
      return booking;"""
          if old not in text:
              raise SystemExit('post-create return missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          print('bookings ok')

          # --- availability ---
          p = Path('backend/src/availability/availability.service.ts')
          text = p.read_text(encoding='utf-8')
          old = """    return { date: dateStr, professionalId, durationMin, slots, timezone: TEHRAN_TZ };
  }"""
          new = """    const publicSlots = slots.filter((s) => s.available);
    return {
      date: dateStr,
      professionalId,
      durationMin,
      slots: publicSlots,
      timezone: TEHRAN_TZ,
    };
  }"""
          if old not in text:
              raise SystemExit('getSlots return missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('availability ok')

          # --- payments offline metadata ---
          p = Path('backend/src/payments/payments.service.ts')
          text = p.read_text(encoding='utf-8')
          old = """        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
        },"""
          new = """        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
          settlementEligible: false,
          realMoney: false,
        },"""
          if old not in text:
              raise SystemExit('offline metadata missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('payments ok')

          # --- impersonation storage ---
          Path('frontend/src/lib/impersonation-storage.ts').write_text(
              Path('/dev/stdin').read_text() if False else '''/**\n * Impersonation state.\n * Admin access backup uses sessionStorage so a page reload does not trap the\n * admin inside the customer session (memory-only was lost on reload).\n * sessionStorage is tab-scoped and cleared when the tab closes.\n */\n\nconst ADMIN_BACKUP_KEY = \'bj_imp_admin_access_v1\';\nconst META_KEY = \'bj_imp_meta_v1\';\n\nexport type ImpersonationMeta = {\n  customerId: string;\n  customerName: string | null;\n  customerPhone: string | null;\n  startedAt: string;\n};\n\nfunction canUseSession(): boolean {\n  return typeof window !== \'undefined\' && typeof sessionStorage !== \'undefined\';\n}\n\nexport function saveAdminAccessBackup(accessToken: string) {\n  if (!canUseSession()) return;\n  try {\n    sessionStorage.setItem(ADMIN_BACKUP_KEY, accessToken);\n  } catch {\n    /* private mode / quota */\n  }\n}\n\nexport function takeAdminAccessBackup(): string | null {\n  if (!canUseSession()) return null;\n  try {\n    const v = sessionStorage.getItem(ADMIN_BACKUP_KEY);\n    sessionStorage.removeItem(ADMIN_BACKUP_KEY);\n    return v;\n  } catch {\n    return null;\n  }\n}\n\nexport function peekAdminAccessBackup(): string | null {\n  if (!canUseSession()) return null;\n  try {\n    return sessionStorage.getItem(ADMIN_BACKUP_KEY);\n  } catch {\n    return null;\n  }\n}\n\nexport function setImpersonationMeta(meta: ImpersonationMeta) {\n  if (!canUseSession()) return;\n  try {\n    sessionStorage.setItem(META_KEY, JSON.stringify(meta));\n  } catch {\n    /* ignore */\n  }\n}\n\nexport function getImpersonationMeta(): ImpersonationMeta | null {\n  if (!canUseSession()) return null;\n  try {\n    const raw = sessionStorage.getItem(META_KEY);\n    if (!raw) return null;\n    return JSON.parse(raw) as ImpersonationMeta;\n  } catch {\n    return null;\n  }\n}\n\nexport function clearImpersonationMeta() {\n  if (!canUseSession()) return;\n  try {\n    sessionStorage.removeItem(META_KEY);\n  } catch {\n    /* ignore */\n  }\n}\n''',
              encoding='utf-8',
          )
          print('impersonation ok')
          print('ALL PATCHES APPLIED')
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts \
                  backend/src/bookings/bookings.service.ts \
                  backend/src/availability/availability.service.ts \
                  backend/src/payments/payments.service.ts \
                  frontend/src/lib/impersonation-storage.ts
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: batch items — admin phone ownership/sessions, reportIssue all admins, offline auto-confirm, pro reschedule, slots privacy, invalid from/to, impersonation sessionStorage"
          git push origin HEAD:main
