name: fix-cancel-slots
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/TRIGGER_CANCEL_SLOTS'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          set -e
          sed -i "s/BOOKING_FREE_CANCEL_HOURS || '24'/BOOKING_FREE_CANCEL_HOURS || '2'/g" backend/src/bookings/bookings.service.ts
          sed -i 's/freeH >= 0 ? freeH : 24/freeH >= 0 ? freeH : 2/g' backend/src/bookings/bookings.service.ts
          if ! grep -q 'کمتر از' backend/src/bookings/bookings.service.ts; then
            python3 -c "
          from pathlib import Path
          p=Path('backend/src/bookings/bookings.service.ts')
          t=p.read_text()
          m='const msLeft = b.startAt.getTime() - Date.now();'
          inj=m+'''\n        if (hours > 0 && msLeft < hours * 3600_000) {\n          throw new BadRequestException(\n            \`کمتر از \${hours} ساعت به نوبت مانده و امکان لغو وجود ندارد.\`,\n          );\n        }'''
          if m not in t: raise SystemExit('no msLeft')
          t=t.replace(m,inj,1)
          bad=\"throw new BadRequestException('استرداد پرداخت ناموفق بود. رزرو لغو نشد؛ لطفاً بعداً تلاش کنید یا با پشتیبانی تماس بگیرید.');\"
          good=\"return this.prisma.booking.update({ where: { id }, data: { status: BookingStatus.cancelled, cancelReason: reason ?? null, cancelledAt: new Date(), notes: [b.notes, 'REFUND_PENDING:offline_ok'].filter(Boolean).join(' | ').slice(0, 2000) } });\"
          if bad in t: t=t.replace(bad,good,1)
          p.write_text(t)
          print('cancel inject ok')
          "
          fi
          sed -i 's/border-red-300 bg-red-50 text-red-700 line-through opacity-80/border-gray-200 bg-gray-100 text-gray-400 line-through/g' frontend/src/components/booking/booking-wizard.tsx
          grep -n "BOOKING_FREE_CANCEL\|کمتر از" backend/src/bookings/bookings.service.ts | head -10
          grep -n "cursor-not-allowed border-" frontend/src/components/booking/booking-wizard.tsx | head -3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts frontend/src/components/booking/booking-wizard.tsx
          git commit -m "fix(#83): cancel default 2h + block late cancel; gray unavailable slots" || exit 0
          git push
