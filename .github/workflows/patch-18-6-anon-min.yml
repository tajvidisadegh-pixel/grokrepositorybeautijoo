name: patch-18-6-anon-min
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-18-6-anon-min.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Anonymize PII on deleteAccount
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/auth/auth.service.ts')
          src = p.read_text()
          if 'phone: null' in src and 'account_delete' in src and 'anonymized' in src:
              print('already full')
              raise SystemExit(0)
          old = """      await tx.user.update({
        where: { id: userId },
        data: { status: UserStatus.deleted },
      });"""
          new = """      await tx.user.update({
        where: { id: userId },
        data: {
          status: UserStatus.deleted,
          phone: null,
          email: null,
          passwordHash: null,
          phoneVerified: false,
          emailVerified: false,
        },
      });
      // Anonymize profile PII (keep bookings/payments/audit)
      await tx.profile.updateMany({
        where: { userId },
        data: {
          displayName: 'کاربر حذف‌شده',
          firstName: null,
          lastName: null,
          avatarUrl: null,
          bio: null,
          birthDate: null,
          gender: 'undisclosed',
        },
      });
      // Unpublish professional if any
      await tx.professional.updateMany({
        where: { userId },
        data: {
          status: 'suspended',
          publishedAt: null,
          isFeatured: false,
          bio: null,
          title: 'حساب حذف‌شده',
        },
      });
      // Cancel open bookings (customer)
      await tx.booking.updateMany({
        where: { customerId: userId, status: { in: ['pending', 'confirmed'] } },
        data: { status: 'cancelled', cancelReason: 'حذف حساب کاربری', cancelledAt: new Date() },
      });
      await tx.favorite.deleteMany({ where: { userId } });
      await tx.otpCode.deleteMany({ where: { userId } });"""
          if old not in src:
              raise SystemExit('target block not found')
          src2 = src.replace(old, new, 1)
          # enrich audit after payload
          src2 = src2.replace(
              "entityId: userId,\n          },",
              "entityId: userId,\n            after: { anonymized: true },\n          },",
              1,
          )
          # password optional check
          src2 = src2.replace(
              "const ok = await argon2.verify(user.passwordHash, dto.password);",
              "if (!dto.password) throw new BadRequestException('رمز عبور برای تأیید حذف الزامی است');\n      const ok = await argon2.verify(user.passwordHash, dto.password);",
              1,
          )
          p.write_text(src2)
          assert 'phone: null' in src2
          assert 'anonymized' in src2
          print('patched ok', len(src2))
          PY
          grep -q 'phone: null' backend/src/auth/auth.service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git commit -m "feat(#18.6): anonymize PII on account soft-delete" || exit 0
          git push
