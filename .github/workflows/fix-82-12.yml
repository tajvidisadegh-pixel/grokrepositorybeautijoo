name: fix-82-12
"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-82-12.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Persian error messages for complete gate
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("backend/src/bookings/bookings.service.ts")
          t = p.read_text()
          if "فقط نوبت تأییدشده" in t:
              print("already persian")
          else:
              t = t.replace(
                  "throw new BadRequestException('complete requires confirmed booking');",
                  "throw new BadRequestException('فقط نوبت تأییدشده (پرداخت‌شده) قابل تکمیل است');",
              )
              t = t.replace(
                  "throw new BadRequestException('complete requires paid booking');",
                  "throw new BadRequestException('فقط نوبت پرداخت‌شده قابل تکمیل است');",
              )
              p.write_text(t)
              print("persianized")
          assert "#82.12" in p.read_text()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git diff --cached --quiet && echo nochange || (git commit -m "fix(#82.12): Persian messages for complete gate" && git push)
