name: CI green fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ci-green-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('backend/src/payments/payments.service.ts')
          t = p.read_text()
          old = "    if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired) {\n      await this.prisma.booking.update({\n        where: { id: bookingId },\n        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },\n      });\n    }"
          # Only first occurrence is in confirmOfflineBooking (callback still needs both for un-narrowed types)
          if 'status already narrowed' not in t:
              # replace only inside confirmOfflineBooking: after paidAt metadata block the pending||expired
              idx = t.find('private async confirmOfflineBooking')
              if idx < 0:
                  raise SystemExit('confirmOfflineBooking missing')
              # find the pending||expired after confirmOfflineBooking
              sub = t[idx:]
              pos = sub.find('if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired)')
              if pos < 0:
                  raise SystemExit('offline confirm status check missing')
              abs_pos = idx + pos
              end = t.find('}', abs_pos)
              # simpler string replace once on the offline-specific block with more context
              old2 = '''    await this.prisma.payment.update({
      where: { bookingId },
      data: {
        status: PaymentStatus.paid,
        provider: 'offline',
        providerRef: ref,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
        },
      },
    });
    if (booking.status === BookingStatus.pending || booking.status === BookingStatus.expired) {
      await this.prisma.booking.update({
        where: { id: bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }'''
              new2 = '''    await this.prisma.payment.update({
      where: { bookingId },
      data: {
        status: PaymentStatus.paid,
        provider: 'offline',
        providerRef: ref,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          mode: 'offline',
          note: 'Confirmed without online gateway. Not a bank settlement.',
        },
      },
    });
    // status already narrowed past expired/cancelled above
    if (booking.status === BookingStatus.pending) {
      await this.prisma.booking.update({
        where: { id: bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }'''
              if old2 not in t:
                  raise SystemExit('payments pattern missing')
              t = t.replace(old2, new2, 1)
              p.write_text(t)
              print('payments fixed')
          else:
              print('payments already fixed')

          p = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          t = p.read_text()
          old = '''          items={items.map((m) => ({
            src: m.publicUrl || '',
            alt: m.title || 'portfolio',
            isVideo: isVideo(m.mimeType, m.publicUrl),
          }))}'''
          new = '''          items={items.map((m) => ({
            id: m.id,
            url: m.publicUrl || '',
            mimeType: m.mimeType || undefined,
            caption: m.title || undefined,
          }))}'''
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print('portfolio fixed')
          elif 'id: m.id' in t and 'url: m.publicUrl' in t:
              print('portfolio already fixed')
          else:
              raise SystemExit('portfolio pattern missing')
          print('OK')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts frontend/src/app/zibagar/portfolio/page.tsx
          git commit -m "fix(ci): payments TS2367 + portfolio LightboxItem typecheck" || exit 0
          git push origin HEAD:main
      - name: Sync export payments
        run: |
          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          mkdir -p /tmp/be/src/payments
          cp backend/src/payments/payments.service.ts /tmp/be/src/payments/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/payments/payments.service.ts
          git commit -m "fix: payments TS2367 offline confirm" || exit 0
          git push origin HEAD:beautijoo-backend-export
