name: restore-admin-services
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from good commit 0e8887c
        run: |
          set -euo pipefail
          GOOD=0e8887cae03ecc02c541902f69be0a4362bbc3c0
          git show "$GOOD:backend/src/admin/admin.service.ts" > backend/src/admin/admin.service.ts
          git show "$GOOD:backend/src/admin/admin-ops.controller.ts" > backend/src/admin/admin-ops.controller.ts
          wc -c backend/src/admin/admin.service.ts backend/src/admin/admin-ops.controller.ts
          head -3 backend/src/admin/admin.service.ts
          # Re-apply MediaStatus enum fix: only draft|published (no rejected/deleted)
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin.service.ts')
          t = p.read_text(encoding='utf-8')
          # Replace any rejected/deleted MediaStatus usages with draft for purge path
          t2 = t
          t2 = t2.replace('MediaStatus.rejected', 'MediaStatus.draft')
          t2 = t2.replace('MediaStatus.deleted', 'MediaStatus.draft')
          t2 = t2.replace("'rejected'", "'draft'")
          # Only if in media status context - already conservative
          if t2 != t:
              p.write_text(t2, encoding='utf-8')
              print('MediaStatus aliases applied')
          else:
              print('No MediaStatus.rejected/deleted found')
          # Ensure impersonateCustomer exists or thin wrapper
          if 'impersonateCustomer' not in t2 and 'issueImpersonationAccessToken' not in t2:
              # add method before last closing brace of class
              method = '''
  async impersonateCustomer(adminId: string, customerId: string) {
    const user = await this.prisma.user.findUnique({
      where: { id: customerId },
      include: { professional: true },
    });
    if (!user) throw new NotFoundException('User not found');
    if (user.professional) {
      throw new BadRequestException('فقط حساب مشتری قابل جعل هویت است');
    }
    if (user.status !== UserStatus.active) {
      throw new BadRequestException('کاربر فعال نیست');
    }
    // blocking audit before token
    await this.prisma.auditLog.create({
      data: {
        actorId: adminId,
        action: 'IMPERSONATION_STARTED',
        entityType: 'user',
        entityId: customerId,
        after: { adminId, customerId } as any,
      },
    });
    const token = await this.authService.issueImpersonationAccessToken(
      customerId,
      user.phone,
      adminId,
    );
    return token;
  }
'''
              # ensure AuthService injected
              if 'authService' not in t2 and 'AuthService' in t2:
                  print('AuthService import present')
              if 'private readonly authService' not in t2 and 'AuthService' in t2:
                  t2 = t2.replace(
                      'private readonly authService: AuthService,',
                      'private readonly authService: AuthService,',
                  )
                  if 'private readonly authService' not in t2:
                      # try inject in constructor
                      t2 = t2.replace(
                          'private readonly cache: AppCacheService,',
                          'private readonly cache: AppCacheService,\n    private readonly authService: AuthService,',
                      )
                      print('injected authService')
              idx = t2.rfind('\n}\n')
              if idx > 0:
                  t2 = t2[:idx] + method + t2[idx:]
                  p.write_text(t2, encoding='utf-8')
                  print('impersonateCustomer added')
              else:
                  print('could not add impersonateCustomer')
          else:
              print('impersonate already present')
          PY
          wc -c backend/src/admin/admin.service.ts backend/src/admin/admin-ops.controller.ts
          grep -n "impersonateCustomer\|getPlatformSettings\|mutateSmsOptOut\|sms-opt-out" backend/src/admin/admin.service.ts backend/src/admin/admin-ops.controller.ts | head -20
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts backend/src/admin/admin-ops.controller.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: restore admin.service.ts and admin-ops.controller.ts after PLACEHOLDER corruption"
          git push origin HEAD:main
