name: patch-i33-caption
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-i33-caption.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch caption with sed
        run: |
          set -euo pipefail
          FILE="frontend/src/app/professionals/[slug]/page.tsx"
          # Replace fixed approximate label with precision-aware text via python line-based edit
          python3 -c "
          from pathlib import Path
          p = Path('$FILE')
          lines = p.read_text().splitlines(True)
          out = []
          i = 0
          while i < len(lines):
              if 'موقعیت تقریبی روی نقشه' in lines[i] and 'موقعیت دقیق' not in lines[i]:
                  # insert isExact before the return that owns this block: find previous 'return (' within a few lines
                  # Simple: replace the paragraph content only
                  lines[i] = lines[i].replace(
                      'موقعیت تقریبی روی نقشه',
                      """{loc?.precision === 'exact' ? 'موقعیت دقیق — مشتری می‌تواند با نشان مسیریابی کند' : 'موقعیت تقریبی (شهر/محله) — پین دقیق عمومی نیست'}""",
                  )
              out.append(lines[i])
              i += 1
          p.write_text(''.join(out))
          assert 'موقعیت دقیق' in p.read_text()
          print('ok')
          "
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "frontend/src/app/professionals/[slug]/page.tsx"
          git diff --cached --quiet || git commit -m "fix(#33): location map caption respects exact vs approximate"
          rm -f .github/workflows/patch-i33-caption.yml
          git add -A .github/workflows || true
          git diff --cached --quiet || git commit -m "chore(#33): remove caption helper workflow"
          git push
