name: Sync backend export ROOT (outage)
on:
  workflow_dispatch:
  push:
    paths:
      - backend/**
      - .github/workflows/sync-backend-export-root.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main/backend into export branch root
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main beautijoo-backend-export

          rm -rf /tmp/be-export
          git worktree add /tmp/be-export origin/beautijoo-backend-export

          SRC="$GITHUB_WORKSPACE/backend"
          test -d "$SRC/src"

          DEST=/tmp/be-export

          rsync -a --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            "$SRC/src/" "$DEST/src/"

          if [ -d "$SRC/prisma" ]; then
            rsync -a --delete "$SRC/prisma/" "$DEST/prisma/"
          fi
          if [ -d "$SRC/scripts" ]; then
            rsync -a "$SRC/scripts/" "$DEST/scripts/"
          fi

          for f in package.json package-lock.json nest-cli.json tsconfig.json tsconfig.build.json Dockerfile .dockerignore liara.json; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "$DEST/$f"
            fi
          done

          mkdir -p "$DEST/backend"
          rsync -a --delete \
            --exclude node_modules --exclude dist \
            "$SRC/" "$DEST/backend/"

          cd "$DEST"
          git add -A
          if git diff --cached --quiet; then
            echo "export already matches main/backend"
            exit 0
          fi
          git commit -m "fix(prod): sync main/backend into export ROOT — stop SMS/payment FATAL crash"
          git push origin HEAD:beautijoo-backend-export
          echo pushed
