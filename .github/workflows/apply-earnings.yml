name: Apply earnings methods to professionals.service
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_earnings_methods.py'
      - '.github/workflows/apply-earnings.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Restore service if placeholder then apply methods
        run: |
          set -euo pipefail
          F=backend/src/professionals/professionals.service.ts
          if grep -q 'PLACEHOLDER' "$F" 2>/dev/null || ! grep -q 'ProfessionalsService' "$F"; then
            echo "Restoring from last good commit..."
            git show 02f26c03877d2876a9c7c2f49b30983c6e6e9990:"$F" > "$F" || \
              git show 246b099b4fb06339ed41134e2c7b09637578ca4f:"$F" > "$F"
          fi
          python3 scripts/apply_earnings_methods.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git commit -m "feat(professionals): getEarnings + requestPayout (#8)" || exit 0
          git push origin HEAD:main
