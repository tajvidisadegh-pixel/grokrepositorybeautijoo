name: Patch share button
on:
  push:
    paths: ['.github/workflows/patch-share-btn.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/professionals/[slug]/page.tsx')
          s = p.read_text()
          if 'ShareProfileButton' not in s:
            s = s.replace(
              "import { TrustBadge } from '@/components/professionals/trust-badge';",
              "import { TrustBadge } from '@/components/professionals/trust-badge';\nimport { ShareProfileButton } from '@/components/professionals/share-profile-button';",
            )
            # after TrustBadge block, add share near header area
            needle = '<div className="mt-1"><TrustBadge status={pro.status} verifiedAt={(pro as { verifiedAt?: string | null }).verifiedAt} size="md" /></div>'
            if needle in s:
              s = s.replace(
                needle,
                needle + '\n                <div className="mt-2"><ShareProfileButton slug={pro.slug} name={name} /></div>',
                1,
              )
            p.write_text(s)
            print('ok', 'ShareProfileButton' in s)
          else:
            print('skip')
          Path('.github/workflows/patch-share-btn.yml').unlink(missing_ok=True)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'feat: share button on public professional page'
          git push
