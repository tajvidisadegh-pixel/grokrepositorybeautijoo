name: run-fix-r4-gaps
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/fix-r4-gaps.py
          # remove junk tracked files
          git rm -f .tmp/b82_0.txt .tmp/b82_1.txt 2>/dev/null || true
          find scripts/b64chunks scripts/buffer82 scripts/ci-blobs scripts/patches -type f -size -2c -print -delete 2>/dev/null || true
          grep -n "سابقه رزرو دارد" backend/src/admin/admin.service.ts | head -3
          grep -n "npm ci" Dockerfile | head -3
          grep -n "retry SMS\|smsDelivered" backend/src/admin/admin-ops.controller.ts | head -5
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(security): r4 gaps — hard-delete preserves history, docker full npm ci, campaign SMS retry, remove junk"
          git push origin HEAD:main
