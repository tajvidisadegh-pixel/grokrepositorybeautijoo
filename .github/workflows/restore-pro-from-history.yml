name: restore-pro-from-history
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/TRIGGER_RESTORE_PRO_HIST'
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from last good blob and patch checkbox
        run: |
          set -e
          # last known good full page before PLACEHOLDER accidents
          git show 8e8c8497576d8a894b65ce3597c9ef6a7fef8cf9:frontend/src/app/admin/professionals/page.tsx > frontend/src/app/admin/professionals/page.tsx || \
          git show dee62d5b11f68a877b424861b50e56eb381d3be4:frontend/src/app/admin/professionals/page.tsx > frontend/src/app/admin/professionals/page.tsx
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/admin/professionals/page.tsx')
          t = p.read_text()
          if 'PLACEHOLDER' in t or len(t) < 500:
              raise SystemExit('restore failed size='+str(len(t)))
          old = '''              {items.map((p) => (
                <tr key={p.id} className="border-b last:border-0 hover:bg-gray-50/80">
                  <td className="px-3 py-2">
                    <Link href={`/admin/professionals/${p.id}`} className="font-medium text-coral hover:underline">
                      {p.user?.profile?.displayName || p.title || p.slug}
                    </Link>
                    <div className="text-xs text-gray" dir="ltr">{p.slug}</div>
                  </td>'''
          new = '''              {items.map((p) => (
                <tr key={p.id} className="border-b last:border-0 hover:bg-gray-50/80">
                  <td className="px-3 py-2">
                    <input type="checkbox" aria-label="انتخاب" checked={selected.has(p.id)} onChange={() => toggleSelect(p.id)} />
                  </td>
                  <td className="px-3 py-2">
                    <Link href={`/admin/professionals/${p.id}`} className="font-medium text-coral hover:underline">
                      {p.user?.profile?.displayName || p.title || p.slug}
                    </Link>
                    <div className="text-xs text-gray" dir="ltr">{p.slug}</div>
                  </td>'''
          if old in t and 'checked={selected.has(p.id)}' not in t:
              t = t.replace(old, new, 1)
              print('checkbox added')
          else:
              print('checkbox skip or already')
          old2 = '''                  <td className="px-3 py-2">
                    <div className="flex flex-wrap gap-1">
                      {p.status !== 'approved' && (
                        <Button size="sm" loading={busyId === p.id} onClick={() => onStatus(p.id, 'approved')}>تأیید</Button>
                      )}
                      <Link href={`/admin/professionals/${p.id}`}>
                        <Button size="sm" variant="outline">ویرایش</Button>
                      </Link>
                      <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onNotify(p)}>اعلان</Button>
                      <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onDelete(p.id)}>حذف</Button>
                    </div>
                  </td>'''
          new2 = '''                  <td className="px-3 py-2 whitespace-nowrap">
                    <div className="flex flex-nowrap items-center gap-1 text-xs">
                      {p.status !== 'approved' && (
                        <button type="button" className="rounded border border-green-400 px-1.5 py-0.5 text-green-700 disabled:opacity-50" disabled={busyId === p.id} onClick={() => onStatus(p.id, 'approved')}>تأیید</button>
                      )}
                      <Link href={`/admin/professionals/${p.id}`} className="rounded border px-1.5 py-0.5">ویرایش</Link>
                      <button type="button" className="rounded border px-1.5 py-0.5 disabled:opacity-50" disabled={busyId === p.id} onClick={() => onNotify(p)}>اعلان</button>
                      <button type="button" className="rounded border border-red-300 px-1.5 py-0.5 text-red-700 disabled:opacity-50" disabled={busyId === p.id} onClick={() => onDelete(p.id)}>حذف</button>
                    </div>
                  </td>'''
          if old2 in t:
              t = t.replace(old2, new2, 1)
              print('actions compact')
          p.write_text(t)
          print('final', len(t))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/professionals/page.tsx
          git commit -m "fix(#83): restore admin professionals with select checkbox + compact row" || exit 0
          git push
