name: item25b
on:
  push:
    paths:
      - '.github/workflows/item25-wizard.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 -c "
from pathlib import Path
w=Path('frontend/src/components/booking/booking-wizard.tsx')
s=w.read_text()
s=s.replace(
  'const { isAuthenticated, loading: authLoading } = useAuth();',
  'const { isAuthenticated, loading: authLoading, user } = useAuth();',
  1,
)
needle=\""\"    if (!isAuthenticated) {
      const draft = buildDraft();
      saveBookingDraft(draft);
      router.push(\\`/login?next=\${encodeURIComponent(bookingLoginReturnPath(draft))}\\`);
      return;
    }
    setSubmitting(true);\""\"
# fix - use normal string
"
          python3 << 'PY'
          from pathlib import Path
          w = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = w.read_text()
          s = s.replace(
              'const { isAuthenticated, loading: authLoading } = useAuth();',
              'const { isAuthenticated, loading: authLoading, user } = useAuth();',
              1,
          )
          a = """    if (!isAuthenticated) {
      const draft = buildDraft();
      saveBookingDraft(draft);
      router.push(`/login?next=${encodeURIComponent(bookingLoginReturnPath(draft))}`);
      return;
    }
    setSubmitting(true);"""
          b = """    if (!isAuthenticated) {
      const draft = buildDraft();
      saveBookingDraft(draft);
      router.push(`/login?next=${encodeURIComponent(bookingLoginReturnPath(draft))}`);
      return;
    }
    if (user && user.phoneVerified === false) {
      const draft = buildDraft();
      saveBookingDraft(draft);
      setSubmitError('قبل از رزرو باید شماره موبایل را تأیید کنید.');
      router.push(`/otp?next=${encodeURIComponent(bookingLoginReturnPath(draft))}&reason=booking`);
      return;
    }
    setSubmitting(true);"""
          if a not in s:
              raise SystemExit('block missing')
          s = s.replace(a, b, 1)
          # banner before CancelPolicy or submitError
          if 'تأیید شماره موبایل لازم است' not in s:
              marker = '<CancelPolicyNotice className="mb-3" />'
              banner = '''<CancelPolicyNotice className="mb-3" />
          {isAuthenticated && user && user.phoneVerified === false && (
            <div className="mb-3 rounded-2xl border border-coral/30 bg-coral-soft/50 px-3 py-2 text-sm">
              <p className="font-medium text-coral">تأیید شماره موبایل لازم است</p>
              <p className="mt-1 text-xs text-gray">برای ثبت رزرو ابتدا موبایل را با کد پیامکی تأیید کنید.</p>
              <button
                type="button"
                className="mt-2 text-xs font-medium text-coral underline"
                onClick={() => {
                  const draft = buildDraft();
                  saveBookingDraft(draft);
                  router.push(`/otp?next=${encodeURIComponent(bookingLoginReturnPath(draft))}&reason=booking`);
                }}
              >
                رفتن به تأیید موبایل
              </button>
            </div>
          )}
'''
              if marker in s:
                  s = s.replace(marker, banner, 1)
              else:
                  s = s.replace(
                      '{submitError && (',
                      banner + '          {submitError && (',
                      1,
                  )
          w.write_text(s)
          assert 'phoneVerified' in s
          print('ok', s.count('phoneVerified'))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item25-wizard.yml
          git add frontend/src/components/booking/booking-wizard.tsx
          git add -A
          git status
          git commit -m "feat(booking): require phoneVerified in wizard (#40-25)" || echo nothing
          git push
