name: item25c
on:
  push:
    paths:
      - '.github/workflows/item25-wizard.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wizard
        env:
          # Prevent Actions from eating ${...} in scripts
          DOLLAR: '$'
        run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          w = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = w.read_text()
          s = s.replace(
              'const { isAuthenticated, loading: authLoading } = useAuth();',
              'const { isAuthenticated, loading: authLoading, user } = useAuth();',
              1,
          )
          # Insert after authenticated check using line markers only
          marker = '    setSubmitting(true);'
          insert = '''    if (user && user.phoneVerified === false) {
      const draft = buildDraft();
      saveBookingDraft(draft);
      setSubmitError('قبل از رزرو باید شماره موبایل را تأیید کنید.');
      router.push('/otp?reason=booking&next=' + encodeURIComponent(bookingLoginReturnPath(draft)));
      return;
    }
    setSubmitting(true);'''
          # Only first occurrence inside submitBooking
          idx = s.find('async function submitBooking')
          if idx < 0:
              raise SystemExit('no submit')
          idx2 = s.find(marker, idx)
          if idx2 < 0:
              raise SystemExit('no setSubmitting')
          # ensure not already patched
          if 'user.phoneVerified' in s[idx:idx2+50]:
              print('already')
          else:
              s = s[:idx2] + insert + s[idx2 + len(marker):]
              print('inserted check')
          if 'تأیید شماره موبایل لازم است' not in s:
              hint = '''
          {isAuthenticated && user && user.phoneVerified === false && (
            <div className="mb-3 rounded-2xl border border-coral/30 bg-coral-soft/50 px-3 py-2 text-sm">
              <p className="font-medium text-coral">تأیید شماره موبایل لازم است</p>
              <p className="mt-1 text-xs text-gray">برای ثبت رزرو ابتدا موبایل را با کد پیامکی تأیید کنید.</p>
              <button
                type="button"
                className="mt-2 text-xs font-medium text-coral underline"
                onClick={() => {
                  const draft = buildDraft();
                  saveBookingDraft(draft);
                  router.push('/otp?reason=booking&next=' + encodeURIComponent(bookingLoginReturnPath(draft)));
                }}
              >
                رفتن به تأیید موبایل
              </button>
            </div>
          )}
'''
              if '<CancelPolicyNotice className="mb-3" />' in s:
                  s = s.replace('<CancelPolicyNotice className="mb-3" />', '<CancelPolicyNotice className="mb-3" />' + hint, 1)
              else:
                  s = s.replace('{submitError && (', hint + '          {submitError && (', 1)
          w.write_text(s)
          print('phoneVerified count', s.count('phoneVerified'))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item25-wizard.yml
          git add frontend/src/components/booking/booking-wizard.tsx || true
          git add -A
          git commit -m "feat(booking): wizard requires phoneVerified (#40-25)" || echo nothing
          git push
