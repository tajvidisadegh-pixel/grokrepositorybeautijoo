name: apply-r2-sms-reviews
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-r2-sms-reviews.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- admin-ops: inject SMS and send when sms:true ---
          p = Path('backend/src/admin/admin-ops.controller.ts')
          t = p.read_text(encoding='utf-8')

          if 'SMS_PROVIDER' not in t:
              t = t.replace(
                  "import { CurrentUser } from '../common/decorators/current-user.decorator';",
                  "import { CurrentUser } from '../common/decorators/current-user.decorator';\n"
                  "import { Inject, Logger } from '@nestjs/common';\n"
                  "import { SMS_PROVIDER, SmsProvider } from '../sms/sms.provider';",
                  1,
              )
              # Fix duplicate imports from @nestjs/common - merge instead
              # remove the Inject Logger line if BadRequest already imports from same package
              if t.count("from '@nestjs/common'") >= 2:
                  # fold Inject, Logger into first import block
                  t = t.replace(
                      "import { Inject, Logger } from '@nestjs/common';\n",
                      '',
                      1,
                  )
                  t = t.replace(
                      "import {\n  Body,\n  Controller,\n  Get,\n  Param,\n  Patch,\n  Post,\n  Put,\n  Query,\n  BadRequestException,\n  ConflictException,\n  NotFoundException,\n} from '@nestjs/common';",
                      "import {\n  Body,\n  Controller,\n  Get,\n  Param,\n  Patch,\n  Post,\n  Put,\n  Query,\n  BadRequestException,\n  ConflictException,\n  NotFoundException,\n  Inject,\n  Logger,\n} from '@nestjs/common';",
                      1,
                  )
              t = t.replace(
                  "export class AdminOpsController {\n  constructor(private readonly prisma: PrismaService) {}",
                  "export class AdminOpsController {\n  private readonly logger = new Logger(AdminOpsController.name);\n  constructor(\n    private readonly prisma: PrismaService,\n    @Inject(SMS_PROVIDER) private readonly sms: SmsProvider,\n  ) {}",
                  1,
              )
              print('sms inject ok')
          else:
              print('sms inject skip')

          # Replace honest skip SMS block with real send (limited concurrency)
          old_sms = (
              "    // Honest SMS: bulk SMS is not wired in this controller (avoids silent smsSent:0 lie).\n"
              "    const smsSent = 0;\n"
              "    const smsSkippedReason = dto.sms\n"
              "      ? 'bulk_sms_not_wired_use_provider_queue'\n"
              "      : undefined;\n"
          )
          new_sms = (
              "    // #82.r2.sms — optional bulk SMS (capped, sequential batches)\n"
              "    let smsSent = 0;\n"
              "    let smsFailed = 0;\n"
              "    let smsSkippedReason: string | undefined;\n"
              "    if (dto.sms) {\n"
              "      const maxSms = Math.min(ids.length, Number(process.env.BULK_SMS_MAX || 200));\n"
              "      const users = await this.prisma.user.findMany({\n"
              "        where: { id: { in: ids.slice(0, maxSms) }, phone: { not: null } },\n"
              "        select: { id: true, phone: true },\n"
              "      });\n"
              "      const msg = `${title}\n${body}`.slice(0, 400);\n"
              "      for (const u of users) {\n"
              "        if (!u.phone) continue;\n"
              "        try {\n"
              "          await this.sms.sendNotification(u.phone, msg);\n"
              "          smsSent++;\n"
              "        } catch (e) {\n"
              "          smsFailed++;\n"
              "          this.logger.warn(`bulk SMS fail user=${u.id}: ${e}`);\n"
              "        }\n"
              "      }\n"
              "      if (ids.length > maxSms) {\n"
              "        smsSkippedReason = `capped_at_${maxSms}`;\n"
              "      }\n"
              "    }\n"
          )
          if old_sms in t:
              t = t.replace(old_sms, new_sms, 1)
              # update campaignMeta sms fields
              t = t.replace(
                  "      smsSent,\n      smsSkippedReason,",
                  "      smsSent,\n      smsFailed,\n      smsSkippedReason,",
                  1,
              )
              print('sms send ok')
          elif 'sendNotification' in t:
              print('sms send already')
          else:
              print('sms send pattern missing — manual check')

          p.write_text(t, encoding='utf-8')

          # --- reviews: mask phone + MaxLength comment ---
          rc = Path('backend/src/reviews/reviews.controller.ts')
          rct = rc.read_text(encoding='utf-8')
          if '@MaxLength(2000) comment' not in rct and 'comment?: string' in rct:
              rct = rct.replace(
                  "  @IsOptional() @IsString() comment?: string;",
                  "  @IsOptional() @IsString() @MaxLength(2000) comment?: string;",
                  1,
              )
              rc.write_text(rct, encoding='utf-8')
              print('review comment maxlen ok')
          else:
              print('review comment skip')

          rs = Path('backend/src/reviews/reviews.service.ts')
          rst = rs.read_text(encoding='utf-8')
          if 'maskPhone' not in rst:
              # add helper after imports
              rst = rst.replace(
                  "import { PrismaService } from '../prisma/prisma.service';\n",
                  "import { PrismaService } from '../prisma/prisma.service';\n\n"
                  "function maskPhone(phone?: string | null): string | null {\n"
                  "  if (!phone) return null;\n"
                  "  const d = phone.replace(/\\D/g, '');\n"
                  "  if (d.length < 7) return '***';\n"
                  "  return d.slice(0, 4) + '***' + d.slice(-2);\n"
                  "}\n",
                  1,
              )
              # mask in listForProfessional return
              old_ret = "    return {\n      items,\n      meta: { page: Math.max(1, page), limit: take, total, totalPages: Math.ceil(total / take) || 0 },\n      summary: {\n        ratingAvg: pro.ratingAvg,\n        ratingCount: pro.ratingCount,\n      },\n    };"
              new_ret = (
                  "    return {\n"
                  "      items: items.map((it) => ({\n"
                  "        ...it,\n"
                  "        customer: it.customer\n"
                  "          ? { ...it.customer, phone: maskPhone(it.customer.phone) }\n"
                  "          : it.customer,\n"
                  "      })),\n"
                  "      meta: { page: Math.max(1, page), limit: take, total, totalPages: Math.ceil(total / take) || 0 },\n"
                  "      summary: {\n"
                  "        ratingAvg: pro.ratingAvg,\n"
                  "        ratingCount: pro.ratingCount,\n"
                  "      },\n"
                  "    };"
              )
              if old_ret in rst:
                  rst = rst.replace(old_ret, new_ret, 1)
                  print('mask reviews ok')
              else:
                  print('mask reviews pattern miss')
              rs.write_text(rst, encoding='utf-8')
          else:
              print('reviews mask already')

          print('ALL_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts backend/src/reviews/reviews.service.ts backend/src/reviews/reviews.controller.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.r2): bulk SMS via SmsProvider, mask review phones, comment MaxLength"
          git push origin HEAD:main
