name: Cleanup legacy scripts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-scripts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep only operational scripts
        run: |
          set -euo pipefail
          KEEP='README.md|check-env.sh|db-reset.sh|dev-up.sh|generate-secrets.sh'
          # remove junk at repo root
          if [ -f 37607803.txt ]; then git rm -f 37607803.txt || rm -f 37607803.txt; fi
          cd scripts
          # delete files not in keep list
          find . -maxdepth 1 -type f ! -name '.' | while read -r f; do
            base=$(basename "$f")
            if echo "$base" | grep -Eq "^($KEEP)$"; then
              echo "KEEP $base"
            else
              echo "DELETE $f"
              git rm -rf "$f" 2>/dev/null || rm -rf "$f"
            fi
          done
          # delete subdirectories that are historical payloads
          for d in admin-ops-b64 apply-payload auth68_chunks dash68_chunks payloads patches patch_parts; do
            if [ -d "$d" ]; then
              echo "DELETE dir $d"
              git rm -rf "$d" 2>/dev/null || rm -rf "$d"
            fi
          done
          # any remaining subdirs under scripts (except none of keepers are dirs)
          find . -mindepth 1 -maxdepth 1 -type d | while read -r d; do
            echo "DELETE leftover dir $d"
            git rm -rf "$d" 2>/dev/null || rm -rf "$d"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "chore: remove historical one-shot patch scripts and junk files"
          git push origin HEAD:main
