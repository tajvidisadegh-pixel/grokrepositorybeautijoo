name: Apply issue 80 mode fields
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-80-mode-fields.yml'
      - 'scripts/patch_issue_80_mode_fields.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_80_mode_fields.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/zibagar/PricingModeFields.tsx frontend/src/components/admin/ServicePricingPanel.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#80): hide mode picker when single allowed mode"
          git push origin HEAD:main
