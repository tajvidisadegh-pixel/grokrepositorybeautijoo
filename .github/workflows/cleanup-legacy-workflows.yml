name: Cleanup legacy workflows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-workflows.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove legacy one-shot workflows
        run: |
          set -euo pipefail
          KEEP='ci.yml|codeql.yml|create-release-tag.yml|production-zips.yml|sync-backend-deploy-branch.yml|post-deploy-smoke.yml|backend-branch-ci.yml|sync-backend-export.yml|cleanup-legacy-workflows.yml'
          cd .github/workflows
          for f in *.yml; do
            if echo "$f" | grep -Eq "^($KEEP)$"; then
              echo "KEEP $f"
            else
              echo "DELETE $f"
              git rm -f "$f" || rm -f "$f"
            fi
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing to delete"
            exit 0
          fi
          git add -A .github/workflows || true
          git commit -m "chore(ci): delete all legacy one-shot patch/item/fix workflows" || true
          git push origin HEAD:main
