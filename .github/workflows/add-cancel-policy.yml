name: Add cancel policy
on:
  push:
    paths: ['.github/workflows/add-cancel-policy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          if 'سیاست لغو' in s:
              print('already')
          else:
              old = '<p className="text-xs text-gray">هیچ هزینه پنهانی اضافه نمی‌شود.</p>'
              new = old + '''
          <p className="rounded-xl bg-gray-light/60 px-3 py-2 text-xs text-gray">
            سیاست لغو: تا حدود ۲ ساعت قبل از نوبت می‌توانید رزرو را لغو کنید. پس از پرداخت موفق،
            با لغو به‌موقع درخواست استرداد ثبت می‌شود.
          </p>'''
              if old not in s:
                  raise SystemExit('needle missing')
              p.write_text(s.replace(old, new, 1))
              print('ok')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/add-cancel-policy.yml
          git add -A
          git diff --cached --quiet || git commit -m "feat(booking): show cancel policy before confirm (#40-2)"
          git push
