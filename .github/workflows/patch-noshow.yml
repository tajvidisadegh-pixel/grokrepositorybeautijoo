name: Patch noshow
on:
  push:
    paths:
      - '.github/workflows/patch-noshow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          s = p.read_text()
          if "action === 'no_show'" in s:
              print('already patched')
              raise SystemExit(0)
          s = s.replace(
              "action: 'confirm' | 'reject' | 'cancel' | 'complete',",
              "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show',",
              1,
          )
          needle = "throw new BadRequestException('عملیات نامعتبر');"
          idx = s.rfind(needle)
          if idx < 0:
              raise SystemExit('needle not found')
          insert = '''if (action === 'no_show') {
      if (!isAdmin && !isPro) throw new ForbiddenException();
      if (b.status !== BookingStatus.confirmed && b.status !== BookingStatus.pending) {
        throw new BadRequestException('فقط رزرو در انتظار یا تأییدشده قابل علامت‌گذاری عدم حضور است');
      }
      if (b.startAt.getTime() > Date.now()) {
        throw new BadRequestException('علامت عدم حضور فقط پس از زمان شروع نوبت مجاز است');
      }
      const note = (reason || 'عدم حضور مشتری').trim();
      const updated = await this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelledAt: new Date(),
          cancelReason: note,
          notes: b.notes ? `${b.notes}\n[عدم حضور] ${note}` : `[عدم حضور] ${note}`,
        },
      });
      await this.notifications.notify({
        userId: b.customerId,
        type: NotificationType.booking_cancelled,
        title: 'عدم حضور در نوبت',
        body: 'زیباگر این نوبت را به‌عنوان عدم حضور ثبت کرد.',
        data: { bookingId: id, reason: note, noShow: true },
        sms: false,
      });
      return updated;
    }

    '''
          s = s[:idx] + insert + s[idx:]
          p.write_text(s)
          print('patched', len(s))

          # panel-api
          p = Path('frontend/src/lib/panel-api.ts')
          s = p.read_text()
          s2 = s.replace(
              "action: 'confirm' | 'reject' | 'cancel' | 'complete'",
              "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no-show'",
          )
          p.write_text(s2)
          print('api', 'no-show' in s2)

          # zibagar - type only + button after first complete
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          s = p.read_text()
          s = s.replace(
              "action: 'confirm' | 'reject' | 'cancel' | 'complete'",
              "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no-show'",
          )
          if "if (action === 'no-show')" not in s:
              s = s.replace(
                  "if (action === 'reject') {\n        reason = window.prompt('دلیل رد (اختیاری):') || undefined;\n      }",
                  "if (action === 'reject') {\n        reason = window.prompt('دلیل رد (اختیاری):') || undefined;\n      }\n      if (action === 'no-show') {\n        reason = window.prompt('توضیح عدم حضور (اختیاری):') || 'عدم حضور مشتری';\n      }",
                  1,
              )
          if "act(b.id, 'no-show')" not in s:
              s = s.replace(
                  "onClick={() => act(b.id, 'complete')}\n                              >\n                                تکمیل\n                              </Button>",
                  "onClick={() => act(b.id, 'complete')}\n                              >\n                                تکمیل\n                              </Button>\n                              {b.status === 'confirmed' && new Date(b.startAt).getTime() <= Date.now() && (\n                                <Button size=\"sm\" variant=\"outline\" loading={busy === `${b.id}:no-show`} onClick={() => act(b.id, 'no-show')}>عدم حضور</Button>\n                              )}",
                  1,
              )
          p.write_text(s)
          print('zibagar', "no-show" in s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/patch-noshow.yml
          git add backend/src/bookings/bookings.service.ts frontend/src/lib/panel-api.ts frontend/src/app/zibagar/bookings/page.tsx
          git add -A
          git status
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "feat(bookings): no-show action for pro (#40 item3)"
          git push
