name: Restore auth.service #41
on:
  push:
    paths:
      - '.github/workflows/restore-auth-svc-41.yml'
      - 'scripts/patch_auth_svc_41.py'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - name: Patch auth.service
        run: python3 scripts/patch_auth_svc_41.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git status
          git diff --cached --stat
          git commit -m "fix(#41): restore AuthService with OTP-required register" || true
          git push
