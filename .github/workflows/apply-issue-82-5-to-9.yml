name: apply-issue-82-5-to-9
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-82-5-to-9.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply #82.5 callback guards
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("backend/src/payments/payments.service.ts")
          t = p.read_text()
          if "#82.5" in t and "booking_cancelled" in t:
              print("payments already patched")
          else:
              old = """    const verified = await this.provider.verify(providerRef, payment.amount);
    if (!verified.success) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: { status: PaymentStatus.failed },
      });
      await this.releaseUnpaidPendingBooking(
        payment.bookingId,
        'payment_verify_failed',
      );
      return { status: 'failed', bookingId: payment.bookingId };
    }

    const rateRow = await this.prisma.platformSetting.findUnique({
      where: { key: PLATFORM_COMMISSION_RATE_KEY },
    });
    const rate =
      rateRow?.value != null && Number.isFinite(Number(rateRow.value))
        ? Number(rateRow.value)
        : DEFAULT_PLATFORM_COMMISSION_RATE;
    const { commissionAmount, professionalNetAmount } = calculateCommission(
      payment.amount,
      rate,
    );

    await this.prisma.payment.update({
      where: { id: payment.id },
      data: {
        status: PaymentStatus.paid,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          ...(typeof payment.metadata === 'object' && payment.metadata !== null
            ? (payment.metadata as object)
            : {}),
          gatewayRefId: verified.refId ?? null,
        },
      },
    });

    const booking = await this.prisma.booking.findUnique({
      where: { id: payment.bookingId },
    });
    if (booking && (booking.status === 'pending' || booking.status === 'expired')) {
      await this.prisma.booking.update({
        where: { id: payment.bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }

    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };
  }"""
              new = """    const verified = await this.provider.verify(providerRef, payment.amount);
    if (!verified.success) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: { status: PaymentStatus.failed },
      });
      await this.releaseUnpaidPendingBooking(
        payment.bookingId,
        'payment_verify_failed',
      );
      return { status: 'failed', bookingId: payment.bookingId };
    }

    // #82.5 — never mark paid / confirm against a cancelled booking
    const bookingRow =
      payment.booking ||
      (await this.prisma.booking.findUnique({ where: { id: payment.bookingId } }));
    if (!bookingRow) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: {
          status: PaymentStatus.failed,
          metadata: {
            ...(typeof payment.metadata === 'object' && payment.metadata !== null
              ? (payment.metadata as object)
              : {}),
            gatewayRefId: verified.refId ?? null,
            rejectReason: 'booking_missing',
          },
        },
      });
      return { status: 'failed', bookingId: payment.bookingId, reason: 'booking_missing' };
    }
    if (bookingRow.status === BookingStatus.cancelled) {
      await this.prisma.payment.update({
        where: { id: payment.id },
        data: {
          status: PaymentStatus.failed,
          metadata: {
            ...(typeof payment.metadata === 'object' && payment.metadata !== null
              ? (payment.metadata as object)
              : {}),
            gatewayRefId: verified.refId ?? null,
            rejectReason: 'booking_cancelled',
            verifiedButRejected: true,
          },
        },
      });
      try {
        if (payment.providerRef) {
          await this.provider.refund({
            providerRef: payment.providerRef,
            amount: payment.amount,
            reason: 'رزرو قبل از تأیید پرداخت لغو شده بود',
          });
        }
      } catch {
        /* non-blocking */
      }
      return {
        status: 'failed',
        bookingId: payment.bookingId,
        reason: 'booking_cancelled',
      };
    }

    // #82.5 — expired (or any re-confirm): re-check slot before confirming
    if (
      bookingRow.status === BookingStatus.expired ||
      bookingRow.status === BookingStatus.pending
    ) {
      const overlap = await this.prisma.booking.count({
        where: {
          professionalId: bookingRow.professionalId,
          id: { not: bookingRow.id },
          status: { in: [BookingStatus.pending, BookingStatus.confirmed] },
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      const timeOff = await this.prisma.timeOff.count({
        where: {
          professionalId: bookingRow.professionalId,
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      const manual = await this.prisma.manualReservation.count({
        where: {
          professionalId: bookingRow.professionalId,
          startAt: { lt: bookingRow.endAt },
          endAt: { gt: bookingRow.startAt },
        },
      });
      if (overlap > 0 || timeOff > 0 || manual > 0) {
        await this.prisma.payment.update({
          where: { id: payment.id },
          data: {
            status: PaymentStatus.failed,
            metadata: {
              ...(typeof payment.metadata === 'object' && payment.metadata !== null
                ? (payment.metadata as object)
                : {}),
              gatewayRefId: verified.refId ?? null,
              rejectReason: 'slot_unavailable',
              verifiedButRejected: true,
            },
          },
        });
        try {
          if (payment.providerRef) {
            await this.provider.refund({
              providerRef: payment.providerRef,
              amount: payment.amount,
              reason: 'اسلات در زمان تأیید پرداخت آزاد نبود',
            });
          }
        } catch {
          /* non-blocking */
        }
        return {
          status: 'failed',
          bookingId: payment.bookingId,
          reason: 'slot_unavailable',
        };
      }
    }

    const rateRow = await this.prisma.platformSetting.findUnique({
      where: { key: PLATFORM_COMMISSION_RATE_KEY },
    });
    const rate =
      rateRow?.value != null && Number.isFinite(Number(rateRow.value))
        ? Number(rateRow.value)
        : DEFAULT_PLATFORM_COMMISSION_RATE;
    const { commissionAmount, professionalNetAmount } = calculateCommission(
      payment.amount,
      rate,
    );

    await this.prisma.payment.update({
      where: { id: payment.id },
      data: {
        status: PaymentStatus.paid,
        paidAt: new Date(),
        platformCommissionAmount: commissionAmount,
        professionalNetAmount: professionalNetAmount,
        metadata: {
          ...(typeof payment.metadata === 'object' && payment.metadata !== null
            ? (payment.metadata as object)
            : {}),
          gatewayRefId: verified.refId ?? null,
        },
      },
    });

    if (
      bookingRow.status === BookingStatus.pending ||
      bookingRow.status === BookingStatus.expired
    ) {
      await this.prisma.booking.update({
        where: { id: payment.bookingId },
        data: { status: BookingStatus.confirmed, confirmedAt: new Date() },
      });
    }

    return { status: 'paid', bookingId: payment.bookingId, refId: verified.refId };
  }"""
              if old not in t:
                  raise SystemExit("payments callback anchor not found")
              p.write_text(t.replace(old, new, 1))
              print("payments #82.5 applied")
          PY
      - name: Apply #82.7 paid cancel refund
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("backend/src/bookings/bookings.service.ts")
          t = p.read_text()
          if "#82.7" in t:
              print("#82.7 already present")
          else:
              old = """      // Customer cancel of confirmed/paid remains (policy may refund later)
      return this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelReason: reason ?? null,
          cancelledAt: new Date(),
        },
      });
    }"""
              new = """      // #82.7 — customer cancel of paid booking: issue gateway refund
      if (isCustomer && paid && b.payment?.id) {
        try {
          await this.payments.refund(
            b.payment.id,
            reason?.trim() || 'لغو توسط مشتری',
            userId,
          );
        } catch (err) {
          this.logger.warn(
            `customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`,
          );
          return this.prisma.booking.update({
            where: { id },
            data: {
              status: BookingStatus.cancelled,
              cancelReason: reason ?? 'لغو توسط مشتری (استرداد ناموفق — پیگیری پشتیبانی)',
              cancelledAt: new Date(),
            },
          });
        }
        return this.prisma.booking.findUniqueOrThrow({ where: { id } });
      }

      return this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelReason: reason ?? null,
          cancelledAt: new Date(),
        },
      });
    }"""
              if old not in t:
                  print("WARNING: #82.7 anchor missing")
              else:
                  p.write_text(t.replace(old, new, 1))
                  print("#82.7 applied")
          PY
      - name: Ensure security doc
        run: |
          mkdir -p docs
          cat > docs/SECURITY_ISSUE_82_9.md << 'EOF'
          # Issue #82.9 — Repository exposure & secret hygiene

          ## Owner actions (cannot be done from CI alone)
          1. Make the repository private on GitHub, or move secrets out of any public fork.
          2. Run a history scan on a trusted machine (gitleaks / trufflehog).
          3. If any secret is found in history: rotate immediately, then purge history if required.

          ## App-side hygiene
          - Never commit .env, Liara tokens, SMS API keys, or payment merchant keys.
          - Production must set real PAYMENT_PROVIDER / SMS provider.

          This item is process + owner configuration.
          EOF
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts docs/SECURITY_ISSUE_82_9.md || true
          if git diff --cached --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.5-9): callback guards, paid cancel refund, security hygiene"
          git push
