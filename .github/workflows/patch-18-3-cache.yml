name: patch-18-3-cache
on:
  push:
    paths:
      - '.github/workflows/patch-18-3-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply AppCache patches
        run: |
          python3 << 'ENDSCRIPT'
          from pathlib import Path

          p = Path("backend/src/professionals/professionals.service.ts")
          t = p.read_text()
          assert "PLACEHOLDER" not in t
          if "AppCacheService" not in t:
              t = t.replace(
                  "import { PrismaService } from '../prisma/prisma.service';",
                  "import { PrismaService } from '../prisma/prisma.service';\nimport { AppCacheService } from '../cache/app-cache.service';",
              )
              t = t.replace(
                  "  constructor(private readonly prisma: PrismaService) {}",
                  "  constructor(\n    private readonly prisma: PrismaService,\n    private readonly cache: AppCacheService,\n  ) {}",
              )
              marker = "    const page = params.page || 1;\n    const limit = Math.min(params.limit || 20, 50);\n    const skip = (page - 1) * limit;"
              inject = marker + """\n\n    const cacheKey =\n      !params.ids || params.ids.length === 0\n        ? `catalog:search:${JSON.stringify({\n            q: params.q || '',\n            city: params.city || '',\n            category: params.category || '',\n            page,\n            limit,\n            minRating: params.minRating ?? null,\n            minPrice: params.minPrice ?? null,\n            maxPrice: params.maxPrice ?? null,\n            sort: params.sort || '',\n            availableDate: params.availableDate || '',\n          })}`\n        : null;\n    if (cacheKey) {\n      const hit = this.cache.get<{ items: unknown; meta: unknown }>(cacheKey);\n      if (hit) return hit as Awaited<ReturnType<ProfessionalsService['search']>>;\n    }"""
              if marker not in t:
                  raise SystemExit("search marker missing")
              t = t.replace(marker, inject, 1)
              ret = """    return {\n      items: sorted,\n      meta: {\n        page,\n        limit,\n        total,\n        sort,\n        filters: {\n          minRating: params.minRating ?? null,\n          minPrice: params.minPrice ?? null,\n          maxPrice: params.maxPrice ?? null,\n          availableDate: params.availableDate ?? null,\n        },\n      },\n    };\n  }"""
              ret_new = """    const result = {\n      items: sorted,\n      meta: {\n        page,\n        limit,\n        total,\n        sort,\n        filters: {\n          minRating: params.minRating ?? null,\n          minPrice: params.minPrice ?? null,\n          maxPrice: params.maxPrice ?? null,\n          availableDate: params.availableDate ?? null,\n        },\n      },\n    };\n    if (cacheKey) this.cache.set(cacheKey, result);\n    return result;\n  }"""
              if ret not in t:
                  raise SystemExit("return marker missing")
              t = t.replace(ret, ret_new, 1)
              old = """  async findBySlug(slug: string) {\n    const pro = await this.prisma.professional.findUnique({\n      where: { slug },\n      include: this.publicInclude(),\n    });\n    if (!pro || pro.status !== ProfessionalStatus.approved || !pro.publishedAt) {\n"""
              if old not in t:
                  raise SystemExit("findBySlug missing")
              t = t.replace(old, """  async findBySlug(slug: string) {\n    const cacheKey = `catalog:slug:${slug}`;\n    const hit = this.cache.get<unknown>(cacheKey);\n    if (hit) return hit as Awaited<ReturnType<ProfessionalsService['findBySlug']>>;\n\n    const pro = await this.prisma.professional.findUnique({\n      where: { slug },\n      include: this.publicInclude(),\n    });\n    if (!pro || pro.status !== ProfessionalStatus.approved || !pro.publishedAt) {\n""", 1)
              t = t.replace(
                  "    return pro;\n  }\n\n  async getOwn",
                  "    this.cache.set(cacheKey, pro, 120_000);\n    return pro;\n  }\n\n  async getOwn",
                  1,
              )
              if "invalidateCatalog" not in t:
                  t = t.replace(
                      "await this.prisma.professional.update({ where: { id: pro.id }, data: proData });",
                      "await this.prisma.professional.update({ where: { id: pro.id }, data: proData });\n      this.cache.invalidateCatalog();",
                      1,
                  )
                  t = t.replace(
                      """    const updated = await this.prisma.professional.update({\n      where: { id: pro.id },\n      data: {\n        status: ProfessionalStatus.pending_review,\n        publishedAt: null,\n      },\n    });""",
                      """    const updated = await this.prisma.professional.update({\n      where: { id: pro.id },\n      data: {\n        status: ProfessionalStatus.pending_review,\n        publishedAt: null,\n      },\n    });\n    this.cache.invalidateCatalog();""",
                      1,
                  )
                  t = t.replace(
                      """    await this.prisma.professional.update({\n      where: { id: pro.id },\n      data: { status: ProfessionalStatus.draft, publishedAt: null },\n    });\n    return this.getOwn(userId);""",
                      """    await this.prisma.professional.update({\n      where: { id: pro.id },\n      data: { status: ProfessionalStatus.draft, publishedAt: null },\n    });\n    this.cache.invalidateCatalog();\n    return this.getOwn(userId);""",
                      1,
                  )
              p.write_text(t)
              print("professionals patched")
          else:
              print("professionals already has AppCache")

          p = Path("backend/src/admin/admin.service.ts")
          t = p.read_text()
          assert "PLACEHOLDER" not in t
          if "AppCacheService" not in t:
              t = t.replace(
                  "from '../storage/storage.provider';",
                  "from '../storage/storage.provider';\nimport { AppCacheService } from '../cache/app-cache.service';",
              )
              t = t.replace(
                  """  constructor(\n    private readonly prisma: PrismaService,\n    @Inject(STORAGE_PROVIDER) private readonly storage: StorageProvider,\n  ) {}""",
                  """  constructor(\n    private readonly prisma: PrismaService,\n    @Inject(STORAGE_PROVIDER) private readonly storage: StorageProvider,\n    private readonly cache: AppCacheService,\n  ) {}""",
              )
              t = t.replace(
                  "    const updated = await this.prisma.professional.update({ where: { id }, data });",
                  "    const updated = await this.prisma.professional.update({ where: { id }, data });\n    this.cache.invalidateCatalog();",
                  1,
              )
              p.write_text(t)
              print("admin patched")
          else:
              print("admin already has AppCache")
          print("done")
          ENDSCRIPT
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts backend/src/admin/admin.service.ts
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "feat(#18.3): AppCache on professionals search/slug + admin invalidation"
          git push
