name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Build
        run: npx nest build

      - name: Assert dist output
        run: test -f dist/main.js || test -f dist/src/main.js

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.beautijoo.ir/api/v1
          NEXT_PUBLIC_APP_URL: https://beautijoo.ir
          NEXT_PUBLIC_APP_NAME: Beautijoo
        run: npm run build
