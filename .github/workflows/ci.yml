name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Build
        run: npx nest build

      - name: Assert dist output
        run: test -f dist/main.js || test -f dist/src/main.js

      - name: Unit tests (with coverage thresholds)
        run: npm run test:unit:coverage

  backend-e2e:
    name: Backend e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: beautijoo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d beautijoo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/beautijoo_test?schema=public
      JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long!!
      JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!
      SMS_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3001
      OTP_COOLDOWN_SECONDS: "60"
      OTP_MAX_PER_HOUR: "3"
      OTP_MAX_PER_DAY: "8"
      CLEANUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Prisma generate
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: Migrate deploy (fresh test DB — same path as production)
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Seed roles
        run: node prisma/seed-roles.cjs

      - name: E2E Auth login / refresh / logout
        run: npm run test:e2e -- --testPathPattern=auth/login-refresh-logout

      - name: E2E Auth httpOnly cookie path
        run: npm run test:e2e -- --testPathPattern=auth/cookie-auth

      - name: E2E OTP rate-limit
        run: npm run test:e2e -- --testPathPattern=auth/otp-rate-limit

      - name: E2E Authorization / 403
        run: npm run test:e2e -- --testPathPattern=auth/authorization

      - name: E2E Bookings race
        run: npm run test:e2e -- --testPathPattern=bookings/race

      - name: E2E Public professionals smoke
        run: npm run test:e2e -- --testPathPattern=professionals/public-smoke

      - name: E2E Public rate-limit
        run: npm run test:e2e -- --testPathPattern=security/public-rate-limit

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.beautijoo.ir/api/v1
          NEXT_PUBLIC_APP_URL: https://beautijoo.ir
          NEXT_PUBLIC_APP_NAME: Beautijoo
        run: npm run build
