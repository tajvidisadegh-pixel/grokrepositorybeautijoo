name: Apply issue 74 multi service pricing

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-74.yml'
      - 'scripts/patch_issue_74_multi_service_pricing.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_74_multi_service_pricing.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts frontend/src/components/booking/booking-wizard.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#74): independent per-service price/duration then sum"
          git push origin HEAD:main
