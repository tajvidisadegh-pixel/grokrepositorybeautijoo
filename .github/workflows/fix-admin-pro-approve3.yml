name: Apply admin pro approve patch v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_admin_pro_approve3.py'
      - 'scripts/pro_approve_methods.b64.part1'
      - 'scripts/pro_approve_methods.b64.part2'
      - '.github/workflows/fix-admin-pro-approve3.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_admin_pro_approve3.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          git status
          git diff --cached --stat
          git commit -m "fix: publish professional on admin approve, notify, full detail" || exit 0
          git push origin HEAD:main
