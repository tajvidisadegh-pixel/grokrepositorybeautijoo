name: run-fix-admin-r4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-fix-admin-r4.yml'
      - 'scripts/fix-admin-r4-critical.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply r4 patches
        run: |
          set -euo pipefail
          python3 scripts/fix-admin-r4-critical.py
          grep -n "admin.dashboard.read" backend/src/admin/admin.controller.ts | head -3
          grep -n "انتقال وضعیت" backend/src/admin/admin.service.ts | head -5
          grep -n "hasRole && hasPerms" backend/src/common/guards/roles.guard.ts | head -2
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.controller.ts backend/src/admin/admin.service.ts backend/src/common/guards/roles.guard.ts backend/src/media/files.controller.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(security): admin r4 critical/high — dashboard ACL, role grant, deletes, booking/payout state machines"
          git push origin HEAD:main
