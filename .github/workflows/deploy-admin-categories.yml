name: Fix admin categories ReactNode
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-admin-categories.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix types
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/admin/service-categories/page.tsx')
          t = p.read_text()
          if 'React.ReactNode' in t:
              t = t.replace(
                  "import { useCallback, useEffect, useMemo, useState } from 'react';",
                  "import { useCallback, useEffect, useMemo, useState, type ReactNode } from 'react';",
              )
              t = t.replace('React.ReactNode', 'ReactNode')
              p.write_text(t)
              print('fixed')
          else:
              print('ok already')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/service-categories/page.tsx
          git commit -m "fix(admin): import ReactNode for categories tree" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
