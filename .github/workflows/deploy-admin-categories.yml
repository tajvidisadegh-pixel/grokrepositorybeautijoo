name: Fix ReactNode
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-admin-categories.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euxo pipefail
          f=frontend/src/app/admin/service-categories/page.tsx
          sed -i "s/import { useCallback, useEffect, useMemo, useState } from 'react';/import { useCallback, useEffect, useMemo, useState, type ReactNode } from 'react';/" "$f"
          sed -i 's/React\.ReactNode/ReactNode/g' "$f"
          grep -n 'type ReactNode\|ReactNode' "$f" | head
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "fix(admin): ReactNode import for categories page" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
