name: Deploy admin categories page
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-admin-categories.yml
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/admin/service-categories/page.tsx')
          t = p.read_text()
          if 'selectedCategoryId' not in t:
              t = t.replace(
                  "const [pricingFilter, setPricingFilter] = useState<'all' | 'fixed' | 'variable' | 'deposit'>('all');",
                  "const [pricingFilter, setPricingFilter] = useState<'all' | 'fixed' | 'variable' | 'deposit'>('all');\n  const [selectedCategoryId, setSelectedCategoryId] = useState<string | null>(null);",
                  1,
              )
              print('state')
          old = """  const filteredServices = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return services;
    return services.filter(
      (s) =>
        s.name.toLowerCase().includes(q) ||
        (s.category?.name || '').toLowerCase().includes(q),
    );
  }, [services, query]);"""
          new = """  const filteredServices = useMemo(() => {
    const q = query.trim().toLowerCase();
    return services.filter((s) => {
      if (selectedCategoryId) {
        const cid = s.categoryId || s.category?.id;
        if (cid !== selectedCategoryId) return false;
      }
      if (pricingFilter === 'fixed' && (s.allowVariable || s.allowDeposit)) return false;
      if (pricingFilter === 'variable' && !s.allowVariable) return false;
      if (pricingFilter === 'deposit' && !s.allowDeposit) return false;
      if (!q) return true;
      return (
        s.name.toLowerCase().includes(q) ||
        (s.category?.name || '').toLowerCase().includes(q)
      );
    });
  }, [services, query, pricingFilter, selectedCategoryId]);"""
          if old in t:
              t = t.replace(old, new, 1)
              print('filter')
          else:
              print('filter missing')
          if 'value={pricingFilter}' not in t:
              # match both with and without ZWNJ in تخصص‌ها
              import re
              pattern = re.compile(
                  r'(<h2 className="font-semibold text-\[#0B2C4A\]">تخصص.\u200c?ها</h2>\s*<Input\s*className="max-w-xs"\s*value=\{query\}\s*onChange=\{\(e\) => setQuery\(e\.target\.value\)\}\s*placeholder="جستجوی تخصص\.\.\."\s*/>)',
                  re.M,
              )
              # simpler line-based insert after query Input closing
              lines = t.splitlines(keepends=True)
              out = []
              inserted = False
              for i, line in enumerate(lines):
                  out.append(line)
                  if (not inserted) and 'placeholder="جستجوی تخصص' in line:
                      # next non-empty should be />
                      pass
                  if (not inserted) and line.strip() == '/>' and i > 0 and 'placeholder="جستجوی تخصص' in lines[i-1]:
                      # close Input, then inject select before closing parent div
                      # parent structure: after this /> comes </div>
                      out.append('\n            <select\n              value={pricingFilter}\n              onChange={(e) => setPricingFilter(e.target.value as \'all\' | \'fixed\' | \'variable\' | \'deposit\')}\n              className="h-10 rounded-xl border px-3 text-sm"\n            >\n              <option value="all">همه حالت‌ها</option>\n              <option value="fixed">فقط ثابت</option>\n              <option value="variable">دارای متغیر</option>\n              <option value="deposit">دارای بیعانه</option>\n            </select>\n')
                      inserted = True
                      print('select inserted')
              t = ''.join(out)
              if not inserted:
                  print('select insert failed')
          if 'setSelectedCategoryId(cat.id)' not in t:
              t = t.replace(
                  'onClick={() => setEditCat({ ...cat })} className="text-xs text-[#2D6CDF]">ویرایش</button>',
                  'onClick={() => setSelectedCategoryId(cat.id)} className="text-xs text-[#0B2C4A]">فیلتر تخصص</button>\n                      <button type="button" disabled={busy} onClick={() => setEditCat({ ...cat })} className="text-xs text-[#2D6CDF]">ویرایش</button>',
                  1,
              )
              print('filter btn')
          t = t.replace(
              'مدیریت کامل دسته‌بندی‌ها و تخصص‌های اصلی (افزودن، ویرایش، فعال/غیرفعال).',
              'مدیریت درخت دسته‌ها، تخصص‌های کاتالوگ و حالت‌های قیمت (ثابت / گزینه‌ها / بیعانه). از دکمه «قیمت‌گذاری» روی هر تخصص استفاده کنید.',
          )
          t = t.replace(
              'className="text-xs text-[#0B2C4A]"\n                      >\n                        قیمت‌گذاری',
              'className="rounded-lg bg-[#0B2C4A] px-2 py-1 text-xs text-white"\n                      >\n                        قیمت‌گذاری',
          )
          p.write_text(t)
          print('final', 'selectedCategoryId' in t, 'value={pricingFilter}' in t, p.stat().st_size)
          PY
      - name: Commit
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/service-categories/page.tsx
          git status
          git commit -m "feat(admin): categories pricing filters and actions (#80 #81)" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
