name: restore-homepage-69
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/payloads/homepage-69/**'
      - '.github/workflows/restore-homepage-69.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and write page.tsx
        run: |
          set -e
          cat .github/payloads/homepage-69/part_*.b64 | tr -d '\n' > /tmp/page.b64
          python3 -c "import base64,pathlib; pathlib.Path('frontend/src/app/page.tsx').write_bytes(base64.b64decode(open('/tmp/page.b64').read())); print(pathlib.Path('frontend/src/app/page.tsx').stat().st_size)"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/page.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "feat(#69,#70): full homepage UX — warm hero, chips, trust, soft empty/error, no role cards"
          git push
