name: restore-homepage-69
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-homepage-69.yml'
      - 'scripts/patch_homepage_69.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore base page and patch
        run: |
          set -e
          git show 93717e3472e0ddaa30a1cc10cbf20d2ff62e7475:frontend/src/app/page.tsx > frontend/src/app/page.tsx
          python3 scripts/patch_homepage_69.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/page.tsx frontend/src/app/register/page.tsx scripts/patch_homepage_69.py
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "feat(#69,#70): homepage UX polish + register role labels (no top role cards)"
          git push
