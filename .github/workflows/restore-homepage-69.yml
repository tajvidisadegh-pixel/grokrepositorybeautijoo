name: restore-homepage-69
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-homepage-69.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wrap form+chips in single parent div
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/page.tsx')
          t = p.read_text()

          old_open = """                {features.showSearchInHero !== false && (
                  <form
                    action={hero.ctaLink || '/search'}
                    method="get"
                    className={`mt-6 flex w-full flex-col gap-2.5 sm:mt-8 sm:flex-row sm:items-center sm:gap-3 ${
                      hero.searchAlign === 'right'
                        ? 'mr-0 ml-auto max-w-xl'
                        : hero.searchAlign === 'left'
                          ? 'ml-0 mr-auto max-w-xl'
                          : 'mx-auto max-w-xl'
                    }`}
                  >"""

          new_open = """                {features.showSearchInHero !== false && (
                  <div
                    className={`mt-6 w-full sm:mt-8 ${
                      hero.searchAlign === 'right'
                        ? 'mr-0 ml-auto max-w-xl'
                        : hero.searchAlign === 'left'
                          ? 'ml-0 mr-auto max-w-xl'
                          : 'mx-auto max-w-xl'
                    }`}
                  >
                    <form
                      action={hero.ctaLink || '/search'}
                      method="get"
                      className="flex w-full flex-col gap-2.5 sm:flex-row sm:items-center sm:gap-3"
                    >"""

          if old_open not in t:
              if 'search?q=%DA%A9' in t and '</form>\n                    <div className="mt-3 flex flex-wrap' not in t:
                  print('already fixed')
                  raise SystemExit(0)
              print('open pattern missing')
              raise SystemExit(1)

          t = t.replace(old_open, new_open, 1)

          old_close = """                      <Link href="/search?sort=distance" className="rounded-full border border-coral/40 bg-coral-soft/50 px-3 py-1.5 text-xs font-medium text-coral hover:bg-coral-soft">نزدیک من</Link>
                    </div>
                )}"""

          new_close = """                      <Link href="/search?sort=distance" className="rounded-full border border-coral/40 bg-coral-soft/50 px-3 py-1.5 text-xs font-medium text-coral hover:bg-coral-soft">نزدیک من</Link>
                    </div>
                  </div>
                )}"""

          if old_close not in t:
              print('close pattern missing')
              raise SystemExit(1)

          t = t.replace(old_close, new_close, 1)
          p.write_text(t)
          print('fixed', p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/page.tsx
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix(#69): wrap hero search+chips in single parent (JSX typecheck)"
          git push
