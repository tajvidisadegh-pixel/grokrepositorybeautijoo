name: Sync backend export (outage fix)
on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/src/sms/**'
      - 'backend/src/payments/**'
      - '.github/workflows/sync-backend-export-outage.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync backend to beautijoo-backend-export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin beautijoo-backend-export main
          git checkout -B beautijoo-backend-export origin/beautijoo-backend-export
          git checkout origin/main -- backend
          git add backend
          if git diff --cached --quiet; then echo already synced; exit 0; fi
          git commit -m "fix(prod): boot with disabled SMS/payment instead of FATAL crash"
          git push origin beautijoo-backend-export
