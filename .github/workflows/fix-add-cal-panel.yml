name: fix-add-cal-panel
on:
  push:
    paths:
      - scripts/fix_add_to_calendar_panel.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_add_to_calendar_panel.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "fix: AddToCalendar on customer bookings (#62.33)" && git push)
