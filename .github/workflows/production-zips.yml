# This workflow only builds and packages production ZIP artifacts.
# It does NOT deploy to Liara or any production host.
# BUILD ≠ DEPLOY
# ZIP artifact ≠ production deployment
name: Build & Package Production Artifacts (No Deploy)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Backend
        working-directory: backend
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Build Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.beautijoo.ir/api/v1
          NEXT_PUBLIC_APP_URL: https://beautijoo.ir
          NEXT_PUBLIC_APP_NAME: Beautijoo
        run: |
          npm install
          npm run typecheck
          npm run build

      - name: Prepare Backend ZIP
        run: |
          rm -rf /tmp/beautijoo-backend
          mkdir -p /tmp/beautijoo-backend
          rsync -a backend/ /tmp/beautijoo-backend/ \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=.env.production
          cd /tmp/beautijoo-backend
          zip -qr "$GITHUB_WORKSPACE/beautijoo-backend-production.zip" .

      - name: Prepare Frontend ZIP
        run: |
          rm -rf /tmp/beautijoo-frontend
          mkdir -p /tmp/beautijoo-frontend
          rsync -a frontend/ /tmp/beautijoo-frontend/ \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=dist \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=.env.production
          cd /tmp/beautijoo-frontend
          zip -qr "$GITHUB_WORKSPACE/beautijoo-frontend-production.zip" .

      - name: Verify ZIP structure and forbidden files
        shell: bash
        run: |
          set -euo pipefail
          unzip -l beautijoo-backend-production.zip > /tmp/backend-zip-list.txt
          unzip -l beautijoo-frontend-production.zip > /tmp/frontend-zip-list.txt

          grep -Eq '(^|[[:space:]])package.json$' /tmp/backend-zip-list.txt
          grep -Eq '(^|[[:space:]])package.json$' /tmp/frontend-zip-list.txt

          ! grep -Eq 'node_modules/|dist/|(^|/)\.env($|/)' /tmp/backend-zip-list.txt
          ! grep -Eq 'node_modules/|\.next/|dist/|(^|/)\.env($|/)' /tmp/frontend-zip-list.txt

          unzip -t beautijoo-backend-production.zip >/dev/null
          unzip -t beautijoo-frontend-production.zip >/dev/null

      - name: Upload Backend ZIP
        uses: actions/upload-artifact@v4
        with:
          name: beautijoo-backend-production
          path: beautijoo-backend-production.zip
          retention-days: 30

      - name: Upload Frontend ZIP
        uses: actions/upload-artifact@v4
        with:
          name: beautijoo-frontend-production
          path: beautijoo-frontend-production.zip
          retention-days: 30
