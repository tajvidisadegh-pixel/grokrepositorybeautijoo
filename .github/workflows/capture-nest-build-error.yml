name: capture-nest-build-error
on:
  push:
    paths:
      - '.github/TRIGGER_CAPTURE_BUILD'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee /tmp/install.log
          npx prisma generate --schema=./prisma/schema.prisma 2>&1 | tee /tmp/prisma.log
          npx nest build 2>&1 | tee /tmp/build.log
          echo "exit=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: Write error report
        if: always()
        run: |
          mkdir -p ../docs
          {
            echo "# Last nest build capture"
            echo
            echo "## install (tail)"
            tail -80 /tmp/install.log || true
            echo
            echo "## prisma"
            cat /tmp/prisma.log || true
            echo
            echo "## nest build"
            cat /tmp/build.log || true
          } > ../docs/LAST_BUILD_ERROR.md
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/TRIGGER_CAPTURE_BUILD
          rm -f .github/workflows/capture-nest-build-error.yml
          git add docs/LAST_BUILD_ERROR.md
          git add -A
          git commit -m "ci: nest build error report" || echo no-commit
          git push origin HEAD:main || echo push-failed
