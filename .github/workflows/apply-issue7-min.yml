name: Apply issue 7 min search
on:
  push:
    paths:
      - '.github/workflows/apply-issue7-min.yml'
      - 'scripts/apply_issue7_min.py'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply min patch
        run: |
          set -e
          python3 scripts/apply_issue7_min.py
          grep -q minRating backend/src/professionals/professionals.service.ts
          grep -q minRating backend/src/service-filters/service-filters.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts backend/src/service-filters/service-filters.service.ts
          git diff --staged --quiet || git commit -m "feat(#7): advanced search filters (rating/price/availability/sort)"
          git push
