name: Apply issue 7 min search
on:
  push:
    paths:
      - '.github/workflows/apply-issue7-min.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch search signatures
        run: |
          set -e
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          grep -q minRating backend/src/professionals/professionals.service.ts
          grep -q minRating backend/src/service-filters/service-filters.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts backend/src/service-filters/service-filters.service.ts
          git diff --staged --quiet || git commit -m "feat(#7): expand search param types for advanced filters"
          git push
