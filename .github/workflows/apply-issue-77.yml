name: Apply issue 77 no mock prod

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-issue-77.yml'
      - 'scripts/patch_issue_77_no_mock_prod.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_issue_77_no_mock_prod.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/payments/payments.module.ts \
            backend/src/sms/sms.module.ts \
            backend/src/sms/mock-sms.provider.ts \
            DEPLOY_LIARA.md
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#77): forbid mock payment and mock SMS in production"
          git push origin HEAD:main
