name: Force dual-role patch
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-auth-now.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/auth/auth.service.ts')
          t = p.read_text()
          print('auth size', len(t))
          print('has class', 'export class AuthService' in t)
          print('has otpCandidates', 'otpCandidates' in t)
          if 'otpCandidates' not in t:
              a = "const user = await this.prisma.user.findFirst({\n      where: { phone: dto.phone, accountType },\n      include: { profile: true, userRoles: { include: { role: true } } },\n    });\n    if (!user || !user.passwordHash) {\n      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');\n    }"
              b = "const roleWanted = accountType === AccountType.professional ? 'professional' : 'customer';\n    const candidates = await this.prisma.user.findMany({\n      where: { phone: dto.phone },\n      include: { profile: true, userRoles: { include: { role: true } } },\n    });\n    let user =\n      candidates.find((u) => u.accountType === accountType) ||\n      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted)) ||\n      null;\n    if (!user || !user.passwordHash) {\n      if (candidates.length > 0) {\n        const other = candidates[0].accountType === AccountType.professional ? 'زیباگر' : 'نوبت‌گیر';\n        const want = roleWanted === 'professional' ? 'زیباگر' : 'نوبت‌گیر';\n        throw new UnauthorizedException(\n          'برای این شماره حساب ' + want + ' با رمز پیدا نشد. اگر حساب ' + other + ' دارید نوع ورود را عوض کنید یا ثبت‌نام نقش جدید انجام دهید.',\n        );\n      }\n      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');\n    }"
              if a not in t:
                  raise SystemExit('login block not found')
              t = t.replace(a, b, 1)
              c = "let user = await this.prisma.user.findFirst({\n      where: { phone: dto.phone, accountType },\n      include: { profile: true, userRoles: { include: { role: true } } },\n    });\n\n    if (!user) {\n      const roleName = accountType === AccountType.professional ? 'professional' : 'customer';"
              d = "const roleWantedOtp = accountType === AccountType.professional ? 'professional' : 'customer';\n    const otpCandidates = await this.prisma.user.findMany({\n      where: { phone: dto.phone },\n      include: { profile: true, userRoles: { include: { role: true } } },\n    });\n    let user =\n      otpCandidates.find((u) => u.accountType === accountType) ||\n      otpCandidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWantedOtp)) ||\n      null;\n\n    if (!user) {\n      const roleName = accountType === AccountType.professional ? 'professional' : 'customer';"
              if c not in t:
                  raise SystemExit('verifyOtp block not found')
              t = t.replace(c, d, 1)
              p.write_text(t)
              print('patched', p.stat().st_size)
          # tips
          page = Path('frontend/src/app/zibagar/page.tsx')
          t = page.read_text()
          t = t.replace(
              '<li><Link href="/zibagar/hours" className="text-coral underline">ساعات بگذار</Link></li>',
              '<li><Link href="/zibagar/hours" className="text-coral underline">ساعات کاری بگذار</Link></li>\n            <li><Link href="/zibagar/portfolio" className="text-coral underline">گالری نمونه‌کار آپلود کن</Link></li>',
              1,
          )
          t = t.replace(
              '''          <Link href="/zibagar/portfolio">
            <Button size="sm" variant="outline">
              نمونه‌کار
            </Button>
          </Link>''',
              '''          <Link href="/zibagar/portfolio">
            <Button size="sm" variant="secondary">
              گالری نمونه‌کار
            </Button>
          </Link>''',
              1,
          )
          page.write_text(t)
          print('page updated', 'گالری' in t)
          PY
      - name: Push
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts frontend/src/app/zibagar/page.tsx
          git status
          git commit -m "fix: dual-role same-phone + portfolio tips" || { echo 'no changes'; exit 0; }
          git pull --rebase origin main || true
          git push origin HEAD:main
          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          cp backend/src/auth/auth.service.ts /tmp/be/src/auth/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/auth.service.ts
          git commit -m "fix: dual-role auth" || true
          git push origin HEAD:beautijoo-backend-export || true
