name: Restore auth.service NOW
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-auth-now.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download good auth.service
        run: |
          set -euxo pipefail
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/48601f895ab22d19bf0dc4093be85cbda316aae3/backend/src/auth/auth.service.ts" \
            -o backend/src/auth/auth.service.ts
          wc -c backend/src/auth/auth.service.ts
          grep -q 'export class AuthService' backend/src/auth/auth.service.ts
          if grep -qE 'PLACEHOLDER|RESTORE_FROM_LOCAL' backend/src/auth/auth.service.ts; then
            echo 'still broken'; exit 1
          fi
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts
          git diff --cached --stat
          git commit -m "fix: restore auth.service.ts from good commit 48601f89"
          git pull --rebase origin main || true
          git push origin HEAD:main
      - name: Sync export branch
        run: |
          set -euxo pipefail
          git fetch origin beautijoo-backend-export
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export
          mkdir -p /tmp/be/src/auth
          cp backend/src/auth/auth.service.ts /tmp/be/src/auth/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/auth.service.ts
          git commit -m "fix: restore auth.service.ts" || exit 0
          git push origin HEAD:beautijoo-backend-export || true
