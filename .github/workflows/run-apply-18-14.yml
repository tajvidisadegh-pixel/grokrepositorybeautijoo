name: run-apply-18-14
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_18_14_notifications.py'
      - '.github/workflows/run-apply-18-14.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply
        run: python3 scripts/apply_18_14_notifications.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/lib/panel-api.ts \
            frontend/src/components/layout/header.tsx \
            frontend/src/components/panel/panel-shell.tsx \
            frontend/src/app/panel/notifications/page.tsx
          if git diff --cached --quiet; then
            echo no-change
          else
            git commit -m 'feat(18.14): header badge, mark-all-read, smart polling'
            git push
          fi
