name: apply-med-service
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-med-service.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch bookings.service.ts and auth.service.ts
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # ---- bookings.service.ts ----
          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          if 'PLACEHOLDER' in t and 'class BookingsService' not in t:
              raise SystemExit('bookings broken')

          # med6: reschedule lead = BOOKING_MIN_LEAD_HOURS
          if 'جابه‌جا کنید' not in t:
              old = (
                  "    if (isNaN(startAt.getTime()) || startAt.getTime() < Date.now()) {\n"
                  "      throw new BadRequestException('زمان نامعتبر');\n"
                  "    }\n"
                  "    if (startAt.getTime() < Date.now() + 60 * 60 * 1000) {\n"
                  "      throw new BadRequestException('زمان انتخاب‌شده کمتر از حداقل فاصله مجاز است');\n"
                  "    }"
              )
              new = (
                  "    if (isNaN(startAt.getTime()) || startAt.getTime() < Date.now()) {\n"
                  "      throw new BadRequestException('زمان نامعتبر');\n"
                  "    }\n"
                  "    // #82.med6 — same lead policy as create (BOOKING_MIN_LEAD_HOURS, default 4h)\n"
                  "    {\n"
                  "      const minLead = parseInt(process.env.BOOKING_MIN_LEAD_HOURS || '4', 10);\n"
                  "      const hours = Number.isFinite(minLead) && minLead >= 0 ? minLead : 4;\n"
                  "      if (startAt.getTime() - Date.now() < hours * 3600_000) {\n"
                  "        throw new BadRequestException(\n"
                  "          hours === 0\n"
                  "            ? 'زمان انتخاب‌شده نامعتبر است'\n"
                  "            : `حداقل ${hours} ساعت قبل از نوبت باید جابه‌جا کنید.`,\n"
                  "        );\n"
                  "      }\n"
                  "    }"
              )
              if old not in t:
                  raise SystemExit('med6 pattern missing')
              t = t.replace(old, new, 1)
              print('med6 ok')
          else:
              print('med6 skip')

          # med8: reschedule notify pro
          if 'reschedule notify failed' not in t:
              old = (
                  "      return tx.booking.update({ where: { id }, data: { startAt, endAt } });\n"
                  "    });\n"
                  "  }"
              )
              new = (
                  "      return tx.booking.update({ where: { id }, data: { startAt, endAt } });\n"
                  "    }).then(async (updated) => {\n"
                  "      // #82.med8 — notify professional of reschedule (non-blocking)\n"
                  "      try {\n"
                  "        const pro = await this.prisma.professional.findUnique({\n"
                  "          where: { id: updated.professionalId },\n"
                  "          select: { userId: true },\n"
                  "        });\n"
                  "        if (pro?.userId) {\n"
                  "          await this.notifications.notify({\n"
                  "            userId: pro.userId,\n"
                  "            type: NotificationType.booking_request,\n"
                  "            title: 'جابه‌جایی نوبت',\n"
                  "            body: 'مشتری زمان نوبت را تغییر داد.',\n"
                  "            data: { bookingId: id, href: `/zibagar/bookings?focus=${id}` },\n"
                  "            sms: false,\n"
                  "          });\n"
                  "        }\n"
                  "      } catch (err) {\n"
                  "        this.logger.warn(\n"
                  "          `reschedule notify failed booking=${id}: ${(err as Error)?.message || err}`,\n"
                  "        );\n"
                  "      }\n"
                  "      return updated;\n"
                  "    });\n"
                  "  }"
              )
              if old not in t:
                  raise SystemExit('med8 pattern missing')
              t = t.replace(old, new, 1)
              print('med8 ok')
          else:
              print('med8 skip')

          # med11 customer list
          if 'safePage' not in t:
              old = (
                  "  async listMineAsCustomer(userId: string, page = 1, limit = 20, status?: string) {\n"
                  "    const skip = (page - 1) * limit;\n"
                  "    const where: { customerId: string; status?: BookingStatus } = { customerId: userId };\n"
                  "    if (status) where.status = status as BookingStatus;"
              )
              new = (
                  "  async listMineAsCustomer(userId: string, page = 1, limit = 20, status?: string) {\n"
                  "    // #82.med11 — guard against NaN / invalid status (was 500)\n"
                  "    const safePage = Number.isFinite(page) && page > 0 ? Math.floor(page) : 1;\n"
                  "    const safeLimit = Number.isFinite(limit) && limit > 0 ? Math.min(Math.floor(limit), 100) : 20;\n"
                  "    const skip = (safePage - 1) * safeLimit;\n"
                  "    const where: { customerId: string; status?: BookingStatus } = { customerId: userId };\n"
                  "    if (status) {\n"
                  "      const allowed = Object.values(BookingStatus) as string[];\n"
                  "      if (!allowed.includes(status)) {\n"
                  "        throw new BadRequestException('وضعیت رزرو نامعتبر است');\n"
                  "      }\n"
                  "      where.status = status as BookingStatus;\n"
                  "    }"
              )
              if old not in t:
                  raise SystemExit('med11 customer missing')
              t = t.replace(old, new, 1)
              old2 = (
                  "    return { items, meta: { page, limit, total } };\n"
                  "  }\n\n"
                  "  async listMineAsProfessional"
              )
              new2 = (
                  "    return { items, meta: { page: safePage, limit: safeLimit, total } };\n"
                  "  }\n\n"
                  "  async listMineAsProfessional"
              )
              if old2 not in t:
                  raise SystemExit('med11 customer return missing')
              t = t.replace(old2, new2, 1)
              print('med11 customer ok')
          else:
              print('med11 customer skip')

          # med11 pro list
          if 'pageRaw' not in t:
              old = (
                  "  async listMineAsProfessional(userId: string, query: ProBookingListQuery = {}) {\n"
                  "    const page = query.page || 1;\n"
                  "    const limit = Math.min(query.limit || 20, 100);\n"
                  "    const skip = (page - 1) * limit;\n"
                  "    const pro = await this.prisma.professional.findFirst({ where: { userId } });\n"
                  "    if (!pro) throw new ForbiddenException();\n"
                  "    const where: Prisma.BookingWhereInput = { professionalId: pro.id };\n"
                  "    if (query.status) {\n"
                  "      const parts = query.status.split(',').map((s) => s.trim()).filter(Boolean) as BookingStatus[];\n"
                  "      if (parts.length === 1) where.status = parts[0];\n"
                  "      else if (parts.length > 1) where.status = { in: parts };\n"
                  "    }"
              )
              new = (
                  "  async listMineAsProfessional(userId: string, query: ProBookingListQuery = {}) {\n"
                  "    // #82.med11 — guard page/limit/status\n"
                  "    const pageRaw = query.page ?? 1;\n"
                  "    const limitRaw = query.limit ?? 20;\n"
                  "    const page = Number.isFinite(pageRaw) && pageRaw > 0 ? Math.floor(pageRaw) : 1;\n"
                  "    const limit = Number.isFinite(limitRaw) && limitRaw > 0 ? Math.min(Math.floor(limitRaw), 100) : 20;\n"
                  "    const skip = (page - 1) * limit;\n"
                  "    const pro = await this.prisma.professional.findFirst({ where: { userId } });\n"
                  "    if (!pro) throw new ForbiddenException();\n"
                  "    const where: Prisma.BookingWhereInput = { professionalId: pro.id };\n"
                  "    if (query.status) {\n"
                  "      const allowed = Object.values(BookingStatus) as string[];\n"
                  "      const parts = query.status\n"
                  "        .split(',')\n"
                  "        .map((s) => s.trim())\n"
                  "        .filter(Boolean)\n"
                  "        .filter((s) => allowed.includes(s)) as BookingStatus[];\n"
                  "      if (!parts.length) {\n"
                  "        throw new BadRequestException('وضعیت رزرو نامعتبر است');\n"
                  "      }\n"
                  "      if (parts.length === 1) where.status = parts[0];\n"
                  "      else where.status = { in: parts };\n"
                  "    }"
              )
              if old not in t:
                  raise SystemExit('med11 pro missing')
              t = t.replace(old, new, 1)
              print('med11 pro ok')
          else:
              print('med11 pro skip')

          # med13 offline notify text
          if 'رزرو ثبت شد' not in t:
              old = (
                  "      // #82.8 — notifications must not fail the booking create path\n"
                  "      try {\n"
                  "        await this.notifications.notify({\n"
                  "          userId: pro.userId,\n"
                  "          type: NotificationType.booking_request,\n"
                  "          title: 'درخواست رزرو (در انتظار پرداخت)',\n"
                  "          body: 'یک مشتری نوبت رزرو کرده و در حال پرداخت است. تا تأیید پرداخت، نوبت قطعی نیست.',\n"
                  "          data: {\n"
                  "            bookingId: booking.id,\n"
                  "            customerId,\n"
                  "            professionalId: data.professionalId,\n"
                  "            href: `/zibagar/bookings?focus=${booking.id}`,\n"
                  "          },\n"
                  "          sms: true,\n"
                  "        });\n"
                  "        await this.notifications.notify({\n"
                  "          userId: customerId,\n"
                  "          type: NotificationType.booking_request,\n"
                  "          title: 'رزرو در انتظار پرداخت',\n"
                  "          body: 'رزرو شما ثبت شد. پس از پرداخت موفق، نوبت قطعی می‌شود.',\n"
                  "          data: { bookingId: booking.id, professionalId: data.professionalId },\n"
                  "          sms: false,\n"
                  "        });\n"
                  "      } catch (err) {\n"
                  "        this.logger.warn(`post-create notify failed booking=${booking.id}: ${(err as Error)?.message || err}`);\n"
                  "      }"
              )
              new = (
                  "      // #82.8 — notifications must not fail the booking create path\n"
                  "      // #82.med13 — copy depends on BOOKING_PAYMENT_MODE / offline\n"
                  "      try {\n"
                  "        const payMode = (process.env.BOOKING_PAYMENT_MODE || 'auto').toString().trim().toLowerCase();\n"
                  "        const provider = (process.env.PAYMENT_PROVIDER || '').toString().trim().toLowerCase();\n"
                  "        const offline =\n"
                  "          payMode === 'offline' ||\n"
                  "          (payMode === 'auto' && (!provider || provider === 'disabled' || provider === 'none'));\n"
                  "        if (offline) {\n"
                  "          await this.notifications.notify({\n"
                  "            userId: pro.userId,\n"
                  "            type: NotificationType.booking_request,\n"
                  "            title: 'رزرو جدید',\n"
                  "            body: 'یک مشتری نوبت رزرو کرده است.',\n"
                  "            data: {\n"
                  "              bookingId: booking.id,\n"
                  "              customerId,\n"
                  "              professionalId: data.professionalId,\n"
                  "              href: `/zibagar/bookings?focus=${booking.id}`,\n"
                  "            },\n"
                  "            sms: true,\n"
                  "          });\n"
                  "          await this.notifications.notify({\n"
                  "            userId: customerId,\n"
                  "            type: NotificationType.booking_request,\n"
                  "            title: 'رزرو ثبت شد',\n"
                  "            body: 'رزرو شما با موفقیت ثبت شد.',\n"
                  "            data: { bookingId: booking.id, professionalId: data.professionalId },\n"
                  "            sms: false,\n"
                  "          });\n"
                  "        } else {\n"
                  "          await this.notifications.notify({\n"
                  "            userId: pro.userId,\n"
                  "            type: NotificationType.booking_request,\n"
                  "            title: 'درخواست رزرو (در انتظار پرداخت)',\n"
                  "            body: 'یک مشتری نوبت رزرو کرده و در حال پرداخت است. تا تأیید پرداخت، نوبت قطعی نیست.',\n"
                  "            data: {\n"
                  "              bookingId: booking.id,\n"
                  "              customerId,\n"
                  "              professionalId: data.professionalId,\n"
                  "              href: `/zibagar/bookings?focus=${booking.id}`,\n"
                  "            },\n"
                  "            sms: true,\n"
                  "          });\n"
                  "          await this.notifications.notify({\n"
                  "            userId: customerId,\n"
                  "            type: NotificationType.booking_request,\n"
                  "            title: 'رزرو در انتظار پرداخت',\n"
                  "            body: 'رزرو شما ثبت شد. پس از پرداخت موفق، نوبت قطعی می‌شود.',\n"
                  "            data: { bookingId: booking.id, professionalId: data.professionalId },\n"
                  "            sms: false,\n"
                  "          });\n"
                  "        }\n"
                  "      } catch (err) {\n"
                  "        this.logger.warn(`post-create notify failed booking=${booking.id}: ${(err as Error)?.message || err}`);\n"
                  "      }"
              )
              if old not in t:
                  raise SystemExit('med13 missing')
              t = t.replace(old, new, 1)
              print('med13 ok')
          else:
              print('med13 skip')

          # med18 dead empty if
          old = (
              "      if (isPro && !isCustomer && b.status === BookingStatus.pending && !paid) {\n"
              "        // allow pro to clear unpaid hold\n"
              "      }"
          )
          if old in t:
              t = t.replace(old, "      // unpaid pending: pro may clear hold (fall through to cancel)", 1)
              print('med18 ok')
          else:
              print('med18 skip')

          p.write_text(t, encoding='utf-8')
          assert 'class BookingsService' in t
          print('bookings lines', len(t.splitlines()))

          # ---- auth.service.ts ----
          pa = Path('backend/src/auth/auth.service.ts')
          a = pa.read_text(encoding='utf-8')

          # med16 register short password
          if 'رمز عبور حداقل ۸ کاراکتر باشد' not in a:
              old = (
                  "    // Password is optional (issue #43) - OTP-only accounts have null passwordHash\n"
                  "    const passwordHash =\n"
                  "      dto.password && dto.password.length >= 8\n"
                  "        ? await argon2.hash(dto.password)\n"
                  "        : null;"
              )
              new = (
                  "    // Password is optional (issue #43) - OTP-only accounts have null passwordHash\n"
                  "    // #82.med16 — non-empty password shorter than 8 must error (was silently ignored)\n"
                  "    if (dto.password != null && dto.password !== '' && dto.password.length < 8) {\n"
                  "      throw new BadRequestException('رمز عبور حداقل ۸ کاراکتر باشد');\n"
                  "    }\n"
                  "    const passwordHash =\n"
                  "      dto.password && dto.password.length >= 8\n"
                  "        ? await argon2.hash(dto.password)\n"
                  "        : null;"
              )
              if old not in a:
                  raise SystemExit('med16 missing')
              a = a.replace(old, new, 1)
              print('med16 ok')
          else:
              print('med16 skip')

          # med17 email P2002
          if "err?.code === 'P2002'" not in a:
              old = (
                  "    await this.prisma.$transaction(async (tx) => {\n"
                  "      if (emailUpdate !== undefined) {\n"
                  "        await tx.user.update({\n"
                  "          where: { id: userId },\n"
                  "          data: { email: emailUpdate },\n"
                  "        });\n"
                  "      }\n"
                  "      if (Object.keys(profileData).length > 0) {\n"
                  "        await tx.profile.upsert({\n"
                  "          where: { userId },\n"
                  "          create: { userId, displayName: (dto.displayName as string) || '', ...profileData },\n"
                  "          update: profileData,\n"
                  "        });\n"
                  "      }\n"
                  "      try {\n"
                  "        await tx.auditLog.create({\n"
                  "          data: {\n"
                  "            actorId: userId,\n"
                  "            action: 'user.profile_update',\n"
                  "            entityType: 'user',\n"
                  "            entityId: userId,\n"
                  "            after: { email: emailUpdate, ...profileData } as any,\n"
                  "          },\n"
                  "        });\n"
                  "      } catch {\n"
                  "        /* non-blocking */\n"
                  "      }\n"
                  "    });\n\n"
                  "    userAuthCache.invalidate(userId);\n"
                  "    return this.me(userId);\n"
                  "  }"
              )
              new = (
                  "    try {\n"
                  "      await this.prisma.$transaction(async (tx) => {\n"
                  "        if (emailUpdate !== undefined) {\n"
                  "          await tx.user.update({\n"
                  "            where: { id: userId },\n"
                  "            data: { email: emailUpdate },\n"
                  "          });\n"
                  "        }\n"
                  "        if (Object.keys(profileData).length > 0) {\n"
                  "          await tx.profile.upsert({\n"
                  "            where: { userId },\n"
                  "            create: { userId, displayName: (dto.displayName as string) || '', ...profileData },\n"
                  "            update: profileData,\n"
                  "          });\n"
                  "        }\n"
                  "        try {\n"
                  "          await tx.auditLog.create({\n"
                  "            data: {\n"
                  "              actorId: userId,\n"
                  "              action: 'user.profile_update',\n"
                  "              entityType: 'user',\n"
                  "              entityId: userId,\n"
                  "              after: { email: emailUpdate, ...profileData } as any,\n"
                  "            },\n"
                  "          });\n"
                  "        } catch {\n"
                  "          /* non-blocking */\n"
                  "        }\n"
                  "      });\n"
                  "    } catch (e: unknown) {\n"
                  "      // #82.med17 — duplicate email must be 400, not Prisma 500\n"
                  "      const err = e as { code?: string };\n"
                  "      if (err?.code === 'P2002') {\n"
                  "        throw new ConflictException('این ایمیل قبلاً ثبت شده است');\n"
                  "      }\n"
                  "      throw e;\n"
                  "    }\n\n"
                  "    userAuthCache.invalidate(userId);\n"
                  "    return this.me(userId);\n"
                  "  }"
              )
              if old not in a:
                  raise SystemExit('med17 missing')
              a = a.replace(old, new, 1)
              print('med17 ok')
          else:
              print('med17 skip')

          pa.write_text(a, encoding='utf-8')
          assert 'class AuthService' in a
          print('auth lines', len(a.splitlines()))
          print('ALL_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/auth/auth.service.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82.med): lead-time, list validation, offline notify, register pwd, email conflict, reschedule notify"
          git push origin HEAD:main
