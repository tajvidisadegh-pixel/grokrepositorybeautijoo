name: apply-18-7-reuse
on:
  push:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_18_7_reuse_only.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/auth/auth.service.ts
          if git diff --staged --quiet; then echo nochange; else git commit -m 'feat(18.7): refresh token reuse detection' && git push; fi
