name: Fix finance APIs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_finance.py'
      - 'scripts/patch_fin_ctrl.py'
      - '.github/workflows/fix-finance.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          if [ -f scripts/patch_finance.py ]; then python3 scripts/patch_finance.py || true; fi
          if [ -f scripts/patch_fin_ctrl.py ]; then python3 scripts/patch_fin_ctrl.py || true; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts backend/src/admin/admin.controller.ts frontend/src/app/admin/finance/page.tsx
          git status
          git commit -m "fix(admin): finance POST routes + defensive UI" || exit 0
          git push origin HEAD:main
