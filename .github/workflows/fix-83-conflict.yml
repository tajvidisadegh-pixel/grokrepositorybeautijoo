name: fix-83-conflict
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/hours/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'conflicts.length' in t:
              print('already')
          else:
              old = """                  setSubmitting(true);
                  setError(null);
                  try {
                    await addTimeOff({
                      ...tehranRange(blockDate, blockFrom, blockTo),
                      reason: blockReason.trim() || undefined,
                    });"""
              new = """                  const range = tehranRange(blockDate, blockFrom, blockTo);
                  const rs = new Date(range.startAt).getTime();
                  const re = new Date(range.endAt).getTime();
                  const conflicts = bookings.filter((b) => {
                    const st = String(b.status || '');
                    if (st === 'cancelled' || st === 'rejected') return false;
                    const bs = new Date(b.startAt).getTime();
                    const be = b.endAt ? new Date(b.endAt).getTime() : bs + 3600000;
                    return bs < re && be > rs;
                  });
                  if (conflicts.length > 0) {
                    const ok = window.confirm(
                      `این بازه با ${conflicts.length.toLocaleString('fa-IR')} نوبت تداخل دارد. ادامه می‌دهید؟`,
                    );
                    if (!ok) return;
                  }
                  setSubmitting(true);
                  setError(null);
                  try {
                    await addTimeOff({
                      ...range,
                      reason: blockReason.trim() || undefined,
                    });"""
              if old in t:
                  t = t.replace(old, new, 1)
                  p.write_text(t, encoding='utf-8')
                  print('fixed')
              else:
                  print('miss')
          PY
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "fix: time-off conflict confirm on block dialog (#40.83)" && git push; fi
