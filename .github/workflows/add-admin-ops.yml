  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-admin-ops.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download controller from gist-like commit artifact via curl raw parts
        run: |
          set -e
          # Reconstruct from repo scripts if present, else write minimal inline
          mkdir -p backend/src/admin
          python3 << 'PY'
          from pathlib import Path
          # Minimal but complete controller written here
          Path('backend/src/admin/admin-ops.controller.ts').write_text(r'''
import {
  Body, Controller, Get, Param, Patch, Post, Put, Query,
  BadRequestException, ConflictException, NotFoundException,
} from '@nestjs/common';
import { ApiBearerAuth, ApiTags } from '@nestjs/swagger';
import { IsArray, IsBoolean, IsNumber, IsOptional, IsString } from 'class-validator';
import { PaymentStatus, UserStatus, Prisma } from '@prisma/client';
import { PrismaService } from '../prisma/prisma.service';
import { Roles } from '../common/decorators/roles.decorator';
import { CurrentUser } from '../common/decorators/current-user.decorator';

class CreateCustomerDto {
  @IsString() phone!: string;
  @IsOptional() @IsString() displayName?: string;
  @IsOptional() @IsString() firstName?: string;
  @IsOptional() @IsString() lastName?: string;
}
class UpdateUserProfileDto {
  @IsOptional() @IsString() displayName?: string;
  @IsOptional() @IsString() firstName?: string;
  @IsOptional() @IsString() lastName?: string;
  @IsOptional() @IsString() phone?: string;
}
class NotifyUsersDto {
  @IsArray() @IsString({ each: true }) userIds!: string[];
  @IsString() title!: string;
  @IsString() body!: string;
  @IsOptional() @IsBoolean() sms?: boolean;
  @IsOptional() @IsString() campaignId?: string;
}
class NotifyByFilterDto {
  @IsString() title!: string;
  @IsString() body!: string;
  @IsOptional() @IsBoolean() sms?: boolean;
  @IsOptional() @IsNumber() limit?: number;
  @IsOptional() filters?: Record<string, unknown>;
}
class FeaturedDto { @IsBoolean() isFeatured!: boolean; }

@ApiTags('admin-ops')
@ApiBearerAuth()
@Roles('SUPER_ADMIN', 'admin')
@Controller('admin')
export class AdminOpsController {
  constructor(private readonly prisma: PrismaService) {}

  private async audit(actorId: string | undefined, action: string, entityType: string, entityId: string | null, after: unknown) {
    try {
      await this.prisma.auditLog.create({
        data: { actorId: actorId || null, action, entityType, entityId: entityId || undefined, after: after as Prisma.InputJsonValue },
      });
    } catch { /* ignore */ }
  }

  @Get('content')
  async getContent() {
    const row = await this.prisma.platformSetting.findUnique({ where: { key: 'site_cms_content' } });
    return (row?.value as object) ?? { hero: {}, texts: {}, features: {} };
  }

  @Put('content')
  async putContent(@Body() body: any, @CurrentUser('id') actorId?: string) {
    const value = { hero: body?.hero ?? {}, texts: body?.texts ?? {}, features: body?.features ?? {} } as any;
    await this.prisma.platformSetting.upsert({ where: { key: 'site_cms_content' }, create: { key: 'site_cms_content', value }, update: { value } });
    await this.audit(actorId, 'site_cms.content_save', 'platform_setting', 'site_cms_content', value);
    return value;
  }

  @Get('site-builder')
  async getSiteBuilder() {
    const row = await this.prisma.platformSetting.findUnique({ where: { key: 'site_cms_sections' } });
    const val = row?.value;
    if (Array.isArray(val)) return val;
    if (val && typeof val === 'object' && Array.isArray((val as any).sections)) return (val as any).sections;
    return [];
  }

  @Put('site-builder')
  async putSiteBuilder(@Body() body: any, @CurrentUser('id') actorId?: string) {
    const list = Array.isArray(body) ? body : body?.sections ?? [];
    const value = list as any;
    await this.prisma.platformSetting.upsert({ where: { key: 'site_cms_sections' }, create: { key: 'site_cms_sections', value }, update: { value } });
    await this.audit(actorId, 'site_cms.builder_save', 'platform_setting', 'site_cms_sections', value);
    return list;
  }

  @Post('users')
  async createCustomer(@Body() dto: CreateCustomerDto, @CurrentUser('id') actorId?: string) {
    const phone = String(dto.phone || '').trim();
    if (!phone) throw new BadRequestException('موبایل الزامی است');
    const existing = await this.prisma.user.findFirst({ where: { phone } });
    if (existing) throw new ConflictException('این موبایل قبلاً ثبت شده است');
    const user = await this.prisma.user.create({
      data: {
        phone, accountType: 'customer' as any, status: UserStatus.active,
        profile: { create: { displayName: (dto.displayName || dto.firstName || phone).trim(), firstName: dto.firstName?.trim() || null, lastName: dto.lastName?.trim() || null } },
      },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    await this.audit(actorId, 'user.create', 'user', user.id, { phone });
    return user;
  }

  @Patch('users/:id/profile')
  async updateUserProfile(@Param('id') id: string, @Body() dto: UpdateUserProfileDto, @CurrentUser('id') actorId?: string) {
    const existing = await this.prisma.user.findUnique({ where: { id } });
    if (!existing) throw new NotFoundException('کاربر یافت نشد');
    if (dto.phone !== undefined) {
      const phone = dto.phone.trim();
      if (phone && phone !== existing.phone) {
        const taken = await this.prisma.user.findFirst({ where: { phone, NOT: { id } } });
        if (taken) throw new ConflictException('این موبایل قبلاً ثبت شده است');
        await this.prisma.user.update({ where: { id }, data: { phone } });
      }
    }
    const profileData: any = {};
    if (dto.displayName !== undefined) profileData.displayName = dto.displayName.trim() || existing.phone || 'User';
    if (dto.firstName !== undefined) profileData.firstName = dto.firstName.trim() || null;
    if (dto.lastName !== undefined) profileData.lastName = dto.lastName.trim() || null;
    if (Object.keys(profileData).length) {
      await this.prisma.profile.upsert({
        where: { userId: id },
        update: profileData,
        create: { userId: id, displayName: profileData.displayName || existing.phone || 'User', firstName: profileData.firstName ?? null, lastName: profileData.lastName ?? null },
      });
    }
    await this.audit(actorId, 'user.profile_update', 'user', id, dto);
    return this.prisma.user.findUnique({ where: { id }, include: { profile: true, userRoles: { include: { role: true } } } });
  }

  @Post('notifications/notify')
  async notifyUsers(@Body() dto: NotifyUsersDto, @CurrentUser('id') actorId?: string) {
    const title = String(dto.title || '').trim();
    const body = String(dto.body || '').trim();
    if (!title || !body) throw new BadRequestException('عنوان و متن الزامی است');
    const ids = Array.from(new Set((dto.userIds || []).filter(Boolean)));
    const campaignId = dto.campaignId || `cmp_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    let notified = 0, failed = 0;
    for (const userId of ids) {
      try {
        await this.prisma.notification.create({ data: { userId, type: 'system' as any, title, body, data: { campaignId, smsRequested: !!dto.sms } } });
        notified++;
      } catch { failed++; }
    }
    await this.audit(actorId, 'notification.notify', 'campaign', campaignId, { title, notified, failed });
    return { success: true, notified, smsSent: 0, campaignId, failed };
  }

  @Post('notifications/notify-by-filter')
  async notifyByFilter(@Body() dto: NotifyByFilterDto, @CurrentUser('id') actorId?: string) {
    const limit = Math.min(5000, Math.max(1, Number(dto.limit) || 500));
    const filters = dto.filters || {};
    const where: Prisma.UserWhereInput = {};
    if (filters.neverNotified) where.notifications = { none: {} };
    if (filters.hasPaid) where.bookingsAsCustomer = { some: { payment: { is: { status: PaymentStatus.paid } } } };
    const users = await this.prisma.user.findMany({ where, take: limit, select: { id: true }, orderBy: { createdAt: 'desc' } });
    return this.notifyUsers({ userIds: users.map(u => u.id), title: dto.title, body: dto.body, sms: dto.sms }, actorId);
  }

  @Get('notifications/campaigns')
  async listCampaigns(@Query('page') pageStr?: string, @Query('limit') limitStr?: string, @Query('search') search?: string) {
    const page = Math.max(1, Number(pageStr) || 1);
    const limit = Math.min(50, Math.max(1, Number(limitStr) || 20));
    const rows = await this.prisma.notification.findMany({
      where: search ? { OR: [{ title: { contains: search, mode: 'insensitive' } }, { body: { contains: search, mode: 'insensitive' } }] } : undefined,
      orderBy: { createdAt: 'desc' }, take: 2000,
      select: { id: true, title: true, body: true, createdAt: true, readAt: true, data: true },
    });
    const map = new Map<string, any>();
    for (const r of rows) {
      const cid = (r.data as any)?.campaignId || `legacy_${r.id}`;
      if (!map.has(cid)) map.set(cid, { campaignId: cid, title: r.title, body: r.body, createdAt: r.createdAt, total: 0, sent: 0, failed: 0, read: 0 });
      const c = map.get(cid); c.total++; c.sent++; if (r.readAt) c.read++;
    }
    const all = Array.from(map.values()).sort((a, b) => +new Date(b.createdAt) - +new Date(a.createdAt));
    const total = all.length;
    return { items: all.slice((page - 1) * limit, page * limit), meta: { page, limit, total, totalPages: Math.ceil(total / limit) || 0 } };
  }

  @Get('notifications/campaigns/:campaignId')
  async campaignRecipients(@Param('campaignId') campaignId: string, @Query('page') pageStr?: string, @Query('limit') limitStr?: string) {
    const page = Math.max(1, Number(pageStr) || 1);
    const limit = Math.min(100, Math.max(1, Number(limitStr) || 50));
    const where: any = { data: { path: ['campaignId'], equals: campaignId } };
    const [rows, total] = await Promise.all([
      this.prisma.notification.findMany({ where, skip: (page - 1) * limit, take: limit, orderBy: { createdAt: 'desc' }, include: { user: { select: { id: true, phone: true, profile: { select: { displayName: true } } } } } }),
      this.prisma.notification.count({ where }),
    ]);
    return {
      campaignId,
      items: rows.map(r => ({ id: r.id, userId: r.userId, phone: r.user?.phone, displayName: r.user?.profile?.displayName, status: r.readAt ? 'read' : 'sent', createdAt: r.createdAt, error: null })),
      meta: { page, limit, total, totalPages: Math.ceil(total / limit) || 0 },
    };
  }

  @Post('notifications/campaigns/:campaignId/retry-failed')
  async retryCampaign(@Param('campaignId') campaignId: string, @CurrentUser('id') actorId?: string) {
    await this.audit(actorId, 'notification.retry_failed', 'campaign', campaignId, {});
    return { success: true, retried: 0, campaignId, totalFailed: 0 };
  }

  @Patch('professionals/:id/feature')
  async setFeaturedAlias(@Param('id') id: string, @Body() dto: FeaturedDto, @CurrentUser('id') actorId?: string) {
    const pro = await this.prisma.professional.findUnique({ where: { id } });
    if (!pro) throw new NotFoundException('زیباگر یافت نشد');
    const updated = await this.prisma.professional.update({ where: { id }, data: { isFeatured: !!dto.isFeatured } });
    await this.audit(actorId, 'professional.featured', 'professional', id, { isFeatured: dto.isFeatured });
    return updated;
  }
}
'''.lstrip())
          print('wrote', Path('backend/src/admin/admin-ops.controller.ts').stat().st_size)
          mod = Path('backend/src/admin/admin.module.ts')
          mt = mod.read_text()
          if 'AdminOpsController' not in mt:
              if "admin-catalog.controller" in mt:
                  mt = mt.replace("from './admin-catalog.controller';", "from './admin-catalog.controller';\nimport { AdminOpsController } from './admin-ops.controller';")
              else:
                  mt = mt.replace("from './public-site.controller';", "from './public-site.controller';\nimport { AdminOpsController } from './admin-ops.controller';")
              if 'AdminCatalogController,' in mt:
                  mt = mt.replace('AdminCatalogController,', 'AdminCatalogController,\n    AdminOpsController,')
              else:
                  mt = mt.replace('PublicSiteController,', 'PublicSiteController,\n    AdminOpsController,')
              mod.write_text(mt)
              print('module ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin-ops.controller.ts backend/src/admin/admin.module.ts
          git commit -m "feat(admin): AdminOpsController for CMS, notifications, users create/profile, feature" || exit 0
          git push origin HEAD:main
