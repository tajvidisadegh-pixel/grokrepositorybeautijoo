name: Restore panel-api now
on:
  push:
    paths:
      - 'scripts/restore_panel_api.py'
      - '.github/workflows/restore-panel-now.yml'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_panel_api.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/panel-api.ts
          git diff --staged --quiet && echo nochange && exit 0
          git commit -m "fix: restore full panel-api.ts (remove PLACEHOLDER)"
          git push
