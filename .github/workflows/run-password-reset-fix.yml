name: run-password-reset-fix
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_password_reset_purpose.py'
      - '.github/TRIGGER_PASSWORD_RESET_FIX'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main
        run: python3 scripts/patch_password_reset_purpose.py
      - name: Commit main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/password-reset.helpers.ts backend/src/auth/auth.service.ts
          git commit -m "fix(auth): unify password_reset OTP purpose so forgot-password works" || exit 0
          git push
      - name: Sync auth files to export branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 << 'PY'
          import base64, json, os, urllib.request
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'beautijoo-backend-export'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'sync-auth',
              'Content-Type': 'application/json',
          }
          def api(method, url, data=None):
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read().decode())
          for local, remote in [
              ('backend/src/auth/auth.service.ts', 'src/auth/auth.service.ts'),
              ('backend/src/auth/password-reset.helpers.ts', 'src/auth/password-reset.helpers.ts'),
          ]:
              with open(local, 'rb') as f:
                  raw = f.read()
              b64 = base64.b64encode(raw).decode()
              get_url = f'https://api.github.com/repos/{repo}/contents/{remote}?ref={branch}'
              sha = None
              try:
                  sha = api('GET', get_url).get('sha')
              except Exception as e:
                  print('get', remote, e)
              payload = {
                  'message': f'fix(auth): sync {remote} password_reset purpose from main',
                  'content': b64,
                  'branch': branch,
              }
              if sha:
                  payload['sha'] = sha
              api('PUT', f'https://api.github.com/repos/{repo}/contents/{remote}', json.dumps(payload).encode())
              print('synced', remote, len(raw))
          PY
