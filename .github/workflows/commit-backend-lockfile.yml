name: commit-backend-lockfile

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/tmp/package-lock.part0.b64"

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lockfile from parts and commit
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, gzip, pathlib
          parts = sorted(pathlib.Path("backend/tmp").glob("package-lock.part*.b64"))
          assert parts, "no parts"
          b64 = "".join(p.read_text().strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("backend/package-lock.json").write_bytes(raw)
          print("wrote", len(raw))
          assert b"lockfileVersion" in raw
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git rm -f backend/tmp/package-lock.part*.b64 || true
          if git diff --cached --quiet; then echo noop; exit 0; fi
          git commit -m "chore(#82.16): add backend package-lock.json for deterministic npm ci"
          git pull --rebase origin main || true
          git push origin HEAD:main
