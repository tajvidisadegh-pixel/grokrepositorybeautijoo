name: assemble-82-services
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-82-services.yml'
      - 'scripts/b64chunks/**'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble services from b64 chunks
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64
          from pathlib import Path

          def assemble(prefix, dest):
              parts = []
              for i in range(4):
                  p = Path(f"scripts/b64chunks/{prefix}.{i}.b64")
                  if not p.exists():
                      raise SystemExit(f"missing {p}")
                  parts.append(base64.b64decode("".join(p.read_text().split())))
              data = b"".join(parts)
              Path(dest).parent.mkdir(parents=True, exist_ok=True)
              Path(dest).write_bytes(data)
              t = data.decode()
              print(dest, len(data), "has82", "#82" in t)
              return t

          pt = assemble("pay", "backend/src/payments/payments.service.ts")
          bt = assemble("book", "backend/src/bookings/bookings.service.ts")
          assert "#82.5" in pt and "booking_cancelled" in pt
          assert "#82.7" in bt and "#82.6" in bt
          Path("docs").mkdir(exist_ok=True)
          Path("docs/SECURITY_ISSUE_82_9.md").write_text(
              "# Issue 82.9 - Repository exposure and secret hygiene\n\n"
              "## Owner actions\n"
              "1. Make the repository private on GitHub.\n"
              "2. Run gitleaks / trufflehog on history.\n"
              "3. Rotate any leaked secrets immediately.\n\n"
              "## App-side hygiene\n"
              "- Never commit .env or payment/SMS keys.\n"
              "- Production must set real PAYMENT_PROVIDER.\n"
          )
          print("all ok")
          PY
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/payments/payments.service.ts backend/src/bookings/bookings.service.ts docs/SECURITY_ISSUE_82_9.md
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "fix(82.5-9): callback guards, reschedule locks, paid cancel refund, safe notify, security hygiene"
          git push
