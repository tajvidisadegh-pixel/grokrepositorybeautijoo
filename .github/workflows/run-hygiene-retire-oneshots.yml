name: run-hygiene-retire-oneshots
on:
  workflow_dispatch:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retire oneshots
        run: |
          set -euo pipefail
          python3 scripts/hygiene-retire-oneshots.py
          echo "Remaining workflows:"
          ls -1 .github/workflows | head -30
          echo "Remaining scripts:"
          ls -1 scripts | head -20
          # remove self after apply so bot cannot re-run mass deletes easily
          rm -f .github/workflows/run-hygiene-retire-oneshots.yml
          rm -f scripts/hygiene-retire-oneshots.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "chore(hygiene): retire one-shot patch workflows/scripts; keep ci/codeql/gitleaks"
          git push origin HEAD:main
