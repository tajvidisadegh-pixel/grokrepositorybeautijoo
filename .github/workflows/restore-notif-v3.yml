name: Restore notif v3
on:
  push:
    paths:
      - '.github/workflows/restore-notif-v3.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download known-good notifications page
        run: |
          set -e
          f=frontend/src/app/panel/notifications/page.tsx
          mkdir -p "$(dirname "$f")"
          curl -fsSL -o "$f" \
            "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/8352345ebf15c66782236d082681a784ec4c6e2c/frontend/src/app/panel/notifications/page.tsx"
          wc -c "$f"
          test "$(wc -c < "$f")" -gt 500
          python3 -c "
from pathlib import Path
p=Path('frontend/src/app/panel/notifications/page.tsx')
s=p.read_text()
old='<PanelEmpty title=\"اعلانی نیست\" />'
new='''<PanelEmpty
          title=\"اعلانی نیست\"
          description=\"وقتی رزرو، پرداخت یا پیام جدیدی باشد اینجا می‌بینید.\"
          icon=\"🔔\"
          action={
            <Link href=\"/panel/bookings\">
              <Button size=\"sm\" variant=\"outline\">مشاهده رزروها</Button>
            </Link>
          }
        />'''
if old in s: s=s.replace(old,new,1)
if \"from 'next/link'\" not in s: s=s.replace(\"'use client';\\n\", \"'use client';\\nimport Link from 'next/link';\\n\",1)
if \"from '@/components/ui/button'\" not in s: s=s.replace(\"import { Card } from '@/components/ui/card';\",\"import { Card } from '@/components/ui/card';\\nimport { Button } from '@/components/ui/button';\",1)
p.write_text(s)
print(len(s))
"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/restore-notif-v3.yml
          git add frontend/src/app/panel/notifications/page.tsx
          git add -A
          git diff --cached --quiet || git commit -m "fix(ui): restore notifications page (#40)"
          git push
