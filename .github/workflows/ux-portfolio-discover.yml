name: UX portfolio discover
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ux-portfolio-discover.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore auth if broken
        run: |
          set -euxo pipefail
          f=backend/src/auth/auth.service.ts
          if ! grep -q 'export class AuthService' "$f" || grep -qE 'PLACEHOLDER|RESTORE_FROM_LOCAL' "$f"; then
            echo 'auth broken — restoring'
            git show 48601f895ab22d19bf0dc4093be85cbda316aae3:backend/src/auth/auth.service.ts > "$f"
            grep -q 'export class AuthService' "$f"
          else
            echo 'auth ok'
          fi
          # dual-role login patch if missing
          if ! grep -q 'otpCandidates' "$f"; then
            python3 <<'PY'
          from pathlib import Path
          p = Path('backend/src/auth/auth.service.ts')
          t = p.read_text()
          old_login = '''  async login(dto: LoginDto) {
    const accountType = this.resolveAccountType(dto.accountType);
    const user = await this.prisma.user.findFirst({
      where: { phone: dto.phone, accountType },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    if (!user || !user.passwordHash) {
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }'''
          new_login = '''  async login(dto: LoginDto) {
    const accountType = this.resolveAccountType(dto.accountType);
    const roleWanted = accountType === AccountType.professional ? 'professional' : 'customer';
    const candidates = await this.prisma.user.findMany({
      where: { phone: dto.phone },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    let user =
      candidates.find((u) => u.accountType === accountType) ||
      candidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWanted)) ||
      null;
    if (!user || !user.passwordHash) {
      if (candidates.length > 0) {
        const other = candidates[0].accountType === AccountType.professional ? 'زیباگر' : 'نوبت‌گیر';
        const want = roleWanted === 'professional' ? 'زیباگر' : 'نوبت‌گیر';
        throw new UnauthorizedException(
          'برای این شماره حساب ' + want + ' با رمز پیدا نشد. اگر حساب ' + other + ' دارید نوع ورود را عوض کنید یا ثبت‌نام نقش جدید انجام دهید.',
        );
      }
      throw new UnauthorizedException('شماره یا رمز عبور نادرست است');
    }'''
          assert old_login in t
          t = t.replace(old_login, new_login, 1)
          old_vo = '''    let user = await this.prisma.user.findFirst({
      where: { phone: dto.phone, accountType },
      include: { profile: true, userRoles: { include: { role: true } } },
    });

    if (!user) {
      const roleName = accountType === AccountType.professional ? 'professional' : 'customer';'''
          new_vo = '''    const roleWantedOtp = accountType === AccountType.professional ? 'professional' : 'customer';
    const otpCandidates = await this.prisma.user.findMany({
      where: { phone: dto.phone },
      include: { profile: true, userRoles: { include: { role: true } } },
    });
    let user =
      otpCandidates.find((u) => u.accountType === accountType) ||
      otpCandidates.find((u) => u.userRoles.some((ur) => ur.role.name === roleWantedOtp)) ||
      null;

    if (!user) {
      const roleName = accountType === AccountType.professional ? 'professional' : 'customer';'''
          assert old_vo in t
          t = t.replace(old_vo, new_vo, 1)
          p.write_text(t)
          print('dual ok', p.stat().st_size)
          PY
          fi
      - name: Dashboard portfolio tips
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/page.tsx')
          t = p.read_text()
          old_tips = '''            <li><Link href="/zibagar/services" className="text-coral underline">خدمت بساز</Link></li>
            <li><Link href="/zibagar/hours" className="text-coral underline">ساعات بگذار</Link></li>
            <li><Link href="/zibagar/profile" className="text-coral underline">منتشر کن</Link></li>'''
          new_tips = '''            <li><Link href="/zibagar/services" className="text-coral underline">خدمت بساز</Link></li>
            <li><Link href="/zibagar/hours" className="text-coral underline">ساعات کاری بگذار</Link></li>
            <li><Link href="/zibagar/portfolio" className="text-coral underline">گالری نمونه‌کار آپلود کن</Link></li>
            <li><Link href="/zibagar/profile" className="text-coral underline">پروفایل را منتشر کن</Link></li>'''
          if old_tips in t:
              t = t.replace(old_tips, new_tips, 1)
              print('tips')
          old_btn = '''          <Link href="/zibagar/portfolio">
            <Button size="sm" variant="outline">
              نمونه‌کار
            </Button>
          </Link>'''
          new_btn = '''          <Link href="/zibagar/portfolio">
            <Button size="sm" variant="secondary">
              گالری نمونه‌کار
            </Button>
          </Link>'''
          if old_btn in t:
              t = t.replace(old_btn, new_btn, 1)
              print('btn')
          p.write_text(t)
          PY
      - name: Commit
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts frontend/src/app/zibagar/page.tsx
          git status
          git commit -m "fix: restore auth + portfolio discoverability on dashboard" || exit 0
          git push origin HEAD:main
      - name: Export auth
        run: |
          git fetch origin beautijoo-backend-export || exit 0
          rm -rf /tmp/be
          git worktree add /tmp/be origin/beautijoo-backend-export || exit 0
          mkdir -p /tmp/be/src/auth
          cp backend/src/auth/auth.service.ts /tmp/be/src/auth/
          cd /tmp/be
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/auth.service.ts
          git commit -m "fix: restore auth.service" || true
          git push origin HEAD:beautijoo-backend-export || true
