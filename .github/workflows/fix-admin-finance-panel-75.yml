name: Fix admin finance panel 75
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-finance-panel-75.yml'
      - 'scripts/fix_admin_finance_panel_75.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_admin_finance_panel_75.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/finance/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#75): render payout panel + apiClient import"
          git push origin HEAD:main
