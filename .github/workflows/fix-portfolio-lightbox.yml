name: Fix portfolio lightbox types
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-portfolio-lightbox.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/zibagar/portfolio/page.tsx')
          t = p.read_text()
          old = """          items={items.map((m) => ({
            src: m.publicUrl || '',
            alt: m.title || 'portfolio',
            isVideo: isVideo(m.mimeType, m.publicUrl),
          }))}"""
          new = """          items={items.map((m) => ({
            id: m.id,
            url: m.publicUrl || '',
            mimeType: m.mimeType || undefined,
            caption: m.title || undefined,
          }))}"""
          if old not in t:
              if 'id: m.id' in t and 'url: m.publicUrl' in t:
                  print('already fixed')
              else:
                  raise SystemExit('pattern missing')
          else:
              p.write_text(t.replace(old, new, 1))
              print('fixed')
          # payments must not be placeholder
          pt = Path('backend/src/payments/payments.service.ts').read_text()
          if 'PLACEHOLDER' in pt or 'export class PaymentsService' not in pt:
              raise SystemExit('payments.service is broken — abort')
          print('payments ok', len(pt))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/portfolio/page.tsx
          git commit -m "fix(frontend): portfolio LightboxItem id/url for typecheck" || exit 0
          git push origin HEAD:main
