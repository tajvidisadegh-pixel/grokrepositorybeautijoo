name: Apply customer booking pricing 80.6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-customer-booking-pricing-80.yml'
      - 'scripts/patch_customer_booking_pricing_80.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_customer_booking_pricing_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/professionals/professionals.service.ts \
            frontend/src/types/booking.ts \
            "frontend/src/app/booking/[slug]/page.tsx" \
            frontend/src/components/booking/booking-wizard.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.6): customer booking UI for variable options and deposit"
          git push origin HEAD:main
