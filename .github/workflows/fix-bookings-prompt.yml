name: fix-bookings-prompt
on:
  push:
    paths:
      - scripts/fix_bookings_prompt.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_bookings_prompt.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m 'fix: bookings reject prompt syntax (#61.17)' && git push)
