name: Notif bell top
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/notif-bell-top.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Line-based patch
        run: |
          set -euxo pipefail
          python3 <<'PY'
          from pathlib import Path

          # --- header ---
          p = Path('frontend/src/components/layout/header.tsx')
          lines = p.read_text().splitlines(keepends=True)
          text = ''.join(lines)
          if 'NotificationBell' not in text:
              out = []
              for i, line in enumerate(lines):
                  out.append(line)
                  if "from 'lucide-react'" in line and 'NotificationBell' not in ''.join(out):
                      out.append("import { NotificationBell } from '@/components/layout/notification-bell';\n")
                  # after search icon closing Link, before isAuthenticated
                  if line.strip() == '</Link>' and i + 2 < len(lines) and '{isAuthenticated ? (' in lines[i+2]:
                      # only first such occurrence after Search
                      if any('Search' in lines[j] for j in range(max(0, i-6), i)):
                          out.append('\n')
                          out.append('          <NotificationBell />\n')
              p.write_text(''.join(out))
              print('header written', 'NotificationBell' in p.read_text())
          else:
              print('header skip')

          # --- panel-shell ---
          p = Path('frontend/src/components/panel/panel-shell.tsx')
          t = p.read_text()
          if "from '@/components/layout/notification-bell'" not in t:
              t = t.replace(
                  "import { fetchUnreadCount } from '@/lib/panel-api';",
                  "import { fetchUnreadCount } from '@/lib/panel-api';\nimport { NotificationBell } from '@/components/layout/notification-bell';",
                  1,
              )
          # desktop title
          old = '{title ? <h2 className="mb-4 text-lg font-bold text-foreground">{title}</h2> : null}'
          new = '<div className="mb-4 flex items-center justify-between gap-2">{title ? <h2 className="text-lg font-bold text-foreground">{title}</h2> : <span />}<NotificationBell /></div>'
          if old in t:
              t = t.replace(old, new, 1)
              print('desktop title')
          # mobile: inject bell before menu button
          if 'Mobile header' in t and t.count('<NotificationBell') < 2:
              t = t.replace(
                  '{title ? <h2 className="text-lg font-bold text-foreground">{title}</h2> : null}\n              <button',
                  '{title ? <h2 className="text-lg font-bold text-foreground">{title}</h2> : <span />}\n              <div className="flex items-center gap-1">\n                <NotificationBell />\n                <button',
                  1,
              )
              # close the div after the mobile menu button block end - find first occurrence of closing after moreOpen
              # simpler: after aria-expanded button closing tag of menu
              marker = "{moreOpen ? 'بستن منو' : 'همه بخش‌ها'}\n              </button>\n            </div>"
              if marker in t:
                  t = t.replace(marker, "{moreOpen ? 'بستن منو' : 'همه بخش‌ها'}\n                </button>\n              </div>\n            </div>", 1)
                  print('mobile close')
              else:
                  print('mobile marker missing')
          p.write_text(t)
          print('shell bells', p.read_text().count('NotificationBell'))

          # panel layout remove mobile from notifications
          pl = Path('frontend/src/app/panel/layout.tsx')
          pt = pl.read_text()
          pt2 = pt.replace("label: 'اعلان‌ها', mobile: true", "label: 'اعلان‌ها'")
          pl.write_text(pt2)
          print('panel', "mobile: true" in pt2 and "اعلان" in pt2)
          PY
      - name: Commit
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/layout/header.tsx frontend/src/components/panel/panel-shell.tsx frontend/src/app/panel/layout.tsx
          git status
          git commit -m "feat(ui): notification bell at top of page" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
