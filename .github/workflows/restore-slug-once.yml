name: Restore slug page once
on:
  push:
    paths:
      - '.github/workflows/restore-slug-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download good version and patch precision
        run: |
          set -euo pipefail
          GOOD='https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/d272e2e6bdf991da49de2e1486194a8983be545e/frontend/src/app/professionals/%5Bslug%5D/page.tsx'
          curl -fsSL "$GOOD" -o 'frontend/src/app/professionals/[slug]/page.tsx'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/professionals/[slug]/page.tsx')
          s = p.read_text()
          old = '<LocationMapView position={{ lat, lng }} height="200px" />'
          new = '<LocationMapView position={{ lat, lng }} height="200px" precision={(loc as { precision?: string | null }).precision === "exact" ? "exact" : "approximate"} />'
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace(
              '<p className="mt-2 text-xs text-gray-muted">موقعیت تقریبی روی نقشه</p>',
              '<p className="mt-2 text-xs text-gray-muted">مسیریابی و نقشه از طریق نشان</p>',
          )
          if 'PLACEHOLDER' in s:
              raise SystemExit('still placeholder')
          p.write_text(s)
          print('ok', len(s))
          PY
          rm -f .github/workflows/restore-slug-once.yml
          rm -f scripts/_b64_slug_0 scripts/restore_slug_page.py scripts/patch_i33_public_map.py 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status
          git commit -m 'fix(#33): restore professionals/[slug] + Neshan precision prop'
          git push
