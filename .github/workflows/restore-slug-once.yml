name: Restore slug page once
on:
  push:
    paths:
      - '.github/workflows/restore-slug-once.yml'
      - 'scripts/_b64_slug_*'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path('scripts').glob('_b64_slug_*'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          target = Path('frontend/src/app/professionals/[slug]/page.tsx')
          target.write_bytes(data)
          print('restored', len(data))
          for p in parts:
            p.unlink()
          Path('.github/workflows/restore-slug-once.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(#33): restore professionals/[slug] page with Neshan precision'
          git push
