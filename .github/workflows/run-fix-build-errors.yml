name: run-fix-build-errors
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-fix-build-errors.yml'
      - 'scripts/fix-build-errors.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          set -euo pipefail
          python3 scripts/fix-build-errors.py
          grep -n tehranWeekdaySun0 backend/src/common/timezone.ts | head -2
          grep -n workingHour backend/src/availability/availability.service.ts | head -3
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/common/timezone.ts backend/src/availability/availability.service.ts backend/src/bookings/bookings.service.ts
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: build errors in availability schema alignment and BookingStatus includes"
          git push origin HEAD:main
