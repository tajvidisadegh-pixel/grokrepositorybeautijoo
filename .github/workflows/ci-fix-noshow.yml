name: CI fix noshow + cleanup workflows
on:
  push:
    paths:
      - '.github/workflows/ci-fix-noshow.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch no_show in bookings.service
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/src/bookings/bookings.service.ts')
          s = p.read_text()
          if "| 'no_show'" in s and "action === 'no_show'" in s:
              print('already fixed')
          else:
              s = s.replace(
                  "action: 'confirm' | 'reject' | 'cancel' | 'complete',",
                  "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show',",
                  1,
              )
              needle = "    throw new BadRequestException('عملیات نامعتبر');\n  }\n\n  async reportIssue"
              insert = '''    if (action === 'no_show') {
      if (!isAdmin && !isPro) throw new ForbiddenException();
      if (b.status !== BookingStatus.confirmed && b.status !== BookingStatus.pending) {
        throw new BadRequestException('فقط رزرو در انتظار یا تأییدشده قابل علامت‌گذاری عدم حضور است');
      }
      if (b.startAt.getTime() > Date.now()) {
        throw new BadRequestException('علامت عدم حضور فقط پس از زمان شروع نوبت مجاز است');
      }
      const note = (reason || 'عدم حضور مشتری').trim();
      const updated = await this.prisma.booking.update({
        where: { id },
        data: {
          status: BookingStatus.cancelled,
          cancelledAt: new Date(),
          cancelReason: note,
          notes: b.notes ? `${b.notes}\\n[عدم حضور] ${note}` : `[عدم حضور] ${note}`,
        },
      });
      await this.notifications.notify({
        userId: b.customerId,
        type: NotificationType.booking_cancelled,
        title: 'عدم حضور در نوبت',
        body: 'زیباگر این نوبت را به‌عنوان عدم حضور ثبت کرد.',
        data: { bookingId: id, reason: note, noShow: true },
        sms: false,
      });
      return updated;
    }

    throw new BadRequestException('عملیات نامعتبر');
  }

  async reportIssue'''
              if needle not in s:
                  raise SystemExit('needle not found')
              s = s.replace(needle, insert, 1)
              p.write_text(s)
              print('patched service', len(s))
          PY
      - name: Delete ad-hoc workflows
        run: |
          set -e
          rm -f .github/workflows/add-lifecycle-ci.yml
          rm -f .github/workflows/fix-empty-states.yml
          rm -f .github/workflows/fix-gender-ts.yml
          rm -f .github/workflows/restore-auth-service.yml
          rm -f .github/workflows/restore-notif-v2.yml
          rm -f .github/workflows/restore-notif-v3.yml
          rm -f .github/workflows/restore-notifications.yml
          rm -f .github/workflows/run-empty-loading-patch.yml
          rm -f .github/workflows/run-empty-loading-v2.yml
          rm -f .github/workflows/run-reschedule-patch.yml
          rm -f .github/workflows/ci-fix-noshow.yml
          rm -f scripts/restore-svc.b64
          rm -f scripts/restore-notifications.py
          rm -f scripts/fix-jsx-classname.py
          ls .github/workflows/
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status
          git diff --cached --stat
          git commit -m "fix(ci): no_show type in bookings.service + remove ad-hoc workflows"
          git push
