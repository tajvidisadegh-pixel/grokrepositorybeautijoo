name: Patch bookings calendar
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-bookings-calendar.yml'
      - 'scripts/apply-payload/bookings.b64.part1'
      - 'scripts/apply-payload/bookings.b64.part2'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode bookings page
        run: |
          set -e
          cat scripts/apply-payload/bookings.b64.part1 scripts/apply-payload/bookings.b64.part2 | base64 -d > frontend/src/app/zibagar/bookings/page.tsx
          grep -q 'weekDays' frontend/src/app/zibagar/bookings/page.tsx
          grep -q 'تقویم هفتگی' frontend/src/app/zibagar/bookings/page.tsx
          wc -c frontend/src/app/zibagar/bookings/page.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/zibagar/bookings/page.tsx
          git diff --staged --quiet || git commit -m "feat(#9): weekly calendar view for professional bookings"
          git push
