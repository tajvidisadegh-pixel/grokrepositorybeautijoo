name: run-fix-r4-final-gaps
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          python3 scripts/fix-r4-final-gaps.py
          grep -n "panel wins\|withEnv\|deepMerge(withEnv" backend/src/admin/admin.service.ts | head -5
          grep -n "partial:\|failed:" backend/src/admin/admin.service.ts | head -5
          grep -n "sms-opt-out\|sms-opt-in\|setSmsOptOut" backend/src/admin/admin-ops.controller.ts | head -10
          grep -n "\$transaction" backend/src/admin/admin-ops.controller.ts | head -5
          grep -n "setSmsOptOut" backend/src/auth/auth.service.ts | head -3 || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix: panel settings win over env, SMS opt-out API, bulk partial report, phone change tx"
          git push origin HEAD:main
