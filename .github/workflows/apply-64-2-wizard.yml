name: Apply #64.2 wizard cancelMyBooking
on:
  push:
    paths:
      - '.github/workflows/apply-64-2-wizard.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking-wizard for #64.2
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          wpath = Path('frontend/src/components/booking/booking-wizard.tsx')
          w = wpath.read_text()
          if 'SEE_FILE' in w or len(w) < 1000:
              raise SystemExit('wizard file is broken; restore first')
          if 'cancelMyBooking' not in w:
              w = w.replace('  initiatePayment,', '  initiatePayment,\n  cancelMyBooking,', 1)
          # Prefer already-updated messages; inject cancel calls
          old = '''        if (pay.redirectUrl) {
          window.location.href = pay.redirectUrl;
          return;
        }
        setPaymentInfo(
          \'لینک درگاه دریافت نشد. نوبت نگه‌داشته نشد — بعداً دوباره تلاش کنید.\',
        );
      } catch {
        setPaymentInfo(
          \'پرداخت آنلاین در دسترس نیست. رزرو قطعی ثبت نشد و زمان آزاد ماند.\',
        );
      }'''
          new = '''        if (pay.redirectUrl) {
          window.location.href = pay.redirectUrl;
          return;
        }
        // #64.2 — no gateway URL
        try {
          await cancelMyBooking(created.id, \'payment_no_redirect\');
        } catch {
          /* already released server-side */
        }
        setPaymentInfo(
          \'لینک درگاه دریافت نشد. نوبت نگه‌داشته نشد — بعداً دوباره تلاش کنید.\',
        );
      } catch {
        // #64.2 — gateway off / initiate failed
        try {
          await cancelMyBooking(created.id, \'payment_unavailable\');
        } catch {
          /* already released server-side */
        }
        setPaymentInfo(
          \'پرداخت آنلاین در دسترس نیست. رزرو قطعی ثبت نشد و زمان آزاد ماند.\',
        );
      }'''
          if old not in w:
              # try pre-message-update variant
              old2 = '''        if (pay.redirectUrl) {
          window.location.href = pay.redirectUrl;
          return;
        }
        setPaymentInfo(
          \'رزرو ذخیره شد اما هنوز نهایی نیست — لینک درگاه دریافت نشد.\',
        );
      } catch {
        setPaymentInfo(
          \'رزرو ذخیره شد اما نهایی نیست. پرداخت آنلاین فعلاً در دسترس نیست یا نیاز به پیکربندی درگاه دارد.\',
        );
      }'''
              new2 = new
              if old2 in w:
                  w = w.replace(old2, new2, 1)
              else:
                  if 'cancelMyBooking(created.id' not in w:
                      raise SystemExit('could not find payment block to patch')
          else:
              w = w.replace(old, new, 1)
          wpath.write_text(w)
          assert 'cancelMyBooking' in wpath.read_text()
          assert 'payment_unavailable' in wpath.read_text() or 'payment_no_redirect' in wpath.read_text()
          print('wizard patched ok', wpath.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/booking/booking-wizard.tsx
          git diff --staged --quiet || git commit -m "fix(#64.2): complete wizard cancelMyBooking on payment fail"
          git push
