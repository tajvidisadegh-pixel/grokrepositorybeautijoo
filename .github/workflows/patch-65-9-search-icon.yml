name: patch-65-9-search-icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-9-search-icon.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage search + site-builder
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # Shared search field snippet builder using hero config
          # --- page.tsx HeroCfg ---
          p = Path('frontend/src/app/page.tsx')
          t = p.read_text()

          if 'searchIconPosition' not in t:
              t = t.replace(
                  "  searchAlign?: 'right' | 'center' | 'left';",
                  "  searchAlign?: 'right' | 'center' | 'left';\n  /** #65.9 — icon inside search box */\n  searchIconPosition?: 'left' | 'right' | 'hidden';\n  searchIconSize?: 'sm' | 'md';",
              )

          # Helper: replace absolute Search icon blocks with configurable ones
          # Pattern used twice (side layout + background layout)
          old_icon = '''                      <div className="relative flex-1">
                        <Search className="pointer-events-none absolute left-3 top-1/2 size-3.5 -translate-y-1/2 text-gray-muted" aria-hidden />
                        <input
                          name="q"
                          type="search"
                          placeholder={hero.searchPlaceholder || 'جستجوی خدمت یا زیباگر...'}
                          className="h-12 w-full rounded-2xl border border-border bg-white pl-10 pr-4 text-sm shadow-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
                        />
                      </div>'''

          new_icon = '''                      <div className="relative flex-1">
                        {(hero.searchIconPosition || 'left') !== 'hidden' && (
                          <Search
                            className={`pointer-events-none absolute top-1/2 -translate-y-1/2 text-gray-muted ${
                              (hero.searchIconPosition || 'left') === 'right'
                                ? 'right-2.5'
                                : 'left-2.5'
                            } ${
                              (hero.searchIconSize || 'sm') === 'md' ? 'size-4' : 'size-3'
                            }`}
                            aria-hidden
                          />
                        )}
                        <input
                          name="q"
                          type="search"
                          placeholder={hero.searchPlaceholder || 'جستجوی خدمت یا زیباگر...'}
                          className={`h-11 w-full rounded-2xl border border-border bg-white text-sm shadow-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20 sm:h-12 [appearance:textfield] [&::-webkit-search-decoration]:appearance-none [&::-webkit-search-cancel-button]:appearance-none ${
                            (hero.searchIconPosition || 'left') === 'hidden'
                              ? 'px-4'
                              : (hero.searchIconPosition || 'left') === 'right'
                                ? 'pl-4 pr-8'
                                : 'pl-8 pr-4'
                          }`}
                        />
                      </div>'''

          # Also match slight whitespace variants from second form
          old_icon2 = '''                    <div className="relative flex-1">
                      <Search className="pointer-events-none absolute left-3 top-1/2 size-3.5 -translate-y-1/2 text-gray-muted" aria-hidden />
                      <input
                        name="q"
                        type="search"
                        placeholder={hero.searchPlaceholder || 'جستجوی خدمت یا زیباگر...'}
                        className="h-12 w-full rounded-2xl border border-border bg-white pl-10 pr-4 text-sm shadow-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
                      />
                    </div>'''

          new_icon2 = new_icon.replace('                      ', '                    ')

          count = 0
          if old_icon in t:
              t = t.replace(old_icon, new_icon)
              count += t.count('searchIconPosition')
              print('replaced form variant1')
          if old_icon2 in t:
              t = t.replace(old_icon2, new_icon2)
              print('replaced form variant2')

          # Mobile: keep search + button on one row (icon not "below")
          t = t.replace(
              'className="mt-6 flex w-full max-w-md flex-col gap-2.5 sm:flex-row"',
              'className="mt-6 flex w-full max-w-md flex-row items-center gap-2"',
          )
          t = t.replace(
              'className={`mt-6 flex w-full flex-col gap-2.5 sm:mt-8 sm:flex-row sm:items-center sm:gap-3 ${',
              'className={`mt-6 flex w-full flex-row items-center gap-2 sm:mt-8 sm:gap-3 ${',
          )

          p.write_text(t)
          print('page.tsx size', p.stat().st_size)

          # --- site-builder ---
          sb = Path('frontend/src/app/admin/site-builder/page.tsx')
          s = sb.read_text()
          if 'searchIconPosition' not in s:
              s = s.replace(
                  "  searchAlign?: 'right' | 'center' | 'left';",
                  "  searchAlign?: 'right' | 'center' | 'left';\n  searchIconPosition?: 'left' | 'right' | 'hidden';\n  searchIconSize?: 'sm' | 'md';",
              )
          if 'موقعیت آیکون جستجو' not in s:
              needle = '''                <Select label="تراز جعبه جستجو" value={hero.searchAlign || 'center'} onChange={(v) => patchHero({ searchAlign: v as Hero['searchAlign'] })} options={[{ value: 'right', label: 'راست' }, { value: 'center', label: 'وسط' }, { value: 'left', label: 'چپ' }]} />'''
              inject = '''                <Select label="تراز جعبه جستجو" value={hero.searchAlign || 'center'} onChange={(v) => patchHero({ searchAlign: v as Hero['searchAlign'] })} options={[{ value: 'right', label: 'راست' }, { value: 'center', label: 'وسط' }, { value: 'left', label: 'چپ' }]} />
                <Select label="موقعیت آیکون جستجو" value={hero.searchIconPosition || 'left'} onChange={(v) => patchHero({ searchIconPosition: v as Hero['searchIconPosition'] })} options={[{ value: 'left', label: 'چپ (داخل باکس)' }, { value: 'right', label: 'راست (داخل باکس)' }, { value: 'hidden', label: 'مخفی' }]} />
                <Select label="اندازه آیکون جستجو" value={hero.searchIconSize || 'sm'} onChange={(v) => patchHero({ searchIconSize: v as Hero['searchIconSize'] })} options={[{ value: 'sm', label: 'خیلی کوچک' }, { value: 'md', label: 'متوسط' }]} />'''
              if needle in s:
                  s = s.replace(needle, inject, 1)
                  print('site-builder controls added')
              else:
                  # insert after search placeholder field
                  ph = '<Field label="متن placeholder جستجو"'
                  idx = s.find(ph)
                  if idx < 0:
                      print('WARN could not find placeholder field')
                  else:
                      # find end of that Field line
                      end = s.find('/>', idx) + 2
                      s = s[:end] + '''
                <Select label="موقعیت آیکون جستجو" value={hero.searchIconPosition || 'left'} onChange={(v) => patchHero({ searchIconPosition: v as Hero['searchIconPosition'] })} options={[{ value: 'left', label: 'چپ (داخل باکس)' }, { value: 'right', label: 'راست (داخل باکس)' }, { value: 'hidden', label: 'مخفی' }]} />
                <Select label="اندازه آیکون جستجو" value={hero.searchIconSize || 'sm'} onChange={(v) => patchHero({ searchIconSize: v as Hero['searchIconSize'] })} options={[{ value: 'sm', label: 'خیلی کوچک' }, { value: 'md', label: 'متوسط' }]} />''' + s[end:]
                      print('site-builder controls inserted after placeholder')
          sb.write_text(s)
          print('sb size', sb.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/page.tsx frontend/src/app/admin/site-builder/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.9): search icon left+small on mobile; admin icon controls"
          git push
