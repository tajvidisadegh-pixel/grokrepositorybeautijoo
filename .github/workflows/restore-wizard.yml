name: restore-wizard4
on:
  push:
    paths:
      - '.github/workflows/restore-wizard.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore file from known-good commit
        run: |
          set -eux
          git cat-file -t 5a7537d1dfd944da76d8b765c6d24704823e748e
          git show 5a7537d1dfd944da76d8b765c6d24704823e748e:frontend/src/components/booking/booking-wizard.tsx > frontend/src/components/booking/booking-wizard.tsx
          wc -c frontend/src/components/booking/booking-wizard.tsx
          grep -n "export function BookingWizard" frontend/src/components/booking/booking-wizard.tsx | head
          ! grep -q RESTORE_INCOMPLETE frontend/src/components/booking/booking-wizard.tsx
      - name: Add phoneVerified check
        run: |
          python3 << 'ENDPY'
          from pathlib import Path
          p = Path('frontend/src/components/booking/booking-wizard.tsx')
          s = p.read_text()
          s = s.replace(
            'const { isAuthenticated, loading: authLoading } = useAuth();',
            'const { isAuthenticated, loading: authLoading, user } = useAuth();',
            1,
          )
          if 'user.phoneVerified' not in s:
            needle = '    setSubmitting(true);'
            i = s.find('async function submitBooking')
            j = s.find(needle, i)
            block = (
              '    if (user && user.phoneVerified === false) {\n'
              '      const draft = buildDraft();\n'
              '      saveBookingDraft(draft);\n'
              "      setSubmitError('Phone verification required');\n"
              "      router.push('/otp?reason=booking');\n"
              '      return;\n'
              '    }\n'
            )
            s = s[:j] + block + s[j:]
          p.write_text(s)
          print('ok', len(s), s.count('phoneVerified'))
          ENDPY
      - name: Commit
        run: |
          set -eux
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/restore-wizard.yml
          git add frontend/src/components/booking/booking-wizard.tsx
          git add -u
          git status
          git commit -m "fix: restore booking-wizard + phoneVerified (#40-25)"
          git push
