name: apply-18-10-versioning
on:
  push:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main + health
        run: |
          set -euo pipefail
          test -f backend/src/common/api-version.ts
          test -f scripts/apply_18_10_versioning.py
          python3 scripts/apply_18_10_versioning.py
          grep -n 'apiVersionHeaders\|openapi.json' backend/src/main.ts | head -15
          grep -n 'apiVersion' backend/src/health/health.controller.ts | head -5
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/main.ts backend/src/health/health.controller.ts
          if git diff --staged --quiet; then
            echo nochange
            exit 0
          fi
          git commit -m 'feat(18.10): wire version headers + OpenAPI JSON export'
          git pull --rebase origin main
          git push
