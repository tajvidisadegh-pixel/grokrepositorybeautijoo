name: patch-65-6-pro-media-first
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-6-pro-media-first.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Improve pro page media order + galleries
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- page.tsx: portfolio first, then salon, then bio/services ---
          p = Path('frontend/src/app/professionals/[slug]/page.tsx')
          t = p.read_text()

          old_media = '''          {/* #65.6 — photos & portfolio before bio/about */}
          {salonMedia.length > 0 && <SalonMediaGallery media={salonMedia} />}

          <ServicePortfolioGallery
            slug={pro.slug}
            services={(pro.professionalServices || []) as ProfessionalServiceItem[]}
          />'''

          new_media = '''          {/* #65.6 — visual proof first: portfolio samples, then salon photos, then text */}
          <ServicePortfolioGallery
            slug={pro.slug}
            services={(pro.professionalServices || []) as ProfessionalServiceItem[]}
            extraMedia={(pro.mediaAssets || [])
              .filter(
                (m) =>
                  m.kind === 'portfolio' &&
                  (m.publicUrl || (m as { url?: string }).url),
              )
              .map((m) => ({
                id: m.id,
                publicUrl: (m.publicUrl || (m as { url?: string }).url || '') as string,
                mimeType: (m as { mimeType?: string }).mimeType || 'image/jpeg',
                title: (m as { title?: string | null }).title,
              }))}
          />

          {salonMedia.length > 0 && <SalonMediaGallery media={salonMedia} />}'''

          if old_media in t:
              t = t.replace(old_media, new_media, 1)
              print('page order swapped')
          elif 'extraMedia=' in t:
              print('page already has extraMedia')
          else:
              # try looser match
              if 'ServicePortfolioGallery' in t and 'SalonMediaGallery' in t:
                  print('page structure differs; manual check')
              else:
                  raise SystemExit('page media block missing')

          p.write_text(t)

          # --- service-portfolio-gallery: accept extraMedia + responsive grid ---
          sp = Path('frontend/src/components/professionals/service-portfolio-gallery.tsx')
          st = sp.read_text()
          if 'extraMedia' not in st:
              st = st.replace(
                  '''export function ServicePortfolioGallery({
  slug,
  services,
}: {
  slug: string;
  services: ProfessionalServiceItem[];
}) {
  const items = useMemo(() => {
    const out: MediaItem[] = [];
    for (const ps of services || []) {
      for (const m of ps.mediaAssets || []) {
        out.push({
          id: m.id,
          publicUrl: m.publicUrl,
          mimeType: m.mimeType,
          title: m.title,
          serviceName: ps.service?.name || 'خدمت',
          serviceId: ps.service?.id || '',
          price: ps.price,
          durationMin: ps.durationMin,
        });
      }
    }
    return out;
  }, [services]);''',
                  '''export function ServicePortfolioGallery({
  slug,
  services,
  extraMedia = [],
}: {
  slug: string;
  services: ProfessionalServiceItem[];
  /** Pro-level portfolio media (kind=portfolio) */
  extraMedia?: Array<{
    id: string;
    publicUrl: string;
    mimeType?: string;
    title?: string | null;
  }>;
}) {
  const items = useMemo(() => {
    const out: MediaItem[] = [];
    for (const ps of services || []) {
      for (const m of ps.mediaAssets || []) {
        if (!m.publicUrl && !(m as { url?: string }).url) continue;
        out.push({
          id: m.id,
          publicUrl: m.publicUrl || (m as { url?: string }).url || '',
          mimeType: m.mimeType,
          title: m.title,
          serviceName: ps.service?.name || 'خدمت',
          serviceId: ps.service?.id || '',
          price: ps.price,
          durationMin: ps.durationMin,
        });
      }
    }
    for (const m of extraMedia || []) {
      if (!m.publicUrl) continue;
      out.push({
        id: m.id,
        publicUrl: m.publicUrl,
        mimeType: m.mimeType || 'image/jpeg',
        title: m.title,
        serviceName: 'نمونه‌کار',
        serviceId: '',
        price: 0,
        durationMin: 0,
      });
    }
    return out;
  }, [services, extraMedia]);'''
              )

          # horizontal scroll → responsive grid
          st = st.replace(
              '<div className="mt-4 flex gap-3 overflow-x-auto pb-2">',
              '<div className="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">',
          )
          st = st.replace(
              'className="w-40 shrink-0 text-right"',
              'className="w-full text-right"',
          )
          st = st.replace(
              'className="h-36 overflow-hidden rounded-2xl border border-border bg-gray-light"',
              'className="aspect-[4/5] overflow-hidden rounded-2xl border border-border bg-gray-light"',
          )

          # title polish
          st = st.replace(
              '''      <h2 className="text-lg font-bold">نمونه‌کار خدمات</h2>
      <p className="text-xs text-gray">نمونه کارها · پس از تأیید زیباگر</p>
      <p className="mt-1 text-xs text-gray">روی هر عکس بزنید تا بزرگ شود و ورق بزنید</p>''',
              '''      <h2 className="text-lg font-bold text-foreground">نمونه‌کارها</h2>
      <p className="mt-0.5 text-xs text-gray">اول کیفیت کار را ببینید؛ برای بزرگ‌نمایی روی عکس بزنید</p>''',
          )

          sp.write_text(st)
          print('portfolio gallery updated', sp.stat().st_size)

          # --- salon gallery: responsive grid + clearer title ---
          sg = Path('frontend/src/components/professionals/salon-media-gallery.tsx')
          gt = sg.read_text()
          gt = gt.replace(
              '''      <h2 className="text-lg font-bold text-foreground">عکس‌های محل</h2>
      <p className="text-xs text-gray">نمونه کارها · پس از تأیید زیباگر</p>
      <p className="mt-1 text-xs text-gray">برای بزرگ‌نمایی روی عکس بزنید</p>
      <div className="mt-4 flex gap-3 overflow-x-auto pb-2">
        {items.map((m, i) => (
          <button
            key={m.id}
            type="button"
            className="h-36 w-52 shrink-0 overflow-hidden rounded-2xl border border-border bg-gray-light"
            onClick={() => setIndex(i)}
          >''',
              '''      <h2 className="text-lg font-bold text-foreground">فضا و محیط کار</h2>
      <p className="mt-0.5 text-xs text-gray">عکس محل · برای بزرگ‌نمایی روی عکس بزنید</p>
      <div className="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3">
        {items.map((m, i) => (
          <button
            key={m.id}
            type="button"
            className="aspect-[4/3] w-full overflow-hidden rounded-2xl border border-border bg-gray-light"
            onClick={() => setIndex(i)}
          >''',
          )
          sg.write_text(gt)
          print('salon gallery updated', sg.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/professionals/[slug]/page.tsx \
            frontend/src/components/professionals/service-portfolio-gallery.tsx \
            frontend/src/components/professionals/salon-media-gallery.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.6): portfolio then salon photos first; responsive gallery grid"
          git push
