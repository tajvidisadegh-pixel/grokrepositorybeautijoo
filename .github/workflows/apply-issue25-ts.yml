name: Fix issue25 TS
on:
  push:
    paths: ['scripts/patch-issue25-ts.py']
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-issue25-ts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/professionals/[slug]/page.tsx
          if git diff --staged --quiet; then echo No change; else git commit -m "fix(ux): verified badge uses status only (#25)" && git push; fi
