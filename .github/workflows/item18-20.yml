name: item18-20c
on:
  push:
    paths:
      - '.github/workflows/item18-20.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          # area filter
          python3 -c "
from pathlib import Path
p=Path('backend/src/professionals/professionals.service.ts')
s=p.read_text()
if 'params.area' not in s:
  s=s.replace('city?: string;\n    category?: string;','city?: string;\n    area?: string;\n    category?: string;',1)
  old='''    if (params.city) {
      where.locations = {
        some: { location: { city: { contains: params.city, mode: \'insensitive\' } } },
      };
    }'''
  # try without escape
  old2='''    if (params.city) {
      where.locations = {
        some: { location: { city: { contains: params.city, mode: \'insensitive\' } } },
      };
    }'''
"
          python3 << 'PY'
          from pathlib import Path
          p=Path('backend/src/professionals/professionals.service.ts')
          s=p.read_text()
          if 'params.area' in s:
              print('area ok')
          else:
              s=s.replace('city?: string;\n    category?: string;','city?: string;\n    area?: string;\n    category?: string;',1)
              needle='some: { location: { city: { contains: params.city, mode: \'insensitive\' } } },'
              # find city block end
              i=s.find('if (params.city)')
              j=s.find('\n    }\n', i)
              if i<0 or j<0: raise SystemExit('city not found')
              j=j+len('\n    }')
              insert='''

    if (params.area && String(params.area).trim()) {
      const area = String(params.area).trim();
      const areaFilter = {
        locations: {
          some: {
            location: {
              OR: [
                { name: { contains: area, mode: \'insensitive\' as const } },
                { address: { contains: area, mode: \'insensitive\' as const } },
              ],
            },
          },
        },
      };
      const prevAnd = Array.isArray(where.AND) ? where.AND : where.AND ? [where.AND] : [];
      where.AND = [...prevAnd, areaFilter];
    }'''
              # fix quotes - use proper string
              insert = """

    if (params.area && String(params.area).trim()) {
      const area = String(params.area).trim();
      const areaFilter = {
        locations: {
          some: {
            location: {
              OR: [
                { name: { contains: area, mode: 'insensitive' as const } },
                { address: { contains: area, mode: 'insensitive' as const } },
              ],
            },
          },
        },
      };
      const prevAnd = Array.isArray(where.AND) ? where.AND : where.AND ? [where.AND] : [];
      where.AND = [...prevAnd, areaFilter];
    }"""
              s=s[:j]+insert+s[j:]
              p.write_text(s)
              print('area patched')

          # panel api
          pa=Path('frontend/src/lib/panel-api.ts')
          t=pa.read_text()
          t=t.replace("action: 'confirm' | 'reject' | 'cancel' | 'complete'","action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show'",1)
          # also allow calling no-show endpoint
          if 'no-show' not in t and 'transitionBooking' in t:
              t=t.replace(
                  "return apiClient.patch(`/bookings/${id}/${action}`, reason ? { reason } : undefined);",
                  """const path = action === 'no_show' ? 'no-show' : action;
  return apiClient.patch(`/bookings/${id}/${path}`, reason ? { reason } : undefined);""",
                  1,
              )
          pa.write_text(t)
          print('panel')

          # public api area
          fa=Path('frontend/src/lib/public-api.ts')
          f=fa.read_text()
          if 'area?: string' not in f:
              f=f.replace('city?: string;','city?: string;\n  area?: string;',1)
              f=f.replace("if (params.city) sp.set('city', params.city);","if (params.city) sp.set('city', params.city);\n  if (params.area) sp.set('area', params.area);",1)
              fa.write_text(f)
          print('public')

          # search UI
          sp=Path('frontend/src/app/search/page.tsx')
          ss=sp.read_text()
          if 'name="area"' not in ss:
              ss=ss.replace('const city = sp.city?.trim() || undefined;','const city = sp.city?.trim() || undefined;\n  const area = sp.area?.trim() || undefined;',1)
              ss=ss.replace('q, city, category, filterCategory: true, page, limit: 12,','q, city, area, category, filterCategory: true, page, limit: 12,',1)
              ss=ss.replace("if (city) params.set('city', city);","if (city) params.set('city', city);\n    if (area) params.set('area', area);",1)
              ss=ss.replace('placeholder="شهر"','placeholder="مثلاً تهران"',1)
              ss=ss.replace(
                  'placeholder="مثلاً تهران" className={inputCls} />\n          </div>\n          <div>\n            <label className="mb-1 block text-xs font-medium text-gray">دسته‌بندی</label>',
                  'placeholder="مثلاً تهران" className={inputCls} />\n          </div>\n          <div>\n            <label className="mb-1 block text-xs font-medium text-gray">محله / محدوده</label>\n            <input name="area" defaultValue={area || \'\'} placeholder="مثلاً ونک" className={inputCls} />\n          </div>\n          <div>\n            <label className="mb-1 block text-xs font-medium text-gray">دسته‌بندی</label>',
                  1,
              )
              sp.write_text(ss)
              print('search', 'name="area"' in ss)

          # wire public controller - find file with Query city and professionals search
          for cp in Path('backend/src').rglob('*.controller.ts'):
              txt=cp.read_text()
              if "@Query('city')" in txt and 'Professional' in txt and "@Query('area')" not in txt:
                  txt=txt.replace("@Query('city') city?: string,","@Query('city') city?: string,\n    @Query('area') area?: string,",1)
                  txt=txt.replace('city: city,','city: city, area,') if 'city: city,' in txt else txt.replace('city,','city, area,',1)
                  cp.write_text(txt)
                  print('wired', cp)
          print('done')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item18-20.yml
          git add -A
          git commit -m "feat: area search filter + no-show API path (#40 18-20)" || echo nothing
          git push
