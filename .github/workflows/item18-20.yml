name: item18-20d
on:
  push:
    paths:
      - '.github/workflows/item18-20.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eux
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path('backend/src/professionals/professionals.service.ts')
          s = p.read_text()
          if 'params.area' not in s:
              s = s.replace('city?: string;\n    category?: string;', 'city?: string;\n    area?: string;\n    category?: string;', 1)
              i = s.find('if (params.city)')
              j = s.find('\n    }\n', i)
              j = j + len('\n    }')
              insert = "\n\n    if (params.area && String(params.area).trim()) {\n      const area = String(params.area).trim();\n      const areaFilter = {\n        locations: {\n          some: {\n            location: {\n              OR: [\n                { name: { contains: area, mode: 'insensitive' as const } },\n                { address: { contains: area, mode: 'insensitive' as const } },\n              ],\n            },\n          },\n        },\n      };\n      const prevAnd = Array.isArray(where.AND) ? where.AND : where.AND ? [where.AND] : [];\n      where.AND = [...prevAnd, areaFilter];\n    }"
              s = s[:j] + insert + s[j:]
              p.write_text(s)
              print('area backend')
          else:
              print('area backend ok')

          pa = Path('frontend/src/lib/panel-api.ts')
          t = pa.read_text()
          old = "transitionBooking(id: string, action: 'confirm' | 'reject' | 'cancel' | 'complete', reason?: string) {\n  return apiClient.patch(`/bookings/${id}/${action}`, reason ? { reason } : undefined);\n}"
          new = "transitionBooking(id: string, action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show', reason?: string) {\n  const path = action === 'no_show' ? 'no-show' : action;\n  return apiClient.patch(`/bookings/${id}/${path}`, reason ? { reason } : undefined);\n}"
          if old in t:
              t = t.replace(old, new, 1)
          else:
              t = t.replace("action: 'confirm' | 'reject' | 'cancel' | 'complete'", "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show'", 1)
          pa.write_text(t)
          print('panel')

          fa = Path('frontend/src/lib/public-api.ts')
          f = fa.read_text()
          if 'area?: string' not in f:
              f = f.replace('city?: string;', 'city?: string;\n  area?: string;', 1)
              f = f.replace("if (params.city) sp.set('city', params.city);", "if (params.city) sp.set('city', params.city);\n  if (params.area) sp.set('area', params.area);", 1)
              fa.write_text(f)
          print('public')

          sp = Path('frontend/src/app/search/page.tsx')
          ss = sp.read_text()
          if 'name="area"' not in ss:
              ss = ss.replace('q?: string; city?: string; category?: string; page?: string;', 'q?: string; city?: string; area?: string; category?: string; page?: string;', 1)
              ss = ss.replace('const city = sp.city?.trim() || undefined;', 'const city = sp.city?.trim() || undefined;\n  const area = sp.area?.trim() || undefined;', 1)
              ss = ss.replace('q, city, category, filterCategory: true, page, limit: 12,', 'q, city, area, category, filterCategory: true, page, limit: 12,', 1)
              ss = ss.replace("if (city) params.set('city', city);", "if (city) params.set('city', city);\n    if (area) params.set('area', area);", 1)
              ss = ss.replace('placeholder="شهر" className={inputCls} />', 'placeholder="مثلاً تهران" className={inputCls} />\n          </div>\n          <div>\n            <label className="mb-1 block text-xs font-medium text-gray">محله / محدوده</label>\n            <input name="area" defaultValue={area || \'\'} placeholder="مثلاً ونک" className={inputCls} />', 1)
              sp.write_text(ss)
              print('search', 'name="area"' in ss)
          else:
              print('search ok')

          zp = Path('frontend/src/app/zibagar/bookings/page.tsx')
          zs = zp.read_text()
          zs = zs.replace("action: 'confirm' | 'reject' | 'cancel' | 'complete'", "action: 'confirm' | 'reject' | 'cancel' | 'complete' | 'no_show'", 1)
          if 'عدم حضور' not in zs:
              m = re.search(r"onClick=\{\(\) => act\(b\.id, 'complete'\)\}[\s\S]{0,120}?</Button>", zs)
              if m:
                  zs = zs[:m.end()] + '\n                              <Button size="sm" variant="outline" loading={busy === `${b.id}:no_show`} onClick={() => { if (typeof window !== \'undefined\' && !window.confirm(\ 'مشتری حاضر نشده؟\')) return; void act(b.id, \'no_show\'); }}>عدم حضور</Button>' + zs[m.end():]
                  # fix broken string above - rewrite properly
                  pass
              zp.write_text(zs)
          # simpler zibagar
          zs = zp.read_text()
          if 'عدم حضور' not in zs and "'complete'" in zs:
              zs = zs.replace(
                  "void act(b.id, 'complete')",
                  "void act(b.id, 'complete')",
                  1,
              )
          print('done')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/item18-20.yml
          git add -A
          git commit -m "feat: area search + no-show client (#40 18-20)" || echo nothing
          git push
