name: Admin list table + delete APIs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-list-delete-fix.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch backend + frontend
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- admin.service.ts: hard delete methods ----------
          svc = Path('backend/src/admin/admin.service.ts')
          st = svc.read_text()
          if 'hardDeleteUser' not in st:
              methods = r'''
  async hardDeleteUser(id: string, actorId?: string) {
    const existing = await this.prisma.user.findUnique({ where: { id }, include: { professional: true } });
    if (!existing) throw new NotFoundException('User not found');
    // Remove dependent rows that lack onDelete: Cascade on User FK
    await this.prisma.$transaction(async (tx) => {
      // Reviews by this customer
      await tx.review.deleteMany({ where: { customerId: id } });
      // Bookings as customer (payments/items cascade from booking)
      await tx.booking.deleteMany({ where: { customerId: id } });
      if (existing.professional) {
        const pid = existing.professional.id;
        await tx.review.deleteMany({ where: { professionalId: pid } });
        await tx.booking.deleteMany({ where: { professionalId: pid } });
        await tx.professional.delete({ where: { id: pid } });
      }
      // Notifications, favorites cascade; audit logs keep actor nullable if any
      await tx.user.delete({ where: { id } });
    });
    await this.audit(actorId, 'user.hard_delete', 'user', id, { phone: existing.phone }, null);
    return { id, deleted: true };
  }

  async bulkHardDeleteUsers(userIds: string[], actorId?: string) {
    const ids = Array.from(new Set((userIds || []).filter(Boolean)));
    let deleted = 0;
    const failed: string[] = [];
    for (const id of ids) {
      try {
        await this.hardDeleteUser(id, actorId);
        deleted += 1;
      } catch {
        failed.push(id);
      }
    }
    return { deleted, failed };
  }

  async hardDeleteProfessional(id: string, actorId?: string) {
    const pro = await this.prisma.professional.findUnique({ where: { id } });
    if (!pro) throw new NotFoundException('Professional not found');
    await this.prisma.$transaction(async (tx) => {
      await tx.review.deleteMany({ where: { professionalId: id } });
      await tx.booking.deleteMany({ where: { professionalId: id } });
      await tx.professional.delete({ where: { id } });
    });
    await this.audit(actorId, 'professional.hard_delete', 'professional', id, { userId: pro.userId, slug: pro.slug }, null);
    return { id, deleted: true };
  }

'''
              # insert before deleteMedia if present, else before last closing brace of class
              if 'async deleteMedia' in st:
                  st = st.replace('  async deleteMedia', methods + '  async deleteMedia')
              else:
                  st = st.rstrip()
                  if st.endswith('}'):
                      st = st[:-1] + methods + '}\n'
              svc.write_text(st)
              print('service: hard delete methods added')
          else:
              print('service: already has hardDeleteUser')

          # ---------- admin.controller.ts: DELETE routes ----------
          ctrl = Path('backend/src/admin/admin.controller.ts')
          ct = ctrl.read_text()
          if "@Delete('users/:id')" not in ct:
              # ensure Delete import
              if 'Delete,' not in ct and ' Delete ' not in ct:
                  ct = ct.replace(
                      "  Patch,\n  Post,",
                      "  Delete,\n  Patch,\n  Post,",
                  )
                  if 'Delete' not in ct.split('from')[0]:
                      ct = ct.replace('Patch,', 'Delete,\n  Patch,', 1)

              bulk_dto = '''
class BulkDeleteUsersDto {
  @IsArray()
  @IsUUID('4', { each: true })
  userIds!: string[];
}
'''
              if 'BulkDeleteUsersDto' not in ct:
                  # insert before @ApiTags or after last class DTO
                  ct = ct.replace("@ApiTags('admin')", bulk_dto + "\n@ApiTags('admin')")
                  # ensure IsArray import
                  if 'IsArray' not in ct:
                      ct = ct.replace('IsEnum,', 'IsArray,\n  IsEnum,')

              routes = '''
  @Delete('users/:id')
  hardDeleteUser(@Param('id') id: string, @CurrentUser('id') actorId?: string) {
    return this.service.hardDeleteUser(id, actorId);
  }

  @Post('users/bulk-delete')
  bulkHardDeleteUsers(@Body() dto: BulkDeleteUsersDto, @CurrentUser('id') actorId?: string) {
    return this.service.bulkHardDeleteUsers(dto.userIds, actorId);
  }

  @Delete('professionals/:id')
  hardDeleteProfessional(@Param('id') id: string, @CurrentUser('id') actorId?: string) {
    return this.service.hardDeleteProfessional(id, actorId);
  }

'''
              # place after setUserRoles block
              marker = "setUserRoles(id, dto.roles, actorId);\n  }"
              if marker in ct:
                  ct = ct.replace(marker, marker + '\n' + routes, 1)
              else:
                  ct = ct.replace(
                      "@Get('professionals')",
                      routes + "  @Get('professionals')",
                      1,
                  )
              ctrl.write_text(ct)
              print('controller: delete routes added')
          else:
              print('controller: already has delete users')

          # ---------- frontend users page: table UI ----------
          users = Path('frontend/src/app/admin/users/page.tsx')
          ut = users.read_text()
          old_list = '''      {items.length === 0 ? (
        <PanelEmpty title="مشتری‌ای یافت نشد" />
      ) : (
        <ul className="space-y-3">
          {items.map((u) => (
            <li key={u.id}>
              <Card className="space-y-3 p-4">
                <div className="flex flex-wrap items-start justify-between gap-2">
                  <div className="flex items-start gap-3">
                    <input type="checkbox" className="mt-1" checked={selected.has(u.id)} onChange={() => toggleSelect(u.id)} />
                    <div>
                      <p className="font-semibold">{u.profile?.displayName || u.profile?.firstName || 'بدون نام'}</p>
                      <p className="text-xs text-gray" dir="ltr">{u.phone || '—'}</p>
                      <p className="text-xs text-gray">
                        عضویت: {formatDate(u.createdAt, { style: 'short' })}
                        {u.bookingCount != null ? ` · رزرو: ${u.bookingCount}` : ''}
                      </p>
                    </div>
                  </div>
                  <span className={`rounded-full px-3 py-1 text-xs ${
                    u.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                  }`}>
                    {STATUS_LABEL[u.status || ''] || u.status || '—'}
                  </span>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button type="button" className="rounded border px-3 py-1 text-xs" onClick={() => openDetail(u.id)}>جزئیات / ویرایش</button>
                  <button type="button" className="rounded border px-3 py-1 text-xs" onClick={() => openNotify([u.id])}>اعلان</button>
                  {u.status === 'active' ? (
                    <button type="button" className="rounded border border-red-300 px-3 py-1 text-xs text-red-700" disabled={busy} onClick={() => changeStatus(u.id, 'suspended')}>مسدود</button>
                  ) : (
                    <button type="button" className="rounded border border-green-300 px-3 py-1 text-xs text-green-700" disabled={busy} onClick={() => changeStatus(u.id, 'active')}>فعال‌سازی</button>
                  )}
                  <button type="button" className="rounded border border-red-500 px-3 py-1 text-xs text-red-700" disabled={busy} onClick={() => removeOne(u.id)}>حذف کامل</button>
                </div>
              </Card>
            </li>
          ))}
        </ul>
      )}'''
          new_list = '''      {items.length === 0 ? (
        <PanelEmpty title="مشتری‌ای یافت نشد" />
      ) : (
        <div className="overflow-x-auto rounded-xl border border-border bg-white">
          <table className="min-w-full border-collapse text-sm">
            <thead>
              <tr className="border-b bg-gray-50 text-right text-xs text-gray-600">
                <th className="px-3 py-2 font-medium">
                  <input type="checkbox" checked={selected.size === items.length && items.length > 0} onChange={toggleSelectAll} />
                </th>
                <th className="px-3 py-2 font-medium">نام</th>
                <th className="px-3 py-2 font-medium">موبایل</th>
                <th className="px-3 py-2 font-medium">وضعیت</th>
                <th className="px-3 py-2 font-medium">رزرو</th>
                <th className="px-3 py-2 font-medium">عضویت</th>
                <th className="px-3 py-2 font-medium">عملیات</th>
              </tr>
            </thead>
            <tbody>
              {items.map((u) => (
                <tr key={u.id} className="border-b last:border-0 hover:bg-gray-50/80">
                  <td className="px-3 py-2">
                    <input type="checkbox" checked={selected.has(u.id)} onChange={() => toggleSelect(u.id)} />
                  </td>
                  <td className="px-3 py-2 font-medium">{u.profile?.displayName || u.profile?.firstName || 'بدون نام'}</td>
                  <td className="px-3 py-2" dir="ltr">{u.phone || '—'}</td>
                  <td className="px-3 py-2">
                    <span className={`inline-block rounded-full px-2 py-0.5 text-xs ${
                      u.status === 'active' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'
                    }`}>
                      {STATUS_LABEL[u.status || ''] || u.status || '—'}
                    </span>
                  </td>
                  <td className="px-3 py-2">{u.bookingCount != null ? u.bookingCount : '—'}</td>
                  <td className="px-3 py-2 whitespace-nowrap">{formatDate(u.createdAt, { style: 'short' })}</td>
                  <td className="px-3 py-2">
                    <div className="flex flex-wrap gap-1">
                      <button type="button" className="rounded border px-2 py-0.5 text-xs" onClick={() => openDetail(u.id)}>جزئیات</button>
                      <button type="button" className="rounded border px-2 py-0.5 text-xs" onClick={() => openNotify([u.id])}>اعلان</button>
                      {u.status === 'active' ? (
                        <button type="button" className="rounded border border-red-300 px-2 py-0.5 text-xs text-red-700" disabled={busy} onClick={() => changeStatus(u.id, 'suspended')}>مسدود</button>
                      ) : (
                        <button type="button" className="rounded border border-green-300 px-2 py-0.5 text-xs text-green-700" disabled={busy} onClick={() => changeStatus(u.id, 'active')}>فعال</button>
                      )}
                      <button type="button" className="rounded border border-red-500 px-2 py-0.5 text-xs text-red-700" disabled={busy} onClick={() => removeOne(u.id)}>حذف</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}'''
          if old_list in ut:
              ut = ut.replace(old_list, new_list)
              users.write_text(ut)
              print('users page: table UI applied')
          else:
              print('users page: list block not found exactly')
              # try softer match
              if 'space-y-3' in ut and 'removeOne(u.id)' in ut:
                  print('partial markers found')

          # ---------- frontend professionals page: table + delete ----------
          pros = Path('frontend/src/app/admin/professionals/page.tsx')
          pt = pros.read_text()
          # add delete helper if missing
          if 'hardDeletePro' not in pt and 'apiClient.delete(`/admin/professionals' not in pt:
              if "import { apiClient }" not in pt:
                  pt = pt.replace(
                      "import { friendlyApiError } from '@/lib/api-errors';",
                      "import { friendlyApiError } from '@/lib/api-errors';\nimport { apiClient } from '@/lib/api';",
                  )
              # inject delete handler near onFeatured
              if 'async function onFeatured' in pt:
                  pt = pt.replace(
                      'async function onFeatured',
                      '''async function onDelete(id: string) {
    if (!window.confirm('حذف کامل این زیباگر؟ رزروها و نظرات مرتبط حذف می‌شوند.')) return;
    setBusyId(id); setError(null); setMsg(null);
    try {
      await apiClient.delete(`/admin/professionals/${id}`);
      setMsg('زیباگر حذف شد');
      await load();
    } catch (e) {
      setError(friendlyApiError(e));
    } finally {
      setBusyId(null);
    }
  }

  async function onFeatured''',
                  )

          # replace card list with table
          old_pro_list = None
          m = re.search(r'\{loading \? <PanelLoading /> : items\.length === 0 \?[\s\S]*?</ul>\n      \)}', pt)
          if not m:
              m = re.search(r'\{items\.length === 0 \?[\s\S]*?<ul className="space-y-3">[\s\S]*?</ul>\n      \)}', pt)
          if m:
              new_pro = '''{loading ? <PanelLoading /> : items.length === 0 ? (
        <PanelEmpty title="زیباگری یافت نشد" />
      ) : (
        <div className="overflow-x-auto rounded-xl border border-border bg-white">
          <table className="min-w-full border-collapse text-sm">
            <thead>
              <tr className="border-b bg-gray-50 text-right text-xs text-gray-600">
                <th className="px-3 py-2 font-medium">نام / عنوان</th>
                <th className="px-3 py-2 font-medium">موبایل</th>
                <th className="px-3 py-2 font-medium">شهر</th>
                <th className="px-3 py-2 font-medium">امتیاز</th>
                <th className="px-3 py-2 font-medium">وضعیت</th>
                <th className="px-3 py-2 font-medium">عضویت</th>
                <th className="px-3 py-2 font-medium">عملیات</th>
              </tr>
            </thead>
            <tbody>
              {items.map((p) => (
                <tr key={p.id} className="border-b last:border-0 hover:bg-gray-50/80">
                  <td className="px-3 py-2">
                    <Link href={`/admin/professionals/${p.id}`} className="font-medium text-coral hover:underline">
                      {p.user?.profile?.displayName || p.title || p.slug}
                    </Link>
                    <div className="text-xs text-gray" dir="ltr">{p.slug}</div>
                  </td>
                  <td className="px-3 py-2" dir="ltr">{p.user?.phone || '—'}</td>
                  <td className="px-3 py-2">{p.city || '—'}</td>
                  <td className="px-3 py-2 whitespace-nowrap">
                    {p.ratingAvg != null ? Number(p.ratingAvg).toFixed(1) : '—'} ({p.ratingCount ?? 0})
                  </td>
                  <td className="px-3 py-2">
                    <span className="rounded-full bg-coral-soft px-2 py-0.5 text-xs text-coral">{persianProfessionalStatus(p.status)}</span>
                    {p.isFeatured ? <span className="mr-1 text-xs text-amber-600">ویژه</span> : null}
                  </td>
                  <td className="px-3 py-2 whitespace-nowrap">{p.createdAt ? formatDate(p.createdAt) : '—'}</td>
                  <td className="px-3 py-2">
                    <div className="flex flex-wrap gap-1">
                      <Link href={`/admin/professionals/${p.id}`}><Button size="sm" variant="outline">جزئیات</Button></Link>
                      {p.status !== 'approved' && (
                        <Button size="sm" loading={busyId === p.id} onClick={() => onStatus(p.id, 'approved')}>تأیید</Button>
                      )}
                      {p.status !== 'rejected' && (
                        <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onStatus(p.id, 'rejected')}>رد</Button>
                      )}
                      {p.status !== 'suspended' && (
                        <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onStatus(p.id, 'suspended')}>تعلیق</Button>
                      )}
                      <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onFeatured(p.id, !p.isFeatured)}>
                        {p.isFeatured ? 'حذف ویژه' : 'ویژه'}
                      </Button>
                      <Button size="sm" variant="outline" loading={busyId === p.id} onClick={() => onDelete(p.id)}>حذف</Button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}'''
              pt = pt[:m.start()] + new_pro + pt[m.end():]
              print('pros page: table UI applied')
          else:
              print('pros page: list block not found')

          pros.write_text(pt)
          print('done')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(admin): hard-delete users/professionals + table list UI" || exit 0
          git push origin HEAD:main
