name: fix-upload-progress
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path('frontend/src/app/zibagar/services/page.tsx')
          t = p.read_text(encoding='utf-8')
          if "from '@/lib/media-upload'" not in t and "import { apiClient } from '@/lib/api';" in t:
              t = t.replace(
                  "import { apiClient } from '@/lib/api';",
                  "import { apiClient } from '@/lib/api';\nimport { uploadMyMedia as uploadMyMediaWithProgress } from '@/lib/media-upload';",
                  1,
              )
              print('import ok')
          if 'uploadProgress' not in t:
              t = t.replace(
                  "const [uploadState, setUploadState] = useState<'idle' | 'uploading' | 'ok' | 'err'>('idle');\n  const [uploadErr, setUploadErr] = useState<string | null>(null);",
                  "const [uploadState, setUploadState] = useState<'idle' | 'uploading' | 'ok' | 'err'>('idle');\n  const [uploadErr, setUploadErr] = useState<string | null>(null);\n  const [uploadProgress, setUploadProgress] = useState<number | null>(null);",
                  1,
              )
              print('state ok')
          if "await uploadMyMedia(file, 'portfolio', attachToPsId);" in t:
              t = t.replace(
                  "await uploadMyMedia(file, 'portfolio', attachToPsId);",
                  "setUploadProgress(0);\n      const uploader = typeof uploadMyMediaWithProgress === 'function' ? uploadMyMediaWithProgress : uploadMyMedia;\n      await uploader(file, 'portfolio', attachToPsId, (pct: number) => setUploadProgress(pct));\n      setUploadProgress(100);",
                  1,
              )
              print('call ok')
          if 'setUploadState' in t and 'setUploadProgress(null)' not in t:
              t = t.replace(
                  "setUploadState('err');\n      setUploadErr(friendlyApiError(e));\n    }\n  }",
                  "setUploadState('err');\n      setUploadErr(friendlyApiError(e));\n    } finally {\n      setTimeout(() => setUploadProgress(null), 800);\n    }\n  }",
                  1,
              )
              print('finally ok')
          if 'uploadProgress={uploadProgress}' not in t:
              t = t.replace('uploadState={uploadState}', 'uploadState={uploadState}\n          uploadProgress={uploadProgress}', 2)
              print('props ok')
          p.write_text(t, encoding='utf-8')

          p = Path('frontend/src/app/zibagar/services/ServiceEditPanel.tsx')
          t = p.read_text(encoding='utf-8')
          if 'uploadProgress' not in t:
              t = t.replace(
                  "uploadState: 'idle' | 'uploading' | 'ok' | 'err';\n  uploadErr: string | null;",
                  "uploadState: 'idle' | 'uploading' | 'ok' | 'err';\n  uploadErr: string | null;\n  uploadProgress?: number | null;",
                  1,
              )
              t = t.replace('uploadState, uploadErr, onSavePs,', 'uploadState, uploadErr, uploadProgress, onSavePs,', 1)
              marker = "{uploadState === 'err' && uploadErr && <p className=\"mt-1 text-xs text-red-600\">{uploadErr}</p>}"
              bar = """{uploadState === 'uploading' && (
          <div className=\"mt-2 space-y-1\">
            <div className=\"flex justify-between text-[11px] text-gray\">
              <span>در حال آپلود…</span>
              <span dir=\"ltr\">{uploadProgress != null ? `${uploadProgress}%` : '…'}</span>
            </div>
            <div className=\"h-1.5 w-full overflow-hidden rounded-full bg-gray-100\">
              <div className=\"h-full rounded-full bg-blue-500 transition-all\" style={{ width: `${uploadProgress ?? 10}%` }} />
            </div>
          </div>
        )}
        {uploadState === 'err' && uploadErr && <p className=\"mt-1 text-xs text-red-600\">{uploadErr}</p>}"""
              if marker in t:
                  t = t.replace(marker, bar, 1)
                  print('edit panel UI ok')
              else:
                  print('edit panel marker miss')
              p.write_text(t, encoding='utf-8')
          else:
              print('edit panel exists')

          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text(encoding='utf-8')
          if "'no-show':" not in t and "complete: 'رزرو به عنوان انجام‌شده ثبت شد.'" in t:
              t = t.replace(
                  "complete: 'رزرو به عنوان انجام‌شده ثبت شد.',\n      };",
                  "complete: 'رزرو به عنوان انجام‌شده ثبت شد.',\n        'no-show': 'عدم حضور مشتری ثبت شد.',\n      };",
                  1,
              )
              p.write_text(t, encoding='utf-8')
              print('label ok')
          else:
              print('label skip')

          p = Path('frontend/src/lib/panel-api.ts')
          t = p.read_text(encoding='utf-8')
          if 'onProgress?: (percent: number) => void' not in t and 'export async function uploadMyMedia(file: File, kind: string, professionalServiceId?: string) {' in t:
              t = t.replace(
                  'export async function uploadMyMedia(file: File, kind: string, professionalServiceId?: string) {',
                  '''export async function uploadMyMedia(
  file: File,
  kind: string,
  professionalServiceId?: string,
  onProgress?: (percent: number) => void,
) {
  if (typeof window !== 'undefined') {
    const { uploadMyMedia: uploadWithProgress } = await import('./media-upload');
    return uploadWithProgress(file, kind, professionalServiceId, onProgress);
  }''',
                  1,
              )
              p.write_text(t, encoding='utf-8')
              print('panel-api delegate ok')
          else:
              print('panel-api skip')
          print('DONE')
          PY
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "fix: real upload progress % in services + no-show label" && git push; fi
