name: fix-upload-progress
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          echo 'REPLACEME' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "fix: upload progress + no-show label" && git push; fi
