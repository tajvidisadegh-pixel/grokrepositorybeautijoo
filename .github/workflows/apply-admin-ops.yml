name: Apply admin missing ops
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/_admin_ops.part0'
      - 'scripts/_admin_ops.part1'
      - 'scripts/_admin_ops.part2'
      - '.github/workflows/apply-admin-ops.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and run
        run: |
          cat scripts/_admin_ops.part0 scripts/_admin_ops.part1 scripts/_admin_ops.part2 > /tmp/admin_ops.py
          python3 /tmp/admin_ops.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts backend/src/admin/admin.controller.ts
          git status
          git commit -m "feat(admin): wire missing super-admin APIs (CMS, notify, users, dashboard)" || exit 0
          git push origin HEAD:main
