name: apply-remaining
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-remaining.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply remaining patches
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('backend/src/bookings/bookings.service.ts')
          t = p.read_text(encoding='utf-8')
          if 'class BookingsService' not in t:
              raise SystemExit('bookings broken')

          if 'BOOKING_FREE_CANCEL_HOURS' not in t:
              old = (
                  "      // Unpaid pending: either side may cancel (slot release)\n"
                  "      // unpaid pending: pro may clear hold (fall through to cancel)\n"
                  "      const allowed: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];\n"
                  "      if (!allowed.includes(b.status)) throw new BadRequestException('این رزرو قابل لغو نیست');\n"
                  "      // #82.7 — customer cancel of paid booking must attempt refund\n"
                  "      if (isCustomer && paid && b.payment?.id) {\n"
                  "        try {\n"
                  "          await this.payments.refund(b.payment.id, reason?.trim() || 'لغو توسط مشتری', userId);\n"
                  "        } catch (err) {\n"
                  "          this.logger.warn(`customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`);\n"
                  "          return this.prisma.booking.update({\n"
                  "            where: { id },\n"
                  "            data: {\n"
                  "              status: BookingStatus.cancelled,\n"
                  "              cancelReason: reason ?? 'لغو توسط مشتری (استرداد ناموفق — پیگیری پشتیبانی)',\n"
                  "              cancelledAt: new Date(),\n"
                  "            },\n"
                  "          });\n"
                  "        }\n"
                  "        return this.prisma.booking.findUniqueOrThrow({ where: { id } });\n"
                  "      }\n"
              )
              new = (
                  "      // unpaid pending: pro may clear hold (fall through to cancel)\n"
                  "      const allowed: BookingStatus[] = [BookingStatus.pending, BookingStatus.confirmed];\n"
                  "      if (!allowed.includes(b.status)) throw new BadRequestException('این رزرو قابل لغو نیست');\n"
                  "      // #82.med9 — free-cancel window (BOOKING_FREE_CANCEL_HOURS, default 24)\n"
                  "      {\n"
                  "        const freeH = parseInt(process.env.BOOKING_FREE_CANCEL_HOURS || '24', 10);\n"
                  "        const hours = Number.isFinite(freeH) && freeH >= 0 ? freeH : 24;\n"
                  "        const msLeft = b.startAt.getTime() - Date.now();\n"
                  "        const withinFreeWindow = msLeft >= hours * 3600_000;\n"
                  "        if (isCustomer && paid && b.payment?.id) {\n"
                  "          if (!withinFreeWindow && hours > 0) {\n"
                  "            return this.prisma.booking.update({\n"
                  "              where: { id },\n"
                  "              data: {\n"
                  "                status: BookingStatus.cancelled,\n"
                  "                cancelReason:\n"
                  "                  (reason?.trim() || 'لغو دیرهنگام توسط مشتری') +\n"
                  "                  ` (خارج از پنجره لغو رایگان ${hours} ساعته — استرداد خودکار انجام نشد)',\n"
                  "                cancelledAt: new Date(),\n"
                  "              },\n"
                  "            });\n"
                  "          }\n"
                  "          try {\n"
                  "            await this.payments.refund(\n"
                  "              b.payment.id,\n"
                  "              reason?.trim() || 'لغو توسط مشتری',\n"
                  "              userId,\n"
                  "            );\n"
                  "          } catch (err) {\n"
                  "            this.logger.warn(\n"
                  "              `customer paid cancel refund failed booking=${id}: ${(err as Error)?.message || err}`,\n"
                  "            );\n"
                  "            return this.prisma.booking.update({\n"
                  "              where: { id },\n"
                  "              data: {\n"
                  "                status: BookingStatus.cancelled,\n"
                  "                cancelReason:\n"
                  "                  reason ?? 'لغو توسط مشتری (استرداد ناموفق — پیگیری پشتیبانی)',\n"
                  "                cancelledAt: new Date(),\n"
                  "              },\n"
                  "            });\n"
                  "          }\n"
                  "          return this.prisma.booking.findUniqueOrThrow({ where: { id } });\n"
                  "        }\n"
                  "      }\n"
              )
              if old not in t:
                  raise SystemExit('med9 cancel block missing')
              t = t.replace(old, new, 1)
              print('med9 ok')
          else:
              print('med9 skip')
          p.write_text(t, encoding='utf-8')

          pa = Path('backend/src/auth/auth.service.ts')
          a = pa.read_text(encoding='utf-8')
          if 'otpIpHits' not in a:
              old_cls = (
                  "@Injectable()\n"
                  "export class AuthService {\n"
                  "  constructor(\n"
                  "    private readonly prisma: PrismaService,\n"
                  "    private readonly jwt: JwtService,\n"
                  "    private readonly config: ConfigService,\n"
                  "    @Inject(SMS_PROVIDER) private readonly sms: SmsProvider,\n"
                  "  ) {}\n"
              )
              new_cls = (
                  "@Injectable()\n"
                  "export class AuthService {\n"
                  "  /** #82.med15 — in-memory per-IP OTP request hits (process-local) */\n"
                  "  private readonly otpIpHits = new Map<string, { count: number; windowStart: number }>();\n"
                  "  constructor(\n"
                  "    private readonly prisma: PrismaService,\n"
                  "    private readonly jwt: JwtService,\n"
                  "    private readonly config: ConfigService,\n"
                  "    @Inject(SMS_PROVIDER) private readonly sms: SmsProvider,\n"
                  "  ) {}\n"
              )
              if old_cls not in a:
                  raise SystemExit('auth class header missing')
              a = a.replace(old_cls, new_cls, 1)

          if 'allowedPurposes' not in a:
              old_ro = (
                  "  async requestOtp(dto: RequestOtpDto) {\n"
                  "    const accountType = this.resolveAccountType(dto.accountType);\n"
                  "    const purposeBase = dto.purpose || 'login';\n"
                  "    const purpose = `${purposeBase}:${accountType}`;\n"
              )
              new_ro = (
                  "  async requestOtp(dto: RequestOtpDto, clientIp?: string) {\n"
                  "    // #82.med15 — purpose whitelist\n"
                  "    const allowedPurposes = new Set([\n"
                  "      'login',\n"
                  "      'register',\n"
                  "      'password_reset',\n"
                  "      'change_phone',\n"
                  "      'delete_account',\n"
                  "    ]);\n"
                  "    const purposeBase = (dto.purpose || 'login').toString().trim();\n"
                  "    if (!allowedPurposes.has(purposeBase)) {\n"
                  "      throw new BadRequestException('هدف درخواست کد نامعتبر است');\n"
                  "    }\n"
                  "    // #82.med15 — per-IP soft limit (default 20 / 10 min)\n"
                  "    if (clientIp) {\n"
                  "      const maxIp = parseInt(process.env.OTP_MAX_PER_IP_10M || '20', 10) || 20;\n"
                  "      const now = Date.now();\n"
                  "      const windowMs = 600_000;\n"
                  "      const entry = this.otpIpHits.get(clientIp);\n"
                  "      if (!entry || now - entry.windowStart > windowMs) {\n"
                  "        this.otpIpHits.set(clientIp, { count: 1, windowStart: now });\n"
                  "      } else {\n"
                  "        entry.count += 1;\n"
                  "        if (entry.count > maxIp) {\n"
                  "          throw new BadRequestException(\n"
                  "            'تعداد درخواست از این شبکه بیش از حد مجاز است. کمی بعد دوباره تلاش کنید',\n"
                  "          );\n"
                  "        }\n"
                  "      }\n"
                  "    }\n"
                  "    const accountType = this.resolveAccountType(dto.accountType);\n"
                  "    const purpose = `${purposeBase}:${accountType}`;\n"
              )
              if old_ro not in a:
                  raise SystemExit('requestOtp head missing')
              a = a.replace(old_ro, new_ro, 1)
              print('med15 service ok')
          else:
              print('med15 service skip')
          pa.write_text(a, encoding='utf-8')

          pc = Path('backend/src/auth/auth.controller.ts')
          c = pc.read_text(encoding='utf-8')
          if 'requestOtp(@Body() dto: RequestOtpDto) {' in c:
              old = (
                  "  requestOtp(@Body() dto: RequestOtpDto) {\n"
                  "    return this.auth.requestOtp(dto);\n"
                  "  }\n"
              )
              new = (
                  "  requestOtp(@Body() dto: RequestOtpDto, @Req() req: Request) {\n"
                  "    const xf = (req.headers['x-forwarded-for'] as string | undefined)?.split(',')[0]?.trim();\n"
                  "    const ip = xf || req.ip || req.socket?.remoteAddress || '';\n"
                  "    return this.auth.requestOtp(dto, ip);\n"
                  "  }\n"
              )
              if old not in c:
                  raise SystemExit('controller requestOtp missing')
              c = c.replace(old, new, 1)
              print('med15 controller ok')
          else:
              print('med15 controller skip')
          pc.write_text(c, encoding='utf-8')

          pm = Path('backend/src/main.ts')
          m = pm.read_text(encoding='utf-8')
          if '#82.infra19' not in m:
              old = (
                  "    // #82.14 — no directory listing; public portfolio media only\n"
                  "    app.useStaticAssets(uploadsAbs, {\n"
                  "      prefix: '/uploads/',\n"
                  "      index: false,\n"
                  "      setHeaders: (res) => {\n"
                  "        res.setHeader('Cross-Origin-Resource-Policy', 'cross-origin');\n"
                  "        res.setHeader('Cache-Control', 'public, max-age=86400');\n"
                  "        res.setHeader('X-Content-Type-Options', 'nosniff');\n"
                  "      },\n"
                  "    });\n"
                  "    logger.log(`Static /uploads → ${uploadsAbs} (#82.14 public media only)`);\n"
              )
              new = (
                  "    // #82.14 / #82.infra19 — static media: no listing; only image extensions; block path tricks\n"
                  "    app.use('/uploads', (req, res, next) => {\n"
                  "      const urlPath = (req.path || '').split('?')[0];\n"
                  "      if (urlPath.includes('..') || urlPath.includes('%2e') || urlPath.includes('%2E')) {\n"
                  "        return res.status(400).end('bad path');\n"
                  "      }\n"
                  "      if (urlPath === '/' || urlPath === '') {\n"
                  "        return res.status(404).end();\n"
                  "      }\n"
                  "      const lower = urlPath.toLowerCase();\n"
                  "      const okExt = /\\.(jpe?g|png|gif|webp|avif|svg|ico)$/i.test(lower);\n"
                  "      if (!okExt) {\n"
                  "        return res.status(404).end();\n"
                  "      }\n"
                  "      return next();\n"
                  "    });\n"
                  "    app.useStaticAssets(uploadsAbs, {\n"
                  "      prefix: '/uploads/',\n"
                  "      index: false,\n"
                  "      dotfiles: 'deny',\n"
                  "      setHeaders: (res) => {\n"
                  "        res.setHeader('Cross-Origin-Resource-Policy', 'cross-origin');\n"
                  "        res.setHeader('Cache-Control', 'public, max-age=86400');\n"
                  "        res.setHeader('X-Content-Type-Options', 'nosniff');\n"
                  "        res.setHeader('X-Frame-Options', 'DENY');\n"
                  "      },\n"
                  "    });\n"
                  "    logger.log(\n"
                  "      `Static /uploads → ${uploadsAbs} (#82.infra19 image-only; prefer STORAGE_PROVIDER=s3 in prod)`,\n"
                  "    );\n"
              )
              if old not in m:
                  raise SystemExit('main static block missing')
              m = m.replace(old, new, 1)
              print('infra19 ok')
          else:
              print('infra19 skip')
          pm.write_text(m, encoding='utf-8')

          pd = Path('backend/Dockerfile')
          d = pd.read_text(encoding='utf-8')
          if 'RUN_SEED_CATALOG_ON_BOOT' not in d:
              new_cmd = (
                  'CMD ["sh", "-c", "mkdir -p \\"${STORAGE_LOCAL_PATH:-/app/uploads}\\" 2>/dev/null || true; '
                  'node scripts/prisma-migrate-deploy.cjs && node prisma/seed-roles.cjs && '
                  'if [ \\"${RUN_SEED_CATALOG_ON_BOOT:-false}\\" = \\"true\\" ]; then '
                  '(node prisma/seed-catalog.cjs || echo \\"[boot] seed-catalog failed (non-fatal)\\" >&2); '
                  'else echo \\"[boot] seed-catalog skipped (set RUN_SEED_CATALOG_ON_BOOT=true to enable)\\"; fi && '
                  'node dist/main.js"]'
              )
              lines = d.splitlines()
              out = []
              replaced = False
              for line in lines:
                  if line.startswith('CMD ['):
                      out.append(new_cmd)
                      replaced = True
                  else:
                      out.append(line)
              if not replaced:
                  raise SystemExit('Dockerfile CMD line missing')
              d = '\n'.join(out) + ('\n' if d.endswith('\n') else '')
              print('infra20 ok')
          else:
              print('infra20 skip')
          pd.write_text(d, encoding='utf-8')

          sec = Path('docs/SECURITY_ISSUE_82_9.md')
          sec.parent.mkdir(parents=True, exist_ok=True)
          sec.write_text(
              '# Security hygiene (#82.9 / #82.infra21)\n\n'
              'Owner checklist (cannot be fully automated from CI):\n\n'
              '1. **Make the repository private** on GitHub (Settings → Danger Zone → Change visibility).\n'
              '2. **Scan secrets in git history** with gitleaks or trufflehog.\n'
              '3. **Rotate** any credentials that ever appeared in commits.\n'
              '4. Confirm `.env` / `*.pem` are in `.gitignore`.\n'
              '5. Prefer `STORAGE_PROVIDER=s3` in production.\n'
              '6. Set `RUN_SEED_CATALOG_ON_BOOT=true` only when intentionally reseeding catalog.\n',
              encoding='utf-8',
          )
          print('infra21 doc ok')

          t = Path('backend/src/bookings/bookings.service.ts').read_text(encoding='utf-8')
          a = Path('backend/src/auth/auth.service.ts').read_text(encoding='utf-8')
          assert 'BOOKING_FREE_CANCEL_HOURS' in t
          assert 'otpIpHits' in a and 'allowedPurposes' in a
          assert 'class BookingsService' in t and 'class AuthService' in a
          print('ALL_OK')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts backend/src/auth/auth.service.ts backend/src/auth/auth.controller.ts backend/src/main.ts backend/Dockerfile docs/SECURITY_ISSUE_82_9.md
          if git diff --staged --quiet; then echo no-change; exit 0; fi
          git commit -m "fix(#82): cancel policy, OTP IP/purpose limits, harden uploads, seed-on-boot gate, security checklist"
          git push origin HEAD:main
