name: Apply sticky book
on:
  push:
    paths: ['.github/workflows/apply-sticky.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          f='frontend/src/app/professionals/[slug]/page.tsx'
          python3 -c "
          from pathlib import Path
          p=Path('$f')
          s=p.read_text()
          if 'StickyBookBar' not in s:
            s=s.replace(\"import LocationMapView from '@/components/location/location-map-view';\", \"import LocationMapView from '@/components/location/location-map-view'\\nimport { StickyBookBar } from '@/components/professionals/sticky-book-bar';\")
            s=s.replace('className=\\\"mx-auto max-w-6xl px-4 py-10\\\"', 'className=\\\"mx-auto max-w-6xl px-4 py-10 pb-24 md:pb-10\\\"', 1)
            s=s.replace('\\n    </div>\\n  );\\n}', '\\n      <StickyBookBar slug={pro.slug} />\\n    </div>\\n  );\\n}', 1)
            p.write_text(s)
            print('done')
          else:
            print('skip')
          "
          rm -f .github/workflows/apply-sticky.yml .github/workflows/patch-pro-sticky.yml .github/workflows/patch-sticky-book.yml || true
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'feat: sticky book bar on public pro page'
          git push
