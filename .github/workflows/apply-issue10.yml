name: Apply issue 10 settings
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-issue10.yml"
      - "scripts/apply_issue10.py"
      - "scripts/i10_auth_methods.ts"
      - "scripts/i10_panel_helpers.ts"
      - "scripts/i10.settings.zlib.b64"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Apply
        run: python3 scripts/apply_issue10.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/auth/auth.service.ts frontend/src/app/panel/settings/page.tsx frontend/src/lib/panel-api.ts
          git diff --staged --quiet || git commit -m "feat(#10): account settings (password, sessions, delete) + UI"
          git push
