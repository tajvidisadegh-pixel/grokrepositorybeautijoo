name: Fix admin media status UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_admin_media_status_ui.py'
      - '.github/workflows/fix-admin-media-ui.yml'
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_admin_media_status_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/professionals/[id]/page.tsx
          git commit -m "fix(frontend): admin media status uses published/draft" || exit 0
          git push origin HEAD:main
