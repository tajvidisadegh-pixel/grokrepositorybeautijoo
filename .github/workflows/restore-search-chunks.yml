name: restore-search-chunks
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/search_chunks/**'
      - '.github/workflows/restore-search-chunks.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore
        run: |
          python3 << 'END'
          import base64, zlib, pathlib
          parts = []
          for i in range(8):
            parts.append(pathlib.Path(f"scripts/search_chunks/c{i}.b64").read_text().strip())
          b64 = "".join(parts)
          data = zlib.decompress(base64.b64decode(b64))
          pathlib.Path("frontend/src/app/search/page.tsx").write_bytes(data)
          print("restored", len(data))
          END
      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/search/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(#67): restore search page NearMeFields string lat/lng (typecheck)"
          git push
