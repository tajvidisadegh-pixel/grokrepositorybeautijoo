name: apply-buffer-min-tiny
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-buffer-min-tiny.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          set -e
          python3 -c '
          from pathlib import Path
          p=Path("backend/src/bookings/bookings.service.ts")
          t=p.read_text()
          if "maxBufferMin" in t:
            print("done"); raise SystemExit(0)
          h="""  private maxBufferMin(items: Array<{bufferMin?: number|null; professionalService?: {bufferMin?: number|null}|null}>): number {\n    let max=0; for (const it of items){ const v=it.professionalService?.bufferMin??it.bufferMin??0; if(typeof v===\"number\"&&v>max) max=v;} return Math.max(0,max); }\n  private bookingRangesConflict(aStart:Date,aEnd:Date,aBufferMin:number,bStart:Date,bEnd:Date,bBufferMin:number): boolean {\n    const aBusy=aEnd.getTime()+Math.max(0,aBufferMin)*60000; const bBusy=bEnd.getTime()+Math.max(0,bBufferMin)*60000; return aStart.getTime()<bBusy && bStart.getTime()<aBusy; }\n"""
          t=t.replace("  ) {}\n\n  async create(", "  ) {}\n"+h+"\n  async create(",1)
          t=t.replace(
            "const avail = await this.availability.getSlots(data.professionalId, dateStr, totalDuration);",
            "const newBufferMin = orderedServices.reduce((m,ps)=>Math.max(m, ps.bufferMin??0),0);\n    const avail = await this.availability.getSlots(data.professionalId, dateStr, totalDuration, newBufferMin);"
          ,1)
          old="""          const overlappingBookings = await tx.booking.count({\n            where: {\n              professionalId: data.professionalId,\n              status: { in: [BookingStatus.pending, BookingStatus.confirmed] },\n              startAt: { lt: endAt },\n              endAt: { gt: startAt },\n            },\n          });\n          if (overlappingBookings > 0) {\n            throw new ConflictException('\''این بازه زمانی قبلاً رزرو شده است'\'');\n          }"""
          new="""          const padMs=Math.max(newBufferMin,180)*60000;\n          const candidates=await tx.booking.findMany({where:{professionalId:data.professionalId,status:{in:[BookingStatus.pending,BookingStatus.confirmed]},startAt:{lt:new Date(endAt.getTime()+padMs)},endAt:{gt:new Date(startAt.getTime()-padMs)}},include:{items:{select:{professionalService:{select:{bufferMin:true}}}}}});\n          for(const e of candidates){ if(this.bookingRangesConflict(startAt,endAt,newBufferMin,e.startAt,e.endAt,this.maxBufferMin(e.items))) throw new ConflictException('\''این بازه زمانی قبلاً رزرو شده است'\''); }"""
          if old not in t: raise SystemExit("overlap missing")
          t=t.replace(old,new,1)
          old_rs="""    const overlap = await this.prisma.booking.count({\n      where: {\n        professionalId: b.professionalId,\n        id: { not: id },\n        status: { in: [BookingStatus.pending, BookingStatus.confirmed] },\n        startAt: { lt: endAt },\n        endAt: { gt: startAt },\n      },\n    });\n    if (overlap > 0) throw new ConflictException('\''این بازه زمانی قبلاً رزرو شده است'\'');"""
          new_rs="""    const bFull=await this.prisma.booking.findUnique({where:{id},include:{items:{select:{professionalService:{select:{bufferMin:true}}}}}});\n    const newBufferMin=this.maxBufferMin(bFull?.items??[]);\n    const padMs=Math.max(newBufferMin,180)*60000;\n    const candidates=await this.prisma.booking.findMany({where:{professionalId:b.professionalId,id:{not:id},status:{in:[BookingStatus.pending,BookingStatus.confirmed]},startAt:{lt:new Date(endAt.getTime()+padMs)},endAt:{gt:new Date(startAt.getTime()-padMs)}},include:{items:{select:{professionalService:{select:{bufferMin:true}}}}}});\n    for(const e of candidates){ if(this.bookingRangesConflict(startAt,endAt,newBufferMin,e.startAt,e.endAt,this.maxBufferMin(e.items))) throw new ConflictException('\''این بازه زمانی قبلاً رزرو شده است'\''); }"""
          if old_rs not in t: raise SystemExit("reschedule overlap missing")
          t=t.replace(old_rs,new_rs,1)
          p.write_text(t)
          print("ok", t.count("maxBufferMin"))
          '
          grep -c maxBufferMin backend/src/bookings/bookings.service.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git commit -m "fix(#82.10): apply professionalService.bufferMin in booking overlap (create/reschedule)"
          git push
