name: fix-media-service
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-media-service.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore media.service.ts
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/c9774cbae4f8210179d84fae72c54eb13a51ffcd/backend/src/media/media.service.ts" -o backend/src/media/media.service.ts
          python3 -c "from pathlib import Path; t=Path('backend/src/media/media.service.ts').read_text(); t2=t.replace('kind !== MediaKind.portfolio && kind !== MediaKind.service', 'kind !== MediaKind.portfolio && kind !== MediaKind.service && kind !== MediaKind.salon', 1); assert 'MediaKind.salon' in t2; Path('backend/src/media/media.service.ts').write_text(t2); print(len(t2))"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/media/media.service.ts
          git diff --cached --quiet || git commit -m "fix(#33): restore media.service.ts with salon video support"
          git push
