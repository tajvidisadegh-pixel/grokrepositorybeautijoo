name: Apply phase3 quotes 80

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-phase3-quotes-80.yml'
      - 'scripts/patch_phase3_quotes_80.py'
      - 'backend/src/quotes/**'
      - 'backend/prisma/migrations/20261104120000_price_quote_requests/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_phase3_quotes_80.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/prisma/schema.prisma \
            backend/src/app.module.ts \
            backend/src/quotes \
            frontend/src/lib/panel-api.ts \
            frontend/src/app/zibagar/quotes/page.tsx
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "feat(#80.phase3): wire quote requests schema, module, pro UI"
          git push origin HEAD:main
