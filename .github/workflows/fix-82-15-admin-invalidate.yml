name: fix-82-15-admin-invalidate

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch setUserStatus invalidate
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("backend/src/admin/admin.service.ts")
          text = p.read_text()
          marker = "async setUserStatus(id: string, status: UserStatus | string, actorId?: string, reason?: string)"
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit("setUserStatus not found")
          window = text[idx:idx+700]
          if "userAuthCache.invalidate(id)" in window:
              print("already invalidates in setUserStatus")
          else:
              end = text.find("\n  async ", idx + 20)
              if end < 0:
                  end = idx + 900
              block = text[idx:end]
              if "return updated;" not in block:
                  raise SystemExit("return updated not found in block")
              new_block = block.replace(
                  "return updated;",
                  "// #82.15 — drop in-memory JWT user cache so suspended/inactive takes effect immediately on this instance\n    userAuthCache.invalidate(id);\n    return updated;",
                  1,
              )
              text = text[:idx] + new_block + text[end:]
              p.write_text(text)
              print("patched setUserStatus")
          t = p.read_text()
          i = t.find(marker)
          assert "userAuthCache.invalidate(id)" in t[i:i+700]
          print("ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/admin/admin.service.ts
          if git diff --cached --quiet; then echo "noop"; exit 0; fi
          git commit -m "fix(#82.15): invalidate userAuthCache on setUserStatus"
          git push origin HEAD:main
