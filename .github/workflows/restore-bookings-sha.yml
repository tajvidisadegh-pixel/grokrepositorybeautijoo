name: restore-bookings-sha
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-bookings-sha.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and fix
        run: |
          set -euo pipefail
          git show 2b44ecd8075297c7fb81736921bbefa8558db5ef:backend/src/bookings/bookings.service.ts > backend/src/bookings/bookings.service.ts
          sed -i 's/this downstreamprisma/this.prisma/g' backend/src/bookings/bookings.service.ts
          grep -q 'BookingsService' backend/src/bookings/bookings.service.ts
          grep -q 'async reschedule' backend/src/bookings/bookings.service.ts
          grep -q 'take: safeLimit' backend/src/bookings/bookings.service.ts
          ! grep -q 'PLACEHOLDER' backend/src/bookings/bookings.service.ts
          wc -l backend/src/bookings/bookings.service.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bookings/bookings.service.ts
          git commit -m "fix: restore bookings.service from 2b44ecd + typo fix"
          git push origin HEAD:main
