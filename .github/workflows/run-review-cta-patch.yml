name: Run review CTA patch
on:
  push:
    paths:
      - '.github/workflows/run-review-cta-patch.yml'
      - 'scripts/patch-review-cta.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch-review-cta.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/run-review-cta-patch.yml
          git add frontend/src/app/panel/bookings/page.tsx backend/src/reminders/reminders.service.ts backend/src/bookings/bookings.service.ts
          git add -A
          git diff --cached --quiet || git commit -m "feat(reviews): post-completion CTA, deep link, notify href (#40-5)"
          git push
