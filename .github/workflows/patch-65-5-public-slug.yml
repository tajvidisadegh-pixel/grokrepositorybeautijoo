name: patch-65-5-public-slug
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-5-public-slug.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch pro service + page SEO
        run: |
          python3 << 'PY'
          from pathlib import Path

          # --- backend professionals.service.ts ---
          p = Path('backend/src/professionals/professionals.service.ts')
          t = p.read_text()
          if "from '../common/public-slug'" not in t:
              t = t.replace(
                  "import { boundingBox, haversineKm, parseGeoQuery } from '../common/geo';",
                  "import { boundingBox, haversineKm, parseGeoQuery } from '../common/geo';\nimport { isUuidLike, isValidPublicSlug, toPublicSlug } from '../common/public-slug';",
              )

          # createForUser: normalize + validate slug
          old_create = """  async createForUser(userId: string, data: { slug: string; title: string; bio?: string }) {
    const existing = await this.prisma.professional.findUnique({ where: { userId } });
    if (existing) throw new ConflictException('\u067e\u0631\u0648\u0641\u0627\u06cc\u0644 \u0632\u06cc\u0628\u0627\u06af\u0631 \u0642\u0628\u0644\u0627\u064b \u0627\u06cc\u062c\u0627\u062f \u0634\u062f\u0647 \u0627\u0633\u062a');
    const slugTaken = await this.prisma.professional.findUnique({ where: { slug: data.slug } });
    if (slugTaken) throw new ConflictException('\u0627\u06cc\u0646 \u0627\u0633\u0644\u0627\u06af \u0642\u0628\u0644\u0627\u064b \u0627\u0633\u062a\u0641\u0627\u062f\u0647 \u0634\u062f\u0647 \u0627\u0633\u062a');
    const proRole = await this.prisma.role.findUnique({ where: { name: 'professional' } });
    if (proRole) {
      await this.prisma.userRole.upsert({
        where: { userId_roleId: { userId, roleId: proRole.id } },
        update: {},
        create: { userId, roleId: proRole.id },
      });
    }
    return this.prisma.professional.create({
      data: {
        userId, slug: data.slug, title: data.title, bio: data.bio,
        status: ProfessionalStatus.draft,
      },
    });
  }"""

          new_create = """  async createForUser(userId: string, data: { slug: string; title: string; bio?: string }) {
    const existing = await this.prisma.professional.findUnique({ where: { userId } });
    if (existing) throw new ConflictException('\u067e\u0631\u0648\u0641\u0627\u06cc\u0644 \u0632\u06cc\u0628\u0627\u06af\u0631 \u0642\u0628\u0644\u0627\u064b \u0627\u06cc\u062c\u0627\u062f \u0634\u062f\u0647 \u0627\u0633\u062a');
    // #65.5 — public URL must be Latin English slug, never UUID/numeric id
    let slug = toPublicSlug(data.slug || data.title || '');
    if (!isValidPublicSlug(slug)) {
      throw new BadRequestException(
        'نامک (slug) باید انگلیسی باشد؛ فقط حروف لاتین، عدد و خط تیره (مثلاً sara-nail).',
      );
    }
    const slugTaken = await this.prisma.professional.findUnique({ where: { slug } });
    if (slugTaken) throw new ConflictException('\u0627\u06cc\u0646 \u0627\u0633\u0644\u0627\u06af \u0642\u0628\u0644\u0627\u064b \u0627\u0633\u062a\u0641\u0627\u062f\u0647 \u0634\u062f\u0647 \u0627\u0633\u062a');
    const proRole = await this.prisma.role.findUnique({ where: { name: 'professional' } });
    if (proRole) {
      await this.prisma.userRole.upsert({
        where: { userId_roleId: { userId, roleId: proRole.id } },
        update: {},
        create: { userId, roleId: proRole.id },
      });
    }
    return this.prisma.professional.create({
      data: {
        userId, slug, title: data.title, bio: data.bio,
        status: ProfessionalStatus.draft,
      },
    });
  }"""

          if old_create in t:
              t = t.replace(old_create, new_create, 1)
              print('createForUser patched')
          elif 'toPublicSlug' in t:
              print('createForUser already uses toPublicSlug')
          else:
              print('WARN createForUser pattern miss')

          # findBySlug: if UUID, resolve by id then prefer slug (payload still has slug for SEO)
          old_find = """  async findBySlug(slug: string) {
    const cacheKey = `catalog:slug:${slug}`;
    const hit = this.cache.get<unknown>(cacheKey);
    if (hit) return hit as any;

    const pro = await this.prisma.professional.findUnique({
      where: { slug },
      include: this.publicInclude(),
    });
    if (!pro || pro.status !== ProfessionalStatus.approved || !pro.publishedAt) {
      throw new NotFoundException('\u067e\u0631\u0648\u0641\u0627\u06cc\u0644 \u06cc\u0627\u0641\u062a \u0646\u0634\u062f');
    }"""

          new_find = """  async findBySlug(slug: string) {
    const raw = String(slug || '').trim();
    const cacheKey = `catalog:slug:${raw}`;
    const hit = this.cache.get<unknown>(cacheKey);
    if (hit) return hit as any;

    // #65.5 — never treat UUID as public slug; resolve then expose real slug for SEO/canonical
    let pro = await this.prisma.professional.findUnique({
      where: { slug: raw },
      include: this.publicInclude(),
    });
    if (!pro && isUuidLike(raw)) {
      pro = await this.prisma.professional.findUnique({
        where: { id: raw },
        include: this.publicInclude(),
      });
    }
    if (!pro || pro.status !== ProfessionalStatus.approved || !pro.publishedAt) {
      throw new NotFoundException('\u067e\u0631\u0648\u0641\u0627\u06cc\u0644 \u06cc\u0627\u0641\u062a \u0646\u0634\u062f');
    }"""

          if old_find in t:
              t = t.replace(old_find, new_find, 1)
              print('findBySlug patched')
          elif 'isUuidLike' in t:
              print('findBySlug already uuid-aware')
          else:
              print('WARN findBySlug pattern miss')

          p.write_text(t)

          # --- frontend pro page: permanent redirect UUID → slug ---
          fp = Path('frontend/src/app/professionals/[slug]/page.tsx')
          ft = fp.read_text()
          if 'redirect(' not in ft or 'isUuidLike' not in ft:
              # add redirect import
              if "from 'next/navigation'" in ft and 'redirect' not in ft.split("from 'next/navigation'")[0][-80:]:
                  ft = ft.replace(
                      "import { notFound } from 'next/navigation';",
                      "import { notFound, redirect } from 'next/navigation';",
                  )
              # after successful fetch, if param was uuid-like and differs from pro.slug, redirect
              needle = "  const name = pro.user?.profile?.displayName || pro.title;"
              inject = """  // #65.5 — public URL must be English slug, never internal UUID
  const looksUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(slug);
  if (looksUuid && pro.slug && pro.slug !== slug) {
    redirect(`/professionals/${pro.slug}`);
  }

  const name = pro.user?.profile?.displayName || pro.title;"""
              if needle in ft and 'looksUuid' not in ft:
                  ft = ft.replace(needle, inject, 1)
                  print('frontend redirect injected')
              else:
                  print('frontend inject skip')
              fp.write_text(ft)
          else:
              print('frontend already redirects')

          # --- seo.jsonLd already uses slug; ensure robots index on pro page metadata ---
          if 'robots:' not in ft and 'generateMetadata' in ft:
              old_meta_return = """    return {
      title,
      description,
      alternates: { canonical: url },
      openGraph: {"""
              new_meta_return = """    return {
      title,
      description,
      alternates: { canonical: url },
      robots: { index: true, follow: true },
      openGraph: {"""
              if old_meta_return in ft:
                  ft = ft.replace(old_meta_return, new_meta_return, 1)
                  fp.write_text(ft)
                  print('metadata robots ok')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts frontend/src/app/professionals/[slug]/page.tsx backend/src/common/public-slug.ts
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "feat(#65.5): English public slug only; UUID URLs redirect for SEO"
          git push
