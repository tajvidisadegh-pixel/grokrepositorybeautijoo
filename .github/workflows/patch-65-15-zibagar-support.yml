name: patch-65-15-zibagar-support
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-65-15-zibagar-support.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Harden support service + rewrite zibagar support UI
        run: |
          python3 << 'PY'
          from pathlib import Path

          # ---- support.service.ts ----
          ss = Path('backend/src/support/support.service.ts')
          t = ss.read_text()
          if 'BadRequestException' not in t:
              t = t.replace(
                  '''import {
  ForbiddenException,
  Injectable,
  NotFoundException,
} from '@nestjs/common';''',
                  '''import {
  BadRequestException,
  ForbiddenException,
  Injectable,
  NotFoundException,
} from '@nestjs/common';''',
              )
          t = t.replace(
              "if (sub.length < 3) throw new ForbiddenException('موضوع حداقل ۳ کاراکتر باشد');\n    if (msg.length < 2) throw new ForbiddenException('پیام حداقل ۲ کاراکتر باشد');",
              "if (sub.length < 3) throw new BadRequestException('موضوع حداقل ۳ کاراکتر باشد');\n    if (msg.length < 1) throw new BadRequestException('متن پیام خالی است');",
          )
          t = t.replace(
              "if (msg.length < 1) throw new ForbiddenException('پیام خالی است');",
              "if (msg.length < 1) throw new BadRequestException('پیام خالی است');",
          )
          # listMine: last message for preview
          t = t.replace(
              '''          messages: {
            orderBy: { createdAt: 'asc' },
            take: 1,
            select: { body: true, createdAt: true, isStaff: true },
          },
          _count: { select: { messages: true } },
        },
      }),
      this.prisma.supportTicket.count({ where }),
    ]);
    return {
      items: items.map((t) => ({
        id: t.id,
        subject: t.subject,
        status: t.status,
        createdAt: t.createdAt,
        updatedAt: t.updatedAt,
        messageCount: t._count.messages,
        lastPreview: t.messages[0]?.body?.slice(0, 120) ?? null,
      })),''',
              '''          messages: {
            orderBy: { createdAt: 'desc' },
            take: 1,
            select: { body: true, createdAt: true, isStaff: true },
          },
          _count: { select: { messages: true } },
        },
      }),
      this.prisma.supportTicket.count({ where }),
    ]);
    return {
      items: items.map((t) => ({
        id: t.id,
        subject: t.subject,
        status: t.status,
        createdAt: t.createdAt,
        updatedAt: t.updatedAt,
        messageCount: t._count.messages,
        lastPreview: t.messages[0]?.body?.slice(0, 120) ?? null,
      })),''',
          )
          ss.write_text(t)
          print('support.service updated')

          # ---- frontend page rewrite ----
          fp = Path('frontend/src/app/zibagar/support/page.tsx')
          fp.write_text('''\'use client\';

import { useCallback, useEffect, useState } from \'react\';
import { Card } from \'@/components/ui/card\';
import { Button } from \'@/components/ui/button\';
import { Input } from \'@/components/ui/input\';
import { PanelLoading, PanelError, PanelEmpty } from \'@/components/panel/state-blocks\';
import { apiClient } from \'@/lib/api\';
import { friendlyApiError } from \'@/lib/api-errors\';
import { formatDate } from \'@/lib/utils\';

type TicketListItem = {
  id: string;
  subject: string;
  status: string;
  createdAt: string;
  updatedAt: string;
  messageCount: number;
  lastPreview?: string | null;
};

type TicketDetail = {
  id: string;
  subject: string;
  status: string;
  createdAt: string;
  messages: Array<{
    id: string;
    body: string;
    isStaff: boolean;
    createdAt: string;
  }>;
};

const STATUS_LABEL: Record<string, string> = {
  open: \'باز\',
  answered: \'پاسخ\u200cداده\u200cشده\',
  closed: \'بسته\',
};

const CATEGORIES = [
  \'مشکل رزرو\',
  \'پرداخت و مالی\',
  \'پروفایل و خدمات\',
  \'فنی / اپلیکیشن\',
  \'سایر\',
] as const;

export default function ZibagarSupportPage() {
  const [items, setItems] = useState<TicketListItem[]>([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState<string | null>(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState<string | null>(null);
  const [showCreate, setShowCreate] = useState(false);
  const [category, setCategory] = useState<string>(CATEGORIES[0]);
  const [subject, setSubject] = useState(\'\');
  const [body, setBody] = useState(\'\');
  const [selectedId, setSelectedId] = useState<string | null>(null);
  const [detail, setDetail] = useState<TicketDetail | null>(null);
  const [detailLoading, setDetailLoading] = useState(false);
  const [reply, setReply] = useState(\'\');

  const load = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const res = await apiClient.get<{ items?: TicketListItem[] } | TicketListItem[]>(
        \'/support/tickets?page=1\',
      );
      const list = Array.isArray(res)
        ? res
        : Array.isArray((res as { items?: TicketListItem[] }).items)
          ? (res as { items: TicketListItem[] }).items
          : [];
      setItems(list);
    } catch (e) {
      setItems([]);
      setError(friendlyApiError(e));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    void load();
  }, [load]);

  async function openTicket(id: string) {
    setSelectedId(id);
    setDetail(null);
    setDetailLoading(true);
    setReply(\'\');
    setMsg(null);
    try {
      const d = await apiClient.get<TicketDetail>(`/support/tickets/${id}`);
      setDetail({
        ...d,
        messages: Array.isArray(d.messages) ? d.messages : [],
      });
    } catch (e) {
      setSelectedId(null);
      setMsg(friendlyApiError(e));
    } finally {
      setDetailLoading(false);
    }
  }

  async function createTicket() {
    const s = (subject.trim() || category).trim();
    const b = body.trim();
    if (s.length < 3) {
      setMsg(\'موضوع حداقل ۳ کاراکتر باشد.\');
      return;
    }
    if (b.length < 2) {
      setMsg(\'متن پیام را بنویسید.\');
      return;
    }
    setBusy(true);
    setMsg(null);
    try {
      const created = await apiClient.post<{ id?: string }>(\'/support/tickets\', {
        subject: s.length > 3 ? s : `${category}: ${s}`,
        body: b,
      });
      setShowCreate(false);
      setSubject(\'\');
      setBody(\'\');
      setMsg(\'تیکت با موفقیت ثبت شد. تیم پشتیبانی به‌زودی پاسخ می‌دهد.\');
      await load();
      if (created?.id) {
        await openTicket(created.id);
      }
    } catch (e) {
      setMsg(friendlyApiError(e));
    } finally {
      setBusy(false);
    }
  }

  async function sendReply() {
    if (!selectedId || reply.trim().length < 1) return;
    setBusy(true);
    setMsg(null);
    try {
      await apiClient.post(`/support/tickets/${selectedId}/messages`, {
        body: reply.trim(),
      });
      setReply(\'\');
      setMsg(\'پیام ارسال شد.\');
      await openTicket(selectedId);
      await load();
    } catch (e) {
      setMsg(friendlyApiError(e));
    } finally {
      setBusy(false);
    }
  }

  if (loading) return <PanelLoading />;
  if (error) return <PanelError message={error} onRetry={() => void load()} />;

  if (selectedId && detailLoading) {
    return (
      <div className="space-y-3">
        <Button
          variant="outline"
          size="sm"
          onClick={() => {
            setSelectedId(null);
            setDetail(null);
          }}
        >
          ← بازگشت
        </Button>
        <PanelLoading />
      </div>
    );
  }

  if (selectedId && detail) {
    return (
      <div className="mx-auto max-w-lg space-y-4" dir="rtl">
        <div className="flex flex-wrap items-center justify-between gap-2">
          <Button
            variant="outline"
            size="sm"
            onClick={() => {
              setSelectedId(null);
              setDetail(null);
              setMsg(null);
            }}
          >
            ← بازگشت به لیست
          </Button>
          <span className="rounded-full bg-gray-light px-2.5 py-1 text-xs text-gray">
            {STATUS_LABEL[detail.status] || detail.status}
          </span>
        </div>

        <Card className="space-y-3">
          <h1 className="text-lg font-bold">{detail.subject}</h1>
          <p className="text-xs text-gray">
            {formatDate(detail.createdAt, { style: \'short\', includeTime: true })}
          </p>
          <ul className="space-y-3">
            {detail.messages.map((m) => (
              <li
                key={m.id}
                className={`rounded-xl px-3 py-2 text-sm ${
                  m.isStaff
                    ? \'border border-coral/20 bg-coral/10\'
                    : \'bg-gray-light/60\'
                }`}
              >
                <p className="mb-1 text-xs font-medium text-gray">
                  {m.isStaff ? \'پشتیبانی\' : \'شما\'} ·{\' \'}
                  {formatDate(m.createdAt, { style: \'short\', includeTime: true })}
                </p>
                <p className="whitespace-pre-wrap leading-7">{m.body}</p>
              </li>
            ))}
          </ul>

          {detail.status !== \'closed\' ? (
            <div className="space-y-2 border-t border-border pt-3">
              <textarea
                className="min-h-[88px] w-full rounded-xl border border-border px-3 py-2 text-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
                value={reply}
                onChange={(e) => setReply(e.target.value)}
                placeholder="پاسخ خود را بنویسید…"
                maxLength={4000}
              />
              <Button size="sm" loading={busy} onClick={() => void sendReply()}>
                ارسال پیام
              </Button>
            </div>
          ) : (
            <p className="text-sm text-gray">این تیکت بسته شده است.</p>
          )}
        </Card>

        {msg && <p className="text-sm text-coral">{msg}</p>}
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-lg space-y-4" dir="rtl">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h1 className="text-xl font-bold">پشتیبانی</h1>
          <p className="mt-0.5 text-sm text-gray">تیکت بسازید؛ تیم Beautijoo پاسخ می‌دهد</p>
        </div>
        <Button
          size="sm"
          onClick={() => {
            setShowCreate(true);
            setMsg(null);
          }}
        >
          تیکت جدید
        </Button>
      </div>

      {showCreate && (
        <Card className="space-y-3">
          <h2 className="font-semibold">ثبت تیکت جدید</h2>
          <div>
            <label className="mb-1 block text-xs text-gray">موضوع / دسته</label>
            <select
              className="mb-2 h-11 w-full rounded-xl border border-border bg-white px-3 text-sm"
              value={category}
              onChange={(e) => setCategory(e.target.value)}
            >
              {CATEGORIES.map((c) => (
                <option key={c} value={c}>
                  {c}
                </option>
              ))}
            </select>
            <Input
              placeholder="عنوان کوتاه (اختیاری)"
              value={subject}
              onChange={(e) => setSubject(e.target.value)}
              maxLength={200}
            />
          </div>
          <div>
            <label className="mb-1 block text-xs text-gray">شرح</label>
            <textarea
              className="min-h-[110px] w-full rounded-xl border border-border px-3 py-2 text-sm outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
              placeholder="مشکل یا درخواست را کامل بنویسید…"
              value={body}
              onChange={(e) => setBody(e.target.value)}
              maxLength={4000}
            />
          </div>
          <div className="flex flex-wrap gap-2">
            <Button size="sm" loading={busy} onClick={() => void createTicket()}>
              ارسال تیکت
            </Button>
            <Button size="sm" variant="outline" disabled={busy} onClick={() => setShowCreate(false)}>
              انصراف
            </Button>
          </div>
        </Card>
      )}

      {msg && (
        <p className="rounded-xl bg-blue-light px-3 py-2 text-sm text-blue">{msg}</p>
      )}

      {items.length === 0 && !showCreate ? (
        <PanelEmpty
          title="هنوز تیکتی ندارید"
          description="برای ارتباط با پشتیبانی یک تیکت جدید ثبت کنید."
          action={
            <Button size="sm" onClick={() => setShowCreate(true)}>
              تیکت جدید
            </Button>
          }
        />
      ) : (
        <ul className="space-y-2">
          {items.map((t) => (
            <li key={t.id}>
              <button
                type="button"
                className="w-full text-right"
                onClick={() => void openTicket(t.id)}
              >
                <Card className="space-y-1 transition-colors hover:border-coral/40">
                  <div className="flex flex-wrap items-start justify-between gap-2">
                    <p className="font-semibold">{t.subject}</p>
                    <span className="text-xs text-gray">
                      {STATUS_LABEL[t.status] || t.status}
                    </span>
                  </div>
                  {t.lastPreview ? (
                    <p className="line-clamp-1 text-sm text-gray">{t.lastPreview}</p>
                  ) : null}
                  <p className="text-xs text-gray">
                    {formatDate(t.updatedAt, { style: \'short\', includeTime: true })} ·{\' \'}
                    {Number(t.messageCount || 0).toLocaleString(\'fa-IR\')} پیام
                  </p>
                </Card>
              </button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}
''')
          print('support page rewritten', fp.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/support/support.service.ts frontend/src/app/zibagar/support/page.tsx
          if git diff --cached --quiet; then echo nochange; exit 0; fi
          git commit -m "fix(#65.15): zibagar support page + API validation"
          git push
