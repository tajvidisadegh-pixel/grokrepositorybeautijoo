name: Apply step9 residual

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-step9.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch finance silent catch + panel-api no-mock header
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path('frontend/src/app/admin/finance/page.tsx')
          t = p.read_text()
          old = """    } catch {
      /* ignore */
    }
  }, []);"""
          new = """    } catch (e) {
      setCommissionMsg(e instanceof Error ? e.message : '\u0628\u0627\u0631\u06af\u0630\u0627\u0631\u06cc \u062a\u0646\u0638\u06cc\u0645\u0627\u062a \u0646\u0627\u0645\u0648\u0641\u0642 \u0628\u0648\u062f');
    }
  }, []);"""
          if old in t:
              t = t.replace(old, new)
              p.write_text(t)
              print('finance: patched silent catch')
          else:
              print('finance: pattern not found (already patched?)')

          p = Path('frontend/src/lib/panel-api.ts')
          t = p.read_text()
          if 'NEXT_PUBLIC_USE_MOCK' not in t:
              old_h = """/**
 * Typed helpers for customer / professional / admin panel endpoints.
 * Admin helpers intentionally do NOT fall back to mock data.
 */
"""
              new_h = """/**
 * Typed helpers for customer / professional / admin panel endpoints.
 *
 * Production policy (step 9):
 * - Admin helpers NEVER fall back to mock / sample / static data.
 * - On API failure callers must surface errors (PanelError / toast), not invent rows.
 * - NEXT_PUBLIC_USE_MOCK is unsupported and treated as off.
 */
if (typeof process !== 'undefined' && process.env.NEXT_PUBLIC_USE_MOCK === 'true') {
  if (process.env.NODE_ENV === 'production') {
    throw new Error('NEXT_PUBLIC_USE_MOCK is not allowed in production');
  }
}
"""
              if old_h in t:
                  t = t.replace(old_h, new_h)
                  p.write_text(t)
                  print('panel-api: no-mock header applied')
              else:
                  print('panel-api: header pattern not found')
          else:
              print('panel-api: already has USE_MOCK guard')
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/admin/finance/page.tsx frontend/src/lib/panel-api.ts || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat(step9): panel-api no-mock production guard + finance settings error surface"
            git push
          fi
