name: items-61-33-34
on:
  push:
    paths:
      - scripts/patch_61_33_34.py
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_61_33_34.py
      - run: |
          git config user.name beautijoo-bot
          git config user.email bot@beautijoo.ir
          git add -A
          git diff --staged --quiet || (git commit -m "feat: #61.33 fraud card + #61.34 suspend reason" && git push)
