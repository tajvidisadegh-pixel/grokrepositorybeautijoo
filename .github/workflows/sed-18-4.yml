name: sed-18-4
on:
  push:
    paths: ['.github/workflows/sed-18-4.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sed patches
        run: |
          set -e
          # wizard: import + todayISO
          if ! grep -q "tehranTodayIso" frontend/src/components/booking/booking-wizard.tsx; then
            sed -i "s|import { formatPrice } from '@/lib/utils';|import { formatPrice } from '@/lib/utils';\nimport { tehranTodayIso, isoToJalaliLabel } from '@/lib/jalali';|" frontend/src/components/booking/booking-wizard.tsx
          fi
          sed -i 's|return new Date().toISOString().slice(0, 10);|return tehranTodayIso();|' frontend/src/components/booking/booking-wizard.tsx
          sed -i 's|<dd dir="ltr">{date}</dd>|<dd>{isoToJalaliLabel(date)} <span className="text-xs text-gray" dir="ltr">({date})</span></dd>|' frontend/src/components/booking/booking-wizard.tsx
          # zibagar dayKey
          if ! grep -q "tehranDateStr" frontend/src/app/zibagar/bookings/page.tsx; then
            sed -i "s|import { formatPrice } from '@/lib/utils';|import { formatPrice, formatDate, formatTime24 } from '@/lib/utils';\nimport { tehranDateStr } from '@/lib/jalali';|" frontend/src/app/zibagar/bookings/page.tsx
          fi
          sed -i 's|return d.toISOString().slice(0, 10);|return tehranDateStr(d);|' frontend/src/app/zibagar/bookings/page.tsx
          grep -n tehranTodayIso frontend/src/components/booking/booking-wizard.tsx | head
          grep -n tehranDateStr frontend/src/app/zibagar/bookings/page.tsx | head
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/booking/booking-wizard.tsx frontend/src/app/zibagar/bookings/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(#18.4): booking min-date Tehran + zibagar dayKey Tehran"
          git push
