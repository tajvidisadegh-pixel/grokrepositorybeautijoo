name: fix-i33-enum
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-i33-enum.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Drop MediaKind.salon where filter
        run: |
          set -euo pipefail
          FILE=backend/src/professionals/professionals.service.ts
          # Remove the where line that casts salon enum
          sed -i '/where: { kind: { in: \[MediaKind.salon, MediaKind.portfolio\] } },/d' "$FILE"
          grep -n "MediaKind.salon\|mediaAssets:" "$FILE" | head -20
          grep -q "mediaAssets:" "$FILE"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/professionals/professionals.service.ts
          git diff --cached --quiet || git commit -m "fix(#33): drop MediaKind.salon where filter for e2e DB compatibility"
          git push
      - name: Cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-i33-enum.yml
          git add -A .github/workflows || true
          git diff --cached --quiet || git commit -m "chore(#33): remove fix-i33-enum helper"
          git push
