name: apply-68b-patches
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch68b.py'
      - '.github/workflows/apply-68b-patches.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply frontend #68b
        run: python3 scripts/patch68b.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(#68): popular toggle on categories + dashboard window tabs"
          git push
