name: Restore services service

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-svc-80.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore file
        run: |
          set -euo pipefail
          git show 1240566a149af5beace42b3ad5f4a7f64b1f5c6d:backend/src/services/services.service.ts > backend/src/services/services.service.ts
          test -s backend/src/services/services.service.ts
          wc -c backend/src/services/services.service.ts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/services.service.ts
          if git diff --cached --quiet; then echo no change; exit 0; fi
          git commit -m "fix(#80): restore services.service.ts emptied by mistake"
          git push origin HEAD:main
