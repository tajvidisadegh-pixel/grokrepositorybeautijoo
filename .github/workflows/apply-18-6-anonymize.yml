name: apply-18-6-anonymize

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch deleteAccount anonymize
        run: |
          set -e
          git show e8db68381a14:backend/src/auth/auth.service.ts > backend/src/auth/auth.service.ts
          python3 << 'PY'
          from pathlib import Path
          path = Path("backend/src/auth/auth.service.ts")
          text = path.read_text()
          start = text.find("  async deleteAccount(")
          if start < 0:
              raise SystemExit("deleteAccount not found")
          end = text.rfind("}")
          # replace from start to final closing brace of class
          # find end of method: last "  }\n}" before EOF
          method_end = text.find("\n  }\n}\n", start)
          if method_end < 0:
              method_end = text.rfind("\n}")
          else:
              method_end = method_end + len("\n  }")
          new_method = r'''  async deleteAccount(userId: string, dto: DeleteAccountDto) {
    const user = await this.prisma.user.findUnique({
      where: { id: userId },
      include: { profile: true, professional: true },
    });
    if (!user) throw new UnauthorizedException();
    if (user.status === UserStatus.deleted) {
      throw new BadRequestException("\u0627\u06cc\u0646 \u062d\u0633\u0627\u0628 \u0642\u0628\u0644\u0627\u064b \u062d\u0630\u0641 \u0634\u062f\u0647 \u0627\u0633\u062a");
    }
    if (user.passwordHash) {
      if (!dto.password) {
        throw new BadRequestException("\u0631\u0645\u0632 \u0639\u0628\u0648\u0631 \u0628\u0631\u0627\u06cc \u062a\u0623\u06cc\u06cc\u062f \u062d\u0630\u0641 \u0627\u0644\u0632\u0627\u0645\u06cc \u0627\u0633\u062a");
      }
      const ok = await argon2.verify(user.passwordHash, dto.password);
      if (!ok) {
        throw new UnauthorizedException("\u0631\u0645\u0632 \u0639\u0628\u0648\u0631 \u0627\u0634\u062a\u0628\u0627\u0647 \u0627\u0633\u062a");
      }
    }
    await this.prisma.$transaction(async (tx) => {
      await tx.user.update({
        where: { id: userId },
        data: {
          status: UserStatus.deleted,
          phone: null,
          email: null,
          passwordHash: null,
          phoneVerified: false,
          emailVerified: false,
        },
      });
      if (user.profile) {
        await tx.profile.update({
          where: { userId },
          data: {
            displayName: "\u06a9\u0627\u0631\u0628\u0631 \u062d\u0630\u0641\u200c\u0634\u062f\u0647",
            firstName: null,
            lastName: null,
            bio: null,
            avatarUrl: null,
            birthDate: null,
            gender: "undisclosed",
          },
        });
      }
      if (user.professional) {
        await tx.professional.update({
          where: { userId },
          data: {
            status: ProfessionalStatus.suspended,
            publishedAt: null,
            isFeatured: false,
          },
        });
      }
      await tx.booking.updateMany({
        where: {
          customerId: userId,
          status: { in: ["pending", "confirmed"] },
        },
        data: {
          status: "cancelled",
          cancelledAt: new Date(),
          cancelReason: "account_deleted",
        },
      });
      await tx.refreshToken.updateMany({
        where: { userId, revokedAt: null },
        data: { revokedAt: new Date() },
      });
      await tx.session.updateMany({
        where: { userId, revokedAt: null },
        data: { revokedAt: new Date() },
      });
      try {
        await tx.auditLog.create({
          data: {
            actorId: userId,
            action: "user.account_delete",
            entityType: "user",
            entityId: userId,
            after: { anonymized: true, status: "deleted" } as any,
          },
        });
      } catch {
        /* non-blocking */
      }
    });
    userAuthCache.invalidate(userId);
    return { message: "\u062d\u0633\u0627\u0628 \u06a9\u0627\u0631\u0628\u0631\u06cc \u0628\u0627 \u0645\u0648\u0641\u0642\u06cc\u062a \u062d\u0630\u0641 \u0648 \u062f\u0627\u062f\u0647\u200c\u0647\u0627\u06cc \u0634\u062e\u0635\u06cc \u0646\u0627\u0634\u0646\u0627\u0633 \u0634\u062f" };
  }'''
          new_text = text[:start] + new_method + "\n}\n"
          path.write_text(new_text)
          assert "phone: null" in new_text
          print("auth patched", len(new_text))

          # panel-api
          api = Path("frontend/src/lib/panel-api.ts")
          if api.exists():
              at = api.read_text()
              at2 = at.replace(
                  "export async function deleteAccount(payload: { password: string })",
                  "export async function deleteAccount(payload: { password?: string } = {})",
              )
              if at2 != at:
                  api.write_text(at2)
                  print("panel-api ok")

          # settings: optional password + copy
          sp = Path("frontend/src/app/panel/settings/page.tsx")
          if sp.exists():
              st = sp.read_text()
              st = st.replace(
                  "if (!deletePassword) {\n      setDelErr('\u0631\u0645\u0632 \u0639\u0628\u0648\u0631 \u0627\u0644\u0632\u0627\u0645\u06cc \u0627\u0633\u062a');\n      return;\n    }\n    setDelLoading(true);\n    try {\n      const res = await deleteAccount({ password: deletePassword });",
                  "setDelLoading(true);\n    try {\n      const payload = deletePassword ? { password: deletePassword } : {};\n      const res = await deleteAccount(payload);",
              )
              sp.write_text(st)
              print("settings ok")
          PY
      - name: Commit
        run: |
          git config user.name grok-bot
          git config user.email bot@x.ai
          git add backend/src/auth/auth.service.ts frontend/src/lib/panel-api.ts frontend/src/app/panel/settings/page.tsx
          git status
          git commit -m "feat(18.6): soft-delete with PII anonymization" || true
          git push origin HEAD:main
