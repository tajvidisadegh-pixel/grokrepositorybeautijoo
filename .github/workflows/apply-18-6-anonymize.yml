name: apply-18-6-anonymize

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run apply script
        run: python3 scripts/apply_18_6_anonymize.py
      - name: Commit and push
        run: |
          git config user.name grok-bot
          git config user.email bot@x.ai
          git add backend/src/auth/auth.service.ts frontend/src/lib/panel-api.ts frontend/src/app/panel/settings/page.tsx
          git status
          git commit -m "feat(18.6): soft-delete with PII anonymization" || true
          git push origin HEAD:main
