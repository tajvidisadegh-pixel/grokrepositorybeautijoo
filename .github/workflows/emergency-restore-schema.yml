name: Emergency restore schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-schema.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full schema from known-good commit + socialLinks
        run: |
          set -eux
          curl -fsSL "https://raw.githubusercontent.com/tajvidisadegh-pixel/grokrepositorybeautijoo/fa63205669c9f679693de7683a2754581f2f0f20/backend/prisma/schema.prisma" -o backend/prisma/schema.prisma
          test -s backend/prisma/schema.prisma
          wc -c backend/prisma/schema.prisma
          grep -q "model Professional" backend/prisma/schema.prisma
          python3 << 'PY'
          from pathlib import Path
          p = Path('backend/prisma/schema.prisma')
          t = p.read_text()
          assert len(t) > 20000 and 'model Professional' in t
          if 'socialLinks' not in t:
              old = '  selectedCategoryIds  Json?              @map("selected_category_ids")\n  verifiedAt'
              new = '  selectedCategoryIds  Json?              @map("selected_category_ids")\n  socialLinks          Json?              @map("social_links")\n  verifiedAt'
              assert old in t, 'anchor missing'
              p.write_text(t.replace(old, new, 1))
          print('schema OK', p.stat().st_size)
          PY
          mkdir -p backend/prisma/migrations/20260927140000_professional_social_links
          echo 'ALTER TABLE "professionals" ADD COLUMN IF NOT EXISTS "social_links" JSONB;' > backend/prisma/migrations/20260927140000_professional_social_links/migration.sql
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/prisma/schema.prisma backend/prisma/migrations/
          git status
          git diff --staged --quiet || git commit -m "fix: restore full schema.prisma + social_links (#36)"
          git push
