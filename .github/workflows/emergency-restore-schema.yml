name: Emergency restore schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-schema.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch service socialLinks
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('backend/src/professionals/professionals.service.ts')
          s = p.read_text()
          if 'socialLinks?:' in s:
              print('already done')
          else:
              s = s.replace(
                  'selectedCategoryIds?: string[];\\n  }) {',
                  'selectedCategoryIds?: string[];\\n    socialLinks?: { instagram?: string | null; telegram?: string | null; website?: string | null; phone?: string | null; whatsapp?: string | null } | null;\\n  }) {',
              )
              old = '    if (data.selectedCategoryIds !== undefined) {\\n      proData.selectedCategoryIds = data.selectedCategoryIds as Prisma.InputJsonValue;\\n    }\\n    if (data.logoUrl !== undefined) proData.logoUrl = data.logoUrl.trim() || null;'
              new = '''    if (data.selectedCategoryIds !== undefined) {
      proData.selectedCategoryIds = data.selectedCategoryIds as Prisma.InputJsonValue;
    }
    if (data.socialLinks !== undefined) {
      if (data.socialLinks === null) {
        proData.socialLinks = Prisma.JsonNull;
      } else {
        const allowed = [\\'instagram\\', \\'telegram\\', \\'website\\', \\'phone\\', \\'whatsapp\\'] as const;
        const cleaned: Record<string, string> = {};
        for (const k of allowed) {
          const raw = data.socialLinks[k];
          if (raw == null) continue;
          const v = String(raw).trim().slice(0, 200);
          if (v) cleaned[k] = v;
        }
        proData.socialLinks = (Object.keys(cleaned).length ? cleaned : Prisma.JsonNull) as Prisma.InputJsonValue;
      }
    }
    if (data.logoUrl !== undefined) proData.logoUrl = data.logoUrl.trim() || null;'''
              if old not in s:
                  raise SystemExit('anchor missing')
              s = s.replace(old, new)
              p.write_text(s)
              print('service ok', s.count('socialLinks'))
          "
      - name: Patch panel-api
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('frontend/src/lib/panel-api.ts')
          t = p.read_text()
          if 'SocialLinks' in t:
              print('panel ok')
          else:
              t = t.replace(
                  'export type OwnProfessional = {',
                  'export type SocialLinks = { instagram?: string | null; telegram?: string | null; website?: string | null; phone?: string | null; whatsapp?: string | null; };\\nexport type OwnProfessional = {',
              )
              t = t.replace(
                  '  logoUrl?: string | null; selectedCategoryIds?: string[] | null;\\n  professionalServices?: ProfessionalServiceItem[];',
                  '  logoUrl?: string | null; selectedCategoryIds?: string[] | null;\\n  socialLinks?: SocialLinks | null;\\n  professionalServices?: ProfessionalServiceItem[];',
              )
              p.write_text(t)
              print('panel patched')
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --staged --quiet || git commit -m "feat(#36): socialLinks service + panel-api"
          git push
