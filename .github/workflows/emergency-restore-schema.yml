name: Emergency restore schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-schema.yml'
      - 'scripts/patch_social_links.py'
      - 'scripts/patch_i37_admin.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run patches
        run: |
          if [ -f scripts/patch_i37_admin.py ]; then python3 scripts/patch_i37_admin.py; fi
          if [ -f scripts/patch_social_links.py ]; then python3 scripts/patch_social_links.py || true; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --staged --quiet || git commit -m "feat(#37): apply admin channel permissions on APIs"
          git push
