name: Emergency restore schema
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emergency-restore-schema.yml'
      - 'scripts/patch_social_links.py'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run social links patch
        run: python3 scripts/patch_social_links.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --staged --quiet || git commit -m "feat(#36): socialLinks service + panel-api types"
          git push
