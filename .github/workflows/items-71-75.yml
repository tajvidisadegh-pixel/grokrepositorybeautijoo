name: items-71-75
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          changed = []

          # ---- 72: forgot password on OTP page ----
          p = Path('frontend/src/app/otp/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'forgot-password' not in t:
              old = """        <div className="mt-6 border-t border-border pt-4 text-center text-sm text-gray">
          ورود با رمز عبور؟{' '}
          <Link
            href={`/login?as=${accountType}${next ? `&next=${encodeURIComponent(next)}` : ''}`}
            className="font-medium text-coral hover:text-coral-dark"
          >
            صفحه ورود
          </Link>
        </div>"""
              new = """        <div className="mt-6 space-y-2 border-t border-border pt-4 text-center text-sm text-gray">
          <p>
            <Link
              href={`/forgot-password?as=${accountType}`}
              className="font-medium text-coral hover:text-coral-dark"
            >
              رمز عبورم را فراموش کرده‌ام
            </Link>
          </p>
          <p>
            ورود با رمز عبور؟{' '}
            <Link
              href={`/login?as=${accountType}${next ? `&next=${encodeURIComponent(next)}` : ''}`}
              className="font-medium text-coral hover:text-coral-dark"
            >
              صفحه ورود
            </Link>
          </p>
        </div>"""
              if old in t:
                  t = t.replace(old, new, 1)
                  p.write_text(t, encoding='utf-8')
                  changed.append('72')
              else:
                  # looser
                  if 'صفحه ورود' in t and 'forgot-password' not in t:
                      t = t.replace(
                          'ورود با رمز عبور؟',
                          """<Link href={`/forgot-password?as=${accountType}`} className="font-medium text-coral hover:text-coral-dark">رمز عبورم را فراموش کرده‌ام</Link>
          </p>
          <p>
            ورود با رمز عبور؟""",
                          1,
                      )
                      # may need wrapping - try simpler append before login link block
                      print('72 loose attempted')
                      p.write_text(t, encoding='utf-8')
                      changed.append('72-loose')
                  else:
                      print('72 marker miss')
          else:
              print('72 exists')

          # ---- 73: version in panel-shell footer ----
          p = Path('frontend/src/components/panel/panel-shell.tsx')
          t = p.read_text(encoding='utf-8')
          if 'APP_VERSION' not in t and 'v3.0.0' not in t:
              # add constant after imports
              if "'use client'" in t[:30] or 'use client' in t[:40]:
                  t = t.replace(
                      "'use client';",
                      "'use client';\n\nconst APP_VERSION = process.env.NEXT_PUBLIC_APP_VERSION || '3.0.0';",
                      1,
                  )
              # before closing of outer max-w div, after mobile nav
              footer = """
        <p className="mt-8 text-center text-[10px] text-gray-muted" dir="ltr">
          beautijoo v{APP_VERSION}
        </p>"""
              # insert before final closing of RequireAuth children div
              # structure: </div> </RequireAuth>
              if 'hasMobileNav && (' in t and 'beautijoo v' not in t:
                  # after mobile nav block ends, before final </div>
                  marker = "        )}\n      </div>\n    </RequireAuth>"
                  if marker in t:
                      t = t.replace(
                          marker,
                          "        )}\n" + footer + "\n      </div>\n    </RequireAuth>",
                          1,
                      )
                      p.write_text(t, encoding='utf-8')
                      changed.append('73')
                  else:
                      # try without mobile
                      marker2 = "      </div>\n    </RequireAuth>"
                      if marker2 in t:
                          t = t.replace(marker2, footer + "\n" + marker2, 1)
                          p.write_text(t, encoding='utf-8')
                          changed.append('73-alt')
                      else:
                          print('73 marker miss')
          else:
              print('73 exists')

          # ---- 74: booking short code + copy ----
          # shared helper
          util = Path('frontend/src/lib/booking-code.ts')
          if not util.exists():
              util.write_text(
                  """/** #40 item 74 — short booking reference code */
export function shortBookingCode(id: string): string {
  return (id || '').replace(/-/g, '').slice(0, 8).toUpperCase();
}

export async function copyBookingCode(id: string): Promise<boolean> {
  const code = shortBookingCode(id);
  try {
    if (typeof navigator !== 'undefined' && navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(code);
      return true;
    }
  } catch {
    /* fall through */
  }
  return false;
}
""",
                  encoding='utf-8',
              )
              changed.append('74-util')

          def inject_copy_ui(path: str, label_after: str):
              p = Path(path)
              if not p.exists():
                  return
              t = p.read_text(encoding='utf-8')
              if 'shortBookingCode' in t:
                  print(path, '74 exists')
                  return
              # import
              if "from '@/lib/" in t and "shortBookingCode" not in t:
                  # add import after first import block line with @/lib
                  m = re.search(r"(import .+ from '@/lib/[^']+';)", t)
                  if m:
                      t = t.replace(
                          m.group(1),
                          m.group(1)
                          + "\nimport { shortBookingCode, copyBookingCode } from '@/lib/booking-code';",
                          1,
                      )
              # inject near status badge / name
              block = """                    <div className="mt-1 flex items-center gap-2 text-xs text-gray-muted" dir="ltr">
                      <span>#{'{'}shortBookingCode(b.id){'}'}</span>
                      <button
                        type="button"
                        className="rounded border border-border px-1.5 py-0.5 text-[10px] hover:bg-gray-light"
                        onClick={() => {
                          void copyBookingCode(b.id).then((ok) => {
                            if (ok) {
                              /* optional toast */
                            }
                          });
                        }}
                      >
                        کپی
                      </button>
                    </div>
"""
              # place after proName or customer name paragraph
              if '<p className="font-semibold">{proName}</p>' in t:
                  t = t.replace(
                      '<p className="font-semibold">{proName}</p>',
                      '<p className="font-semibold">{proName}</p>\n' + block,
                      1,
                  )
                  p.write_text(t, encoding='utf-8')
                  changed.append('74-' + path.split('/')[-2])
              elif "font-semibold" in t and 'shortBookingCode' not in t:
                  # zibagar uses different structure - look for customer name
                  # insert after first Card space-y
                  print('74 try zibagar pattern', path)
                  # For zibagar find formatRelativeDate nearby
                  if "formatRelativeDate(b.startAt)" in t and 'shortBookingCode' not in t:
                      t = t.replace(
                          '{formatRelativeDate(b.startAt)}',
                          '{formatRelativeDate(b.startAt)}\n                      </p>\n                      <p className="mt-0.5 flex items-center gap-2 text-xs text-gray-muted" dir="ltr">\n                        <span>#{'{'}shortBookingCode(b.id){'}'}</span>\n                        <button type="button" className="rounded border border-border px-1.5 py-0.5 text-[10px] hover:bg-gray-light" onClick={() => void copyBookingCode(b.id)}>کپی</button>',
                          1,
                      )
                      # might break p tags - careful
                      p.write_text(t, encoding='utf-8')
                      changed.append('74-zibagar-raw')
                  else:
                      print('74 no insert point', path)
              else:
                  p.write_text(t, encoding='utf-8') if 'shortBookingCode' in t else None

          inject_copy_ui('frontend/src/app/panel/bookings/page.tsx', 'proName')

          # zibagar bookings - cleaner insert
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'shortBookingCode' not in t:
              if "from '@/lib/" in t:
                  m = re.search(r"(import .+ from '@/lib/[^']+';)", t)
                  if m:
                      t = t.replace(
                          m.group(1),
                          m.group(1)
                          + "\nimport { shortBookingCode, copyBookingCode } from '@/lib/booking-code';",
                          1,
                      )
              # find card content - look for status span near booking
              if "persianBookingStatus" in t or 'BookingStatus' in t or "b.status" in t:
                  # insert after <li key={b.id}>
                  if '<li key={b.id}>' in t and 'shortBookingCode' not in t:
                      t = t.replace(
                          '<li key={b.id}>',
                          """<li key={b.id}>
                    <div className="mb-1 flex items-center gap-2 text-xs text-gray-muted" dir="ltr">
                      <span>#{'{'}shortBookingCode(b.id){'}'}</span>
                      <button type="button" className="rounded border border-border px-1.5 py-0.5 text-[10px] hover:bg-gray-light" onClick={() => void copyBookingCode(b.id)}>کپی</button>
                    </div>""",
                          1,
                      )
                      # only first occurrence - need all - use replace_all carefully
                      # Actually only replaced first - use count for list items in main list
                      # better replace_all for the li key pattern only in main list
                      p.write_text(t, encoding='utf-8')
                      changed.append('74-zibagar')
                  else:
                      print('74 zibagar no li')
          else:
              print('74 zibagar exists')

          # ---- 71: capacity warning on zibagar dashboard ----
          p = Path('frontend/src/app/zibagar/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'ظرفیت امروز' not in t and 'todayBookings' in t:
              # after todayBookings useMemo or near hero text
              warn = """
      {todayBookings.length >= 5 && (
        <div className="mb-4 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">
          ظرفیت امروز تقریباً پر است ({todayBookings.length.toLocaleString('fa-IR')} نوبت). در صورت نیاز ساعات کاری را بررسی کنید.
        </div>
      )}
"""
              if '<PauseBookingsToggle' in t:
                  t = t.replace(
                      '<PauseBookingsToggle />',
                      '<PauseBookingsToggle />\n' + warn,
                      1,
                  )
                  p.write_text(t, encoding='utf-8')
                  changed.append('71')
              elif 'todayBookings.length > 0' in t:
                  # inject before first occurrence of today summary
                  idx = t.find('{todayBookings.length > 0')
                  if idx > 0:
                      t = t[:idx] + warn + t[idx:]
                      p.write_text(t, encoding='utf-8')
                      changed.append('71-alt')
                  else:
                      print('71 no insert')
              else:
                  print('71 structure miss')
          else:
              print('71 skip')

          # ---- 75: prominent today filter (ensure / enhance) ----
          p = Path('frontend/src/app/zibagar/bookings/page.tsx')
          t = p.read_text(encoding='utf-8')
          if 'فقط امروز' not in t and 'datePreset' in t:
              # enhance the today preset label to be clearer
              if "{ v: 'today' as const, l: 'امروز' }" in t:
                  t = t.replace(
                      "{ v: 'today' as const, l: 'امروز' }",
                      "{ v: 'today' as const, l: 'فقط امروز' }",
                      1,
                  )
                  changed.append('75-label')
              # add quick button at top of filters if missing
              if 'setDatePreset' in t and 'فقط امروز' in t:
                  # already have filter chips - add prominent CTA near title
                  if "نوبت‌ها" in t or 'رزروها' in t:
                      pass
              p.write_text(t, encoding='utf-8')
          elif 'datePreset' in t:
              print('75 already has filter')
              changed.append('75-ok')
          else:
              print('75 no datePreset')

          print('CHANGED', changed)
          PY
      - name: Commit
        run: |
          git config user.name "beautijoo-bot"
          git config user.email "bot@beautijoo.ir"
          git add -A
          if git diff --staged --quiet; then echo none; else git commit -m "feat: #40 items 71-75 (capacity warn, forgot pwd OTP, version footer, booking code, today filter)" && git push; fi
